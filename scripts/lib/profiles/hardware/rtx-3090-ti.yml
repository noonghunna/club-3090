schema_version: 1
id: rtx-3090-ti
display_name: NVIDIA RTX 3090 Ti
sm: 8.6
vram_gb: 24
arch: ampere-consumer
# Card-wide SAFETY CEILING. The launcher (_mem_util_env) clamps DOWNWARD only,
# so this never raises a compose -- it only stops one asking for more than the
# card can safely give. Deliberately left at 0.95: a slug that has MEASURED a
# tighter margin opts out per-entry via `mem_util_unclamped=True` in
# compose_registry, which is auditable per model, rather than by loosening the
# ceiling for every model that shares this card.
mem_util_safe: 0.95
supported_kv_formats:
  - bf16
  - fp16
  - fp8_e5m2
  - turboquant_3bit_nc
  - int8_per_token_head
  - q4_0
  - q5_0
  - q8_0
  - k8v4
kv_format_default:
  long_context: turboquant_3bit_nc
  multi_stream: int8_per_token_head
  balanced: fp8_e5m2
cudagraph: full
driver_pin_recommended:
  min: "580.0"
  notes: "CUDA 13 vLLM nightlies require a 580.x-class NVIDIA driver."
nvlink_capable: true
power_cap_w_optimal: 200
power_cap_w_max: 480
notes: "Added from eddie's discussion #86 sweep; same SM and VRAM class as RTX 3090."


# NVIDIA CMP 170HX with 64 GB — COMMUNITY-VALIDATED, never booted on the reference rig.
#
# The CMP 170HX is a crypto-mining board built on GA100, the A100's chip (sm_8.0), so
# it takes the A100 code path: vLLM's and SGLang's sm_80 kernels and FlashAttention-2.
#
# Measured by a community user (xtj7, 2026-10-02, nvidia-smi on a 2x 3090 + CMP rig):
#   - name "NVIDIA CMP 170HX", memory.total 65536 MiB, compute_cap 8.0.
#   - PCIe link: Gen 2 x4 (~2 GB/s). The board reports Gen 1 as its own max and a
#     x16 max width, but trains at Gen 2 x4.
# Measured by the same user (club-3090#1537, 2026-10-02): SGLang v0.5.20 boots and
#   serves at TP=1 on the CMP alone, with their own config (Vishva007 W4A16 GPTQ +
#   DFlash2 drafter, fp8_e4m3 KV, 262K ctx, mem-fraction 0.85): 510,075-token KV pool,
#   decode 58-106 tok/s at ~142K tokens of context, board power-capped to 175 W of 250.
# Measured by the same user (club-3090#1537, 2026-10-05, stock 250 W, driver 610.57.04):
#   club-3090's vllm/qwen38-27b-single-fast (vLLM v0.30.0) and sgl/qwen38-27b-single-fast
#   (SGLang v0.5.21) boot their full tier (W4A8, MTP n=4, vision, 262K) and pass the whole
#   report.sh chain. vLLM: 84 / 114 tok/s narrative / code, 2,606 tok/s prefill at 10K.
#   SGLang: 79 / 107, 2,011. Both fill 240,662 tokens. The firmware compute limits mining
#   boards are reported to have did not stop either recipe.
#
# What follows from the measurements:
#   - The PCIe width is the slot's, not the board's: x4 (xtj7, below), x8 (#1735/#1736)
#     and x16 (#2052/#2053) have all been seen, always at Gen 2.
#   - On an x4 link, use it as a single card: splitting a model across cards (TP) or
#     offloading experts to the CPU is link-bound there. A TP group with 24 GB cards
#     caps every card at 24 GB whatever the link, wasting the 64.
#   - Model loads are slow over that link; decode then runs from VRAM (vLLM decode drew
#     36 MB/s over it). Open: SGLang decode drew ~1.1 GB/s host->GPU, near the link's
#     limit, with no host cache tier configured; the cause is unknown.
#   - VRAM differs between boards: the detector maps a CMP 170HX here only at >= 60 GB,
#     and a smaller one gets no profile rather than an inflated one.
#   - No NVLink. The board reports a 250 W default and max power limit (#1537); no
#     optimal cap has been measured, so the power_cap fields are left unset.
#   - PCIe P2P: refused on the drivers seen so far (#1736; the upstream cmpunlocker
#     driver in #2053); the only grant seen so far is from a fork of cmpunlocker with ForceP2P=0x11
#     (#2052: `topo -p2p` OK on all 12 pairs, 108/108 byte-exact peer copies).
# Measured on a second rig (club-3090#1735/#1736, 2026-10-18, 2x CMP 170HX at PCIe Gen2 x8
#   each, no P2P, 175 W, driver 615.71.09): two cards CAN serve one model when they split it by
#   PIPELINE stages instead of TP. Flash-Next at PP=2 decodes 117/163 narr/code vs 45/63 at
#   TP=2 on the same link (vllm/qwen38-flash-next-dual). fp8_e4m3 KV is not listed
#   below: stock Triton cannot compile it on sm_80; that slug gets it from an overlay.
# Measured on a third rig (paulp83, club-3090#2052/#2053, 2026-11-14, CMP 170HX at PCIe
#   Gen2 x16 each, the cmpunlocker driver at 610.57.04): tensor parallel works on an x16
#   link.
#   - Project Maya DeepSeek-V4.1 at TP3 on three cards, our pinned image v1.1.61, no P2P,
#     140 W (#2053): 64.92 / 91.00 narr/code, 1,124 tok/s prefill at 10K, needles to
#     240,976 tokens, soak PASS. The first Maya run on sm_80.
#   - A third-party GLM-5.3-Flash recipe on a vLLM fork (not a club slug) at TP4 on four
#     cards with P2P from the cmpunlocker fork, 175 W (#2052): 191.6 / 281.0 wall. Without
#     P2P at 140 W the same recipe did 162.1 / 227.9; power changed too, so the two effects
#     are not separated. One card later fell off the bus (Xid 79), which the reporter reads
#     as a fault on that card or slot.
# Promote the rest from "assumed" to "measured" from a report: `bash scripts/report.sh`.
schema_version: 1
id: cmp-170hx-64gb
display_name: NVIDIA CMP 170HX (64 GB)
sm: 8.0
vram_gb: 64
arch: ampere-datacenter
mem_util_safe: 0.90
supported_kv_formats:
  - bf16
  - fp16
  - fp8_e5m2
  - turboquant_3bit_nc
  - int8_per_token_head
  - q4_0
  - q5_0
  - q8_0
  - k8v4
kv_format_default:
  long_context: turboquant_3bit_nc
  multi_stream: int8_per_token_head
  balanced: fp8_e5m2
cudagraph: full
driver_pin_recommended:
  min: "580.0"
  notes: "CUDA 13 vLLM images require a 580.x-class NVIDIA driver. Verified on 610.57.04 with the CUDA 13.0 vLLM v0.30.0 and SGLang v0.5.21 images (club-3090#1537, 2026-10-05)."
nvlink_capable: false
power_cap_w_optimal: null
power_cap_w_max: null
notes: "COMMUNITY-VALIDATED: GA100 (sm_8.0) mining board, 64 GB, PCIe Gen 2 at the slot's width (x4, x8 and x16 seen); not booted on the reference rig. On an x4 link use it as a single card; on x16, tensor parallel across cards works (Project Maya DeepSeek TP3, club-3090#2053). club-3090's single-fast recipes run their full tier on one card (vLLM v0.30.0 and SGLang v0.5.21, full report.sh chain PASS, club-3090#1537, 2026-10-05); vLLM was the faster engine there. PCIe P2P has only been seen with the cmpunlocker driver fork's ForceP2P (club-3090#2052)."

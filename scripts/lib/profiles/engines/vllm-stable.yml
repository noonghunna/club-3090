schema_version: 1
id: vllm-stable
display_name: vLLM stable v0.34.0 (overlay-free)
type: vllm
# #1365: the compose env var this engine's image is injected as.
image_env: VLLM_IMAGE

stability: stable
lineage:
  relation: "stock"
  base: "vllm"
  base_version: "0.32.0"
  source: "https://github.com/vllm-project/vllm"
  source_ref: "5df63a7203cdb9328d824a27b682e77c7b9928be"
  chain: []
  delta: null
install:
  method: docker_image
  # The pin's record: pin-current is what spec pins now; pin-earlier lists earlier pins, newest first (the first
  # is the rollback). docs/UPSTREAM.md's Pinned images table holds why it's pinned, not these.
  # Each bump's validation is its dated row in docs/UPSTREAM.md (Active follow-ups).
  # pin-current: v0.34.0 · overlay-free · pinned 2026-11-17 (torch 2.14.0+cu130, unchanged, so the FA2 FP8-KV sidecar from our fork carries over; W4A8 moves to --quantization humming with vllm-humming-w4a8; --no-enable-extensible-kv-cache on the memory-fraction composes; vllm/qwen38-flash-next-dual retired and held on v0.33.0)
  # pin-earlier: v0.33.0 (2026-11-10); v0.32.0 (2026-10-18, #1738); v0.31.0 (2026-10-06, #1570); v0.30.0 (2026-09-23); v0.29.0 (2026-09-12); v0.27.1 (2026-08-16); v0.25.1 (2026-07-16, #682)
  spec: vllm/vllm-openai:v0.34.0
min_sm: 7.5
supported_model_families:
  - dense
  - gemma4-swa-dense
  - gemma4-swa-moe
  - gemma4-unified   # Gemma-4-12B unified arch — NATIVE in v0.24.0 (PR #44429 merged) → folds off
                     # the ephemeral vllm-gemma4-unified image onto this engine (2026-07-01).
  - qwen3-next-hybrid
  - qwen3-next-moe
  - qwen35-dense     # Tess-4-27B (qwen3_5 hybrid) — LIVE-VALIDATED on stock v0.24.0
                     # 2026-07-11 (62.4 tok/s TP=2, forensics-week boots; slug
                     # vllm/tess-dual-nvfp4). Family also covers Deckard-40B if a
                     # vLLM path is ever added there.
  - qwen4exp              # Qwen3.8-Flash-Next (Qwen4Exp), loads on stock v0.31.0 and v0.32.0.
                          # Its one slug, vllm/qwen38-flash-next-dual, runs PP=2 on 64 GB cards and mounts
                          # model-specific overlays from its compose (patches.yml, qwen4exp-* rows); the
                          # engine stays overlay-free (#1736).
  - nemotron-h-puzzle-moe   # Nemotron-3 Puzzle 75B-A9B (NemotronHPuzzleForCausalLM, hybrid
                            # Mamba2+attn MoE) — arch aliases to the NemotronH loader (registered
                            # in v0.24.0 + v0.25.0; NVIDIA card tested v0.20.0). UNVERIFIED on-rig
                            # (Blackwell/Hopper-only per NVIDIA; needs 4x3090) — drives the 🧪
                            # community-float slug vllm/nemotron-75b-multi-mtp.
features:
  int8_per_token_head: true    # NATIVE for qwen3-next (uniform head dims) since v0.22.0 — that's why the
                               # flag is true. NOT correct for Gemma-4 (hetero heads): on v0.24.0 int8-PTH
                               # allocates the pool but SILENTLY craters recall past ~32K (needs #40391,
                               # open/conflicting upstream) → gemma-31b-dual ships BF16 here, not int8-PTH.
                               # (verified 2026-07-01; corrects the earlier "gemma native @262K" claim.)
  turboquant_3bit_nc: false
  marlin_pad_sub_tile_n: false
  qwen3_coder_tool_parser: false
supported_kv_formats:
  - bf16
  - fp16
  - fp8_e4m3
  - fp8_e5m2
  - int8_per_token_head   # NATIVE for uniform-head-dim models (qwen3-next) since v0.22.0. Gemma-4 (hetero
                          # head dims) needs the #40391 page-align overlay for CORRECT recall — and #40391 is
                          # NOT native in v0.24.0 (it allocates the pool but recall craters past ~32K). So
                          # Gemma-4 uses BF16 KV on THIS engine (gemma-31b-dual); int8-PTH here = qwen3-next
                          # only. Gemma int8-PTH+#40391 (262K) stays on vllm-gemma-stable. (corrected 2026-07-01)
supported_drafters:
  - mtp
  - mtp_assistant
  # dflash: external DFlash/DFlash2 block-drafters (spec_method=dflash). Provided
  # by the vendored vLLM PR#52816 backport (patches.yml: vllm-dflash2-backport),
  # mounted on the qwen3.8 *-ultrafast composes; not in the stock image.
  - dflash
supported_weight_formats:
  - bf16
  - fp16
  - autoround
  - awq
  - gptq
  - compressed-tensors
  - fp8                   # qwen3.6-27b-fp8 (official e4m3 release) — Marlin W8A16 on Ampere sm_86
                          # (memory win, no FP8 compute speedup). Drives the qwen "max accuracy" tier.
  - modelopt              # nvidia modelopt checkpoints (NVFP4 / MIXED_PRECISION) — stock vLLM
                          # supports --quantization modelopt; the FP4 KERNELS need Hopper/Blackwell,
                          # which is encoded per-slug via required_sm=9.0 (vllm/qwen-27b-*-nvfp4),
                          # NOT here (the loader itself is arch-agnostic).
required_overlays: []
# OVERLAY-FREE BY DESIGN. This is the load-bearing distinction (#254, 2026-06-05):
# `derived_emittable` (CONTRACT-5) refuses any engine with vendored_overlays != []
# as a derived-emission base, and vllm-stable IS used as the overlay-free base for
# uncurated derives (profile-like). Overlay-CARRYING paths (Gemma int8 #40391, Gemma
# duals #42006) live on the separate `vllm-gemma-stable` engine, which declares the
# overlay provenance for diagnose-profile. Compose owns patch APPLICATION; engine owns
# provenance — and a single engine cannot be both overlay-free (for derived bases) and
# overlay-carrying (for Gemma's provenance), hence the two-engine split.
vendored_overlays: []
required_genesis: false
# #1951 — what this engine changes about effort (see the model profiles for
# what the MODEL accepts; the compose keeps the DEFAULT).
effort:
  off_switch: "none"
  supports_none: true
  by_model:
    qwen3.8-27b:
      default_when_unset: xhigh
      supports_none: true
      maps: {minimal: low, high: xhigh, max: xhigh}
      evidence: >-
        The template this model's vLLM slugs mount:
        models/qwen3.8-27b/vllm/patches/qwen38-reasoning-effort-template
        chat_template.jinja folds high->xhigh, minimal->low and max->xhigh, then
        raise_exception()s on anything still outside low|medium|xhigh. The unset
        default is the checkpoint template's own `reasoning_effort |
        default('xhigh')` (docs/engines/STRATA.md "Reasoning and sampling
        defaults"). Mirrored in effort_budget.py ALIASES; the model profile
        carries the same citation plus the 2026-10-20 wire probe. The pair's
        none claim: that probe covers this template's thinking-off rendering
        (chat_template_kwargs enable_thinking:false turns thinking off,
        models/qwen3.8-27b/llama-cpp/patches/
        qwen38-gguf-reasoning-effort-template/PROVENANCE.md); the engine feeds
        it enable_thinking=false (the engine evidence below).
    thinkingcap-qwen3.8-27b:
      default_when_unset: xhigh
      supports_none: true
      maps: {minimal: low, high: xhigh, max: xhigh}
      evidence: >-
        A fine-tune on the same template contract: its composes mount that same
        vendored qwen38-reasoning-effort-template chat_template.jinja over the
        checkpoint's own — the mount and its line are cited in
        models/thinkingcap-qwen3.8-27b.yml's effort.evidence — which folds
        high->xhigh, minimal->low and max->xhigh and raise_exception()s on
        anything still outside low|medium|xhigh. The pair's none claim: the
        same vendored template's thinking-off rendering, wire-probed 2026-10-20
        through the byte-identical GGUF twin (models/qwen3.8-27b/llama-cpp/
        patches/qwen38-gguf-reasoning-effort-template/PROVENANCE.md:
        chat_template_kwargs enable_thinking:false turns thinking off); the
        engine feeds it enable_thinking=false (the engine evidence below).
    qwen3.8-flash-next:
      default_when_unset: xhigh
      supports_none: true
      maps: {minimal: low, high: xhigh, max: xhigh}
      evidence: >-
        Same template family as qwen3.8-27b: the vLLM composes mount
        models/qwen3.8-27b/vllm/patches/qwen38-reasoning-effort-template, which
        folds high->xhigh, minimal->low and max->xhigh and raise_exception()s on
        anything still outside low|medium|xhigh; wire-probed 2026-10-20 through
        the byte-identical GGUF twin (qwen3.8-27b/llama-cpp/patches/
        qwen38-gguf-reasoning-effort-template/PROVENANCE.md). The pair's none
        claim: the same template's thinking-off rendering, probed through that
        twin (chat_template_kwargs enable_thinking:false turns thinking off);
        the engine feeds it enable_thinking=false (the engine evidence below).
  evidence: >-
    The three listed models are exactly the ones whose model profile cites that
    template contract. The engine's other models are NOT listed: their
    template's default and clamps were never read, so they get no fold facts
    rather than Qwen's.
    Engine-wide (off_switch / supports_none): the wire accepts a top-level
    `none`, which the engine turns into enable_thinking=false before the template
    runs (models/qwen3.8-27b/vllm/patches/qwen38-reasoning-effort-template patch
    comment). Whether a given model's template then closes the thinking block is
    the model's contract — the render pairs `supports_none` with a model only
    once that model declares a ladder, so the unlisted models above advertise
    nothing today. But the fact IS engine-wide WITHOUT being inheritable: the
    emit carries a pair's `supports_none` only from the pair itself — a pair
    entry that omits the claim renders NOTHING (inheriting True for an unprobed
    pair is the r6/r8 failure #2055 review it10-3 corrects), and check 5d
    refuses exactly that state, so verify its template honors `none` and
    record the pair's own claim in its `by_model` entry before the advertise
    can appear; test-effort-profiles check 5d enforces the pair entry and its
    none claim (#1951 review r6 + r8, #2055 review it9-7).

notes: "Overlay-free stable vLLM — the broad engine for Qwen3-Next (hybrid 27B + MoE 35B-A3B), generic `dense` transformers, and uncurated derived-emission bases. 24 slugs route here. ⚠️ DO NOT restate the image tag in this note: the VERSION lives ONLY in install.spec (display_name mirrors it for humans). Bump install.spec on the next stable; the engine NAME never changes ('keep the tag, change the number'; #254 2026-06-05). This paragraph said 'docker vllm/vllm-openai:v0.22.0' until 2026-07-26 while install.spec had moved on TWICE (v0.24.0, then v0.25.1 in #682) — a duplicated version string is a drift generator, so it is deliberately gone. Read install.spec, and cross-check a RUNNING container with `docker inspect <c> --format '{{.Config.Image}}'` (the launchers inject the engine-profile image over the compose default, #254, and vllm.__version__ can lag its own docker tag). OVERLAY-FREE IS A CONTRACT, not an accident (CONTRACT-5): it is what makes this engine usable as a derived-emission base, and it is why the #682 pin bump needed no patch re-validation — the step that normally dominates an engine bump. Gemma 4 paths therefore stay on `vllm-gemma-stable`, which carries the #40391 per-head-KV + #42006 tool-parser overlays; DiffusionGemma stays on `vllm-diffusion-gemma`, which carries the gemma-image-fixes mount. An overlay-carrying engine cannot be a derived base, so those must remain separate — and note 'we went overlay-free on vLLM' is true of THIS engine only, not of the vLLM family. The pip `dense` lower-bound is `vllm-pip-baseline`. HISTORY: originally the successor to `vllm-nightly-clean` (image nightly-bf610c2f purged from Docker Hub); that migration COMPLETED — nightly-clean has zero registry users and was deprecated 2026-06-06 (#326), closing out the nightly-engine cleanup. Validation on the current pin is partial by maintainer decision: #682 waived the arm-first hold and moved slug-level gates post-merge (single-card 27B autoround live-boot + bench parity vs v0.24.0 at merge; dual `dual.yml` and the fast-vs-max 262K A/B have since landed in BENCHMARKS). MoE boot, and per-slug verify/stress/soak for the long tail, remain deferred — do not read 'shipped on this pin' as 'gated on this pin'. ⚠️ A `VLLM_IMAGE` env override works ONLY for a direct `docker compose -f <compose> up` — switch.sh and launch.sh re-resolve the image from install.spec (resolve-variant-pin) and export it OVER any user-set VLLM_IMAGE. To trial a different image through the launchers, bump install.spec (in a worktree), then assert `docker inspect <c> --format '{{.Config.Image}}'` AND the boot log's `LLM engine (vX)` line. The v0.30.0 exploration (2026-09-23) lost a whole A/B round to this: every 'v0.30.0' arm ran v0.29.0."

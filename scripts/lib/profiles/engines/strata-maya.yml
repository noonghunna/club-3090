supported_model_families:
  - glm5next-moe          # GLM-5.3-Flash: the `maya` engine
  - deepseek41-moe        # DeepSeek-V4.1-Flash-1017: the `maya-ds4` engine (the image builds both since #1801)
  - minimax-m3-moe        # MiniMax-M3.1-Flash: the `maya-mm3` engine (Project Maya v1.1.29 on)
  - hy4-moe               # Hy4-Flash: the `maya-hy4` engine (Project Maya v1.1.68 on)
  - inkling2-loop-moe     # Inkling-2-Mini: the `maya-ik2` engine (Project Maya v1.1.72 on)
supported_weight_formats:
  - gguf                  # Project Maya's own quants (Maya-S / Maya-M / Maya-L); ISTA's GSQ-RCO GGUF of DeepSeek-V4.1-Flash
  - maya-dspark           # Maya's DSpark drafter format (drafter_pack.py's .bin + .json), read by tools/ds4/pack_gguf.py
  - safetensors           # MiniMax-M3.1-Flash's DSpark drafter (dspark/, Hugging Face safetensors), indexed by tools/mm3/pack_gguf.py
supported_kv_formats:
  - fp16                  # the engine's latent KV cache, as its /metrics reports it ("kv": "fp16")
  - int8_per_token_head   # maya-mm3's default K / V: each token's row per KV head in INT8 with its own scale
                          # (128 + 4 bytes; maya.py MM3_KV_BYTES), streamed from pinned RAM
  - fp8_e4m3              # maya-ik2's cache (IK2_KV=fp8, E4M3: Maya's default; IK2_KV=f16 keeps 16 bits)
supported_drafters:
  - dspark                # DeepSeek-V4.1-Flash's DSpark drafter (maya-ds4 --dspark on) and MiniMax-M3.1-Flash's
                          # (maya-mm3 --dspark on; Maya's own setup leaves it off). GLM's MTP is the model's own
                          # NextN block (two or more GPUs), not a club drafter
  - mtp_gguf              # Hy4-Flash's MTP block, a GGUF of its own (maya-hy4 --mtp; drafter maya-hy4-mtp)
# #1951 — what this engine changes about effort. The Maya slugs' composes
# leave REASONING_EFFORT unset (empty) on purpose, so default_when_unset is
# load-bearing for the render. The wire off switch is PROBED (2026-11-15,
# maya-s24 :8194): the launcher maps a request's reasoning_effort none to
# Maya's own none (maya_settings.py EFFORTS), the same state ENABLE_THINKING
# =false produces, and the server answers it with no thinking block — so
# off_switch/supports_none are declared.
effort:
  off_switch: "none"
  supports_none: true
  by_model:
    glm-5.3-flash:
      default_when_unset: max
      supports_none: true
      maps: {medium: high, xhigh: max}
      evidence: >-
        maya_settings.py — GLM-5.3-Flash's own launcher on this engine:
        DEFAULT_EFFORT = "max" (:44) and EFFORTS running medium as high and
        xhigh as max (:46) — the state ENABLE_THINKING=false produces, "the
        server closes the thinking block" (:10, :95-101). The pair's none
        claim is wire-probed 2026-11-15 on maya-s24 (:8194): reasoning_effort
        none -> 0 chars of reasoning_content (low -> 60, max -> 1391 on a
        900-token cap).
    hy4-flash:
      default_when_unset: high
      supports_none: true
      maps: {low: high, medium: high, xhigh: high, max: high}
      evidence: >-
        hy4_settings.py — Hy4-Flash's own launcher on this engine:
        DEFAULT_EFFORT = "high" (:57), EFFORTS (:60) with every level but none
        written as high (:127). Maya's server does the same at the request:
        serve/frontend.py's Hy4 render (v1.1.69) sends the template no_think for
        none / no_think / enable_thinking false and high for every other level
        ("the template would take them, the model is not made for them"), and
        thinking_levels() reports none / high. Wire-probed 2026-11-20 on
        hy4-flash-dual-maya-xs (:8214): none and minimal -> 0 chars of
        reasoning_content; low / medium / xhigh / max reason like high
        (178-314 chars on a 900-token cap, no growth with the rung).
    inkling-2-mini:
      default_when_unset: high
      # `none` reaches the template as 0.0 and turns thinking off here (measured below), unlike on vllm-inkling.yml
      supports_none: true
      maps: {max: xhigh}
      evidence: >-
        ik2_settings.py, Inkling-2-Mini's own launcher on this engine: DEFAULT_EFFORT = "high", written as the
        config's reasoning_effort when REASONING_EFFORT is unset, and EFFORTS = the template's effort_map names
        (none / minimal / low / medium / high / xhigh / max). Maya's server passes the level to the template by
        name (serve/frontend.py at v1.1.75: Inkling's template takes "reasoning_effort by name (none .. max, its
        effort_map) or a number"), which writes it as "Thinking effort level: X"; xhigh and max are both 0.99.
        Wire-probed 2026-11-23 on strata-maya/inkling-2-mini-single-ud-q4kxl (:8230, Maya v1.1.75 + maya-ik2, a
        local test image), an IPv4-validator coding prompt at temperature 0: minimal -> 0 chars of
        reasoning_content (140 completion tokens), xhigh -> 3,002 chars (1,353 tokens), unset (high) -> 3,777 chars
        (1,409 tokens); the top-level reasoning_effort and chat_template_kwargs.reasoning_effort gave the same.
        Re-probed 2026-11-24 on the pinned v1.1.77 digest (3d4e5368): the same counts to the character, and the
        other levels: none -> 0 chars (140 tokens; top-level and chat_template_kwargs alike), low 1,033 (470),
        medium 1,962 (775), high 3,777 (1,409), max 3,002 (1,353). So none turns thinking off on maya-ik2
        (supports_none: true), where on vllm-inkling none (0.0) still reasons. CORRECTION 2026-11-24: the first
        version of this entry said supports_none: false, copied from vllm-inkling without a measurement.
  evidence: >-
    Engine-wide (off_switch / supports_none): all three launchers on this engine
    map a request's `none` to thinking off — maya_settings.py EFFORTS (:46),
    ds4_settings.py EFFORTS (:54, `none: none`), mm3_settings.py EFFORTS (:57,
    the tuple includes `none`). Only GLM's is measured on the wire: 2026-11-15 on
    maya-s24 (:8194), reasoning_effort none -> 0 chars of reasoning_content
    (low -> 60, max -> 1391 on a 900-token cap).
    The engine's DeepSeek and MiniMax models are deliberately NOT listed under by_model:
    their launchers disagree — ds4_settings.py defaults to "high" (:51) and
    mm3_settings.py to "auto" (:54) with seven pass-through levels (:57) — and
    both are `status: unprobed`, so there is no ladder to fold onto yet.

notes: >
  Project Maya (github.com/mw00/project-maya, MIT): a fork of Strata (Niko1221/Strata) for
  GLM-5.3-Flash, with its own quants, and DeepSeek-V4.1-Flash-1017 on a second engine (maya-ds4). Upstream publishes no Linux image, Dockerfile or
  engine (maya.sh compiles on the user's PC), so club-3090 builds one per release
  (models/glm-5.3-flash/strata-maya/image/, an image-provenance exception in
  docs/ADDING_ENGINES.md): both engines (maya, maya-ds4) compiled as maya.py compiles them, ggml's
  CPU code on an AVX2 baseline, archs 75;80;86;89;120, text only (no vision encoder or DeepSeek
  vision tower, no DFlash2 drafter). Host
  needs NVIDIA driver >= 580 (CUDA 13) and an AVX2 CPU; x86-64 only. Experts are spread over a
  per-layer VRAM pool, a pinned RAM tier sized from free memory, and the GGUF files; the CPU
  computes part of each token's RAM-tier experts. GLM's MTP drafting runs only on two or more
  GPUs; DeepSeek drafts with a separate DSpark drafter (maya-dspark-xs2).
  Serves on 8080 with Strata's /health, /props, /slots and JSON /metrics shape (engine kind
  `strata`); the per-request engine lines go to a log file on the data volume.

  delta: "Strata's C++/CUDA engine and Python server rewritten for GLM-5.3-Flash only (the GLM5-Next runner, a per-layer VRAM expert pool, a pinned RAM tier and a CPU lane priced against PCIe, MTP drafting across a two-card split), with its own quants (peasantsmith/GLM-5.3-Flash-Maya-GGUF); a second engine, maya-ds4, for DeepSeek-V4.1-Flash-1017 (src/ds4: tensor parallel or a layer split, every CPU-side expert copied into RAM when it fits, a DSpark drafter, Engram tables); and a third, maya-mm3, for MiniMax-M3.1-Flash (src/mm3: a layer split for its GGUF quants, the experts VRAM doesn't hold computed on the CPU from RAM, streamed K / V, a DSpark drafter). Upstream publishes no image, Dockerfile or Linux engine; our image compiles each release with our own Dockerfile (upstream's STRATA_PORTABLE option for an AVX2 baseline, text only), an image-provenance exception (docs/ADDING_ENGINES.md)"

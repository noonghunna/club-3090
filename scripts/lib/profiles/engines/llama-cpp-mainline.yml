schema_version: 1
id: llama-cpp-local
display_name: llama.cpp local CUDA server (MTP-enabled)
type: llama.cpp
stability: stable
install:
  method: docker_image
  spec: ghcr.io/ggml-org/llama.cpp@sha256:6ac921528d613deb0fd142c654735e594a446a1c37a069eeab08d8fd974d4bec
min_sm: 6.0
supported_model_families:
  - qwen3-next-hybrid
  - qwen3-next-moe
  - qwen35-dense          # Deckard-40B (standard GQA, arch=qwen35; MTP via embedded nextn head)
  - gemma4-unified
  - dense                 # plain transformer GGUFs (e.g. VibeThinker-3B, Qwen2 dense — no MTP)
  - deepseek4-moe         # DeepSeek-V4-Flash-0731 (arch deepseek4, 43 all-MoE layers, MLA+DSA) — CPU-offload slugs
features: {}
supported_kv_formats:
  - fp16                  # llama.cpp default when no -ctk/-ctv is passed (DeepSeek-Flash offload slugs)
  - q4_0
  - q5_0
  - q8_0
  - k8v4
supported_drafters:
  - mtp                   # embedded nextn head (self-spec) — 27B built-in, Deckard-40B
  - mtp_gguf              # external draft GGUF via --spec-draft-model — Tess-4-27B; live-validated on server-cuda-b9246 (dual 3090, 262K, 2026-07-09)
  - dspark                # DeepSeek-V4-Flash external DSpark drafter (--spec-type draft-dspark); runtime landed ggml-org#25784, present in b10236, ABSENT in b9967
supported_weight_formats:
  - gguf
required_overlays: []
vendored_overlays: []
required_genesis: false
notes: "Cliff-immune single-card fallback for Qwen GGUF serving. Uses upstream `ghcr.io/ggml-org/llama.cpp`, pinned BY DIGEST to `@sha256:6ac9215...` = build b10920 (commit `eafe15a5e`, image built 2026-09-12T06:03:33Z; read it back from the image labels or `llama-server --version`). WHY A DIGEST AND NOT `server-cuda-bNNNN`: upstream STOPPED publishing per-build CUDA server images. Probed 2026-09-12 -- the old `server-cuda-b10236` returns 200, but b10930 / b10917 / b10901 / b10883 / b10867 / b10850 / b10793 all 404, as do `server-cuda12-b10917`, `full-cuda-b10917`, `light-cuda-b10917`, `cuda-b10917` and bare `b10917`; only the ROLLING tags (`server-cuda`, `server-cuda12`, `server`, `full-cuda`) still resolve. So 'always pin a validated build' is no longer satisfiable via a build tag. Pinning the rolling tag's DIGEST keeps both properties: immutable (a digest cannot move under us, which is exactly the #187 hazard) AND validated (the labels still name the build). Already the house pattern -- beellama-local and all three llamacpp-club3090 profiles pin `@sha256:`. To bump: resolve the rolling tag via `docker buildx imagetools inspect ... --format {{.Manifest.Digest}}`, validate, then pin that digest. Pin history: b9246 → b9967 2026-07-11 after a full quality A/B on Tess dual (think-OFF total tie 115=115, think-ON 122 vs the 118x3 pin — the lift is thinking-path-specific); b9967 → b10236 2026-08-06, chosen because it is the build the DeepSeek-V4-Flash offload matrix was measured on and it carries **DSpark** (worth +26–56% decode on that model), which b9967 lacks. Deliberately NOT the newest build at bump time (b10297) — shipping an unmeasured image is the failure this pin exists to prevent. ⚠️⚠️ THAT RULE NEARLY PRODUCED A FALSE REGRESSION REPORT on the 2026-09-12 bump, and the lesson is about POWER, not builds. b10920 first benched 36.7 narr / 42.4 code against the recorded b10236 baseline of 61.55 / 71.33 -- a -40% that looked exactly like an upstream spec-decode regression, with the drafter accepting healthily (0.83-0.89) but converting nothing. The cause was `nvidia-power-cap.service`, an ENABLED systemd unit (description: cap both RTX 3090s at 230W for quieter/cooler operation) running `nvidia-smi -pl 230` on both cards at every boot, against a 370 W default. Uncapped, the SAME image measures 67.2 narr / 78.8 code -- +9%/+10% OVER the baseline. Two standing consequences: (1) a depth arm alone would NOT have caught it, since SPEC_N=1 and SPEC_N=2 measured identically -- that is what ruled out the depth hypothesis and pointed at the machine; (2) the recorded b10236 baseline carries NO power annotation and so is not reproducible from its own entry, while neighbouring BENCHMARKS rows do annotate power. ⇒ Capture `power.limit` vs `power.default_limit` before quoting ANY llama.cpp number on this rig. NOT the rolling `:server-cuda` tag either — it regressed at b9282 with a broken-lib crash loop, #187; always pin validated builds. MTP PR #22673 merged upstream + draft-eagle3 + draft-mtp spec types available natively. Bump via env once a newer build is validated: `LLAMACPP_IMAGE=ghcr.io/.../server-cuda-bXXXX`. No club-3090 patches on llama.cpp; we follow upstream as-is (`vendored_overlays: []`)."


schema_version: 1
id: llama-cpp-local
display_name: llama.cpp local CUDA server (MTP-enabled)
type: llama.cpp
# #1365: the compose env var this engine's image is injected as.
# null, and ⚠️ NOT because this profile is ambiguous — it is the MAINLINE engine
# (ggml-org), used correctly by 15 llamacpp/* slugs that all read LLAMACPP_IMAGE
# and whose compose defaults match install.spec byte for byte.
#
# It is null because 15 ik-llama/* slugs ALSO register against this profile and
# read IK_LLAMA_IMAGE instead. ik_llama is a SEPARATE ENGINE -- its builds take
# --merge-qkv / --fit / --fit-margin / --cache-ram, none of which exist here, and
# the two forks disagree on --no-mmap vs --load-mode in opposite directions. Those
# slugs are registered here only because ik-llama HAS NO ENGINE PROFILE. The fix
# is to add one (two, in fact: the ik slugs pin two different digests), NOT to
# split this profile -- an earlier version of this comment said 'split', which
# misnamed the cause.
#
# Until then a single image var cannot be named here, and keying it off the slug
# prefix would reintroduce exactly the fragility #1365 removed from the launchers.
# Cost of leaving it: these 30 slugs keep their compose default (identical to
# install.spec for all 15 mainline ones, so no behaviour is lost), ik slugs are
# judged against MAINLINE's supported_kv_formats/supported_drafters, and the ik
# pin logic lives as a bash special case (preflight_ik_llama_image, #633).
# 13 of the 15 ik slugs are already deprecated, which is why this is not urgent.
image_env: null

stability: stable
install:
  method: docker_image
  spec: ghcr.io/ggml-org/llama.cpp@sha256:52192a23c7b258044463aebba78826cdff39a7393b713edc313324b343a7b836
min_sm: 6.0
supported_model_families:
  - qwen3-next-hybrid
  - qwen3-next-moe
  - qwen35-dense          # Deckard-40B (standard GQA, arch=qwen35; MTP via embedded nextn head)
  - gemma4-unified
  - dense                 # plain transformer GGUFs (e.g. VibeThinker-3B, Qwen2 dense — no MTP)
  - deepseek4-moe         # DeepSeek-V4-Flash-0731 (arch deepseek4, 43 all-MoE layers, MLA+DSA) — CPU-offload slugs
features: {}
supported_kv_formats:
  - fp16                  # llama.cpp default when no -ctk/-ctv is passed (DeepSeek-Flash offload slugs)
  - q4_0
  - q5_0
  - q8_0
  - k8v4
supported_drafters:
  - mtp                   # embedded nextn head (self-spec) — 27B built-in, Deckard-40B
  - mtp_gguf              # external draft GGUF via --spec-draft-model — Tess-4-27B; live-validated on server-cuda-b9246 (dual 3090, 262K, 2026-07-09)
  - dspark                # DeepSeek-V4-Flash external DSpark drafter (--spec-type draft-dspark); runtime landed ggml-org#25784, present in b10236, ABSENT in b9967
supported_weight_formats:
  - gguf
required_overlays: []
vendored_overlays: []
required_genesis: false
notes: "Cliff-immune single-card fallback for Qwen GGUF serving. Uses upstream `ghcr.io/ggml-org/llama.cpp`, pinned BY DIGEST to `@sha256:52192a23...` = release **v0.5.0** = build b11146 (commit `7fe450e19`, image `server-cuda-v0.5.0` built 2026-09-23T20:22Z, CUDA 12.8.1 — the same base as the b10920 pin; read it back from the image labels or `llama-server --version`). ⚠️ v0.5.0 was pinned WITHOUT a live boot (2026-09-23: both GPUs busy) — boots of the 10 functional composes are pending; see docs/UPSTREAM.md. UPSTREAM RESUMED VERSIONED IMAGES with v0.5.0: `server-cuda-v0.5.0` / `server-cuda13-v0.5.0` resolve (per-build `server-cuda-bNNNN` still 404). The digest pin stays anyway — a tag can be re-pushed, a digest cannot. WHY A DIGEST AND NOT `server-cuda-bNNNN`: upstream STOPPED publishing per-build CUDA server images. Probed 2026-09-12 -- the old `server-cuda-b10236` returns 200, but b10930 / b10917 / b10901 / b10883 / b10867 / b10850 / b10793 all 404, as do `server-cuda12-b10917`, `full-cuda-b10917`, `light-cuda-b10917`, `cuda-b10917` and bare `b10917`; only the ROLLING tags (`server-cuda`, `server-cuda12`, `server`, `full-cuda`) still resolve. So 'always pin a validated build' is no longer satisfiable via a build tag. Pinning the rolling tag's DIGEST keeps both properties: immutable (a digest cannot move under us, which is exactly the #187 hazard) AND validated (the labels still name the build). Already the house pattern -- beellama-local and all three llamacpp-club3090 profiles pin `@sha256:`. To bump: resolve the rolling tag via `docker buildx imagetools inspect ... --format {{.Manifest.Digest}}`, validate, then pin that digest. Pin history: b9246 → b9967 2026-07-11 after a full quality A/B on Tess dual (think-OFF total tie 115=115, think-ON 122 vs the 118x3 pin — the lift is thinking-path-specific); b9967 → b10236 2026-08-06, chosen because it is the build the DeepSeek-V4-Flash offload matrix was measured on and it carries **DSpark** (worth +26–56% decode on that model), which b9967 lacks. b10236 → b10920 2026-09-12 (digest pin, see below); b10920 → v0.5.0/b11146 2026-09-23 (carries `bfd73a876`/ggml-org#29257 — the Qwen3-Coder handler fix that lets MiMo's vendored template patch drop — and #28549 CUDA graphs for MTP drafting; unbooted at pin time). The b10236 pick was deliberately NOT the newest build at bump time (b10297) — shipping an unmeasured image is the failure this pin exists to prevent. ⚠️⚠️ THAT RULE NEARLY PRODUCED A FALSE REGRESSION REPORT on the 2026-09-12 bump, and the lesson is about POWER, not builds. b10920 first benched 36.7 narr / 42.4 code against the recorded b10236 baseline of 61.55 / 71.33 -- a -40% that looked exactly like an upstream spec-decode regression, with the drafter accepting healthily (0.83-0.89) but converting nothing. The cause was `nvidia-power-cap.service`, an ENABLED systemd unit (description: cap both RTX 3090s at 230W for quieter/cooler operation) running `nvidia-smi -pl 230` on both cards at every boot, against a 370 W default. Uncapped, the SAME image measures 67.2 narr / 78.8 code -- +9%/+10% OVER the baseline. Two standing consequences: (1) a depth arm alone would NOT have caught it, since SPEC_N=1 and SPEC_N=2 measured identically -- that is what ruled out the depth hypothesis and pointed at the machine; (2) the recorded b10236 baseline carries NO power annotation and so is not reproducible from its own entry, while neighbouring BENCHMARKS rows do annotate power. ⇒ Capture `power.limit` vs `power.default_limit` before quoting ANY llama.cpp number on this rig. NOT the rolling `:server-cuda` tag either — it regressed at b9282 with a broken-lib crash loop, #187; always pin validated builds. MTP PR #22673 merged upstream + draft-eagle3 + draft-mtp spec types available natively. Bump via env once a newer build is validated: `LLAMACPP_IMAGE=ghcr.io/.../server-cuda-bXXXX`. No club-3090 patches on llama.cpp; we follow upstream as-is (`vendored_overlays: []`)."


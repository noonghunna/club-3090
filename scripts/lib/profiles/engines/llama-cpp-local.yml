schema_version: 1
id: llama-cpp-local
display_name: llama.cpp local CUDA server (MTP-enabled)
type: llama.cpp
# #1365: the compose env var this engine's image is injected as. The launchers
# export install.spec as LLAMACPP_IMAGE, so a pin bump here is what every
# llamacpp/* slug runs, whatever its compose default says.
#
# This was null until 2026-10-13, because the 15 ik-llama/* slugs also register
# against this profile and their composes read IK_LLAMA_IMAGE (ik_llama is a
# separate engine with no profile of its own, and it's out of the catalog). All
# 15 are deprecated now, and injecting LLAMACPP_IMAGE doesn't touch them: their
# composes never read it, so they keep running their own ik image.
#
# What changes: the 5 deprecated llamacpp/* composes that engine-pin-bump.sh
# skipped (they still default to the older ggml-org digest 6ac92152…) now run
# this pin when launched with --force, the same as deprecated vLLM composes do
# under VLLM_IMAGE. A SAVED LLAMACPP_IMAGE (club3090.env) is now ignored in
# favour of the pin, as for every other engine image; export it in the shell
# for a one-off build.
image_env: LLAMACPP_IMAGE

stability: stable
# The ik-llama slugs also register against this profile but run ikawrakow's own
# image (IK_LLAMA_IMAGE), so this lineage describes the mainline slugs only.
lineage:
  relation: "stock"
  base: "llama.cpp"
  base_version: "b12110"
  source: "https://github.com/ggml-org/llama.cpp"
  source_ref: "cd959bae99ff4bed22bef2604f45241c09bbb8c8"
  chain: []
  delta: null
install:
  method: docker_image
  # The pin's record: pin-current is what spec pins now; pin-earlier lists earlier pins, newest first (the first
  # is the rollback). docs/UPSTREAM.md's Pinned images table holds why it's pinned, not these.
  # Each bump's validation is its dated row in docs/UPSTREAM.md (Active follow-ups).
  # pin-current: v0.9.0 · server-cuda-b12110 · commit cd959bae9 · pinned 2026-11-04
  # pin-earlier: v0.8.0 = b11960 `4ccae195…` (2026-10-28, #1835); v0.7.0 = b11669 `e4cfff28…` (2026-10-17, #1717); v0.6.0 = b11429 (2026-10-06, #1567); v0.5.0 = b11146 (#1397); b10920, the first pinned by digest (2026-09-12, #1273); b10236 (2026-08-06); b9967 (2026-07-11); b9246; before that the rolling `server-cuda` tag
  spec: ghcr.io/ggml-org/llama.cpp@sha256:a2963b4817f03eea7e0d6065ea576252322792441ef97aaae178b924520547d6
min_sm: 6.0
supported_model_families:
  - qwen3-next-hybrid
  - qwen3-next-moe
  - qwen35-dense          # Deckard-40B (standard GQA, arch=qwen35; MTP via embedded nextn head)
  - gemma4-unified
  - dense                 # plain transformer GGUFs (e.g. VibeThinker-3B, Qwen2 dense — no MTP)
  - deepseek4-moe         # DeepSeek-V4-Flash-0731 (arch deepseek4, 43 all-MoE layers, MLA+DSA) — CPU-offload slugs
features: {}
supported_kv_formats:
  - fp16                  # llama.cpp default when no -ctk/-ctv is passed (DeepSeek-Flash offload slugs)
  - q4_0
  - q5_0
  - q8_0
  - k8v4
supported_drafters:
  - mtp                   # embedded nextn head (self-spec) — 27B built-in, Deckard-40B
  - mtp_gguf              # external draft GGUF via --spec-draft-model — Tess-4-27B; live-validated on server-cuda-b9246 (dual 3090, 262K, 2026-07-09)
  - dspark                # DeepSeek-V4-Flash external DSpark drafter (--spec-type draft-dspark); runtime landed ggml-org#25784, present in b10236, ABSENT in b9967
supported_weight_formats:
  - gguf
required_overlays: []
vendored_overlays: []
required_genesis: false
notes: "Cliff-immune single-card fallback for Qwen GGUF serving. Uses upstream `ghcr.io/ggml-org/llama.cpp`, pinned BY DIGEST to `@sha256:a2963b48...` = release **v0.9.0** = build b12110 (commit `cd959bae9`, image `server-cuda-b12110` = `server-cuda12-b12110`, CUDA 12 — the same base as v0.8.0; read it back from `llama-server --version`, which prints `0.9.0-dev (build 12110, commit cd959bae9)`, or the `org.opencontainers.image.version` / `.revision` labels). ⚠️ HOW TO FIND A RELEASE IMAGE (2026-10-06, still true for v0.9.0 on 2026-11-04): upstream publishes NO `server-cuda-v0.X.0` alias (404). Map the release tag to its commit, the commit to its `bNNNNN` tag (`git ls-remote --tags https://github.com/ggml-org/llama.cpp | grep <commit>`), then use `server-cuda-bNNNNN` and pin its digest. ⚠️ The per-build image lands only when the release's `Publish Docker image` run finishes: v0.8.0 was tagged 12:47 UTC and its image appeared ~15:00, and until then the rolling `server-cuda` was still the previous nightly (b11946); v0.9.0 was released 13:08 UTC and its `server-cuda*-b12110` tags appeared only ~20:10, after the run's tag jobs had sat queued behind the other platforms' builds for hours. Read the image's `org.opencontainers.image.version` label before pinning. Validated 2026-11-04 (boot tests only, 230 W): qwen38-27b-single-iq4xs, qwen38-27b-dual-q8kxl and mimo9b-single-vision boot via `switch.sh --force` on this digest, pass verify-full (9 + 1 n/a, 8 + 2 n/a, 8 + 2 n/a; MTP draft acceptance 1.000 and 0.974; vision 4/4 where an mmproj is loaded) and keep 0 restarts; on both Qwen3.8 slugs every effort (low / medium / xhigh / high / minimal / max) returns 200 with the vendored template still served, and an unknown effort still gets 500; `--help` is unchanged since b11960, and the five `LLAMA_ARG_*` variables the composes set are still read. NOT booted: the DeepSeek / gemma-12b / 35B-A3B / Swift-1.5 slugs (weights not on the rig). The v0.8.0 validation (2026-10-28, 230 W) booted the same three slugs. The digest pin stays — a tag can be re-pushed, a digest cannot. WHY A DIGEST AND NOT `server-cuda-bNNNN` (history: per-build tags were back by b11429): upstream STOPPED publishing per-build CUDA server images in 2026-09. Probed 2026-09-12 -- the old `server-cuda-b10236` returns 200, but b10930 / b10917 / b10901 / b10883 / b10867 / b10850 / b10793 all 404, as do `server-cuda12-b10917`, `full-cuda-b10917`, `light-cuda-b10917`, `cuda-b10917` and bare `b10917`; only the ROLLING tags (`server-cuda`, `server-cuda12`, `server`, `full-cuda`) still resolve. So 'always pin a validated build' is no longer satisfiable via a build tag. Pinning the rolling tag's DIGEST keeps both properties: immutable (a digest cannot move under us, which is exactly the #187 hazard) AND validated (the labels still name the build). Already the house pattern -- beellama-local and all three llamacpp-club3090 profiles pin `@sha256:`. To bump: resolve the rolling tag via `docker buildx imagetools inspect ... --format {{.Manifest.Digest}}`, validate, then pin that digest. Pin history: b9246 → b9967 2026-07-11 after a full quality A/B on Tess dual (think-OFF total tie 115=115, think-ON 122 vs the 118x3 pin — the lift is thinking-path-specific); b9967 → b10236 2026-08-06, chosen because it is the build the DeepSeek-V4-Flash offload matrix was measured on and it carries **DSpark** (worth +26–56% decode on that model), which b9967 lacks. b10236 → b10920 2026-09-12 (digest pin, see below); b10920 → v0.5.0/b11146 2026-09-23 (carries `bfd73a876`/ggml-org#29257 — the Qwen3-Coder handler fix that lets MiMo's vendored template patch drop — and #28549 CUDA graphs for MTP drafting; unbooted at pin time). v0.5.0/b11146 → v0.6.0/b11429 2026-10-06 (MiMo's template patch dropped in the same change: CLI-21…26 6/6 without it). v0.6.0/b11429 → v0.7.0/b11669 2026-10-17 (rewrites the server's chat layer, #30210 / #30389 / #29876, which tool-call and reasoning parsing go through; adds mainline's own host-memory MoE expert cache, `--moe-cache-mib`, #29887 / #30112). v0.7.0/b11669 → v0.8.0/b11960 2026-10-28 (a 50/50 SLRU for host-resident MoE experts, ggml 0.28 with chunked CUDA graph launches, server tool-calling and router changes; #31271 exposes the template's effort levels). v0.8.0/b11960 → v0.9.0/b12110 2026-11-04 (MTP hidden state saved and restored in context checkpoints, #30141; the speculative checkpoint restored for drafts longer than `n_rs_seq`, #31350; rollbacks past the last ubatch's snapshots refused, #31368; fused MoE MMQ gate/up + GLU on CUDA, #31188; a CUDA Q8_1 correction-sum fix, #31247; the qwen3-coder think block stripped with `reasoning_format none`, #31380; ggml 0.29.0 with FP8 E4M3 and `flash_attn_ext_rows`; no `--help` flag added or removed). The b10236 pick was deliberately NOT the newest build at bump time (b10297) — shipping an unmeasured image is the failure this pin exists to prevent. ⚠️⚠️ THAT RULE NEARLY PRODUCED A FALSE REGRESSION REPORT on the 2026-09-12 bump, and the lesson is about POWER, not builds. b10920 first benched 36.7 narr / 42.4 code against the recorded b10236 baseline of 61.55 / 71.33 -- a -40% that looked exactly like an upstream spec-decode regression, with the drafter accepting healthily (0.83-0.89) but converting nothing. The cause was `nvidia-power-cap.service`, an ENABLED systemd unit (description: cap both RTX 3090s at 230W for quieter/cooler operation) running `nvidia-smi -pl 230` on both cards at every boot, against a 370 W default. Uncapped, the SAME image measures 67.2 narr / 78.8 code -- +9%/+10% OVER the baseline. Two standing consequences: (1) a depth arm alone would NOT have caught it, since SPEC_N=1 and SPEC_N=2 measured identically -- that is what ruled out the depth hypothesis and pointed at the machine; (2) the recorded b10236 baseline carries NO power annotation and so is not reproducible from its own entry, while neighbouring BENCHMARKS rows do annotate power. ⇒ Capture `power.limit` vs `power.default_limit` before quoting ANY llama.cpp number on this rig. NOT the rolling `:server-cuda` tag either — it regressed at b9282 with a broken-lib crash loop, #187; always pin validated builds. MTP PR #22673 merged upstream + draft-eagle3 + draft-mtp spec types available natively. Bump via env once a newer build is validated: `LLAMACPP_IMAGE=ghcr.io/.../server-cuda-bXXXX`. No club-3090 patches on llama.cpp; we follow upstream as-is (`vendored_overlays: []`)."


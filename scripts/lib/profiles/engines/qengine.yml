  # on); its server, engine libraries and entrypoint are byte-identical to the text image of the same release.
  # Its org.opencontainers.image.revision label is the source commit: 1.3.5.6 is git tag v1.3.5.6, commit 0330e7e4.
  # pin-current: 1.3.5.6-vision · source 0330e7e4 · pinned 2026-11-09 · upstream's STABLE release (latest and vision moved here from 1.3.5; it contains the experimental 1.3.5.1 to 1.3.5.5; rollback 1.3.5.4, or 1.3.5 for the previous stable build) · booted on both slugs (230 W): verify-full all pass with vision 4/4 (27B ready 24 s, MTP acceptance length 5.90, KV pool 368,640 with vision, served context 262144, MemAvailable 50.5 GiB below idle at ready; Flash-Next ready 136 s, 3.97, context 262144, MemAvailable 87.5 GiB below the idle reading taken after it stopped); omitted effort = low and probe-effort-budget --positive on both; reasoning_effort, reasoning.effort and chat_template_kwargs effort `none` give no reasoning on both (1.3.5.5; also with enable_thinking true); QE_DECODE_COMM=auto kept P2P on both against the new host path (one stream 14.97 / 15.20 ms a step on the 27B, 23.98 / 24.92 on Flash-Next); the `context: requested …, served …` start-up line on both
  # pin-earlier: 1.3.5.4-vision `0fbc6fec…` (source 8ec82d5e, 2026-11-07, upstream-experimental, contains 1.3.5.3; booted on both slugs, verify-full all pass with vision 4/4, logprobs on both); 1.3.5.3-vision `c175eb42…` (source dffb7d19, 2026-11-07, upstream-experimental at the maintainer's call for the Flash-Next disk cache; booted on both slugs, verify-full all pass with vision 4/4, Flash-Next disk cache measured); 1.3.5-vision `167d404c…` (source 1348a95d, 2026-11-06, upstream's previous stable build; booted on both slugs, verify-full all pass with vision 4/4); 1.3.4.3-vision `db64a5db…` (source 5083e042, 2026-11-03; booted on both slugs, verify-full all pass with vision 4/4, the THINKING_BUDGET_* map reaching QE_THINKING_BUDGET); 1.3.4.2-vision `e7ef3c0e…` (source d2a24bf8, 2026-11-02; booted on both slugs, verify-full all pass with vision 4/4, Flash-Next on the new c0022018 weights; 1.3.4.1 was never pinned on its own); 1.3.4-vision `2b3f8fb5…` (source c3f8ca75, 2026-11-01; booted on both slugs, verify-full, vision, thinking budget per request and by QE_THINKING_BUDGET, Flash-Next concurrency sweep clean); 1.3.3.1-vision `39c1cf06…` (source 7bd4bebf, 2026-11-01; booted on both slugs, verify-full, vision, concurrent-prefill sweep); 1.3.3-vision `0358837d…` (source 21517be6, 2026-11-01; booted on both slugs, Flash-Next FLASH_COMM=ce sweep 9/9 clean with the pipeline on); 1.3.2-vision `3375a425…` (source fb1da72d, 2026-10-31); 1.3.2 text-only `ff323aa4…` (source fb1da72d, 2026-10-31; runs the slugs with VISION=0); 1.3.1 `849b059d…` (source 016c9249, 2026-10-30); 1.3 `b9d1b0af…` (source d15a4d3a, 2026-10-28); 1.3-rc4 `18b3c4bb…` (source 116bd8d9, 2026-10-27)
  # Before 1.3.1 there is no QE_REASONING_EFFORT, so the composes refuse those images: a rollback to 1.3 also
  # needs the composes' earlier entrypoint, which served a copy of the template with its default effort replaced.
  spec: ghcr.io/bpx03/qengine@sha256:126929905654fd80f7245794b656fcaacedd56a081772f2db752aaec6ecdd4da
supported_model_families:
  - qwen35-dense          # Qwen3.8-27B, RedHatAI's INT4 only (libqengine.so)
  - qwen4exp              # Qwen3.8-Flash-Next, the author's own INT4 layout (libqflash.so, from 1.3; upstream calls it a
                          # preview: tested on one machine, no quality benchmark yet)
supported_weight_formats:
  - compressed-tensors    # RedHatAI/Qwen3.8-27B-INT4 (pack-quantized W4A16, group 128, symmetric). It reads only
                          # weight_packed / weight_scale, so other INT4 formats (AutoRound's auto_gptq packing) don't load
  - qengine-int4          # bpx03/Qwen3.8-Flash-Next-QEngine: Intel's AutoRound INT4 regrouped per layer for libqflash.so,
                          # with an INT8 n-gram table; only QEngine reads it
supported_kv_formats:
  - fp8_e4m3              # its one K / V format: FP8 e4m3 in a shared pool per GPU
supported_drafters:
  - mtp                   # the checkpoint's MTP head, or the author's head fine-tuned on the engine's own answers
                          # (model_mtp_ft.safetensors, a release asset); it also drafts by lookup from the token history
notes: >
  QEngine (github.com/bpx03/QEngine, Krzysztof Jagus): ⚠️ PolyForm Noncommercial License 1.0.0, free
  for non-commercial use only; commercial use needs the author's licence. An independent C++/CUDA engine
  for one model on one kind of machine: Qwen3.8-27B INT4 (RedHatAI's compressed-tensors W4A16, plus its
  MTP head) on three RTX 3090s with tensor parallel 3 over PCIe, built for sm_86 only. The author has
  measured two cards (72-85% of the three-card throughput); one card is experimental (QE_MAX_SEQS 1-4).
  GPU-to-GPU P2P is used when the driver grants it, else a slower path through host memory. FP8 KV up
  to 262,144 tokens a conversation, MTP and lookup drafts, continuous batching up to 32 sequences,
  prefix and KV reuse with a host-RAM archive, structured output, tool calls, thinking on/off with
  reasoning-effort levels. Serves on 8080 (/v1/chat/completions, /v1/models with owned_by "qengine",
  /v1/messages, /health), with a dashboard and Prometheus metrics on 9393; settings are QE_* variables
  (QE_GPUS, QE_MAX_SEQS, QE_RESERVE_GB, QE_EXTRA_ARGS for server/app.py flags). From 1.3-rc4 a cross-turn
  loop guard is on by default: after 3 identical (reply, tool result) turns in a row, the next turn gets a
  presence penalty on the repeated reply and a server note appended to the latest tool result
  (QE_LOOP_GUARD_TURNS=0 turns it off, QE_LOOP_GUARD_NOTE=0 drops only the note, "loop_guard": false in a
  request turns it off for that request). Engine kind `qengine`.
  Registered 2026-10-27 with no slug; the first two (2026-10-28) are two-card ones, qengine/qwen38-27b-dual
  and qengine/qwen38-flash-next-dual. They map ENABLE_THINKING to --think, SPEC_N to --mtp-k and
  REASONING_EFFORT to QE_REASONING_EFFORT (from 1.3.1; until then a copy of QEngine's own template, whose
  default is xhigh). From 1.3.4 QEngine caps thinking per request (thinking_budget, Anthropic budget_tokens) or by
  QE_THINKING_BUDGET, which the slugs forward; our THINKING_BUDGET_* effort map isn't wired to it. bench.sh and verify-full read its [stats] lines
  (llama.cpp's timing format, vLLM's SpecDecoding metrics format); health.sh and bench.sh's interconnect block read its boot log (#1854). Its metrics
  port (9393) is unpublished; QE_METRICS_PORT=<port> publishes it on 127.0.0.1 only (switch.sh's override).

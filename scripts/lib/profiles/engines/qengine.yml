schema_version: 1
id: qengine
display_name: QEngine (bpx03's engines for Qwen3.8-27B and Qwen3.8-Flash-Next INT4 on RTX 3090s; the author's own image)
type: qengine
stability: experimental
# The RTX 3090 is QEngine's supported, tuned card. From 1.3.4 its images also carry sm_89 (RTX 4090,
# untested upstream) and sm_120 (RTX 5090, community-tested in #1826) code, neither tuned.
min_sm: 8.6
lineage:
  relation: "new"
  base: null
  base_version: null
  source: "https://github.com/bpx03/QEngine"
  source_ref: "380e3c7afd2daf1f64b29f6cb60c46be6d7af55b"
  chain: []
  delta: "Independent C++/CUDA engine (libqengine.so, about 26k lines) for one model, Qwen3.8-27B INT4 (RedHatAI's compressed-tensors W4A16 checkpoint and its MTP head), tuned for RTX 3090s with tensor parallel over PCIe, with its own Python server (OpenAI- and Anthropic-compatible APIs). Pinned to the image its author publishes (ghcr.io/bpx03/qengine)"
image_env: QENGINE_IMAGE
install:
  method: docker_image
  # The author's own image, ghcr.io/bpx03/qengine:<release>-vision: the engine plus PyTorch for the vision encoder
  # (~3 GB; the text-only :<release> is ~0.3 GB). Pinned from 2026-10-31 so the slugs take images (VISION, default
  # on); its server, engine libraries and entrypoint are byte-identical to the text image of the same release.
  # Its org.opencontainers.image.revision label is the source commit: 1.6.2 is git tag v1.6.2, commit 380e3c7a.
  # pin-current: 1.6.2-vision · source 380e3c7a · pinned 2026-11-27 · upstream's STABLE release (latest and vision moved here through 1.6.0 and 1.6.1, all three released 2026-11-26; 1.6.0 adds Inkling-2-Mini as a preview (no slug here runs it), restore points at the start of a prompt's last two messages on Flash-Next (FLASH_CKPT_TAIL; off on 2 cards with more than 10 GB of host-backed experts per card unless FLASH_CKPT_TAIL_SNAP=1) and an opt-in --disk-eager on both Qwen engines; the 27B greedy output and Flash-Next's deterministic output are identical to 1.5.1; 1.6.1 fixes batched replies on the 27B's bf16 KV cache (QE_KV_FP8=0, bpx03/QEngine#49), which the composes don't use; 1.6.2 keeps an explicit top_k / top_p / min_p of 0 and seed 0 instead of taking the defaults (the engine's own min_p default is 0.00 and bench.sh sends top_k 20, so the bench's sampler is unchanged), and run.sh with no GPU list uses every GPU the container sees; weights unchanged; every QE_*/FLASH_* name the composes forward (80) is in the build, app.py lost no flag (it gained --dense-weights and --disk-eager), the entrypoint still maps QE_GPUS to QE_DEVICES and still reads QE_REASONING_EFFORT) · booted qengine/qwen38-27b-dual (2026-11-27, 230 W): ready 157 s, verify-full all pass with vision 4/4, MTP acceptance length 7.93, KV pool 538,624 tokens at 16 slots (as on 1.5.1), served context 262144. The image came in through docker pull: Id sha256:1276f24c…
  # pin-earlier: 1.5.1-vision `3f5f54d4…` (source 2d171c07, 2026-11-23, upstream's previous stable release; booted on both dual slugs, verify-full all pass with vision 4/4, MTP acceptance length 7.93 on the 27B and 5.90 on Flash-Next); 1.3.6-vision `5064093b…` (source 444b2e49, 2026-11-15, upstream's previous stable release; booted on both slugs, verify-full all pass with vision 4/4, KV pool 331,776 on the 27B with the DFlash2 drafter, MTP acceptance length 5.90 on Flash-Next); 1.3.5.9-vision `e670c0d9…` (source ee98bd10, 2026-11-13, upstream's previous stable build, contains 1.3.5.8 and the MIT licence; booted on both slugs, verify-full all pass with vision 4/4, KV pool 316,416 on the 27B with the DFlash2 drafter); 1.3.5.7-vision `2d790174…` (source 5028c500, 2026-11-10, upstream's previous stable build and the last under the PolyForm Noncommercial licence; booted on both slugs, verify-full all pass with vision 4/4, KV pool 368,640 on the 27B); 1.3.5.6-vision `12692990…` (source 0330e7e4, 2026-11-09, upstream's previous stable build, contains the experimental 1.3.5.1 to 1.3.5.5; booted on both slugs, verify-full all pass with vision 4/4, `none` gives no reasoning); 1.3.5.4-vision `0fbc6fec…` (source 8ec82d5e, 2026-11-07, upstream-experimental, contains 1.3.5.3; booted on both slugs, verify-full all pass with vision 4/4, logprobs on both); 1.3.5.3-vision `c175eb42…` (source dffb7d19, 2026-11-07, upstream-experimental at the maintainer's call for the Flash-Next disk cache; booted on both slugs, verify-full all pass with vision 4/4, Flash-Next disk cache measured); 1.3.5-vision `167d404c…` (source 1348a95d, 2026-11-06, upstream's stable build before 1.3.5.6; booted on both slugs, verify-full all pass with vision 4/4); 1.3.4.3-vision `db64a5db…` (source 5083e042, 2026-11-03; booted on both slugs, verify-full all pass with vision 4/4, the THINKING_BUDGET_* map reaching QE_THINKING_BUDGET); 1.3.4.2-vision `e7ef3c0e…` (source d2a24bf8, 2026-11-02; booted on both slugs, verify-full all pass with vision 4/4, Flash-Next on the new c0022018 weights; 1.3.4.1 was never pinned on its own); 1.3.4-vision `2b3f8fb5…` (source c3f8ca75, 2026-11-01; booted on both slugs, verify-full, vision, thinking budget per request and by QE_THINKING_BUDGET, Flash-Next concurrency sweep clean); 1.3.3.1-vision `39c1cf06…` (source 7bd4bebf, 2026-11-01; booted on both slugs, verify-full, vision, concurrent-prefill sweep); 1.3.3-vision `0358837d…` (source 21517be6, 2026-11-01; booted on both slugs, Flash-Next FLASH_COMM=ce sweep 9/9 clean with the pipeline on); 1.3.2-vision `3375a425…` (source fb1da72d, 2026-10-31); 1.3.2 text-only `ff323aa4…` (source fb1da72d, 2026-10-31; runs the slugs with VISION=0); 1.3.1 `849b059d…` (source 016c9249, 2026-10-30); 1.3 `b9d1b0af…` (source d15a4d3a, 2026-10-28); 1.3-rc4 `18b3c4bb…` (source 116bd8d9, 2026-10-27)
  # Before 1.3.1 there is no QE_REASONING_EFFORT, so the composes refuse those images: a rollback to 1.3 also
  # needs the composes' earlier entrypoint, which served a copy of the template with its default effort replaced.
  spec: ghcr.io/bpx03/qengine@sha256:1276f24ce79fb9dded6504c8b842af4b01a28ca58d98fca905a0b8807df65daf
supported_model_families:
  - qwen35-dense          # Qwen3.8-27B, RedHatAI's INT4 only (libqengine.so)
  - qwen4exp              # Qwen3.8-Flash-Next, the author's own INT4 layout (libqflash.so, from 1.3; upstream calls it a
                          # preview: tested on one machine, no quality benchmark yet)
  - inkling2-loop-moe     # Inkling-2-Mini, the official checkpoint on its own engine (libqinkling.so, sm_86 only), a
                          # preview from 1.6.0: text only, one card, or two with GPU P2P
# The card counts QEngine runs, in place of the models' valid_tp (vLLM's list: 1, 2, 4, 8). QEngine has its own tensor
# parallel and is tuned for three cards. README "Recipes by card count" (1.3.5.7): the 27B on 3 (tuned), 2, and 1 as an
# experiment; Flash-Next on 3 (tuned) and 2, 4 or more in tensor parallel or pipeline mode (FLASH_PAR), never on 1.
# The 27B at 4 isn't in upstream's table: community runs only (4x RTX 5080, #1942 / #1966, its own containers).
valid_tp_by_family:
  qwen35-dense: [1, 2, 3, 4]
  qwen4exp: [2, 3, 4]
  # upstream docs/models/inkling-2-mini.md (1.6.0): one card by default, two with GPU P2P (the 1.6 checks);
  # three work with an uneven head split but aren't in those checks. Only one card has a slug here.
  inkling2-loop-moe: [1, 2]
supported_weight_formats:
  - compressed-tensors    # RedHatAI/Qwen3.8-27B-INT4 (pack-quantized W4A16, group 128, symmetric). It reads only
                          # weight_packed / weight_scale, so other INT4 formats (AutoRound's auto_gptq packing) don't load
  - qengine-int4          # bpx03/Qwen3.8-Flash-Next-QEngine: Intel's AutoRound INT4 regrouped per layer for libqflash.so,
                          # with an INT8 n-gram table; only QEngine reads it
  - modelopt              # thinkingmachines/Inkling-2-Mini as shipped (NVFP4 / MXFP8 experts), read by libqinkling.so,
                          # with the author's INT8 dense weights and trained drafter beside it (bpx03/Inkling-2-Mini-QEngine)
supported_kv_formats:
  - fp8_e4m3              # the Qwen engines' K / V format: FP8 e4m3 in a shared pool per GPU
  - bf16                  # the Inkling engine's K / V (AppState's bf16 K / V, src/inkling/ink.cu at 380e3c7a)
supported_drafters:
  - mtp                   # the checkpoint's MTP head, or the author's head fine-tuned on the engine's own answers
                          # (model_mtp_ft.safetensors, a release asset); it also drafts by lookup from the token history.
                          # From 1.3.5.8 the 27B also runs a DFlash2 block drafter (syvai/Qwen3.8-27B-DFlash2-W4A16) while
                          # one conversation decodes alone: the engine fetches and loads it itself (QE_DRAFTER), so it
                          # isn't a drafter profile of ours
  - dspark                # Inkling-2-Mini's DSpark drafter (the checkpoint's mtp.safetensors, or the author's trained
                          # mtp_qe.safetensors), exact for greedy and sampled replies; built in, no drafter profile of ours
# #1951 — what this engine changes about effort (see the model profiles for
# what the MODEL accepts; the compose keeps the DEFAULT).
effort:
  off_switch: "none"
  supports_none: true
  unknown_name: medium
  by_model:
    qwen3.8-27b:
      default_when_unset: xhigh
      supports_none: true
      maps: {minimal: low, high: xhigh, max: xhigh}
      evidence: >-
        Compose header, models/qwen3.8-27b/qengine/compose/dual/redhat-int4/
        mtp.yml:35-37: QE_REASONING_EFFORT carries the default effort and the
        template's own default is xhigh (our compose passes low); the server
        folds high/max -> xhigh and minimal -> low from 1.3.4.3. The pair's
        none claim: the server's own none -> thinking-off handling (the engine
        evidence below) feeds this checkpoint's template, whose thinking-off
        rendering is wire-probed 2026-10-20 through the byte-identical GGUF
        twin (models/qwen3.8-27b/llama-cpp/patches/
        qwen38-gguf-reasoning-effort-template/PROVENANCE.md:
        chat_template_kwargs enable_thinking:false turns thinking off).
    qwen3.8-flash-next:
      default_when_unset: xhigh
      supports_none: true
      maps: {minimal: low, high: xhigh, max: xhigh}
      evidence: >-
        Compose header, models/qwen3.8-flash-next/qengine/compose/dual/
        qengine-int4/mtp.yml:98 ("its template's own default is xhigh") and :134
        + :416 (the compose passes QE_REASONING_EFFORT, default low); the same
        server-side fold from 1.3.4.3 — high/max -> xhigh, minimal -> low. The
        pair's none claim: the server's own none -> thinking-off handling (the
        engine evidence below) feeds this checkpoint's template, whose
        thinking-off rendering is wire-probed 2026-11-15 on the strata pair
        (qwen3.8-flash-next-iq3s-dual :8018: reasoning_effort none -> 0 chars
        of reasoning_content). The two checkpoints' templates are NOT
        byte-identical (verified 2026-11-16 by comparing the strata GSQ-RCO
        IQ3_S GGUF's tokenizer.chat_template with the qengine-int4's
        chat_template.jinja: the strata's carries system-merging and a
        high->xhigh fold the QEngine's lacks), but their thinking-off
        rendering paths are identical — both render enable_thinking:false as
        `\n\n` with no reasoning content, which is what the probe measured.
    inkling-2-mini:
      default_when_unset: high
      # `none` reaches the template as 0.0, which still reasons on this engine too (upstream says so, measured below).
      supports_none: false
      maps: {max: xhigh}
      evidence: >-
        QEngine's Inkling preview (1.6.0 on; docs/models/inkling-2-mini.md)
        renders the checkpoint's own chat_template.jinja: reasoning_effort
        none 0.0, minimal 0.1, low 0.2, medium 0.7, high 0.9, xhigh and max
        0.99, or a number; unset = 0.9; any other name is HTTP 400 (the
        template refuses it: "Unknown reasoning_effort"), not the engine-wide
        medium fold. The compose passes QE_REASONING_EFFORT (default high).
        Wire-probed 2026-11-27 on QEngine 1.6.2 (one 3090, the
        qengine/inkling-2-mini-single setup), an IPv4-validator prompt at
        temperature 0, reasoning_content chars (completion tokens): none 782
        (376), minimal 1,403 (663), low 1,004 (467), medium 1,893 (771), high
        1,844 (737), xhigh 4,352 (1,724); unset gave exactly high's
        1,844 (737) with QE_REASONING_EFFORT=high and exactly low's 1,004
        (467) with QE_REASONING_EFFORT=low, so the server reads the default
        on Inkling too. `none` reasons, as upstream documents ("the model
        still writes a short thought").
  evidence: >-
    Engine-wide: the fold of an UNRECOGNISED name to medium and the `none` →
    thinking-off handling (1.3.5.5 on) are the server's own code, so they hold
    for any model served here. A model not listed under by_model gets no fold
    table and no default — only that unknown-name rule.

notes: >
  QEngine (github.com/bpx03/QEngine, Krzysztof Jagus): MIT License from 1.3.5.8; 1.3.5.7 and older
  (the pin-earlier images) were released under the PolyForm Noncommercial License 1.0.0, free for
  non-commercial use only. The weights keep their own licences. An independent C++/CUDA engine
  for one model on one kind of machine: Qwen3.8-27B INT4 (RedHatAI's compressed-tensors W4A16, plus its
  MTP head) on three RTX 3090s with tensor parallel 3 over PCIe, built for sm_86 only. The author has
  measured two cards (72-85% of the three-card throughput); one card is experimental (QE_MAX_SEQS 1-4).
  GPU-to-GPU P2P is used when the driver grants it, else a slower path through host memory. FP8 KV up
  to 262,144 tokens a conversation, MTP and lookup drafts, continuous batching up to 32 sequences,
  prefix and KV reuse with a host-RAM archive, structured output, tool calls, thinking on/off with
  reasoning-effort levels. Serves on 8080 (/v1/chat/completions, /v1/models with owned_by "qengine",
  /v1/messages, /health), with a dashboard and Prometheus metrics on 9393; settings are QE_* variables
  (QE_GPUS, QE_MAX_SEQS, QE_RESERVE_GB, QE_EXTRA_ARGS for server/app.py flags). From 1.3-rc4 a cross-turn
  loop guard is on by default: after 3 identical (reply, tool result) turns in a row, the next turn gets a
  presence penalty on the repeated reply and a server note appended to the latest tool result
  (QE_LOOP_GUARD_TURNS=0 turns it off, QE_LOOP_GUARD_NOTE=0 drops only the note, "loop_guard": false in a
  request turns it off for that request). Engine kind `qengine`.
  Registered 2026-10-27 with no slug; the first two (2026-10-28) are two-card ones, qengine/qwen38-27b-dual
  and qengine/qwen38-flash-next-dual. They map ENABLE_THINKING to --think, SPEC_N to --mtp-k and
  REASONING_EFFORT to QE_REASONING_EFFORT (from 1.3.1; until then a copy of QEngine's own template, whose
  default is xhigh). From 1.3.4 QEngine caps thinking per request (thinking_budget, Anthropic budget_tokens) or by
  QE_THINKING_BUDGET, which the slugs forward; our THINKING_BUDGET_* effort map isn't wired to it. bench.sh and verify-full read its [stats] lines
  (llama.cpp's timing format, vLLM's SpecDecoding metrics format); health.sh and bench.sh's interconnect block read its boot log (#1854). Its metrics
  port (9393) is unpublished; QE_METRICS_PORT=<port> publishes it on 127.0.0.1 only (switch.sh's override).

supported_model_families:
  - qwen4exp              # Qwen3.8-Flash-Next family: Strata is written for this model only
supported_weight_formats:
  - gguf                  # ISTA-DASLab GSQ-RCO i-quants (+ Unsloth UD-Q4_K_XL, experimental)
supported_kv_formats:
  - q8_0                  # nearest catalog token for Strata's int8 KV (--kv int8), MEASURED 2026-10-06
supported_drafters: []    # MTP is Strata's built-in draft layer (--spec), not a club drafter
notes: >
  Strata (github.com/Niko1221/Strata, MIT): its own C++/CUDA engine for Qwen3.8-Flash-Next plus a
  Python server and a Terminal (`strata launch`), not a llama.cpp fork; it uses ggml's CPU backend
  and llama.cpp's mtmd / gguf-py as libraries. From 0.2.1 upstream publishes a Docker image per
  release (ghcr.io/niko1221/strata:<release>-<flavor>; cuda13 for RTX 20-50 with driver >= 580),
  which these slugs pin by digest; club-3090's launcher (models/qwen3.8-flash-next/strata/launcher/)
  writes the launch settings into setup's run config and then runs the image's own entrypoint. The
  server needs an API key for everything but GET /health; the composes set one (club-3090's
  default unless STRATA_API_KEY is set) and our tooling sends it (scripts/lib/engine-auth.sh).
  x86-64 with AVX2 only (no DGX Spark). Serves on 8080 and answers /props like llama-server; its
  runtime numbers come from GET /metrics (scripts/lib/strata_metrics.py), as its per-request lines
  go to a file inside the container (/data/state/strata/launch/<preset>.engine.log). Engine kind
  `strata` (#1672).

  # pin-current: 0.2.12 · upstream 146df3c4 · engine 0.1.58 · pinned 2026-11-07 · booted strata/qwen3.8-flash-next-ud-iq4xs-dual (ready 48 s, verify-full 8/0, draft acceptance 0.98 over 195 drafted; Auto still runs the standard DFlash2 drafter, --draft dflash2 --spec 6, not 0.2.12's tuned one; MemAvailable 140.8 GiB after)
  # pin-earlier: 0.2.11 `871e1e79…` (upstream c3b3f503, engine 0.1.57, 2026-11-05); 0.2.9 `83e37db8…` (upstream c62d5e3a, engine 0.1.55, 2026-10-31); 0.2.8 `27f04a74…` (upstream 870aedd9, engine 0.1.54, 2026-10-30); 0.2.7 `db96cd9b…` (upstream 5e8a4cca, engine 0.1.52, 2026-10-27); 0.2.3 `d39ca9fc…` (upstream 5c8dd322, engine 0.1.48, 2026-10-23); 0.2.2 `17e96f76…` (upstream 011c9e60, engine 0.1.47, 2026-10-22); 0.2.1 `a0398afb…` (upstream 90767252, engine 0.1.46, #1764, 2026-10-20); club-3090's own builds of upstream's Dockerfile (strata-club3090): v0.1.45 `75deea40…` (2026-10-17), v0.1.44.1 `fb97d83b…` (2026-10-14), v0.1.43.1 `7f8643c8…` (2026-10-13, the one that also carried sm_90)

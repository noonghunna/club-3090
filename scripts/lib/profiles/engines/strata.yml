schema_version: 1
id: strata
display_name: Strata (upstream's official image)
type: strata
stability: experimental
min_sm: 7.5
lineage:
  relation: "new"
  base: null
  base_version: null
  source: "https://github.com/Niko1221/Strata"
  source_ref: "b28ca95e3e6847f2d5e317994f253b66716deeaa"
  chain: []
  delta: "Independent C++/CUDA engine for Qwen3.8-Flash-Next (and, on its strata-inkling engine in the same image, Inkling-2-Mini) with its own Python server and Terminal; uses ggml's CPU backend and llama.cpp's mtmd/gguf-py as libraries. Pinned to the image upstream publishes (ghcr.io/niko1221/strata:<release>-cuda13, from 0.2.1 on), built from its signed engine packages"
image_env: STRATA_IMAGE
install:
  method: docker_image
  # Upstream's own image `<release>-cuda13` (RTX 20-50, driver >= 580), built by their docker-images
  # workflow from the signed engine packages; the engine version is its com.strata.engine label.
  # scripts/strata-pin-bump.sh writes the two pin- lines (the first earlier pin is the rollback).
  # pin-current: 0.2.22 · upstream b28ca95e · engine 0.1.69 · pinned 2026-11-27 · booted strata/inkling-2-mini-sq20-single (ready 16 s, 3 warm-ups, verify-full 9/0; MemAvailable 220.3 GiB and swap 0 after it). #7130 (the built-in server answers only its own app; /v1 as before): from inside the litellm container, /v1/models and a chat completion to host.docker.internal:8229 return 200, the gateway's path. Host-RAM header inputs unchanged (MODELS ram_gb, rotational_disk(), setup_config.py byte-identical); arg_layers.py and runner.py byte-identical; the four switches the composes forward are in the 0.1.69 engine binary. 0.2.22 also restores the model card's sampling on Flash-Next with MTP (#7070, greedy since 0.2.20), sizes the conversation cache from free RAM (#7044), and fixes Inkling's thinking level, tool results and multi-card placement (#7035, #7051, #7093). Engine 0.1.69 is both strata-engine's and the CUDA strata-inkling's version. No release skipped
  # pin-earlier: 0.2.21 `992c38a2…` (upstream d46f5f26, engine 0.1.67, 2026-11-24); 0.2.19 `5cf423c2…` (upstream c6f6427d, engine 0.1.65, 2026-11-23); 0.2.17 `51d39e3f…` (upstream 12d491da, engine 0.1.63, 2026-11-20); 0.2.13 `b6e18765…` (upstream d2f09647, engine 0.1.59, 2026-11-09); 0.2.12 `c3a85342…` (upstream 146df3c4, engine 0.1.58, 2026-11-07); 0.2.11 `871e1e79…` (upstream c3b3f503, engine 0.1.57, 2026-11-05); 0.2.9 `83e37db8…` (upstream c62d5e3a, engine 0.1.55, 2026-10-31); 0.2.8 `27f04a74…` (upstream 870aedd9, engine 0.1.54, 2026-10-30); 0.2.7 `db96cd9b…` (upstream 5e8a4cca, engine 0.1.52, 2026-10-27); 0.2.3 `d39ca9fc…` (upstream 5c8dd322, engine 0.1.48, 2026-10-23); 0.2.2 `17e96f76…` (upstream 011c9e60, engine 0.1.47, 2026-10-22); 0.2.1 `a0398afb…` (upstream 90767252, engine 0.1.46, #1764, 2026-10-20); club-3090's own builds of upstream's Dockerfile (strata-club3090): v0.1.45 `75deea40…` (2026-10-17), v0.1.44.1 `fb97d83b…` (2026-10-14), v0.1.43.1 `7f8643c8…` (2026-10-13, the one that also carried sm_90)
  spec: ghcr.io/niko1221/strata@sha256:bd66d4d33ddb896274c72d2fc05a425670f544e1506afa5401621f6d5b6c70ca
supported_model_families:
  - qwen4exp              # Qwen3.8-Flash-Next family (the Strata engine itself)
  - inkling2-loop-moe     # Inkling-2-Mini, on Strata's strata-inkling engine (shipped in the image since 0.2.19)
supported_weight_formats:
  - gguf                  # ISTA-DASLab GSQ-RCO i-quants (+ Unsloth UD-Q4_K_XL, experimental)
  - strata                # Strata's own .strata builds (Inkling-2-Mini SQ-20)
supported_kv_formats:
  - q8_0                  # nearest catalog token for Strata's int8 KV (--kv int8), MEASURED 2026-10-06
  - fp16                  # strata-inkling's default KV with host KV offload (kv_fmt 0), MEASURED 2026-11-23
supported_drafters: []    # MTP is Strata's built-in draft layer (--spec), not a club drafter
# #1951 — what this engine changes about effort. The Flash-Next Strata
# composes leave REASONING_EFFORT unset ON PURPOSE (#1951 decision 2026-11-06:
# these routes stay at the template's xhigh), so default_when_unset is
# load-bearing for the render. The wire off switch is PROBED (2026-11-15,
# qwen3.8-flash-next-iq3s-dual :8018): a request's reasoning_effort none
# answers with no thinking block, so off_switch/supports_none are declared.
effort:
  off_switch: "none"
  supports_none: true
  by_model:
    qwen3.8-flash-next:
      default_when_unset: xhigh
      supports_none: true
      maps: {high: xhigh, max: xhigh}
      evidence: >-
        docs/engines/STRATA.md "Reasoning and sampling defaults": with no
        settings, a request that names no effort runs at the checkpoint
        template's `reasoning_effort|default('xhigh')`, and `high` also maps to
        `xhigh`. This fold table is NOT the one the same model gets on
        vllm-stable, which also folds minimal->low. The request path's accepted
        set is the pinned image's own `EFFORT` table
        (`terminal/serve/frontend.py`: none/off/minimal/disabled/false -> off,
        low, medium, high -> xhigh, xhigh, max -> xhigh, maximum -> xhigh);
        `effort_kwargs` raises only for a name outside that table, and its 400
        text "use none, low, medium or high" lists FEWER names than the server
        accepts. The one check that does refuse `xhigh` is
        `clean_shared_defaults` (`server.py` ~9220), which validates the saved
        defaults of `POST /settings`, not a request. CORRECTION 2026-11-17
        (review of #2091): the 2026-11-15 reading that `xhigh`/`max` 400 as
        request names — and with it `refuses: [xhigh]` and the claim that a
        client echoing the unset default back gets a 400 — is superseded.
        Re-measured 2026-11-17 on this rig's qwen3.8-flash-next-iq3s-dual
        (:8018, the same slug and pinned image 0.2.13, b6e18765): `none`,
        `low`, `medium`, `high`, `xhigh`, `max` and `maximum` all answer 200
        with real reasoning content; only a name outside the table (`extreme`)
        400s. And `POST /settings` with `xhigh` or `max` 400s with exactly
        "reasoning_effort: none, low, medium or high" — the only 400 that
        rejects those two names. The pair's none claim stands from the
        2026-11-15 probe: reasoning_effort none -> 0 chars of
        reasoning_content (low -> 214).
    inkling-2-mini:
      default_when_unset: low
      supports_none: true
      evidence: >-
        From 0.2.21 (engine 0.1.67) Strata's Inkling dialect
        (terminal/serve/inkling_dialect.py) hands the request's effort to the
        template: EFFORT_LEVEL none 0.0, minimal 0.1, low 0.2, medium 0.7, high
        0.9, xhigh and max 0.99. A request that names none gets DEFAULT_EFFORT,
        the server's STRATA_INKLING_EFFORT or else "low" (our launcher doesn't
        set it). reasoning_effort none and enable_thinking false are level 0,
        with enable_thinking false in the template, so thinking is off. A name
        outside its EFFORT table raises ("unknown reasoning effort"). Measured
        2026-11-24 on strata/inkling-2-mini-sq20-single (0.2.21's image), an
        IPv4-validator prompt at temperature 0, reasoning_content chars
        (completion tokens): none 0 (129), minimal 929 (427), low 1,274 (563),
        medium 1,548 (602), high 2,510 (924), xhigh 2,883 (1,074); unset gave
        exactly low's 1,274 (563). Top-level reasoning_effort and
        chat_template_kwargs gave the same. HISTORY: in 0.2.19 and 0.2.20 the
        dialect overwrote every request's effort with "none" (normalize_effort()
        returned "none"); measured 2026-11-23 on 0.2.20's image, verify-full's
        thinking check got no reasoning on either question.
  evidence: >-
    Engine-wide (off_switch / supports_none): measured 2026-11-15 on
    qwen3.8-flash-next-iq3s-dual (:8018) — reasoning_effort none -> 0 chars of
    reasoning_content (low -> 214). Measured on that one pair; it is the
    server's request handling, not a template property. The 400 wording is
    under-inclusive of the accepted set — see the pair's evidence and its
    2026-11-17 correction.

notes: >
  Strata (github.com/Niko1221/Strata, MIT): its own C++/CUDA engine for Qwen3.8-Flash-Next plus a
  Python server and a Terminal (`strata launch`), not a llama.cpp fork; it uses ggml's CPU backend
  and llama.cpp's mtmd / gguf-py as libraries. From 0.2.1 upstream publishes a Docker image per
  release (ghcr.io/niko1221/strata:<release>-<flavor>; cuda13 for RTX 20-50 with driver >= 580),
  which these slugs pin by digest; club-3090's launcher (models/qwen3.8-flash-next/strata/launcher/)
  writes the launch settings into setup's run config and then runs the image's own entrypoint. The
  server needs an API key for everything but GET /health; the composes set one (club-3090's
  default unless STRATA_API_KEY is set) and our tooling sends it (scripts/lib/engine-auth.sh).
  x86-64 with AVX2 only (no DGX Spark). Serves on 8080 and answers /props like llama-server; its
  runtime numbers come from GET /metrics (scripts/lib/strata_metrics.py), as its per-request lines
  go to a file inside the container (/data/state/strata/launch/<preset>.engine.log). Engine kind
  `strata` (#1672).

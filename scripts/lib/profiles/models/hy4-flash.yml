    shards: 1
    files:
      - Maya-M/Hy4-Flash-Maya-M-IQ3_XXS-00001-of-00002.gguf
    verify_glob: "Maya-M/Hy4-Flash-Maya-M-IQ3_XXS-00001-of-00002.gguf"
    manual_note: "🐣 Project Maya's Hy4-Flash Maya-M (peasantsmith): routed experts IQ3_XXS (3 bits), IQ4_XS (4 bits) on 7 layers, attention, head and shared expert Q8_0; the model shard 68.4 GB, plus the shared n-gram table, MTP block and vision tower. Maya's card: 93.6% the same top token, KL 0.046, for PCs with about 80-96 GB of RAM + VRAM. ⚠️ Tencent Hy License."

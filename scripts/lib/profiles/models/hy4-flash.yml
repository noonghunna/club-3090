schema_version: 1
id: hy4-flash
display_name: Hy4-Flash (220B MoE, Tencent)
description: Hy4-Flash — Tencent's 220B MoE (42 layers; 512 routed experts, 16 a token, + 1 shared) with MLA attention, a sliding window on most layers and 12 indexed sparse-attention layers, four Engram n-gram layers and an MTP block, 1M native context; served on one to four 3090s by Project Maya's maya-hy4 engine from Maya's own GGUF quants (Maya-XS / S / M / L), the experts VRAM doesn't hold computed on the CPU from RAM.
family: hy4-moe
# Arch: HYV4FlashForConditionalGeneration (model_type hy_v4_flash). Values from tencent/Hy4-flash's config.json
# (@b2498eba, read 2026-11-19).
# ⚠️ LICENSE: the Tencent Hy License (LICENSE in the weights' repo, LICENSE.hy4-flash in Maya's).
hidden_size: 3072                # hidden_size
num_hidden_layers: 42            # num_hidden_layers (layer 0 dense, 1-41 MoE; the MTP block is a separate file)
intermediate_size: 13824         # intermediate_size (the dense layer)
num_attn_heads: 32               # num_attention_heads (MLA: q_lora_rank 1024, kv_lora_rank 512; sliding layers 64)
num_kv_heads: 1                  # MLA: one latent KV row a position (kv_lora_rank 512 + rope 64), as Maya caches it
head_dim_attn: 256               # qk_head_dim / v_head_dim
attention_k_eq_v: false
max_ctx_supported: 1048576       # max_position_embeddings — we SHIP 32768 (Maya has run its quants end to end up to 32K)
num_experts: 512                 # n_routed_experts
num_experts_per_tok: 16          # num_experts_per_tok
moe_intermediate_size: 1536      # moe_intermediate_size
shared_expert_intermediate_size: 1536   # n_shared_experts = 1
vision_capable: true             # the vision tower (Maya's mmproj file, one for every size); VISION=off turns it off
default_weight_variant: maya-l
valid_tp: [1, 2, 3, 4]           # the registry's tp counts GPUs: maya-hy4 runs tensor parallel over the largest group of
                                 # equal cards (--tp auto) and splits the layers where none fits
compatible_drafters: [maya-hy4-mtp]
# kv-calc has no model for MLA + sliding windows + the indexer + Engram: every slug sets kvcalc_key="SKIP", as the
# other Maya slugs.
kv_calc_supported: false
requires_genesis: false

# #1951 — the wire ladder, probed (gate M10 shape) on 2026-11-20. Hy4-Flash
# thinks at ONE level or not at all, so the ladder is that one rung; thinking off
# is the engine's off switch (strata-maya.yml), and the folds of every other
# name onto high are the (hy4-flash, strata-maya) pair's facts there.
effort:
  levels: [high]
  template_kwarg: true    # Maya reads chat_template_kwargs.reasoning_effort for Hy4 as well (probed below)
  budget_map: false       # effort_budget.py knows only the Qwen ladder
  evidence: >-
    Tencent's model card (tencent/Hy4-flash README): reasoning_effort supports
    "high" (default, thinking enabled) and "no_think" (direct responses).
    Wire probe 2026-11-20 on strata-maya/hy4-flash-dual-maya-xs (:8214, Maya
    v1.1.69 08b8a471, a 900-token cap): reasoning_effort none and minimal ->
    0 chars of reasoning_content; low / medium / high / xhigh / max and no
    effort -> 178-314 chars, one level (no growth with the rung, HTTP 200 for
    every name). chat_template_kwargs.reasoning_effort none -> 0, low / high /
    max -> 179-345; chat_template_kwargs.enable_thinking false -> 0. Through
    the LiteLLM gateway: chat reasoning_effort high -> 175, none -> 0;
    Responses reasoning effort high -> 243, none -> 0, none with summary auto
    -> 0, no reasoning field -> 283.

weights:
  maya-xs:
    path: hy4-flash-maya-gguf/Maya-XS
    # local_subdir is the BUCKET: Maya's repo keeps each size in a folder of its own; files and the glob carry the
    # folder prefix. A size's own file is its model shard (00001); the n-gram table (00002), the MTP block and the
    # vision tower are the same file for every size: hy4-ngram, maya-hy4-mtp and hy4-vision below
    local_subdir: hy4-flash-maya-gguf
    size_gb: 44.79
    format: gguf
    status: incubating
    hf_repo: peasantsmith/Hy4-Flash-Maya-GGUF
    revision: 9d73294d20e1119d03d00ea81d1d352bfbe61ff4
    shards: 1
    files:
      - Maya-XS/Hy4-Flash-Maya-XS-IQ2_XXS-00001-of-00002.gguf
    verify_glob: "Maya-XS/Hy4-Flash-Maya-XS-IQ2_XXS-00001-of-00002.gguf"
    manual_note: "🐣 Project Maya's smallest Hy4-Flash quant (peasantsmith): routed experts IQ2_XXS (2 bits) in every layer, attention and head Q6_K, shared expert Q8_0; the model shard 44.8 GB, plus the shared n-gram table (63.4 GB), MTP block (7.5 GB) and vision tower (0.8 GB). Maya's card: 88.5% the same top token as the original, KL 0.16, for PCs with about 56-64 GB of RAM + VRAM. ⚠️ Tencent Hy License."
  maya-s:
    path: hy4-flash-maya-gguf/Maya-S

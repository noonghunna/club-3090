schema_version: 1
id: deepseek-v4.1-flash-1017
display_name: DeepSeek-V4.1-Flash-1017 (MoE with Engram tables)
description: DeepSeek-V4.1-Flash-1017 — a 40-layer MoE (384 routed experts, top-6) with MLA single-KV-head attention, a DSA indexer and two Engram hash-table layers; served on two 3090s by Project Maya's maya-ds4 engine, every CPU-side expert in RAM — ISTA-DASLab's GSQ-RCO IQ2_XXS GGUF with a DSpark drafter (~106 GB of host RAM), or unsloth's UD-IQ3_S (closer to the original, ~240 GB).
family: deepseek41-moe
# Arch: `deepseek41` (a different model from deepseek-v4-flash-0731: Engram layers, 384 experts, 40 layers).
# Every value below read from the GGUF headers through Maya's tools/ds4/pack_gguf.py (the pack's ds4.txt, which
# translates the GGUF's deepseek41.* keys into config.json's names), 2026-10-25, not from a model card.
hidden_size: 5120                # hidden_size
num_hidden_layers: 40            # num_hidden_layers (+ 3 DSpark drafter blocks, layers 40-42, not counted)
num_attn_heads: 64               # num_attention_heads
num_kv_heads: 1                  # MLA: one latent KV head (same shape as deepseek4-moe)
head_dim_attn: 512               # head_dim
attention_k_eq_v: true
max_ctx_supported: 1048576       # max_position_embeddings (yarn factor 16 over 65536) — we SHIP 65536
num_experts: 384                 # n_routed_experts
num_experts_per_tok: 6           # num_experts_per_tok
moe_intermediate_size: 2304      # moe_intermediate_size
vision_capable: false            # the model has a vision tower, but the GGUF leaves it out and our image never fetches it
default_weight_variant: ista-iq2-xxs
valid_tp: [2]                    # the registry's tp counts GPUs: the dual slug's layer split (--tp 1 on two GPUs) is 2
compatible_drafters: [maya-dspark-xs2, maya-dspark-s]
# kv-calc has no model for MLA + a sliding window + the DSA indexer + Engram: every slug sets kvcalc_key="SKIP",
# the same call as deepseek4-moe and glm5next-moe.
kv_calc_supported: false
requires_genesis: false

weights:
  ista-iq2-xxs:
    path: deepseek-v4.1-flash-1017-gsq-rco-gguf
    # ISTA's repo is flat (one folder, every quant's shards at its root) and the Engram file must sit beside the
    # shards: local_subdir is that folder, and `files:` scopes the fetch to this quant's 4 shards + the Engram file
    # (the repo also holds IQ1_M and IQ2_XS, ~400 GB more).
    local_subdir: deepseek-v4.1-flash-1017-gsq-rco-gguf
    size_gb: 248.83
    format: gguf
    status: incubating
    hf_repo: ISTA-DASLab/DeepSeek-V4.1-Flash-1017-GSQ-RCO-GGUF
    revision: 85d6710fd54b2a54974f0943a24bd90db3f43388
    shards: 4
    files:
      - DeepSeek-V4.1-Flash-1017-GSQ-RCO-IQ2_XXS-00001-of-00004.gguf
      - DeepSeek-V4.1-Flash-1017-GSQ-RCO-IQ2_XXS-00002-of-00004.gguf
      - DeepSeek-V4.1-Flash-1017-GSQ-RCO-IQ2_XXS-00003-of-00004.gguf
      - DeepSeek-V4.1-Flash-1017-GSQ-RCO-IQ2_XXS-00004-of-00004.gguf
      - DeepSeek-V4.1-Flash-Engram-IQ4_NL.gguf
    # REQUIRED on a GGUF entry (verify_glob defaults to *.safetensors). One glob (no braces): the 4 shards and the
    # Engram file; it would also match another ISTA quant's shards kept in the same folder (the hash check then
    # reads them too), but not other repos' files there (dspark-*.gguf, UD-Q8_K_XL/).
    verify_glob: "DeepSeek-V4.1-Flash-*.gguf"
    manual_note: "🐣 ISTA-DASLab's GSQ-RCO quant: routed experts IQ1_M / IQ2_XXS / IQ2_XS by ISTA's own allocation (59.5 / 49.0 / 23.6 GB), dense weights Q5_K, the two Engram hash tables IQ4_NL in a shared 110.6 GB file. Served by the strata-maya engine's maya-ds4 (Project Maya v1.1.27 on reads it), which copies every CPU-side expert into RAM when it fits. The launcher SHA-256-checks the 5 files against its own table once (Maya's tables don't list this quant), then builds Maya's pack on the data volume. Text only."
  ud-iq3-s:
    path: deepseek-v4.1-flash-1017-gguf/UD-IQ3_S
    # local_subdir is the BUCKET: unsloth's repo keeps each quant in a folder of its own (UD-IQ3_S/), which
    # --local-dir preserves, so files and the glob carry the UD-IQ3_S/ prefix (the shape of maya-dspark-xs2 below)
    local_subdir: deepseek-v4.1-flash-1017-gguf
    size_gb: 423.63
    format: gguf
    status: incubating
    hf_repo: unsloth/DeepSeek-V4.1-Flash-1017-GGUF
    revision: 8a6ec9cf118e785a362ea94ee123c61c70553be6
    shards: 8
    files:
      - UD-IQ3_S/DeepSeek-V4.1-Flash-1017-UD-IQ3_S-00001-of-00008.gguf
      - UD-IQ3_S/DeepSeek-V4.1-Flash-1017-UD-IQ3_S-00002-of-00008.gguf
      - UD-IQ3_S/DeepSeek-V4.1-Flash-1017-UD-IQ3_S-00003-of-00008.gguf
      - UD-IQ3_S/DeepSeek-V4.1-Flash-1017-UD-IQ3_S-00004-of-00008.gguf
      - UD-IQ3_S/DeepSeek-V4.1-Flash-1017-UD-IQ3_S-00005-of-00008.gguf
      - UD-IQ3_S/DeepSeek-V4.1-Flash-1017-UD-IQ3_S-00006-of-00008.gguf
      - UD-IQ3_S/DeepSeek-V4.1-Flash-1017-UD-IQ3_S-00007-of-00008.gguf
      - UD-IQ3_S/DeepSeek-V4.1-Flash-1017-UD-IQ3_S-00008-of-00008.gguf
    verify_glob: "UD-IQ3_S/DeepSeek-V4.1-Flash-1017-UD-IQ3_S-*.gguf"
    manual_note: "🐣 unsloth's UD-IQ3_S: routed experts IQ2_S / IQ3_XXS / IQ3_S / Q3_K / MXFP4 by layer, dense weights Q8_0 / BF16, the two Engram hash tables Q6_K in the last shard (161.3 GB, the same bytes as Maya's own Q6_K pair). In Project Maya's own setup list (--ds4-quant gguf-iq3_s, KL 0.061 from the full-precision model on Maya's scorer, Q8 0.047); the launcher checks the 8 files against the SHA-256s Maya v1.1.48 pins. Served by the strata-maya engine's maya-ds4, which needs ~240 GB of host RAM to copy the CPU lane's 219 GB of experts; the Engram shard stays on the disk. Text only."
  maya-xs:
    path: deepseek-v4.1-flash-1017-maya-gguf/Maya-XS
    # local_subdir is the BUCKET: the repo keeps each Maya quant in a folder of its own (Maya-XS/, Maya-S/) with the
    # shared dspark/ drafter folder beside them, so files and the glob carry the Maya-XS/ prefix (the shape of
    # maya-dspark-xs2 below). The folder holds the three v2 model shards AND the two n-gram-table shards, which are
    # v1's files 4-5: v2 changed the model files only, so Maya's manifest lists the pair as the quant's "tables", not
    # among its model files. They are a GGUF set, not shards of the model's split (pack_gguf.py refuses a folder that
    # holds two splits), so the compose mounts just those two at /engram and the pack reads them with --engram - the
    # shape of Maya's own setup, which keeps an Engram-Q6_K/ folder beside the quant.
    local_subdir: deepseek-v4.1-flash-1017-maya-gguf
    size_gb: 278.12
    format: gguf
    status: incubating
    hf_repo: peasantsmith/DeepSeek-V4.1-Flash-1017-Maya-GGUF
    revision: c33d87b8c7a3b7d55e71324dc82395587a870b0b
    shards: 5
    files:
      - Maya-XS/DeepSeek-V4.1-Flash-1017-Maya-XS-v2-IQ1_S-00001-of-00003.gguf
      - Maya-XS/DeepSeek-V4.1-Flash-1017-Maya-XS-v2-IQ1_S-00002-of-00003.gguf
      - Maya-XS/DeepSeek-V4.1-Flash-1017-Maya-XS-v2-IQ1_S-00003-of-00003.gguf
      - Maya-XS/DeepSeek-V4.1-Flash-1017-Maya-XS-IQ1_S-00004-of-00005.gguf
      - Maya-XS/DeepSeek-V4.1-Flash-1017-Maya-XS-IQ1_S-00005-of-00005.gguf
    verify_glob: "Maya-XS/DeepSeek-V4.1-Flash-1017-Maya-XS-*.gguf"
    manual_note: "🐣 Project Maya's own smallest DeepSeek quant (peasantsmith): every routed expert IQ1_S with error-feedback rounding, dense weights Q8_0, the two Engram hash tables Q6_K (161.3 GB, read from the disk a few rows a token, never copied into RAM). v2, about 12% closer to the original than v1 and ~20% faster at writing: 116.8 GB of model in three shards + the 161.3 GB table pair Maya-XS shares with Maya-S = 278.1 GB. Maya's manifest (tools/ds4/download_gguf.json, maya/quants/Maya-XS) puts the VRAM + RAM that hold it at 121 GB, its drafter included, and its quality card gives 87.5% the same top token as the original, +8.7% next-token loss. Served by the strata-maya engine's maya-ds4: the hot experts in VRAM, as much of the rest as the host can pin in RAM, the remainder streamed from the SSD. Its own DSpark drafter is maya-dspark-xs2. Text only."
  maya-s:
    path: deepseek-v4.1-flash-1017-maya-gguf/Maya-S
    # local_subdir is the BUCKET (see maya-xs above): the quant's folder Maya-S/ holds all six shards of its split - the
    # four backbone shards and, as shards 5-6, the two Q6_K Engram tables. The compose mounts the folder at /gguf (the
    # pack is given the four backbone shards with --shards) and the two table files one by one at /engram (--engram).
    local_subdir: deepseek-v4.1-flash-1017-maya-gguf
    size_gb: 339.5
    format: gguf
    status: incubating
    hf_repo: peasantsmith/DeepSeek-V4.1-Flash-1017-Maya-GGUF
    revision: d1fc01009f21e26157acb6858c315d0365483b72
    shards: 6
    files:
      - Maya-S/DeepSeek-V4.1-Flash-1017-Maya-S-IQ2_XXS-00001-of-00006.gguf
      - Maya-S/DeepSeek-V4.1-Flash-1017-Maya-S-IQ2_XXS-00002-of-00006.gguf
      - Maya-S/DeepSeek-V4.1-Flash-1017-Maya-S-IQ2_XXS-00003-of-00006.gguf
      - Maya-S/DeepSeek-V4.1-Flash-1017-Maya-S-IQ2_XXS-00004-of-00006.gguf
      - Maya-S/DeepSeek-V4.1-Flash-1017-Maya-S-IQ2_XXS-00005-of-00006.gguf
      - Maya-S/DeepSeek-V4.1-Flash-1017-Maya-S-IQ2_XXS-00006-of-00006.gguf
    verify_glob: "Maya-S/DeepSeek-V4.1-Flash-1017-Maya-S-*.gguf"
    manual_note: "🐣 Project Maya's own larger DeepSeek quant (peasantsmith): routed experts IQ2_XXS (gate/up) + IQ3_XXS (down), attention / shared / embeddings / output Q8_0, and the two Engram hash tables Q6_K (shards 5-6, 161.3 GB, read from the disk a few rows a token, never copied into RAM). 178.2 GB of backbone in four shards + the 161.3 GB table pair = 339.5 GB. Maya's quality card gives 92.6% the same top token as the original, +3.2% next-token loss (Maya-XS: 87.5% / +8.7%). Served by the strata-maya engine's maya-ds4: the hot experts in VRAM, ~140 GB of the rest pinned in RAM on a host that has it, the remainder streamed from the SSD; it wants a ~190 GB host. Its own DSpark drafter is maya-dspark-s. Text only."
  maya-dspark-xs2:
    path: deepseek-v4.1-flash-1017-maya-gguf/dspark
    # local_subdir is the BUCKET: the repo keeps the drafters in its dspark/ folder, which --local-dir preserves, so
    # files and the glob carry the dspark/ prefix (the same shape as glm-5.3-flash's Maya quants)
    local_subdir: deepseek-v4.1-flash-1017-maya-gguf
    size_gb: 4.25
    format: maya-dspark
    status: incubating
    hf_repo: peasantsmith/DeepSeek-V4.1-Flash-1017-Maya-GGUF
    revision: d1fc01009f21e26157acb6858c315d0365483b72
    kind: draft
    files:
      - dspark/dspark-xs2.bin
      - dspark/dspark-xs2.json
    verify_glob: "dspark/dspark-xs2.*"
    manual_note: "Maya-XS's DSpark drafter (peasantsmith, Project Maya's quant author): experts IQ2_XXS 3.50 GB, dense Q8_0 0.60 + BF16 0.14 GB, in Maya's drafter_pack.py format (a .bin and its .json tensor table), which Maya's pack reads with --drafter. It does not read unsloth's dspark GGUF. ISTA's GGUF carries no DSpark geometry, so the launcher writes DeepSeek-V4.1-Flash's own into the pack (docs/UPSTREAM.md)."
  maya-dspark-s:
    path: deepseek-v4.1-flash-1017-maya-gguf/dspark
    local_subdir: deepseek-v4.1-flash-1017-maya-gguf
    size_gb: 8.0
    format: maya-dspark
    status: incubating
    hf_repo: peasantsmith/DeepSeek-V4.1-Flash-1017-Maya-GGUF
    revision: d1fc01009f21e26157acb6858c315d0365483b72
    kind: draft
    files:
      - dspark/dspark.bin
      - dspark/dspark.json
    verify_glob: "dspark/dspark.*"
    manual_note: "Maya-S's DSpark drafter (peasantsmith, Project Maya's quant author), 8.0 GB: a .bin and its .json tensor table in Maya's drafter_pack.py format, which Maya's pack reads with --drafter. Not interchangeable with maya-dspark-xs2, the smaller drafter of Maya-XS and the ISTA quant."

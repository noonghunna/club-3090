schema_version: 1
id: inkling-small
display_name: Inkling-Small (263B MoE, Thinking Machines)
family: inkling-moe
# Arch: `inkling`. 42 blocks — `dense_block_count = 2`, so 2 dense + 40 MoE.
# 256 routed experts top-6 PLUS 2 shared experts per layer (DeepSeek has 1).
# ⚠️ NOT a plain transformer: short convolutions (`shortconv_kernel = 4`) and a
# relative-position mechanism (`d_rel = 16`, `rel_extent` 1024 / 512 SWA) sit
# alongside attention. Anything assuming pure attention — drafters, KV surgery,
# attention patches — needs re-checking against it.
# Every value below was read from the GGUF via `print_info` on a live boot
# (2026-08-12), not from a model card.
hidden_size: 4096              # n_embd
num_hidden_layers: 42          # n_layer — 2 dense + 40 MoE
num_attn_heads: 32             # n_head
num_kv_heads: 8                # n_head_kv — 4:1 GQA
head_dim_attn: 128             # n_embd_head_k == n_embd_head_v
attention_k_eq_v: true
num_experts: 256               # n_expert
num_experts_per_tok: 6         # n_expert_used
num_shared_experts: 2          # ⚠️ TWO, not one — `expert_shared_count`
max_ctx_supported: 1048576     # n_ctx_train — we SHIP 262K, see the weights note
vision_capable: false          # tagged image-text-to-text upstream, but this GGUF ships NO mmproj
default_weight_variant: unsloth-ud-iq4xs
valid_tp: [2, 4]
compatible_drafters: []        # see the drafter note at the bottom
# ⚠️ iSWA hybrid: `n_swa = 512` with a per-layer `sliding_window_pattern`,
# realised by the KV allocator as 7 full-attention + 35 windowed layers (5:1).
# The KV calculator has no model for a per-layer SWA pattern, so every slug sets
# kvcalc_key="SKIP". Flagged here so nobody wires it up by reflex.
kv_calc_supported: false

# ---------------------------------------------------------------------------
# iSWA KV layout — MEASURED at 262K on 2× 3090 (2026-08-12), from the allocator's
# own lines, not derived:
#     non-SWA KV cache:  7 layers × 262,144 cells = 7,168 MiB
#         SWA KV cache: 35 layers ×   2,560 cells =   350 MiB
#                                             total 7,518 MiB
# ⭐ 35 of 42 layers cost ~10 MiB each instead of ~1,024. Uniform full attention
# at 262K would be ~43 GB; this is 7.5 GB — a 5.7× saving, and the reason this
# model's ceiling is set by COMPUTE BUFFERS rather than KV.
# ---------------------------------------------------------------------------
attn_full_layers: 7
attn_swa_layers: 35
swa_window: 512

moe_layers: 40

# ---------------------------------------------------------------------------
# CPU-offload residency.
# ⚠️ ROUTED-EXPERTS-ONLY, same rule as DeepSeek: the `-ot` regex matches
# `ffn_(gate|up|down)_exps.weight`; the 2 SHARED experts are `_shexp` — a
# different tensor name — so they stay GPU-resident by design. Every hit-rate
# figure we quote is therefore over ROUTED experts only.
# ---------------------------------------------------------------------------
offload_residency:
  unsloth-ud-iq4xs:
    # ⚠️⚠️ NOT UNIFORM, and not a single type either. This Unsloth *Dynamic* quant
    # mixes THREE expert tensor types, which the expert cache allocates as three
    # separate pools per card (measured):
    #     iq3_s   3,520 KiB/expert
    #     iq4_xs  4,352 KiB/expert
    #     q6_K    6,720 KiB/expert
    # A single scalar bundle size is therefore WRONG for this model. Do not
    # derive one from "IQ4_XS" — the quant name does not give you the byte size.
    expert_bundle_uniform: false
    expert_types_kib: { iq3_s: 3520, iq4_xs: 4352, q6_K: 6720 }
    # ⚠️ NOT YET MEASURED: per-layer bundle sizes (the DeepSeek file has these
    # from tensor-offset deltas; the equivalent pass has not been run here).
    # Until it is, host-RAM guards must use the totals below, not per-layer math.
    routed_total_gib: 113.5      # 118.7 GiB total − 5.1 GiB GPU-resident
    dense_gpu_gib: 5.0           # measured: CUDA0 2,495 + CUDA1 2,642 MiB

# ---------------------------------------------------------------------------
# VRAM sizing (measured 2026-08-12).
# ⚠️ As with DeepSeek, CONTEXT IS NOT THE DOMINANT TERM and is not what OOMs this
# model. Compute buffers are reserved at boot (`sched_reserve`) and scale with
# ctx × ubatch: at 262K/ub2048 they are 2,802 + 2,304 MiB (+1,099 MiB host);
# at 1M/ub2048 the reserve alone is 9,450 MiB on device 0 and the boot dies
# there — while the 1M KV allocated FINE. A guard that models KV alone will
# pass a config that cannot boot.
# ---------------------------------------------------------------------------
vram_sizing:
  compute_reserve_mib:
    ub2048_262k: { cuda0: 2802, cuda1: 2304, host: 1099 }
    ub2048_1m:   { cuda0: 9450 }        # OOMs here — recorded as the failure point
  kv_total_mib_262k: 7518               # 7,168 non-SWA + 350 SWA

weights:
  unsloth-ud-iq4xs:
    path: inkling-small-gguf/UD-IQ4_XS
    local_subdir: inkling-small-gguf
    size_gb: 119
    format: gguf
    status: incubating
    hf_repo: unsloth/Inkling-Small-GGUF
    shards: 4
    # `--local-dir` preserves repo folder structure, so `local_subdir` is the
    # BUCKET and `files:` carry the quant-folder prefix — same rule as the
    # DeepSeek entry; pointing local_subdir at the quant dir nests it twice.
    files:
      - UD-IQ4_XS/Inkling-Small-UD-IQ4_XS-00001-of-00004.gguf
      - UD-IQ4_XS/Inkling-Small-UD-IQ4_XS-00002-of-00004.gguf
      - UD-IQ4_XS/Inkling-Small-UD-IQ4_XS-00003-of-00004.gguf
      - UD-IQ4_XS/Inkling-Small-UD-IQ4_XS-00004-of-00004.gguf
    # ⚠️ REQUIRED on every GGUF entry — `verify_glob` defaults to `*.safetensors`,
    # which matches NOTHING here (see the DeepSeek entry for what breaks).
    verify_glob: "UD-IQ4_XS/*.gguf"
    manual_note: "🧪 EXPERIMENTAL — the `inkling` architecture is NOT in llama.cpp mainline (unmerged draft ggml-org#25731); stock builds fail with `unknown model architecture: 'inkling'`. Served via the dedicated engine `llamacpp-club3090-v1.1` (v1 engine + that PR vendored), which collapses back into `llamacpp-club3090` when the PR merges. Ships 262K, NOT the 1M the model declares: at 1M the KV allocates fine but the prefill compute buffer wants 9,450 MiB on device 0 and the boot dies (measured). ⚠️ REASONING IS ON BY DEFAULT at effort 0.9 — the template reads `reasoning_effort` (a float dial 0.0-0.99), NOT `enable_thinking`, and an unrecognised switch is silently ignored. ⚠️ Sampling: Unsloth specifies temp 1.0 / top_p 1.0 / min_p 0.0, NOT the stack-canonical Qwen values. ⚠️ Length-dependent logit scaling kicks in above 128K context, so quality does not extrapolate across that boundary."

# ---------------------------------------------------------------------------
# Speculative decoding — NONE shipped. `compatible_drafters` is deliberately
# empty: the GGUF carries no embedded MTP head (no `nextn` keys), so
# self-speculation is impossible.
# One external candidate EXISTS but is unconverted and untested:
# `RadixArk/Inkling-Small-DSpark` (DSparkDraftModel, 6 layers, hidden_size 4096
# matching, vocab 201,024 CONFIRMED equal to the target). Do NOT add it here
# until it is converted AND its acceptance rate is measured — a `qwen3`-shaped
# drafter against a conv-hybrid target is exactly the shape that collapsed to
# 0.3% acceptance on Laguna. When it lands, `-devd none` is MANDATORY: a
# GPU-resident drafter takes the expert cache to zero hits (measured on DeepSeek).
# ---------------------------------------------------------------------------

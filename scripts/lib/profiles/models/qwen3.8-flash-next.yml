      - tokenizer.json
      - tokenizer_config.json
      - vocab.json
      - merges.txt
      - preprocessor_config.json
      - video_preprocessor_config.json
    engine: exllamav3
    kind: main
    verify_glob: "*.safetensors"
    manual_note: "The SAFER bit rate, at a throughput cost: 48.53 narrative / 62.94 code / 1335.7 prefill@10K tuned (BENCHMARKS row 5) — about 18% behind the 3.05 sibling on every axis. Ships for users who would rather not take an unquantified quality risk, since neither tier has an 8-pack. ⚠️ BENCHMARKS row 4 (43.54/62.16) is the UNTUNED FIRST BOOT of this same variant and is ~12% low for reasons never attributed — cite row 5, not row 4. ⚠️ QUALITY UNMEASURED here too; 4.05 is merely the more conservative choice, not a validated one. ⚠️ Measured in a HOST VENV, not the shipped container."

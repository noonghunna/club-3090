schema_version: 1
id: qwen-agentworld-35b-a3b
display_name: Qwen-AgentWorld 35B-A3B (language world model)
family: qwen3-next-moe
# Geometry from cyankiwi/Qwen-AgentWorld-35B-A3B-AWQ-INT4 config.json at
# revision 76b26bbd88c6819e7623357a49275154fe420a64. The model is a specialized
# world-model fine-tune of Qwen3.5-35B-A3B-Base with the same hybrid MoE shape.
hidden_size: 2048
num_hidden_layers: 40
# Hybrid: 10 full-attention layers at indices 3,7,...,39 and 30 GDN layers.
num_gdn_layers: 30
num_attn_layers: 10
num_attn_heads: 16
num_kv_heads: 2
head_dim_attn: 256
linear_num_v_heads: 32
linear_num_k_heads: 16
linear_v_head_dim: 128
linear_k_head_dim: 128
linear_conv_kernel_dim: 4
max_ctx_supported: 262144
attention_k_eq_v: false
# MoE: 35B total, 3B active (8 routed experts plus 1 shared expert).
num_experts: 256
num_experts_per_tok: 8
moe_intermediate_size: 512
shared_expert_intermediate_size: 512
active_params_b: 3.0
# config.json declares mtp_num_hidden_layers=1, but the safetensors index at the
# pinned revision contains zero mtp.* tensors. The quant is drafter-free.
mtp_num_hidden_layers: 0
attn_output_gate: true
# The config declares a visual tower, but this checkpoint contains no visual.*
# tensors. Qwen's model card requires vLLM --language-model-only.
vision_capable: false
weights:
  cyankiwi-awq-int4:
    path: qwen-agentworld-35b-a3b-awq-int4
    local_subdir: qwen-agentworld-35b-a3b-awq-int4
    size_gb: 23.52
    format: compressed-tensors
    status: production
    hf_repo: cyankiwi/Qwen-AgentWorld-35B-A3B-AWQ-INT4
    revision: 76b26bbd88c6819e7623357a49275154fe420a64
    engine: vllm
    kind: main
    verify_glob: "*.safetensors"
    manual_note: "AWQ INT4 group-32 asymmetric compressed-tensors quant of Qwen/Qwen-AgentWorld-35B-A3B. Five shards, 23,519,913,216 indexed bytes. Language-only despite multimodal config: zero visual.* tensors and --language-model-only required. Config declares one MTP layer but the weight index contains zero mtp.* tensors, so speculative decoding must remain off."
default_weight_variant: cyankiwi-awq-int4
compatible_drafters: []
# num_kv_heads=2 caps TP at 2 (each rank needs at least one KV head).
valid_tp:
  - 1
  - 2
requires_genesis: false
# Geometry is identical to the calibrated qwen3.6-35b-a3b hybrid MoE. The first
# live 262K FP8 boot, 240K NIAH ladder, and 4 × ~261.5K concurrency confirmed
# the KV math direction; calibration records the measured 22.87 GiB/card peak.
kv_calc_supported: true

# Thinking Machines' DSpark drafter for Inkling-2-Mini (the checkpoint's mtp.safetensors) as unsloth's GGUF of it
# (llama.cpp's dflash architecture, Q8_0 matrices: dspark-Inkling-2-Mini-Q8_0.gguf, 0.40 GB), which Maya's repo carries
# byte for byte at drafter/ (tools/ik2/download.json's "drafter" at v1.1.75: peasantsmith/Inkling-2-Mini-Maya-GGUF
# @37027719). maya-ik2 --draft reads it on its fastest drafting path, beside the prompt lookup; --drafting auto (Maya's
# default, and the slug's) measures once at the first start which of no drafting, the lookup, the drafter and both
# decodes fastest on the PC and keeps it (IK2_DRAFT_FILE, on the data volume). The draft block is the drafter's own
# (block_size 8), so n_default = n_max = 7. Maya v1.1.75's notes: on one RTX 3090 at 262,144, new code 140 -> about
# 200 tok/s with drafting, the same tokens (their measurement; not reproduced here).

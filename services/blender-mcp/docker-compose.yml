# Blender headless + blender-mcp addon socket — shared 3D workbench for
# omp / pi / dsh agents over MCP (blender-mcp bridge, stdio, spawned per agent).
# Scene/state lives inside the single container; agents take turns on the
# addon's socket (one client at a time — the addon serves sequentially).
services:
  blender:
    build: .
    image: club3090/blender-mcp:latest
    container_name: blender-mcp
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    # Xvfb's lock/socket live in the container's writable layer and survive a
    # daemon restart (2026-11-13 apt upgrade → 10-restart loop: "Server is
    # already active for display 99"). Clean them before starting; nothing else
    # in this image uses /tmp state across restarts.
    entrypoint: ["bash", "-c", "rm -f /tmp/.X99-lock /tmp/.X11-unix/X99; exec \"$@\"", "--"]
    command: ["bash", "-c", "Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp & sleep 3; export DISPLAY=:99; stdbuf -oL -eL blender --python /opt/start-mcp-server.py"]
    ports:
      - "127.0.0.1:9876:9876"
    volumes:
      # persisted .blend files / agent artifacts survive container rebuilds
      - blender-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/9876"]
      interval: 30s
      timeout: 5s
      start_period: 20s

volumes:
  blender-data:

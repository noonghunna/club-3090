services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      # ⚠️ The RUNTIME view, not the tracked config.yaml. config.yaml is the
      # CATALOG (one canonical slug per model, port-pinned); this file is
      # rendered from what is actually serving, so the gateway never
      # advertises a model on a port with nothing behind it.
      # Generated by scripts/lib/litellm-sync.sh, which gpu-mode runs before
      # starting this service. If you `docker compose up` by hand, run the
      # sync first — docker creates a DIRECTORY for a missing bind source,
      # and litellm then fails to parse its config.
      - ./config.runtime.yaml:/app/config.yaml
    environment:
      - LITELLM_MASTER_KEY=sk-litellm-master-key
      # Cloud reference routes — referenced as os.environ/DASHSCOPE_API_KEY and
      # os.environ/ORCAROUTER_API_KEY in config.yaml
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - ORCAROUTER_API_KEY=${ORCAROUTER_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0", "--num_workers", "1"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

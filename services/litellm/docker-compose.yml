services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.100.3
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      # ⚠️ The RUNTIME view, not the tracked config.yaml. config.yaml is the
      # CATALOG (one canonical slug per model, port-pinned); this file is
      # rendered from what is actually serving, so the gateway never
      # advertises a model on a port with nothing behind it.
      # Generated by scripts/lib/litellm-sync.sh, which gpu-mode runs before
      # starting this service. If you `docker compose up` by hand, run the
      # sync first — docker creates a DIRECTORY for a missing bind source,
      # and litellm then fails to parse its config.
      - ./config.runtime.yaml:/app/config.yaml
    environment:
      # The key every client sends (club-3090#1467). `bash scripts/gateway-key.sh rotate`
      # stores a per-install one in ~/.config/club-3090/secrets.env, which gpu-mode
      # hands to compose. Unset, it is this public default, the same on every install:
      # anyone on your network can then use the gateway (gpu-mode warns while it is).
      # Starting it by hand, a plain `docker compose up` here does NOT read secrets.env
      # and comes up on the default: use gpu-mode — `gpu-mode gateway` recreates just this
      # container with your settings (--env-file), which `gateway-key.sh rotate --apply` runs.
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      # Request logging for troubleshooting — OFF unless the starting shell sets it.
      # Bare pass-through: `- LITELLM_LOG=${LITELLM_LOG:-}` would set it to the EMPTY
      # string instead of leaving it unset. Toggle with scripts/litellm-log.sh on|off.
      - LITELLM_LOG
    # Keys for this rig's own routes (litellm/config.local.yaml in your club-3090
    # config dir, e.g. a cloud endpoint's `api_key: os.environ/MY_KEY`), saved in
    # ~/.config/club-3090/secrets.env: `bash scripts/settings.sh set MY_KEY=…`.
    # The gateway does not get secrets.env itself (your HF token is in there too):
    # gpu-mode, c3 and scripts/litellm-log.sh write just the keys the routes name to a
    # 0600 temp file, pass its path as CLUB3090_LITELLM_ROUTE_KEYS, and delete it once
    # compose has created the container (scripts/lib/litellm_local.py). A plain
    # `docker compose up` here gets only the older ./local.env below.
    env_file:
      # Older installs kept these keys in this gitignored file. Still loaded; the keys
      # from your settings come after it, so they win.
      - path: ./local.env
        required: false
      - path: ${CLUB3090_LITELLM_ROUTE_KEYS:-/dev/null}
        required: false
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0", "--num_workers", "1"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Cap the container log: with request logging ON (scripts/litellm-log.sh) every
    # prompt and reply is written here, and an agent session's prompts are large.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

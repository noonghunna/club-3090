      allowed_openai_params: [reasoning_effort]   # route shape: see scripts/lib/litellm_sync.py ROUTE_PARAMS

  # (The old gemma-4-12b :8069 llama.cpp "chat brain" route was retired 2026-06-23 with the
  #  ai-studio consolidation — the studio uses the qwen director only.)
  #
  # NOTE: Gemma 4 26B-A4B is intentionally NOT routed — the registry default
  # (vllm/gemma-a4b, :8041) is the autoround-int4-mixed compose, which is
  # SM86-blocked (Marlin K-dim 704/128). The working AWQ variant
  # (vllm/gemma-a4b-awq, :8042) is not a gpu-mode primary; add a route here if
  # it gets promoted.

  # This rig's own routes (cloud endpoints, private services) do NOT go in this
  # tracked catalog: put them in litellm/config.local.yaml in your club-3090 config
  # dir (~/.config/club-3090/; see config.local.yaml.example) and their keys in
  # secrets.env there. litellm-sync merges them into the runtime view the gateway
  # serves. Older installs kept them in services/litellm/config.local.yaml and
  # services/litellm/local.env, which are still read.

# Gateway-wide behaviour (hand-maintained; outside the generated blocks, so both
# the catalog view and the runtime view litellm-sync renders carry it).
litellm_settings:
  # A coding agent's turn can be a long cold prefill plus a 32K-token reply at
  # ~70 tok/s — well past a short default. The client (omp, claude) owns the real
  # timeout; the gateway must not cut the request first.
  request_timeout: 1800
  # Never re-send a failed request: on a local GPU a retry repeats the whole
  # prefill, doubling the wait, and it lands on a server that just failed.
  num_retries: 0

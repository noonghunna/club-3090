model_list:
  # === Current serving primaries (one GPU service runs at a time per gpu-mode;
  #     routes to the inactive backends fail until that mode is brought up) ===
  #
  # LOCAL block policy (#1078): routes between the GENERATED markers below are
  # derived from the registry by scripts/lib/litellm-emit.sh — never hand-edit
  # them; flip compose_registry._entry(gateway=True) and regenerate instead.
  # `litellm-emit.sh --check` gates the region against drift. Routes BELOW the
  # END marker are hand-maintained: local models not yet gateway-flagged in
  # compose_registry (today only agents-a1) plus the cloud block at the bottom.
  # Non-functional scenes still emit a route, annotated `# status: <status>`.
  #
  # Qwen 3.6 27B — MTP n=3 + fp8/int8-PTH KV + 262K + vision.
  # Started by `gpu-mode 27b` → vllm-qwen36-27b-dual at :8010. Stack default.
  # NOTE: EVERY 27b scene (autoround / fp8 / awq / lmcache) serves the neutral shared
  # primary `qwen3.6-27b` (+ its own quant-specific name as an alias), so this route
  # matches whichever scene is on :8010 regardless of quant (#482/#490). The quant
  # differs by compose path/port + the scene's alias, NOT by the primary name.
  #
  # Local qwen3.8-27b (#1062) — the dual-max scene on :8091 serves BOTH served-names.
  # ⚠️ Scene-dependent port: :8091 is the dual-max slug; other qwen3.8 slugs serve on their
  # own registry default_port (dual-fast 8113, iq4xs 8090, …). The gateway lists one canonical
  # port per model, same as every other local backend here.
  # === BEGIN GENERATED LOCAL BLOCK — scripts/lib/litellm-emit.sh (#1078); DO NOT hand-edit ===

  - model_name: deepseek-v4-flash  # status: incubating
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: http://host.docker.internal:8030/v1
      api_key: EMPTY

  - model_name: gemma-4-12b-int8
    litellm_params:
      model: openai/gemma-4-12b-int8
      api_base: http://host.docker.internal:8038/v1
      api_key: EMPTY

  - model_name: gemma-4-31b
    litellm_params:
      model: openai/gemma-4-31b
      api_base: http://host.docker.internal:8032/v1
      api_key: EMPTY

  - model_name: gemma-4-31b-autoround
    litellm_params:
      model: openai/gemma-4-31b-autoround
      api_base: http://host.docker.internal:8032/v1
      api_key: EMPTY

  - model_name: gemma-4-31b-qat-awq-int4
    litellm_params:
      model: openai/gemma-4-31b-qat-awq-int4
      api_base: http://host.docker.internal:8032/v1
      api_key: EMPTY

  - model_name: glm-5.3-flash  # status: incubating
    litellm_params:
      model: openai/glm-5.3-flash
      api_base: http://host.docker.internal:8119/v1
      api_key: EMPTY

  - model_name: qwen3.6-27b
    litellm_params:
      model: openai/qwen3.6-27b
      api_base: http://host.docker.internal:8010/v1
      api_key: EMPTY

  - model_name: qwen3.6-27b-autoround
    litellm_params:
      model: openai/qwen3.6-27b-autoround
      api_base: http://host.docker.internal:8010/v1
      api_key: EMPTY

  - model_name: qwen3.6-35b-a3b-autoround
    litellm_params:
      model: openai/qwen3.6-35b-a3b-autoround
      api_base: http://host.docker.internal:8051/v1
      api_key: EMPTY

  - model_name: deckard-40b
    litellm_params:
      model: openai/deckard-40b
      api_base: http://host.docker.internal:8199/v1
      api_key: EMPTY

  - model_name: qwen3.8-27b  # status: experimental
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: http://host.docker.internal:8091/v1
      api_key: EMPTY

  - model_name: qwen3.8-27b-fp8  # status: experimental
    litellm_params:
      model: openai/qwen3.8-27b-fp8
      api_base: http://host.docker.internal:8091/v1
      api_key: EMPTY

  # === END GENERATED LOCAL BLOCK ===

  # Agents-A1 — InternScience 35B agentic MoE (⚠️ caveats; the agentic thinking-ON
  # specialist). Launched via `switch.sh vllm/agents-a1-dual` → vllm-agents-a1-dual
  # at :8072 (own port — never share a sibling's; see the slug-masquerade note).
  # Still hand-maintained: agents-a1 is not yet gateway-flagged in compose_registry.
  - model_name: agents-a1
    litellm_params:
      model: openai/agents-a1
      api_base: http://host.docker.internal:8072/v1
      api_key: EMPTY

  # (The old gemma-4-12b :8069 llama.cpp "chat brain" route was retired 2026-06-23 with the
  #  ai-studio consolidation — the studio uses the qwen director only.)
  #
  # NOTE: Gemma 4 26B-A4B is intentionally NOT routed — the registry default
  # (vllm/gemma-a4b, :8041) is the autoround-int4-mixed compose, which is
  # SM86-blocked (Marlin K-dim 704/128). The working AWQ variant
  # (vllm/gemma-a4b-awq, :8042) is not a gpu-mode primary; add a route here if
  # it gets promoted.

  # === Cloud reference endpoint (DashScope MaaS workspace, OpenAI-compatible) ===
  # Qwen 3.8 Max Preview — first CLOUD reference for benchlocal-cli quality runs
  # (all prior references were local composes). Same endpoint pi uses.
  #
  # Thinking-only model: upstream REJECTS enable_thinking=false ("The value of the
  # enable_thinking parameter is restricted to True"), so the "thinking-off" arm is
  # realized as thinking_budget=1 (~1 reasoning token) via the -nothink alias's
  # extra_body — NOT enable_thinking=false. reasoning_effort is accepted but ignored.
  #
  # Rate limits prescribed to us: 500K TPM / 120 RPM per person, no token cap.
  # rpm/tpm below make LiteLLM pace/queue BEFORE the upstream 429s (with ~8% headroom).
  - model_name: qwen3.8-max
    litellm_params:
      model: openai/qwen3.8-max-preview
      api_base: https://ws-rcka3ndnpjlt5fku.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY
      rpm: 110
      tpm: 480000
  # "Thinking-off" arm: identical upstream, but thinking clamped to 1 token.
  - model_name: qwen3.8-max-nothink
    litellm_params:
      model: openai/qwen3.8-max-preview
      api_base: https://ws-rcka3ndnpjlt5fku.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY
      rpm: 110
      tpm: 480000
      extra_body: {"thinking_budget": 1}

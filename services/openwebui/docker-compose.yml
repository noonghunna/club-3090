services:
  open-webui:
    # Pinned (was :main) — v0.11.0 bumped 2026-08-02 (#807) from v0.9.6.
    # ⚠️ v0.10.0 AND v0.11.0 both carry ONE-WAY DB migrations — back up the
    #    open-webui-data volume before any bump (downgrade is unsupported).
    # ⚠️ v0.11.0 flips tool-calling default to NATIVE — chats/models relying on
    #    the old behavior must opt back into "Legacy" (per chat/model/global).
    # Bump deliberately, re-validate the image-gen (ComfyUI) wiring when that
    # stack is next active (mutexed with dual-LLM serving).
    image: ghcr.io/open-webui/open-webui:v0.11.0
    container_name: open-webui
    restart: unless-stopped
    ports:
      # Host port is a knob (#715 gap 3): set OWUI_PORT in the repo .env (compose reads
      # it via --env-file) AND export it for setup-ai-studio.sh + the pipe helper.
      # The container-internal port stays 8080 (docker-exec helpers rely on it).
      - "${OWUI_PORT:-8080}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    env_file:
      # Image generation: Ideogram-4 → ComfyUI (:8188). PersistentConfig — applies on a
      # FRESH volume; on an existing volume set it in Admin → Settings → Images instead.
      - ./imagegen.env
    environment:
      # Chat models — ONE connection to the LiteLLM gateway (:4000) instead of one
      # per model port. The gateway fronts every model-serving scene that is
      # gateway-routed in services/litellm/config.yaml (generated from the
      # compose_registry gateway=True flags):
      #   qwen3.6-27b (:8010) · deepseek-v4-flash (:8030) · qwen3.6-35b-a3b (:8051)
      #   gemma-4-31b (:8032) · gemma-4-12b-int8 (:8038) · deckard-40b (:8199)
      # The ai-studio director (:8090, llamacpp/qwen38-27b-single-iq4xs) has NO
      # gateway route (incubating, not gateway-flagged), so it stays a direct
      # backend — collapsing it too would silently drop it from the picker.
      #
      # Reachability: the openwebui and litellm compose files are SEPARATE compose
      # projects with no shared network, so the `litellm` service DNS name does
      # NOT resolve from open-webui. host.docker.internal:4000 does — litellm
      # publishes 4000 on the host and this compose already maps
      # host.docker.internal (extra_hosts below), the same path every backend
      # here has always used.
      #
      # ⚠️ Behavior change vs per-port backends: the gateway is always up, so OWUI
      # now lists EVERY catalog model (including the cloud reference routes)
      # instead of only the models whose gpu-mode scene is currently serving.
      # Requests to a scene that is down fail at the gateway rather than
      # disappearing from the picker.
      #
      # Override / rollback: set OWUI_OPENAI_API_BASE_URLS + OWUI_OPENAI_API_KEYS
      # (repo .env via --env-file, or host env) to the old per-port lists to
      # restore pre-collapse behavior without editing this file.
      #
      # ⚠️ PersistentConfig: on an EXISTING volume the stored config WINS — re-run
      # scripts/setup-ai-studio.sh or set these in Admin → Settings → Connections.
      # (setup-ai-studio.sh migrates legacy volumes to this same wiring: it
      # registers :4000 + the unrouted :8090 director and drops the pre-collapse
      # per-port connections; it also honors OWUI_OPENAI_API_BASE_URLS and stays
      # out of the way when the override is set.) Backends are no-auth on
      # localhost, so the key is a placeholder.
      - "OPENAI_API_BASE_URLS=${OWUI_OPENAI_API_BASE_URLS:-http://host.docker.internal:4000/v1;http://host.docker.internal:8090/v1}"
      # ⚠️ COUNT MUST MATCH *_URLS above — positional, ;-separated pairs. Nothing
      # validates this, so a backend added to one list and not the other silently
      # leaves that entry unpaired.
      - "OPENAI_API_KEYS=${OWUI_OPENAI_API_KEYS:-sk-noauth;sk-noauth}"
      # Ollama removed from the stack 2026-06-22 — disable the API so OWUI doesn't
      # probe a dead :11434 on boot (chat routes through the OpenAI API above).
      - ENABLE_OLLAMA_API=false
      # Leave empty → Open WebUI generates a strong random key on first boot and persists it
      # in the data volume (.webui_secret_key). NEVER ship a hardcoded shared secret (it would
      # let anyone forge session tokens). Override via the host env only to share sessions
      # across replicas: WEBUI_SECRET_KEY=<your-secret> docker compose up -d
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}

      # --- Web search (SearXNG) ---  v0.9.x env names: the old ENABLE_RAG_WEB_SEARCH /
      # RAG_WEB_SEARCH_* names were renamed upstream and are now IGNORED (→ web search silently
      # off). SearXNG runs at :8088 with JSON output enabled; OWUI substitutes <query>.
      # Config path rag.web.search.* — seeded from these on boot when unset in the DB.
      - ENABLE_WEB_SEARCH=true
      - WEB_SEARCH_ENGINE=searxng
      - WEB_SEARCH_RESULT_COUNT=5
      - WEB_SEARCH_CONCURRENT_REQUESTS=5
      - SEARXNG_QUERY_URL=http://host.docker.internal:8088/search?q=<query>&format=json
      # Inject SearXNG results straight into the prompt instead of embed→vector-retrieve. The
      # retrieve path needs a reranker for hybrid search and was silently returning 0 chunks (web
      # results never reached the model); bypassing it is the reliable path. web_loader off = use
      # the search snippets, not full-page fetches → small, fast context. (rag.web.search.bypass_*)
      - BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL=true
      - BYPASS_WEB_SEARCH_WEB_LOADER=true

      # --- Vector DB (Qdrant) ---  document / knowledge RAG vectors live in the qdrant service
      # (:6333) instead of the embedded Chroma default. VECTOR_DB is a plain STARTUP env (applies
      # on every boot, not PersistentConfig). QDRANT_ON_DISK persists vectors to qdrant's volume.
      # Switching backends does NOT migrate existing Chroma embeddings — re-index any knowledge.
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://host.docker.internal:6333
      - QDRANT_ON_DISK=true

      # Fallback / additional providers (keys loaded if set in env)
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - GOOGLE_PSE_API_KEY=${GOOGLE_PSE_API_KEY:-}
      - GOOGLE_PSE_ENGINE_ID=${GOOGLE_PSE_ENGINE_ID:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - JINA_API_KEY=${JINA_API_KEY:-}

      # --- URL-paste / page loading ---
      - ENABLE_RAG_LOCAL_WEB_FETCH=true

      # --- Image/file upload, document RAG ---
      # Hybrid (BM25 + vector + rerank) retrieval for document RAG. Needs a cross-encoder reranker:
      # bge-reranker-base (~280 MB) runs IN-PROCESS in OWUI on CPU (no GPU contention, no separate
      # service), auto-downloaded from HF on first use. Document-RAG only — web search bypasses
      # retrieval (above). For higher recall swap to BAAI/bge-reranker-v2-m3 (~2.3 GB, still CPU).
      - ENABLE_RAG_HYBRID_SEARCH=true
      - RAG_RERANKING_MODEL=BAAI/bge-reranker-base
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  open-webui-data:

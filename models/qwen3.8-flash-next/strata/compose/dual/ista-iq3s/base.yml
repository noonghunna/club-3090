# ===========================================================================
# Profile (at-a-glance):
#   Model:     Qwen3.8-Flash-Next — ISTA-DASLab GSQ-RCO IQ3_S (2 shards: 54.8 GB experts +
#              28.8 GB n-gram table), Strata's best-quality native format. Strata's setup
#              SHA-256-checks both shards on the first start.
#   Engine:    Strata (the release engines/strata.yml pins) — upstream's own image ghcr.io/niko1221/strata:<release>-cuda13,
#              pinned by digest; club-3090's launcher (../../../launcher/) applies the launch settings
#   Topology:  Dual 3090, Strata layer split (--gpus 0,1, layer split auto): each card
#              caches the experts of its own layers; one hand-off per verify window, no
#              NCCL and no P2P needed. STRATA_START_GPUS=0 starts the same install on one card.
#   Drafter:   MTP — Strata's own draft layer (--spec 4, min-p 0.5), fetched into the data volume at setup
#   KV:        Strata default (int8): 32K cells in VRAM, the rest streamed to RAM
#   Vision:    no
#   Max ctx:   131072
#   Genesis:   N/A — Genesis is Qwen3-Next-specific
#   Status:    🐣 Incubating
#   Caveats:   Not gate-passing yet: IQ3_S quality unmeasured (8-pack pending). Up to 3 requests at once (Strata's pick here).
#              The first start needs the network (setup range-reads ~5 GB of MTP tensors from
#              Qwen/Qwen3.8-Flash-Next) and ~93 GB of free host RAM when the
#              model disk is rotational (setup then keeps the n-gram table in RAM; less on an SSD). Host
#              needs NVIDIA driver >= 580 (CUDA 13) and an AVX2 CPU; x86-64 only. Strata reasons by default,
#              at the template's xhigh (as the bucko-vllm Flash-Next slugs). Launch settings
#              (REASONING_EFFORT, ENABLE_THINKING, THINKING_BUDGET, SPEC_N,
#              ROPE_SCALING, ROPE_SCALE, the sampler;
#              docs/engines/STRATA.md) are written into Strata's config at every boot. The FIRST start on a
#              fresh data volume took 511 s on the reference rig with the image pulled (MTP fetch and pack;
#              setup serves on an unpublished port until it is done), close to switch.sh's 10-minute wait:
#              give it READY_TIMEOUT=1800. Later starts: ~25 s; a first start of this model in another
#              topology, ~45 s (the packs and the MTP layer are shared).
#              Measured 2026-10-13 on 0.1.43.1: 122.5 / 153.9 decode, 2,228 / 3,364 prefill (BENCHMARKS.md,
#              Qwen3.8-Flash-Next / Strata).
# CPU-Offload-Host-RAM-GB: 93
#   ⤷ RE-MEASURED 2026-10-14 (0.1.44.1, this rig's rotational model disk): MemAvailable fell 84 GB
#     at ready on one card: every expert page-locked plus the 28.8 GB n-gram table, which setup
#     keeps in RAM on a rotational disk (--ple-io ram). The 2026-10-06 figure (~58.4 GB, 0.1.33)
#     predates that. Strata page-locks every expert in host RAM whatever the card count.
#     Registry `host_ram_gb` (93) is the NOMINAL figure and must stay <= this.
#   ⤷ RE-MEASURED 2026-10-30 (0.2.8, the Swift dual, sampled every 2 s): MemAvailable fell 92.8 GB at its
#     lowest, during verify-full rather than at ready. Since 0.2.3 (engine 0.1.48, Niko1221/Strata#3493)
#     Strata also sizes a conversation cache from free RAM (8192 MiB here, for up to 4 parked
#     conversations; --conversation-cache-mib N sets it), which the 2026-10-14 figure predates.
#   Best for:  the fastest offloaded Flash-Next measured on the reference rig (2 cards)
# ---------------------------------------------------------------------------
# Strata (github.com/Niko1221/Strata) is its own engine for this model: see docs/engines/STRATA.md.
# Sibling: ../../single/ista-iq3s/base.yml (single card, same data volume).
#   bash scripts/switch.sh --force strata/qwen3.8-flash-next-iq3s-dual
# The first start runs Strata's one-time setup (SHA-256 check, pack, MTP layer; the run config is
# kept in this topology's folder on the data volume, the packs and MTP layer in a folder all of them
# share). Every request needs `Authorization: Bearer <key>`: the container's API_KEY, club-3090's
# default (club-3090-strata-local-key) unless STRATA_API_KEY is set; our scripts send it themselves.
# ⚠️ Strata sizes its RAM tiers from FREE memory at start, so drop the page cache first on a
#   box that just read large files. /health says loaded before the engine has filled its expert
#   cache; switch.sh's generation probe (one token) is the real gate.
services:
  strata:
    image: ${STRATA_IMAGE:-ghcr.io/niko1221/strata@sha256:83e37db8625c67b61c579fd7c0f9068f2d831037a937f139c569502b54290998}
    container_name: ${ESTATE_CONTAINER:-strata-qwen38-flash-next-iq3s}
    restart: ${CLUB3090_RESTART:-unless-stopped}
    # root, with the launcher's group: what Strata writes to the data volume stays
    # removable by the user (the entrypoint sets umask 0002)
    user: "0:${DOCKER_GID:-1000}"
    # tini first, as in the image: it reaps the launcher's children and passes `docker stop` on
    entrypoint: ["/usr/bin/tini", "--", "/bin/sh", "/opt/club3090/strata-entrypoint.sh"]
    ulimits:
      memlock: -1            # Strata pins (locks) RAM for the GPU; upstream's docker run uses -1
    shm_size: "2g"           # and --shm-size 2g
    stop_grace_period: 120s  # and --stop-timeout 120: on `docker stop` the server drains, then stops the model
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8018}}:8080"
    environment:
      CONTEXT: "${CONTEXT:-131072}"
      KV: "${KV:-}"
      STRATA_START_GPUS: "${STRATA_START_GPUS:-0,1}"
      # Strata 0.2+ serves nothing but /health without a key, so one is always set: club-3090's
      # default unless STRATA_API_KEY is (bash scripts/settings.sh set STRATA_API_KEY=...). Our
      # tooling reads it back from this container (scripts/lib/engine-auth.sh).
      API_KEY: "${STRATA_API_KEY:-club-3090-strata-local-key}"
      # Strata run-config settings, written into its config at every boot by strata_config.py
      # (mounted below); unset = Strata's own default. CONTEXT and KV run setup again when changed.
      REASONING_EFFORT:
      ENABLE_THINKING:
      THINKING_BUDGET:
      SPEC_N:
      ROPE_SCALING:
      ROPE_SCALE:
      TEMP:
      TOP_P:
      TOP_K:
      MIN_P:
      PRESENCE_PENALTY:
      REPEAT_PENALTY:
      SERVED_NAME:
      # Strata's own engine switches, passed to the engine as they are when set; unset, Strata's own default
      # (docs/engines/STRATA.md, "Engine switches"). 0.2.9 turned these on for Linux NVIDIA cards (the Gated
      # DeltaNet prompt kernels on the tensor cores); 0 turns each off.
      STRATA_GDN_TC:
      STRATA_GDN_CONVL2:
      # Strata's PLE (n-gram) residency switch: 0 keeps the ~27 GiB table on direct disk
      # reads instead of page-locking it in RAM. The residency policy's free-RAM check
      # counts only the table + the expert arena — not the KV stream, the conversation
      # cache or the batch sessions that fill right after it — so on a big-context boot
      # the auto choice can lock the table and still starve the arena. 0 is the right
      # call whenever the model disk is an SSD. Unset = Strata's own auto policy.
      STRATA_PLE_AUTO_RAM:
    volumes:
      - "${MODEL_DIR:-../../../../../../models-cache}/qwen3.8-flash-next-gsq-rco-gguf/IQ3_S:/gguf:ro"
      # Strata 0.2's layout (0.1.x's strata-data is not read by it), under ~/.local/share/club-3090 from
      # the launchers: run configs, presets and state per topology (setup bakes the cards into a model's
      # run config, so a dual and a single start would set the model up again each time), and the
      # packs and MTP layer shared by all of them
      - "${STRATA_DATA_DIR:-${CLUB3090_DATA_DIR:-../../..}/strata-data-v2}/dual:/data"
      - "${STRATA_DATA_DIR:-${CLUB3090_DATA_DIR:-../../..}/strata-data-v2}/Strata-data:/data/Strata-data"
      - "../../../launcher/strata-entrypoint.sh:/opt/club3090/strata-entrypoint.sh:ro"
      - "../../../launcher/strata_config.py:/opt/club3090/strata_config.py:ro"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${ESTATE_GPUS:-${CUDA_VISIBLE_DEVICES:-0,1}}']
              capabilities: [gpu]

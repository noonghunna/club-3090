# ===========================================================================
# Profile (at-a-glance):
#   Model:     Swift 1.5 (UkisAI's fine-tune of Qwen3.8-Flash-Next), SC117's abliterated GSQ-RCO
#              IQ3_S (2 shards, 44.85 + 38.70 GB; the 28.8 GB per-layer embedding table sits in
#              shard 1). Served as Strata's swift family; setup checks both shards are whole GGUFs.
#   Engine:    Strata (the release engines/strata.yml pins) — upstream's own image ghcr.io/niko1221/strata:<release>-cuda13,
#              pinned by digest; club-3090's launcher (../../../launcher/) applies the launch settings
#   Topology:  4× 24 GB, Strata layer split (--gpus 0,1,2,3, layer split auto): each card
#              caches the experts of its own layers (four cards hold about four times one card's
#              experts); one hand-off per card per verify window, no NCCL and no P2P needed.
#   Drafter:   MTP — Strata's own draft layer (--spec 4, min-p 0.5), the one the ISTA slugs use
#              (from Qwen/Qwen3.8-Flash-Next; Swift ships none)
#   KV:        Strata default (int8): 32K cells in VRAM, the rest streamed to RAM
#   Vision:    no
#   Max ctx:   131072
#   Genesis:   N/A — Genesis is Qwen3-Next-specific
#   Status:    🐣 Incubating
#   Caveats:   Abliterated: its README says it has no reliable built-in guardrails, so put your own
#              moderation in front of anything user-facing. Swift Open License 1.0 (commercial use free
#              only below US$1M annual revenue) on top of the Qwen licence. Upstream documents the
#              IQ3_S tier only in passing (its measured costs are IQ2_XS: decode -2%, MTP acceptance
#              62.5% vs 66.8% with the base draft layer). Not gate-passing yet: quality unmeasured
#              (8-pack pending). NEVER BOOTED on the reference rig (2 GPUs): multi4 is community-
#              validated by design; Strata's layer split takes any number of cards (its
#              docs/MULTI_GPU.md shows a 4-card split). Up to 3 requests at once (Strata's pick here). Needs ~93 GB of free
#              host RAM when the 28.8 GB n-gram table lands in RAM — either setup's --ple-io ram
#              for a rotational disk (which STRATA_PLE_AUTO_RAM=0 does NOT override) or the
#              engine's free-RAM policy locking it on an SSD boot (it counts only the table +
#              expert arena, so a big-CONTEXT boot can lock it and then starve the arena;
#              =0 keeps the SSD on direct disk reads), NVIDIA driver >= 580 (CUDA 13) and an AVX2 CPU; x86-64 only. Strata reasons by
#              default, at the template's xhigh (what SC117 recommends; as the bucko-vllm Flash-Next slugs).
#              Launch settings (REASONING_EFFORT, ENABLE_THINKING, THINKING_BUDGET, SPEC_N,
#              ROPE_SCALING, ROPE_SCALE, the sampler;
#              docs/engines/STRATA.md) are written into Strata's config at every boot. The first start
#              builds this model's pack on the shared data volume (~45 s when the MTP layer is already
#              there; setup serves on an unpublished port until it is done).
#              Not measured: the dual sibling's 125.7 / 161.7 decode (0.1.44.1, 2026-10-14) is the
#              nearest reference, not a number for four cards.
# CPU-Offload-Host-RAM-GB: 93
#   ⤷ The dual sibling's MEASURED figure (2026-10-14, 0.1.44.1, a rotational model disk): Strata
#     page-locks every expert in host RAM whatever the card count, plus the 28.8 GB n-gram table on a
#     rotational disk (--ple-io ram). Not measured on four cards. Registry `host_ram_gb` (93) must
#     stay <= this.
#   ⤷ RE-MEASURED 2026-10-30 (0.2.8, the Swift dual, sampled every 2 s): MemAvailable fell 92.8 GB at its
#     lowest, during verify-full rather than at ready. Since 0.2.3 (engine 0.1.48, Niko1221/Strata#3493)
#     Strata also sizes a conversation cache from free RAM (8192 MiB here, for up to 4 parked
#     conversations; --conversation-cache-mib N sets it), which the 2026-10-14 figure predates.
#   Best for:  Swift 1.5's shorter thinking, abliterated, on 4 cards
# ---------------------------------------------------------------------------
# Strata (github.com/Niko1221/Strata) is its own engine for this model: see docs/engines/STRATA.md.
# Siblings: ../../dual/sc117-swift15-abliterated-iq3s/base.yml and
# ../../single/sc117-swift15-abliterated-iq3s/base.yml (same data volume, links folder, config and pack).
#   bash scripts/switch.sh --force strata/qwen3.8-flash-next-swift15-abliterated-iq3s-multi4
# The first start runs Strata's one-time setup for this model (shard check, pack; the run config is
# kept in this topology's folder on the data volume, the packs and MTP layer in a folder all of them
# share). Every request needs `Authorization: Bearer <key>`: the container's API_KEY, club-3090's
# default (club-3090-strata-local-key) unless STRATA_API_KEY is set; our scripts send it themselves.
# ⚠️ Strata sizes its RAM tiers from FREE memory at start, so drop the page cache first on a
#   box that just read large files. /health says loaded before the engine has filled its expert
#   cache; switch.sh's generation probe (one token) is the real gate.
services:
  strata:
    image: ${STRATA_IMAGE:-ghcr.io/niko1221/strata@sha256:83e37db8625c67b61c579fd7c0f9068f2d831037a937f139c569502b54290998}
    container_name: ${ESTATE_CONTAINER:-strata-qwen38-flash-next-swift15-abl-iq3s-multi4}
    restart: ${CLUB3090_RESTART:-unless-stopped}
    # root, with the launcher's group: what Strata writes to the data volume stays
    # removable by the user (the entrypoint sets umask 0002)
    user: "0:${DOCKER_GID:-1000}"
    # tini first, as in the image: it reaps the launcher's children and passes `docker stop` on
    entrypoint: ["/usr/bin/tini", "--", "/bin/sh", "/opt/club3090/strata-entrypoint.sh", "swift"]
    ulimits:
      memlock: -1            # Strata pins (locks) RAM for the GPU; upstream's docker run uses -1
    shm_size: "2g"           # and --shm-size 2g
    stop_grace_period: 120s  # and --stop-timeout 120: on `docker stop` the server drains, then stops the model
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8046}}:8080"
    environment:
      CONTEXT: "${CONTEXT:-131072}"
      KV: "${KV:-}"
      STRATA_START_GPUS: "${STRATA_START_GPUS:-0,1,2,3}"
      # Strata 0.2+ serves nothing but /health without a key, so one is always set: club-3090's
      # default unless STRATA_API_KEY is (bash scripts/settings.sh set STRATA_API_KEY=...). Our
      # tooling reads it back from this container (scripts/lib/engine-auth.sh).
      API_KEY: "${STRATA_API_KEY:-club-3090-strata-local-key}"
      # Strata run-config settings, written into its config at every boot by strata_config.py
      # (mounted below); unset = Strata's own default. CONTEXT and KV run setup again when changed.
      REASONING_EFFORT:
      ENABLE_THINKING:
      THINKING_BUDGET:
      SPEC_N:
      ROPE_SCALING:
      ROPE_SCALE:
      TEMP:
      TOP_P:
      TOP_K:
      MIN_P:
      PRESENCE_PENALTY:
      REPEAT_PENALTY:
      SERVED_NAME:
      # Strata's own engine switches, passed to the engine as they are when set; unset, Strata's own default
      # (docs/engines/STRATA.md, "Engine switches"). 0.2.9 turned these on for Linux NVIDIA cards (the Gated
      # DeltaNet prompt kernels on the tensor cores); 0 turns each off.
      STRATA_GDN_TC:
      STRATA_GDN_CONVL2:
      # PLE (n-gram) residency switch: 0 = direct disk reads instead of page-locking the ~27 GiB
      # table; the auto policy can lock it and still starve the expert arena at big CONTEXT
      # (the dual ista-iq3s compose's block has the full note). Unset = Strata's auto policy.
      STRATA_PLE_AUTO_RAM:
    volumes:
      - "${MODEL_DIR:-../../../../../../models-cache}/qwen3.8-flash-next-swift15-abliterated-gsq-rco-gguf/IQ3_S:/gguf:ro"
      # Strata 0.2's layout (0.1.x's strata-data is not read by it), under ~/.local/share/club-3090 from
      # the launchers: run configs, presets and state per topology (setup bakes the cards into a model's
      # run config, so a dual and a single start would set the model up again each time), and the
      # packs and MTP layer shared by all of them
      - "${STRATA_DATA_DIR:-${CLUB3090_DATA_DIR:-../../..}/strata-data-v2}/multi4:/data"
      - "${STRATA_DATA_DIR:-${CLUB3090_DATA_DIR:-../../..}/strata-data-v2}/Strata-data:/data/Strata-data"
      - "../../../launcher/strata-entrypoint.sh:/opt/club3090/strata-entrypoint.sh:ro"
      - "../../../launcher/strata_config.py:/opt/club3090/strata_config.py:ro"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${ESTATE_GPUS:-${CUDA_VISIBLE_DEVICES:-0,1,2,3}}']
              capabilities: [gpu]

# ===========================================================================
# Profile (at-a-glance):
#   Model:     GLM-5.3-Flash — Project Maya's Maya-M (`Maya-M`, 116.0 GB in 3 shards): IQ2_S gate/up
#              experts, IQ3_XXS down (IQ3_S in the most sensitive layers), Q6_K attention. Made by Project
#              Maya from Z.ai's FP8 release (peasantsmith/GLM-5.3-Flash-Maya-GGUF @f16ee4ba).
#   Engine:    Project Maya (a Strata fork for GLM-5.3-Flash) — ghcr.io/noonghunna/strata-maya-club3090,
#              built by club-3090 at the release commit (models/glm-5.3-flash/strata-maya/image/)
#   Topology:  Single 3090 (GPU0): the whole model's dense part on one card, experts in its VRAM pool + RAM
#   Drafter:   none (the model's MTP block runs only on two or more GPUs)
#   KV:        fp16 latent cache, 32K positions in VRAM, the rest streamed from pinned RAM (--kv-streaming on)
#   Vision:    no (the image is text only)
#   Max ctx:   131072
#   Genesis:   N/A — Genesis is Qwen3-Next-specific
#   Status:    🐣 Incubating
#   Caveats:   Not gate-passing yet: quality unmeasured here (8-pack pending), one request at a time. Thinking:
#              GLM-5.3's template thinks by default; Maya's server closes the thinking block when a request
#              sends enable_thinking false or reasoning_effort none (unlike the llama.cpp GLM slugs, where
#              thinking can't be turned off). Server defaults for requests that name none: effort max (as the
#              other GLM-5.3-Flash slugs), temperature 1.0 / top_p 0.95, Maya's own 32K reasoning budget; the
#              launch settings change them (docs/engines/STRATA_MAYA.md). The FIRST start SHA-256-checks the
#              shards against Maya's own table and builds Maya's pack on the data volume (minutes, once);
#              later starts ~30 s from a warm page cache. From a hard disk with a cold cache every start
#              reads the whole pack (930-1,010 s for Maya-L and Maya-M on a community rig), longer than
#              switch.sh's 10-minute wait: give it READY_TIMEOUT=1800 (or re-run switch.sh once it times
#              out; the container keeps loading). Maya sizes its RAM tier from free memory: drop the page
#              cache first on a box that just read big files. Host needs NVIDIA driver >= 580 (CUDA 13) and
#              an AVX2 CPU; x86-64 only.
#              One card: no drafting (the MTP block needs two or more GPUs; the DFlash2 drafter
#              is not in the image).
#              Not benchmarked (verify-full only, maintainer 2026-10-15): it passed 7 checks + 3 n/a on
#              this image (no MTP check on one card).
# CPU-Offload-Host-RAM-GB: 107
#   ⤷ MEASURED 2026-10-15 on this image (v1.1.11), on its verify-full boot: MemAvailable fell 105 GB
#     (decimal) at its peak.
#     Maya sizes its RAM tier from FREE memory at start, so this is what it took on a 224 GB host
#     with every expert fitting; a smaller host keeps fewer experts in RAM and reads the rest from
#     the model files while it answers (slower, not measured). Registry `host_ram_gb` is the
#     NOMINAL figure and must stay <= this.
#   Best for:  GLM-5.3-Flash on 24 GB cards with lots of host RAM (M: the middle quant)
# ---------------------------------------------------------------------------
# Project Maya (github.com/mw00/project-maya) is its own engine for this model: see docs/engines/STRATA_MAYA.md.
# Siblings: ../../dual/maya-m/base.yml (dual), ../../multi4/maya-m/base.yml (multi4); the other quants sit
# beside this folder.
#   bash scripts/switch.sh --force strata-maya/glm53-flash-single-maya-m
# The launcher (../../../launcher/) links the shards into the data volume, checks their SHA-256 once, builds
# Maya's pack there and starts Maya's server. By hand: SETUP_ONLY=1 docker compose -f base.yml run --rm
# strata-maya, then up -d. Tuning (optional): Maya's `maya.sh --calibrate` result for this PC goes in
# MAYA_PCIE_SHARE / MAYA_CPU_LANE (the engine's STRATA_GLM_PCIE_SHARE / STRATA_GLM_CPU_LANE).
services:
  strata-maya:
    image: ${STRATA_MAYA_IMAGE:-ghcr.io/noonghunna/strata-maya-club3090@sha256:96abef954ec44ec99d4a2a494a01f36a9670d91f42df17562aa0375cddaaa56c}
    container_name: ${ESTATE_CONTAINER:-strata-maya-glm53-flash-single-maya-m}
    restart: ${CLUB3090_RESTART:-unless-stopped}
    # root, with the launcher's group: what Maya writes to the data volume stays removable by the user
    # (the entrypoint sets umask 0002)
    user: "0:${DOCKER_GID:-1000}"
    entrypoint: ["/bin/sh", "/opt/club3090/maya-entrypoint.sh", "maya-m"]
    ulimits:
      memlock: -1            # Maya pins (locks) its RAM tier for the GPU
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8035}}:8080"
    environment:
      CONTEXT: "${CONTEXT:-131072}"
      SETUP_ONLY: "${SETUP_ONLY:-0}"
      REPACK: "${REPACK:-0}"
      VERIFY: "${VERIFY:-1}"
      MAYA_GPUS: "${MAYA_GPUS:-0}"
      MAYA_PCIE_SHARE: "${MAYA_PCIE_SHARE:-}"
      MAYA_CPU_LANE: "${MAYA_CPU_LANE:-}"
      # Maya's server defaults, written into maya.json at every boot by maya_prepare.py
      # (launcher/maya_settings.py maps each); unset = effort max, sampling 1.0 / 0.95, Maya's 32K budget, the name glm-5.3-flash,
      # the loop guard on (Maya's own)
      REASONING_EFFORT:
      ENABLE_THINKING:
      THINKING_BUDGET:
      KV:
      TEMP:
      TOP_P:
      TOP_K:
      MIN_P:
      PRESENCE_PENALTY:
      REPEAT_PENALTY:
      SERVED_NAME:
      LOOP_GUARD:
      # Maya's model load/unload endpoints (/models/load, /models/unload, /models/sse), on by default from
      # v1.1.47. These composes set no API key, so anyone who reaches the port can unload the model:
      # MAYA_MODEL_MANAGEMENT=0 turns them off
      MAYA_MODEL_MANAGEMENT:
      # the entrypoint passes --host 0.0.0.0 and --port 8080 itself
    volumes:
      - "${MODEL_DIR:-../../../../../../models-cache}/glm-5.3-flash-maya-gguf/Maya-M:/gguf:ro"
      # one folder per quant (shard links, Maya's pack, the config); the launchers put it
      # under ~/.local/share/club-3090
      - "${STRATA_MAYA_DATA_DIR:-${CLUB3090_DATA_DIR:-../../..}/strata-maya-data}:/data"
      - "../../../launcher:/opt/club3090:ro"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${ESTATE_GPUS:-${CUDA_VISIBLE_DEVICES:-0}}']
              capabilities: [gpu]

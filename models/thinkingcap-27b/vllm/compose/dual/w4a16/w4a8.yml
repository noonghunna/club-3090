# ===========================================================================
# Profile (at-a-glance):
#   Model:     ThinkingCap-Qwen3.6-27B (LeaderboardModel1 AutoRound W4A16 — sym
#              INT4 g128 + mtp.fc/linear_attn.in_proj@BF16; VL reasoning
#              fine-tune of Qwen3.6-27B. ~18.5 GB)
#   Topology:  Dual 3090 PCIe (TP=2, no NVLink — auto-detected via NVLINK_MODE)
#   Drafter:   MTP n=3 built-in (SPEC_N override) — the working head (mtp.fc@BF16,
#              same recipe as Tess). ⚠️ DEFAULT LOWERED 5 -> 3 on 2026-07-31: n=5
#              crashes the engine under sustained multi-turn load (#758, 3 rigs).
#              n=3 is community-validated stable (12 h + multi-session daily).
#              The TPS numbers below were measured at n=5 and DO NOT describe the
#              current default — n=3 is unbenched on the reference rig.
#              n-sweep knee was n=5: code +64% (65->107 tok/s), prose break-even,
#              accept-len 4.36-5.0 / 67-80%; n=6/8 regress. SPEC_N=5 restores the
#              benched config at the documented crash risk; SPEC_N=0 disables spec.
#              Toggle: SPEC_N=<n> sets depth; SPEC_N=0 (or SPEC=off) disables
#   KV:        fp8_e4m3
#   Vision:    base is VL-capable (tower resident) — validation is TEXT-ONLY
#   Max ctx:   262144 (full native — dual card frees the KV headroom the
#              single-card W4A8 lacked: single topped out ~76K)
#   Genesis:   N/A — Genesis is Qwen3-Next-specific (this is qwen3_5)
#   Status:    ⚠️ Production w/ caveats
#   Caveats:   • ⚠️ MTP n>=4 CRASHES THE ENGINE under sustained multi-turn load
#                (#758). The drafter intermittently emits all-`-1` draft token IDs
#                -> out-of-bounds embedding gather -> cudaErrorIllegalAddress ->
#                dead worker. Independent of context depth (seen at ~25K after a
#                clean 240K prefill) and of VRAM (lowering util and max-model-len
#                both changed nothing). n=5 dies within 1-2 sessions, n=4
#                eventually; n=3 and n=0 are stable. Hit on 3 rigs incl. 2x 5090.
#                DEFAULT IS NOW n=3 — set SPEC_N=5 only if you accept the crash.
#                ⚠️ 2026-08-01: this is very likely the SAME defect now root-caused
#                upstream as vllm#50021 (next bullet) — that fix's unbounded
#                `i_t = num_accepted_tokens - 1` yields exactly the `-1` seen here
#                at a zero accepted count. If so, n=3 is only lower-probability,
#                not safe: #838 crashed AT n=3 on the same family. Identity is a
#                HYPOTHESIS — confirm by re-running this workload once #50021 is
#                in the pin, before relaxing the n=3 default.
#              • THIN VRAM margin at the 262K ceiling: 69 MB free with MTP n=5
#                (MTP eats ~1.2 GB headroom; no-MTP ladder had 1245 MB). NIAH
#                recall is CLEAN to 240K — but sustained agents at MAX ctx should
#                size below 262K or lower util. Same class as Nemotron.
#              • 8-bit activations (VLLM_MARLIN_INPUT_DTYPE=int8) on this AUTO-ROUND
#                ckpt need 2 vendored patches (INC input_dtype + negative-scale
#                fold) — applied at boot via patches/w4a8/install.sh (see patches.yml).
#              • dedicated compile cache (int8 flag AOT cache-key collision).
#              • vision untested on this serve (text-only validated).
#              • NO froggeric template mount — DELIBERATE: this is the
#                structured-CoT fine-tune; the bundled template is the product
#                and the Quality numbers below were validated on it (#790).
#              • prefix caching ON (mamba-align) costs ~7% NARRATIVE decode vs
#                off — 67.5 vs 72.7 tok/s, same-sitting A/B 2026-07-27, n=5/arm;
#                code neutral (107.0 vs 109.1). The trade buys up to ~7.4x TTFT
#                on held-prefix agent lanes (#736). Narrative-heavy non-agent
#                serving: PREFIX_CACHE_ARG=--no-enable-prefix-caching restores
#                the 73/106 profile.
#              • ⚠️ MTP × hybrid-GDN wild write — vllm#50021, OPEN and LIVE IN THIS PIN.
#                The GDN spec-decode path builds a state-block index from an UNBOUNDED
#                accepted-token count; a zero/stale count dereferences a wild address →
#                `CUDA error: unspecified launch failure` + Xid 13/31 and a dead worker,
#                typically after minutes of agent-shaped traffic rather than at boot. Not
#                quant-, topology- or depth-specific: hit on Ampere+Ada (#758) and on
#                2× 5090 across NVFP4 AND W4A8 alike (#838). The vendored pr48375 fixes
#                vllm#43559 (corruption) and does NOT cover this fault.
#                MITIGATION: run the drafter off — SPEC_N=0. Lower n cuts
#                frequency, NOT exposure (#758 called n=3 stable; #838 crashed AT n=3). Clears when
#                #50021 merges and a pin bump inherits it — v0.26.0 PREDATES it.
#                Detail + re-test trigger: docs/UPSTREAM.md.
#   Quality:   8-pack 113/150 (75%) think-off · 120/150 (80%) think-on
#              (benchlocal --full, rebench thinkingcap-27b-20260721-0758) — TOPS the
#              Tess W4A16 (108/115) and Qwen fast-tier (109) on BOTH legs.
#   Best for:  ⭐ top-of-class 27B W4 quality (esp. reasoning) at Tess-tied speed —
#              67.5 narrative / 107 code tok/s (prefix-ON default; 72.7/109 with
#              prefix off), full 262K, on 2× 24 GB
# ---------------------------------------------------------------------------
# Dual-3090 W4A8 config. Derived from the Tess-4-27B LeaderboardModel1 W4A16 DUAL
# compose (same AutoRound family) — adapted to W4A8 (int8 activations). Single-card
# W4A8 tops out ~76K (18.5 GB weights+vision leave ~2.5 GB KV); TP=2 splits the
# weights so the full 262K KV pool fits, like Tess dual.
#
# W4A8 delivery: stock vLLM image, unmodified; two pure-Python source-patches run
# against the container's vLLM at boot (patches/w4a8/install.sh, registered in
# patches.yml). Recipe + measured deltas (+108% prefill single-card, +52% dual):
# see patches/w4a8/README.md.
#
# Run:
#   cd <repo>/models/thinkingcap-27b/vllm/compose
#   MODEL_DIR=<your-weights-dir> docker compose -f dual/w4a16/w4a8.yml up -d
# ===========================================================================
# Hardware metadata (parsed by scripts/preflight.sh):
# Requires-min-vram-gb: 24
# Engine-profile: vllm-stable
# Requires-min-gpu-count: 2
# Tensor-parallel: 2
services:
  vllm-thinkingcap-27b-dual-w4a8:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.27.1}
    container_name: "${ESTATE_CONTAINER:-vllm-thinkingcap-27b-dual-w4a8}"
    restart: ${CLUB3090_RESTART:-unless-stopped}
    ports:
      - "${BIND_HOST:-0.0.0.0}:${PORT:-8099}:8000"
    volumes:
      - ${MODEL_DIR:-../../../../../../models-cache}:/root/.cache/huggingface
      # W4A8 int8-activation patches (Bug A INC input_dtype + Bug B negscale fold) —
      # SHARED from the qwen3.6-27b tree (single source of truth, like pr48375);
      # run at boot via install.sh. Registered in patches.yml (qwen-w4a8-int8-act).
      - ../../../../../qwen3.6-27b/vllm/patches/w4a8-int8-act:/etc/club3090/w4a8:ro
      # Vendored vllm#48375 (MambaManager drop_eagle_block) — SHARED from the
      # qwen3.6-27b tree (same hybrid family). Makes MTP x prefix-caching safe;
      # inert if PREFIX_CACHE_ARG opts back out. See patches.yml + #736/#790.
      - ../../../../../qwen3.6-27b/vllm/patches/vllm-pr48375-mamba-drop-eagle-block:/etc/club3090/pr48375:ro
      - ../../../../../../scripts/detect_nvlink.sh:/etc/club3090/detect_nvlink.sh:ro
      - ../../../cache/torch_compile:/root/.cache/vllm/torch_compile_cache
      - ../../../cache/triton:/root/.triton/cache
    environment:
      # Drafter toggle — docker only forwards what is declared here. The DEFAULT
      # lives in the entrypoint, not in these lines, so it cannot drift.
      - SPEC_N=${SPEC_N:-}
      - SPEC=${SPEC:-}
      - VLLM_MARLIN_INPUT_DTYPE=int8
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - CUDA_VISIBLE_DEVICES
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - NVLINK_MODE=${NVLINK_MODE:-auto}
      # Opt-in transfer check: VLLM_SKIP_P2P_CHECK=0 makes vLLM PROVE peer access by
      # moving bytes (report.sh reads the cache). Bare passthrough — absent unless set.
      # docs/PCIE_P2P.md §7.
      - VLLM_SKIP_P2P_CHECK
      - NCCL_CUMEM_ENABLE=0
      - NCCL_P2P_DISABLE=${NCCL_P2P_DISABLE:-1}
      - VLLM_NO_USAGE_STATS=1
      - OMP_NUM_THREADS=1
      - PYTORCH_CUDA_ALLOC_CONF=${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - bash
      - -c
      - |
        set -e
        source /etc/club3090/detect_nvlink.sh
        bash /etc/club3090/w4a8/install.sh
        bash /etc/club3090/pr48375/install.sh || exit 1
        echo "[w4a8] VLLM_MARLIN_INPUT_DTYPE=$${VLLM_MARLIN_INPUT_DTYPE}"
        AR=""
        [ "$${_NVLINK_ENABLED:-0}" = "1" ] || AR="--disable-custom-all-reduce"
        # -- Drafter toggle: the same contract on every club-3090 compose --------
        #   SPEC_N=<n>  drafter depth (this compose defaults to 3); SPEC_N=0 disables
        #   SPEC=off    back-compat alias for SPEC_N=0
        # Turning the drafter off is the documented mitigation for vllm#50021 and must
        # never require editing this file. A non-numeric SPEC_N is a hard error, so a
        # typo can never masquerade as a silent "drafter off".
        _spec_n="$${SPEC_N:-3}"
        case "$${SPEC:-}" in off|OFF|Off|false|no|0) _spec_n=0 ;; esac
        case "$$_spec_n" in ""|*[!0-9]*)
          echo "[spec] SPEC_N='$$_spec_n' is not a non-negative integer." >&2
          echo "[spec] Fix: SPEC_N=<n> sets depth; SPEC_N=0 (or SPEC=off) disables." >&2
          exit 1 ;;
        esac
        SPEC_ARGS=()
        if [ "$$_spec_n" -gt 0 ]; then
          SPEC_ARGS=(--speculative-config "{\"method\":\"mtp\",\"num_speculative_tokens\":$$_spec_n}")
          echo "[spec] drafter ON - mtp n=$$_spec_n" >&2
        else
          echo "[spec] drafter OFF (SPEC_N=0 / SPEC=off) - no speculative decoding" >&2
        fi
        exec vllm serve $$AR "$$@" "$${SPEC_ARGS[@]}"
      - --
    command:
      - --model
      - /root/.cache/huggingface/thinkingcap-qwen3.6-27b-w4a16
      - --served-model-name
      - thinkingcap-27b
      - --quantization
      - auto_round
      - --dtype
      - bfloat16
      - --tensor-parallel-size
      - "2"
      - --max-model-len
      - "${MAX_MODEL_LEN:-262144}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.90}"
      - --max-num-seqs
      - "${MAX_NUM_SEQS:-8}"
      - --max-num-batched-tokens
      - "${MAX_NUM_BATCHED_TOKENS:-8192}"
      - --kv-cache-dtype
      - "${KV_CACHE_DTYPE:-fp8_e4m3}"
      - --trust-remote-code
      # Prefix caching ON by default (#736 parity, closes the #790 gap): safe
      # under MTP because the vllm#43559 fix (vllm#48375) is VENDORED here and
      # applied at boot. Opt out: PREFIX_CACHE_ARG=--no-enable-prefix-caching
      - "${PREFIX_CACHE_ARG:---enable-prefix-caching}"
      - --enable-chunked-prefill
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      # MTP (mtp_num_hidden_layers=1, mtp.fc@BF16 = working head, Tess recipe) is
      # added by the entrypoint from SPEC_N (SPEC_N=0 → no-spec) for the n-sweep.
      - --default-chat-template-kwargs
      - '{"enable_thinking": ${ENABLE_THINKING:-false}}'
      - --override-generation-config
      - '{"temperature":${TEMP:-0.6},"top_p":${TOP_P:-0.95},"top_k":${TOP_K:-20},"min_p":${MIN_P:-0.0}}'
      - --host
      - 0.0.0.0
      - --port
      - "8000"

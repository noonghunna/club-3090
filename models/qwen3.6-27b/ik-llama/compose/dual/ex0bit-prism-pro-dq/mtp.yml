# ===========================================================================
# Profile (at-a-glance):
#   Model:     Qwen3.6-27B-PRISM-PRO-DQ (Ex0bit dynamic-quant GGUF)
#   Engine:    ik_llama.cpp (ghcr.io/ikawrakow/ik-llama-cpp@sha256:5f914f1ccade922417af58c94bd1cbb558052c8852d86678ead3fe693eec0143)
#   Topology:  Dual 3090 (TP=2)
#   Drafter:   MTP n=4, p-min 0.0
#              Toggle: SPEC_N=<n> sets depth; SPEC_N=0 (or SPEC=off) disables
#              (removes the flags — n-max=0 would leave the draft context allocated)
#   KV:        q4_0 K + q4_0 V + -khad/-vhad Hadamard
#   Vision:    NO
#   Default ctx: 196608
#   Status:    🗑️ Deprecated
#   Caveats:   provider retired 2026-08-11 — Ex0bit quants removed from the rig to reclaim disk; weights no longer held locally and the slug has had no first-party validation since it was authored.
#              Registry entry is RETAINED (deprecated != deleted) so launch-compat
#              and pull-gate assertions on its hardware fields stay meaningful.
#   Best for:  Text-first dual-card PRISM serving when you want extra context
#              headroom without the multimodal overhead of the vision lane.
# ---------------------------------------------------------------------------
# Qwen3.6-27B-PRISM-PRO-DQ on ik_llama.cpp — dual 3090, text-only, native MTP.
#
# target: Ex0bit/Qwen3.6-27B-PRISM-PRO-DQ
#
# Override defaults via .env or shell:
#   MODEL_DIR              host dir to mount as /models  (default: ../../../../../../models-cache)
#   GGUF_FILE              path under /models  (default: qwen3.6-27b-gguf/ex0bit-prism-pro-dq/Qwen3.6-27B-PRISM-PRO-DQ.gguf)
#   CTX_SIZE               KV pool size        (default: 196608)
#   BATCH_SIZE             llama.cpp -b        (default: 1024)
#   UBATCH_SIZE            llama.cpp -ub       (default: 512)
#   NP                     parallel slots      (default: 1)
#   KV_TYPE                K and V quant type  (default: q4_0)
#   MTP_DRAFT_N_MAX        MTP draft tokens    (default: 4)
#   DRAFT_P_MIN            draft accept floor  (default: 0.0)
#   TENSOR_SPLIT           manual tensor split (default: 1,1)
#   REASONING              thinking gate       (default: off)
#   REASONING_FORMAT       reasoning routing   (default: deepseek)
#   PORT                   host port           (default: 8053)
#   CUDA_VISIBLE_DEVICES   which GPUs to use   (default: 0,1)

services:
  ik-llama-qwen36-27b-prism-pro-dq-dual:
    image: ${IK_LLAMA_IMAGE:-ghcr.io/ikawrakow/ik-llama-cpp@sha256:5f914f1ccade922417af58c94bd1cbb558052c8852d86678ead3fe693eec0143}
    container_name: "${ESTATE_CONTAINER:-ik-llama-qwen36-27b-prism-pro-dq-dual}"
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8053}}:8080"
    volumes:
      - "${MODEL_DIR:-../../../../../../models-cache}:/models:ro"
    environment:
      # Drafter toggle - docker forwards only what is declared here.
      - SPEC_N=${SPEC_N:-}
      - SPEC=${SPEC:-}
    # The image ENTRYPOINT is ["/app/llama-server"] on every engine we ship
    # (mainline, ik-llama, beellama, llamacpp-club3090 — all verified). This
    # wrapper is equivalent to it plus the drafter toggle.
    entrypoint:
      - /bin/bash
      - -c
      - |
        # -- Drafter toggle: the same contract on every club-3090 compose --------
        #   SPEC_N=<n>  drafter depth; SPEC_N=0 disables
        #   SPEC=off    back-compat alias for SPEC_N=0
        # Disabling REMOVES the drafter flags rather than passing n=0. At
        # --spec-draft-n-max 0 llama.cpp sets drafting=false but still builds the
        # draft context (server-context.cpp), and still loads an external draft
        # model when one is named -- so the memory stays spent. Removing the
        # flags is the only clean off. A non-numeric SPEC_N is a hard error, so a
        # typo can never masquerade as a silent "drafter off".
        _spec_n="$${SPEC_N:-1}"
        case "$${SPEC:-}" in off|OFF|Off|false|no|0) _spec_n=0 ;; esac
        case "$$_spec_n" in ""|*[!0-9]*)
          echo "[spec] SPEC_N='$$_spec_n' is not a non-negative integer." >&2
          echo "[spec] Fix: SPEC_N=<n> sets depth; SPEC_N=0 (or SPEC=off) disables." >&2
          exit 1 ;;
        esac
        if [ "$$_spec_n" -gt 0 ]; then
          echo "[spec] drafter ON (SPEC_N=$$_spec_n)" >&2
          exec /app/llama-server "$$@"
        fi
        ARGS=(); _skip=0
        for _a in "$$@"; do
          if [ "$$_skip" = 1 ]; then _skip=0; continue; fi
          case "$$_a" in
            --spec-type|--spec-draft-model|--spec-draft-n-max|--spec-draft-n-min|-md|--model-draft) _skip=1; continue ;;
          esac
          ARGS+=("$$_a")
        done
        echo "[spec] drafter OFF (SPEC_N=0 / SPEC=off) - drafter flags removed" >&2
        exec /app/llama-server "$${ARGS[@]}"
      - --
    command: >-
      --host 0.0.0.0
      --port 8080
      --model /models/${GGUF_FILE:-qwen3.6-27b-gguf/ex0bit-prism-pro-dq/Qwen3.6-27B-PRISM-PRO-DQ.gguf}
      --split-mode layer
      --tensor-split ${TENSOR_SPLIT:-1,1}
      -ngl 99
      --ctx-size ${CTX_SIZE:-196608}
      -b ${BATCH_SIZE:-1024}
      -ub ${UBATCH_SIZE:-512}
      -np ${NP:-1}
      -ctk ${KV_TYPE:-q4_0}
      -ctv ${KV_TYPE:-q4_0}
      -khad
      -vhad
      -ngld 99
      --spec-type mtp:n_max=${SPEC_N:-${MTP_DRAFT_N_MAX:-4}},p_min=${DRAFT_P_MIN:-0.0}
      --recurrent-ckpt-mode auto
      --merge-qkv
      -fa on
      --jinja
      --parallel-tool-calls
      --reasoning ${REASONING:-off}
      --reasoning-format ${REASONING_FORMAT:-deepseek}
      --temp ${TEMP:-${TEMPERATURE:-0.6}}
      --top-p ${TOP_P:-0.95}
      --top-k ${TOP_K:-20}
      --min-p ${MIN_P:-0.0}
      --repeat-penalty ${REPEAT_PENALTY:-1.0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ESTATE_GPUS:-${CUDA_VISIBLE_DEVICES:-0,1}}"]
              capabilities: [gpu]

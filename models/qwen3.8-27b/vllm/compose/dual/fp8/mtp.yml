# ===========================================================================
# Profile (at-a-glance):
#   Model:     Qwen3.8-27B FP8 (official Qwen/Qwen3.8-27B-FP8 — e4m3, dynamic
#              activation scale, 128x128 weight blocks; embedded mtp.* head)
#   Topology:  Dual 3090 PCIe (TP=2, no NVLink; NVLink auto-detected via NVLINK_MODE)
#   Drafter:   MTP n=3 (built-in — the checkpoint ships mtp.safetensors and
#              text_config.mtp_num_hidden_layers=1). SPEC=off disables it.
#              Toggle: SPEC_N=<n> sets depth; SPEC_N=0 (or SPEC=off) disables
#   KV:        fp8 -> e4m3 (1 byte/token/elem; runs at scale=1.0 — the checkpoint
#              is weight-only, no k_scale/v_scale tensors, and vLLM disables
#              calculate_kv_scales on this hybrid family). NOT fp8_e5m2 — that is
#              hard-rejected against an fp8 checkpoint. See "KV choice" below.
#   Vision:    ✅ WORKING — image + video INPUT, no extra flags (measured 2026-08-16).
#              INPUT ONLY: it consumes media and emits TEXT. No image/video
#              generation — the arch has no VAE/UNet/diffusion head.
#              Image: colour+layout described correctly at temp 0 (red/blue/green
#              discriminated, ~66-70 prompt tokens). Video: 3.25s clip, correct
#              temporal order + the blended transition frame. Smoke test only —
#              no vision quality gate, no resolution/duration limits explored.
#              Video cost ~72.7 tok/s @256x256 (36 tok/frame at default fps=2),
#              scaling with pixel count: 23 @128px, 263 @512px, 583 @768px.
#              So ~61 min of 256x256 video fits the 262144 window; ~17 min @512px.
#   Template:  native — the repo's own chat_template.jinja. NOT froggeric.
#              ⚠️ This is a deliberate break from the qwen3.6-27b composes; see
#              "Chat template" below. The 3.8 template is a DIFFERENT program.
#   Max ctx:   262144 — the architectural ceiling (text_config.max_position_embeddings).
#              COMPUTED to fit + inherited from the byte-for-byte-comparable
#              qwen3.6-27b FP8 tier. NEVER MEASURED HERE. See "Context budget".
#   Genesis:   none — intentionally Genesis-free
#   Status:    🧪 Experimental
# ⚠️ #1096 (accumulated-ctx decode cliff): in long multi-turn agentic, decode collapses to
#    single-block emission — ~12k accumulated ctx for DFlash2 (SPEC_N depth does NOT move it,
#    n=3≡n=7) / ~17-21k for MTP; SEVERE on Ampere (~4 tok/s), milder on Blackwell. Drafter TYPE,
#    not depth, sets the floor. Interim: MTP tier (higher cliff) or SPEC_N=0 for sustained >~20k.
#    Real fix pending upstream ReplaySSM (vllm#49887 GDN-spec / vllm#50172). NOT immune to this.
#   Caveats:   ✅ BOOTED + verify-full PASS on the reference rig (2× 3090) 2026-08-17.
#              Promoted 🐣 → 🧪 per this compose's own gate ("clean boot + verify-full").
#              MEASURED 2026-08-17, stock vllm/vllm-openai:v0.27.1, 3 warm + 5 measured:
#                - decode 67.39 narr (CV 1.5%) / 85.75 code (CV 3.5%) tok/s
#                - TTFT 152 ms · prefill 1165.8 @10K / 941.5 @90K tok/s
#                - KV pool 270,930 tok @262144 (1.03× concurrency) · VRAM peak
#                  45,816 MiB total (~22.4 GiB/card) · MTP acceptance 2.62 at n=3
#              ⚠️ STILL UNGATED for ⚠️/✅ — do NOT promote further without:
#                - verify-stress / NIAH fill depth (262144 is ALLOCATED, not filled;
#                  the 3.6 sibling fills to ~240K of its 262K — expect the same or worse)
#                - soak-continuous, and an 8-pack in either reasoning mode
#              ⚠️ MTP exposed to OPEN vllm#50021 (GDN spec-decode wild write, live in
#              this pin). Now that it HAS run, absence of a crash in one bench is not
#              evidence of safety — the exposure is structural. Mitigate with SPEC=off.
#                  There is deliberately NO `Quality:` field on this compose —
#                  the qwen3.6 tier's 109/150 is ITS number, not this model's.
#                - Max ctx 262144 is ARITHMETIC + a sibling analogy, never filled.
#                  Allocating a context is not filling it: the qwen3.6-27b FP8 dual,
#                  same growing-attention geometry and same weight footprint,
#                  NIAH-fills to ~240K of its allocated 262K. Expect a comparable
#                  or worse gap here until a ladder proves otherwise.
#                - ENGINE COMPATIBILITY: ⚠️ the "pin predates the model" concern is
#                  GONE as of the v0.27.1 bump — Qwen3.8-27B published 2026-08-05,
#                  v0.27.1 on 2026-08-11 — and sibling qwen3.8 slugs (dual-fast,
#                  dual-nvfp4) BOOT on it, verify-full 9/9. What is still unproven is
#                  THESE fp8 slugs, which have never booted on any pin. The Qwen3_5ForConditionalGeneration arch IS served on this
#                  pin (qwen3.6-27b FP8, Tess-4-27B), and the quantization_config is
#                  byte-shaped identically to qwen3.6-27b-FP8 — but "should load" is
#                  an inference, not an observation.
#                - MTP head present in the checkpoint != MTP head works. Accept rate
#                  is unmeasured. On the 35B-A3B MoE sibling the BUILT-IN head is
#                  net-negative (-51%) while an external drafter is +49%, so a
#                  present head is not a free win. SPEC=off if it misbehaves.
#                - vision: tower is in the checkpoint, but no image/video request
#                  has ever been served. Treat as text-only until proven.
#              • ⚠️ MTP × hybrid-GDN wild write — vllm#50021, OPEN and LIVE IN THIS PIN.
#                Inherited exposure, not a new one: Qwen3.8-27B is the same
#                Qwen3-Next/DeltaNet hybrid-GDN family as qwen3.6-27b and Tess-4-27B,
#                and the fault is an UNBOUNDED index in the shared GDN spec-decode
#                path — it is quant-, topology- and depth-independent. See
#                "Upstream-risk" below and the docs/UPSTREAM.md row.
#              Promote to 🧪 only after a clean boot + verify-full; to ⚠️/✅ only
#              after the full gate (verify-stress + bench + soak + quality).
#   Upstream-risk:  • ⚠️ MTP × hybrid-GDN wild write — TWO faults share this signature:
#                one is PATCHED here, one (vllm#50021) is STILL LIVE IN THIS PIN.
#                Symptom: `CUDA error: unspecified launch failure` / Xid 13/31 and a dead
#                worker, after minutes of agent-shaped traffic rather than at boot. Not
#                quant-, topology- or depth-specific: hit on Ampere+Ada and on 2× 5090
#                across NVFP4 AND W4A8 alike. The vendored pr48375 fixes vllm#43559
#                (corruption) and does NOT cover this fault.
#                ⚠️ CONFIRMED IN PRODUCTION 2026-08-19 (@alexpolo1 #1059): crashed once on
#                THIS slug (2× 3090, MTP n=3, 44 h uptime, from a HEALTHY state) — Xid 31
#                VIRT_WRITE both cards. ⚠️ That boot was UNPATCHED: the fix below landed
#                2026-08-23 (#1091), two days after the field report.
#                Async scheduling is AUTO-ON for MTP here ('mtp' ∈ EagleModelTypes → the
#                disable-guard doesn't fire, no warning), so the shipped combo is
#                MTP + prefix-cache + async — the #1052 combo.
#                ⚠️ TWO DISTINCT FAULTS share this signature — do not treat them as one:
#                (a) a CROSS-STREAM RACE in `synchronize_input_prep`: the next step's
#                    `_update_states` block-table mutation raced the still-in-flight
#                    spec-decode postprocess → stale state-block index → wild write.
#                    ✅ PATCHED HERE by `vllm-gdn-mtp-async-spec-order` (OURS, not
#                    upstream), mounted + installed by the entrypoint before serve;
#                    anchor drift makes the container REFUSE TO BOOT rather than serve
#                    unpatched. Evidence: async-ON survived 3/3 boots to 33–36k generated
#                    tokens (crossing ctx 32k + a compaction) where 5/5 unpatched arms
#                    died at 6–13k; TPS neutral.
#                (b) vllm#50021's UNBOUNDED `num_accepted`-derived index (Site 1,
#                    `…/flash_linear_attention/ops/fused_sigmoid_gating.py:106`, re-verified
#                    byte-identical on v0.27.1 2026-08-16). 🔴 STILL LIVE — open upstream,
#                    NOT vendored. Our patch does NOT bound this index.
#                ⚠️ CORRECTION (this block previously said otherwise): #50021 does NOT fix
#                (a) — its in-kernel bounds were built and crashed 2/2. So a #50021 merge +
#                pin bump clears (b) only, and never cleared (a). Conversely the shipped
#                patch closes (a) and leaves (b) exposed. #1059's signature is consistent
#                with EITHER; its attribution between them is NOT established.
#                RESIDUAL — why this stays a caveat: (b) is unfixed; the fix for (a) is
#                OURS, validated on the reference 2× 3090 only and NOT community-blessed;
#                33–36k generated tokens is not the 44 h of production traffic that
#                surfaced #1059; and neither addresses the separate acceptance-collapse
#                bug (vllm#52873 / Bug A).
#                FALLBACKS if it recurs: (1) ASYNC_SCHED=off (--no-async-scheduling) — keeps
#                the drafter, wired 2026-09-02 (#1139, thanks @metaoutfitter; it was header
#                prose only before that). Note it avoids (a) AND removes the async trigger
#                path, but does not bound (b). (2) SPEC=off — drops the drafter, avoiding
#                both. Lower n cuts frequency NOT exposure (crashed AT n=3).
#                Full detail, evidence stack + re-test trigger: docs/UPSTREAM.md.
#   Best for:  max-weight-fidelity Qwen3.8-27B on 2 cards, and the on-rig proxy for
#              the 4-card vllm/qwen38-27b-multi4-max. NOT yet recommendable for
#              anything — see Caveats.
# ---------------------------------------------------------------------------
# Siblings: 5 slugs for this model (2 llama.cpp, 3 vLLM) — see
# `switch.sh --list --all` or the registry. ⚠️ This dual is NOT a clean proxy
# for the multis: since 2026-08-15 they run bf16 KV and this runs fp8 e4m3, so
# pool size / concurrency / KV-sensitive results do not transfer. Rationale in
# the registry status_note (not duplicated here).
# ---------------------------------------------------------------------------
# ARCHITECTURE (read from THIS checkpoint's config.json, 2026-08-14):
#   architectures: ["Qwen3_5ForConditionalGeneration"], model_type: qwen3_5,
#   text_config.model_type: qwen3_5_text.
#
#   ⚠️ HYBRID ATTENTION, not uniform GQA. 64 layers with
#   `full_attention_interval: 4`, and `layer_types` in this repo is already
#   EXPANDED and counts exactly 16 `full_attention` + 48 `linear_attention`
#   (DeltaNet-style recurrent) — i.e. only 16 layers grow KV. Naive 64-layer KV
#   math overestimates the pool ~4x. Same trap as qwen3.6-27b / Tess-4-27B.
#
#   NOT MoE. `config.json` carries no num_experts, and reading the tensor table
#   of layers-0.safetensors directly shows a dense FFN (mlp.gate_proj /
#   up_proj / down_proj, intermediate 17408) — no expert tensors at all.
#   ⚠️ Do NOT be misled by `quantization_config.modules_to_not_convert`, which
#   lists `mlp.gate` and `mlp.shared_expert_gate` per layer: those names are
#   export-template artifacts; no such tensors exist in the checkpoint.
#
#   Geometry (text_config): hidden 5120 · 24 attn heads · 4 KV heads ·
#   head_dim 256 · intermediate 17408 · vocab 248320 · max_position 262144 ·
#   tie_word_embeddings false · linear_num_key_heads 16 / value_heads 48 /
#   key+value_head_dim 128 / conv_kernel_dim 4 · mtp_num_hidden_layers 1.
#
#   ⭐ Every one of those fields is IDENTICAL to qwen3.6-27b-FP8 (verified field
#   by field on-disk, same date). That is what licenses reusing the qwen3.6 dual
#   "max" tier's shape here — it is an architectural analogy, NOT a measurement.
#
# QUANTIZATION (quantization_config, this checkpoint):
#   quant_method fp8 · fmt e4m3 · activation_scheme dynamic ·
#   weight_block_size [128, 128] (block-wise FP8, `weight_scale_inv` tensors) ·
#   modules_to_not_convert covers every `visual.blocks.*` (the vision tower is
#   NOT quantized) plus lm_head / embed_tokens / all norms / the linear_attn
#   in_proj_a|b|ba, A_log, dt_bias, conv1d, and the mtp.* norms.
#   ⭐ This is the SAME quantization_config shape as qwen3.6-27b-FP8 (fp8 /
#   e4m3 / dynamic / [128,128]) — the checkpoint that already loads on this exact
#   pin and rig. Load-path risk is therefore low; it is still not zero.
#
# ⚠️ AMPERE REALITY — FP8 WEIGHTS ARE A MEMORY WIN, NOT A DECODE WIN:
#   RTX 3090 is Ampere sm_86 and has NO native FP8 compute. There is no FP8 math
#   on this rig. vLLM serves these weights weight-only through the Marlin FP8
#   kernel (W8A16: weights stay 8-bit in VRAM, the GEMM runs at 16-bit), so what
#   FP8 buys here is the ~31 GB footprint and the fidelity of an 8-bit checkpoint
#   — NOT throughput. Do not read "FP8" as "faster" on this hardware. On Ada /
#   Hopper / consumer Blackwell the native FP8 GEMM path is real (the launchers
#   inject VLLM_USE_DEEP_GEMM=0 on sm_120/121, where DeepGEMM has no recipe).
#
# CONTEXT BUDGET (COMPUTED — no boot has confirmed it):
#   KV over the 16 GROWING layers only (not 64), K+V separate — docs/KV_MATH.md:
#     16 x 4 kv_heads x 256 head_dim x 2 = 32,768 elems/token; fp8 = 32,768 B/token
#     -> 262,144 ctx = 8.00 GiB total = 4.00 GiB/card at TP=2
#   Weights 28.75 GiB (~14.4 GiB/card at TP=2). ⚠️ UNIT TRAP: the HF page quotes
#   DECIMAL GB (30.87); the VRAM-relevant GiB figure is ~7% smaller. Download
#   provenance + CRC32 status: the model profile. Why 262144 is the right ship:
#   the registry status_note.
#   ⚠️ Margin is tight and unverified — the first boot is the test. If it OOMs at
#   KV init the levers in order are MAX_MODEL_LEN=196608 -> GPU_MEMORY_UTILIZATION
#   -> MAX_NUM_BATCHED_TOKENS=4096.
#   ⚠️ tools/kv-calc.py cannot model this hybrid (kvcalc_key="SKIP") — no
#   prediction row, and don't add one without a real boot log.
#
#   YARN NOT TAKEN. The card documents a YaRN extension to 1M
#   (VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 + an --hf-overrides rope block). Measured
#   2026-08-16: at factor 4.0 (1,048,576) KV alone is 32.00 GiB = 16.00 GiB/card
#   at TP=2, which with weights is 25.12 GiB/card — over a 24 GB card BEFORE
#   cudagraphs/activations. It fits only at TP>=4 (12.56 GiB/card) — and KV heads
#   REPLICATE past TP=4, so TP=8 buys weights, not context. 262144 is where the
#   VRAM stops, not where the model stops.
#
# KV CHOICE — why `fp8` and specifically why NOT `fp8_e5m2`:
#   `--kv-cache-dtype fp8` resolves to e4m3 and routes attention to FlashInfer.
#   ⚠️ `fp8_e5m2` is HARD-REJECTED against an fp8 checkpoint
#   (`ValueError: fp8_e5m2 kv-cache is not supported with fp8 checkpoints`).
#   Do not "simplify" this to e5m2.
#   The KV runs at scale=1.0: the checkpoint is weight-only (no k_scale/v_scale
#   tensors) and vLLM disables calculate_kv_scales on Qwen3-Next hybrids because
#   the GDN recurrent state makes warmup scales unreliable. e4m3's exponent range
#   tolerates that. ⚠️ On qwen3.6-27b that regime measured quality-NEUTRAL (an
#   8-pack tie vs int8-PTH). THAT IS A QWEN3.6 MEASUREMENT. It is unmeasured here.
#   int8-PTH is deliberately not offered: it is confined to the TRITON_ATTN
#   backend, whose single-stream decode craters with depth on this family.
#
# CHAT TEMPLATE — native, NOT froggeric (deliberate deviation):
#   The qwen3.6-27b and Tess-4-27B vLLM composes pin the vendored froggeric
#   template because THEIR repo templates are broken. This compose does NOT, and
#   must not, inherit that: Qwen3.8's own chat_template.jinja is a materially
#   different program from Qwen3.6's, and the froggeric file is a fork of the 3.6
#   one. Diffed on-disk 2026-08-14, the 3.8 template adds:
#     - a `reasoning_effort` knob (xhigh | medium | low, default xhigh) that
#       INJECTS a reasoning-effort system preamble whenever thinking is on, and
#       raise_exception()s on any other value;
#     - a `preserve_thinking` default flip (3.6: preserve only when explicitly
#       set or after the last query; 3.8: preserve unless explicitly disabled);
#     - it no longer splits `<think>` out of `content` as a fallback.
#   Mounting the 3.6/froggeric template here would silently delete all of that.
#   The tool-call surface is UNCHANGED between the two (the same
#   `<tool_call><function=…><parameter=…>` XML), which is why
#   `--tool-call-parser qwen3_coder` still applies; and thinking is still
#   `<think>…</think>`, so `--reasoning-parser qwen3` still applies.
#   ⚠️ NOT AUDITED: the 3.8 template has not been checked against the 7 default-
#   template bugs froggeric fixes for 3.6 (empty <think></think> spam,
#   </thinking> hallucination, unclosed think before a tool call, no-user-query
#   crash, developer role, …). If those symptoms show up, that audit — not a
#   blind froggeric mount — is the next step.
#   Note the stack-wide `enable_thinking: true` default below ALSO suppresses
#   the xhigh reasoning-effort preamble, since the template gates it on thinking.
#
# Dependencies:
#   - 2x RTX 3090 (Ampere SM 8.6), PCIe-only (no NVLink — fine; auto-detected
#     at boot via NVLINK_MODE if a rig has it)
#   - vLLM STABLE image — the version of record lives in the `vllm-stable`
#     engine profile's install.spec (#254); the launchers INJECT it over the
#     compose default below, so bump the profile, not this line.
#   - The vendored vllm#48375 install script, shared from the qwen3.6-27b tree
#     (same hybrid family) — see the volumes block + patches.yml.
#
# PORT — 8091, NOT the 8088 you would expect from the 8087/8090 GGUF siblings.
#   8088 is SearXNG and 8090 is the AI-Studio director: both are ALWAYS-ON
#   support services on the reference rig (docs/ARCHITECTURE.md "Services"), so
#   a slug parked there collides at boot with something that is already
#   listening. 8091/8092 were checked free three ways — unused in
#   compose_registry.py, unbound in `ss -ltn`, and unclaimed by services/ and
#   the AI-Studio docs. Check the same three before moving this again: a free
#   registry slot is NOT the same as a free host port.
#
# Override defaults via .env or shell:
#   MODEL_DIR / PORT / TP / PP / MAX_MODEL_LEN / GPU_MEMORY_UTILIZATION /
#   MAX_NUM_BATCHED_TOKENS / KV_CACHE_DTYPE / PREFIX_CACHE_ARG /
#   TEMP TOP_P TOP_K MIN_P PRESENCE_PENALTY REPEAT_PENALTY
#   SPEC=off                    -> drop the MTP drafter (vllm#50021 mitigation 2)
#   ASYNC_SCHED=off             -> --no-async-scheduling: vllm#50021 mitigation 1,
#                                  keeps the drafter (measured 2026-09-02: ~0% cost)
#   VLLM_USE_FLASHINFER_SAMPLER -> default 0 here; see the env block note
#
# SAMPLER — follows the Qwen3.8-27B MODEL CARD, not the stack's Qwen3.6 defaults.
#   The card publishes TWO rows, one per reasoning mode:
#     Thinking mode:  temp 1.0, top_p 0.95, top_k 20, min_p 0.0,
#                     presence_penalty 0.0, repetition_penalty 1.0
#     Instruct mode:  temp 0.7, top_p 0.80, top_k 20, min_p 0.0,
#                     presence_penalty 1.5, repetition_penalty 1.0
#   This compose ships thinking OFF (the stack-wide default), so its DEFAULT is
#   the INSTRUCT row — but the sampler now FOLLOWS the reasoning flag: the
#   entrypoint derives the card row from ENABLE_THINKING at boot (#1014), so the
#   mode and the sampler can no longer mismatch silently.
#
# ⭐ THINKING MODE — one variable now:
#     ENABLE_THINKING=true bash scripts/switch.sh --force vllm/qwen38-27b-dual-max
#   selects the card's THINKING row (temp 1.0 / top_p 0.95 / presence 0.0). An
#   explicit TEMP / TOP_P / PRESENCE_PENALTY still beats both rows (`:=`
#   defaults in the entrypoint); top_k 20 / min_p 0.0 / repetition_penalty 1.0
#   are identical across rows and stay mode-independent. Per-request thinking
#   needs none of this — send chat_template_kwargs {"enable_thinking": true}
#   plus a per-request sampler; --reasoning-parser qwen3 is already on, so
#   <think> is routed to reasoning_content either way.
#   ⚠️ History: this used to demand the four-variable ritual
#   (ENABLE_THINKING=true TEMP=1.0 TOP_P=0.95 PRESENCE_PENALTY=0.0) because
#   compose interpolation has no if/else. The fix (#984/#1014) moved the choice
#   into the ENTRYPOINT, where bash exists — discussion #993's four-variable
#   instructions are obsolete for this model.
#   ⚠️ This deviates from every other Qwen compose on the stack (which ship
#   temp 0.6 / top_p 0.95 / no presence_penalty, tuned on Qwen3.6). Deliberate:
#   the card is the ONLY evidence that exists for this model, and nothing has
#   been A/B'd here. Revisit once there is a real sampler sweep.
#   ⚠️ SERVING defaults only — scripts/bench.sh sends its own fixed canonical
#   sampler explicitly, so BENCHMARKS rows stay cross-engine comparable.
#
# Quick start (weights first):
#   WEIGHT_KEY=qwen3.8-27b:fp8 bash scripts/setup.sh qwen3.8-27b
#   bash scripts/switch.sh --force vllm/qwen38-27b-dual-max
#   (--force is REQUIRED: 🐣 Incubating slugs are launch-gated and hidden from
#    `switch.sh --list`; reveal with `--list --all`.)
#
# Run (direct docker):
#   cd <repo>/models/qwen3.8-27b/vllm/compose
#   docker compose -f dual/fp8/mtp.yml up -d
# ===========================================================================
# Hardware metadata (parsed by scripts/preflight.sh):
# Requires-min-vram-gb: 24
# Engine-profile: vllm-stable
# Requires-min-gpu-count: 2
# Tensor-parallel: 2
services:
  vllm-qwen38-27b-dual-max:
    # Pinned to a vLLM STABLE release (immutable — never purged, unlike
    # nightlies; the #407 pin-drift fix). The launchers resolve the real image
    # from the `vllm-stable` engine profile and inject it over this default,
    # so this literal only bites a raw `docker compose` invocation (#254).
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.27.1}
    container_name: "${ESTATE_CONTAINER:-vllm-qwen38-27b-dual-max}"
    user: "0:${DOCKER_GID:-1000}"
    restart: ${CLUB3090_RESTART:-unless-stopped}
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8091}}:8000"
    volumes:
      - ${MODEL_DIR:-../../../../../../models-cache}:/root/.cache/huggingface
      # torch.compile + Triton kernel caches — first boot warms (~60-90 sec);
      # subsequent boots reuse the compiled graphs.
      - ../../../cache/torch_compile:/root/.cache/vllm/torch_compile_cache
      - ../../../cache/triton:/root/.triton/cache
      # NO chat-template mount. This model serves its OWN chat_template.jinja
      # from the model dir — see "Chat template" in the header for why the
      # froggeric override that the qwen3.6/Tess composes carry is WRONG here.
      # NVLink auto-detection — runs inside the container at boot.
      - ../../../../../../scripts/detect_nvlink.sh:/etc/club3090/detect_nvlink.sh:ro
      # Vendored vllm#48375 (MambaManager drop_eagle_block) — SHARED from the
      # qwen3.6-27b tree (same Qwen3-Next hybrid family), exactly as the
      # Tess-4-27B compose shares it. Load-bearing because this compose ships
      # BOTH MTP and prefix caching, which is the pair vllm#43559 corrupts.
      # Anchor drift => the install script REFUSES the boot rather than
      # half-wiring it. See patches.yml.
      - ../../../../../qwen3.6-27b/vllm/patches/vllm-pr48375-mamba-drop-eagle-block:/etc/club3090/pr48375:ro
      - ../../../../../qwen3.6-27b/vllm/patches/vllm-gdn-mtp-async-spec-order:/etc/club3090/gdn-async-order:ro
      - ../../../patches/vllm-flashinfer-decode-pin:/etc/club3090/flashinfer-decode-pin:ro
    environment:
      # Drafter toggle — docker only forwards what is declared here. The DEFAULT
      # lives in the entrypoint, not in these lines, so it cannot drift.
      - SPEC_N=${SPEC_N:-}
      - SPEC=${SPEC:-}
      - ASYNC_SCHED=${ASYNC_SCHED:-}
      # Sampler env passthrough (#984/#1014): the ENTRYPOINT — not compose
      # interpolation, which has no if/else — derives --override-generation-config
      # from the model-card row matching ENABLE_THINKING, so these must reach the
      # container. Absent -> empty -> the entrypoint's `:=` row default applies;
      # an explicit value crosses unchanged and still wins over both rows.
      - ENABLE_THINKING=${ENABLE_THINKING:-true}
      - TEMP=${TEMP:-}
      - TEMPERATURE=${TEMPERATURE:-}
      - TOP_P=${TOP_P:-}
      - TOP_K=${TOP_K:-}
      - MIN_P=${MIN_P:-}
      - PRESENCE_PENALTY=${PRESENCE_PENALTY:-}
      - REPEAT_PENALTY=${REPEAT_PENALTY:-}
      - NVIDIA_VISIBLE_DEVICES=${ESTATE_GPUS:-${NVIDIA_VISIBLE_DEVICES:-all}}
      # CUDA-level GPU mask — the runtime-agnostic half of GPU selection (#610).
      # CDI runtimes (NixOS, nvidia-ctk cdi) IGNORE NVIDIA_VISIBLE_DEVICES, so
      # this is what actually pins cards there. Unset => absent (no masking).
      - CUDA_VISIBLE_DEVICES
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-${OFFLINE:-0}}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-${OFFLINE:-0}}
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - NVLINK_MODE=${NVLINK_MODE:-auto}
      # Opt-in transfer check: VLLM_SKIP_P2P_CHECK=0 makes vLLM PROVE peer access
      # by moving bytes. Bare passthrough — absent unless set. docs/PCIE_P2P.md §7.
      - VLLM_SKIP_P2P_CHECK
      # CUDA-graph kill switch (Cliff-2 GDN spike mitigation). Bare passthrough —
      # absent unless set. ⚠️ It was READ by the entrypoint but never DECLARED, so
      # `$${VLLM_ENFORCE_EAGER:+--enforce-eager}` always expanded to nothing and the
      # knob could not be turned on at all. Fixed 2026-08-31.
      - VLLM_ENFORCE_EAGER
      - NCCL_CUMEM_ENABLE=0
      # Safe PCIe-only default (the reference rig has no NVLink and no working
      # P2P). Rigs with proven working P2P set NCCL_P2P_DISABLE=0.
      - NCCL_P2P_DISABLE=${NCCL_P2P_DISABLE:-1}
      - VLLM_NO_USAGE_STATS=1
      # FlashInfer sampler OFF by default, but env-overridable (the qwen3.6
      # composes hardcode it, and they disagree with each other: their dual sets
      # 0, their multi4 sets 1). The reason to default 0 is MECHANISM, not a
      # measurement on this model: with MTP active, sampling routes through the
      # rejection-sampler path where the FlashInfer kernel adds overhead rather
      # than removing it, and it also trims sampler workspace, which is
      # load-bearing on a 24 GB card at 262K. ⚠️ The -3.0% narrative / -1.7% code
      # that justified this on qwen3.6-27b is a QWEN3.6 measurement. Nothing has
      # been benched on 3.8 — re-run the A/B before treating 0 as tuned.
      - VLLM_USE_FLASHINFER_SAMPLER=${VLLM_USE_FLASHINFER_SAMPLER:-0}
      - OMP_NUM_THREADS=1
      # DeepGEMM (vLLM's fp8-GEMM path) is built for Hopper (sm_90) + datacenter
      # Blackwell. Consumer Blackwell (5090 / PRO 6000 / GB10, sm_120/121) has no
      # recipe and hard-fails "recipe not found" at boot (disc #571).
      # switch.sh/launch.sh auto-inject VLLM_USE_DEEP_GEMM=0 there; a raw
      # `docker compose` user on those cards must set it. Unset = vLLM's arch
      # default. Irrelevant on the Ampere reference rig (no FP8 compute at all).
      - VLLM_USE_DEEP_GEMM
      # SPEC=off drops the built-in MTP drafter at boot. This is the documented
      # mitigation for vllm#50021 (see the Caveats / Upstream-risk header) and
      # the fallback if the head turns out net-negative on this model, as the
      # built-in head is on the 35B-A3B MoE sibling. Bare passthrough; default on.
      # expandable_segments:True crashes boot on some setups (cuMemMap path):
      # known on NVLink rigs and WSL2/WDDM. Override via .env:
      # PYTORCH_CUDA_ALLOC_CONF=expandable_segments:False
      - PYTORCH_CUDA_ALLOC_CONF=${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True,max_split_size_mb:512}
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - bash
      - -c
      - |
        umask 0002
        # VLLM_ENFORCE_EAGER=1 in .env disables CUDA graphs — the mitigation if
        # you see mid-generation hangs at depth on this hybrid family. Costs
        # ~20-30% TPS in exchange for stability. UNTESTED on this model.
        # NVLink auto-detection (sets NCCL env vars, _NVLINK_ENABLED).
        source /etc/club3090/detect_nvlink.sh
        bash /etc/club3090/pr48375/install.sh || exit 1
        bash /etc/club3090/gdn-async-order/install.sh || exit 1
        FI_PINQ_LIB_ALL="${FI_PINQ_LIB_ALL:-0}" bash /etc/club3090/flashinfer-decode-pin/install.sh || exit 1
        # -- Drafter toggle: the same contract on every club-3090 compose --------
        #   SPEC_N=<n>  drafter depth (this compose defaults to 3); SPEC_N=0 disables
        #   SPEC=off    back-compat alias for SPEC_N=0
        # Turning the drafter off is the documented mitigation for vllm#50021 and must
        # never require editing this file. A non-numeric SPEC_N is a hard error, so a
        # typo can never masquerade as a silent "drafter off".
        _spec_n="$${SPEC_N:-3}"
        case "$${SPEC:-}" in off|OFF|Off|false|no|0) _spec_n=0 ;; esac
        case "$$_spec_n" in ""|*[!0-9]*)
          echo "[spec] SPEC_N='$$_spec_n' is not a non-negative integer." >&2
          echo "[spec] Fix: SPEC_N=<n> sets depth; SPEC_N=0 (or SPEC=off) disables." >&2
          exit 1 ;;
        esac
        SPEC_ARGS=()
        if [ "$$_spec_n" -gt 0 ]; then
          SPEC_ARGS=(--speculative-config "{\"method\":\"mtp\",\"num_speculative_tokens\":$$_spec_n}")
          echo "[spec] drafter ON - mtp n=$$_spec_n" >&2
        else
          echo "[spec] drafter OFF (SPEC_N=0 / SPEC=off) - no speculative decoding" >&2
        fi
        # -- Async-scheduling toggle: vllm#50021 mitigation (1) from the header --
        #   ASYNC_SCHED=off -> --no-async-scheduling. Keeps the drafter; closes the
        #   MTP + prefix-cache + async combo that produced the 2026-08-19 Xid 31.
        ASYNC_ARGS=()
        case "$${ASYNC_SCHED:-}" in off|OFF|Off|false|no|0)
          ASYNC_ARGS=(--no-async-scheduling)
          echo "[async] async scheduling OFF (ASYNC_SCHED=off) - vllm#50021 mitigation, drafter kept" >&2 ;;
        esac
        # -- Sampler follows the reasoning mode ----------------------------------
        # The card publishes TWO sampler rows (see "SAMPLER" in the header);
        # ENABLE_THINKING now selects the row — one variable instead of the
        # four-variable ritual (#1014). `:=` defaults: an explicit TEMP /
        # TOP_P / PRESENCE_PENALTY from .env or shell STILL WINS in both
        # branches. top_k / min_p / repetition_penalty are identical across the
        # rows and stay mode-independent.
        _temp="$${TEMP:-$${TEMPERATURE:-}}"
        if [ "$${ENABLE_THINKING:-true}" = "true" ]; then
          : "$${_temp:=1.0}" "$${TOP_P:=0.95}" "$${PRESENCE_PENALTY:=0.0}"
          echo "[sampler] thinking row (ENABLE_THINKING=true): temp=$$_temp top_p=$${TOP_P} presence=$${PRESENCE_PENALTY}" >&2
        else
          : "$${_temp:=0.7}" "$${TOP_P:=0.80}" "$${PRESENCE_PENALTY:=1.5}"
          echo "[sampler] instruct row (default): temp=$$_temp top_p=$${TOP_P} presence=$${PRESENCE_PENALTY}" >&2
        fi
        SAMPLER_ARGS=(--override-generation-config "{\"temperature\":$$_temp,\"top_p\":$${TOP_P},\"top_k\":$${TOP_K:-20},\"min_p\":$${MIN_P:-0.0},\"presence_penalty\":$${PRESENCE_PENALTY},\"repetition_penalty\":$${REPEAT_PENALTY:-1.0}}")
        if [ "$${_NVLINK_ENABLED:-0}" = "1" ]; then
          exec vllm serve $${VLLM_ENFORCE_EAGER:+--enforce-eager} "$$@" "$${SPEC_ARGS[@]}" "$${ASYNC_ARGS[@]}" "$${SAMPLER_ARGS[@]}"
        else
          exec vllm serve $${VLLM_ENFORCE_EAGER:+--enforce-eager} --disable-custom-all-reduce "$$@" "$${SPEC_ARGS[@]}" "$${ASYNC_ARGS[@]}" "$${SAMPLER_ARGS[@]}"
        fi
      - --
    command:
      - --model
      - /root/.cache/huggingface/qwen3.8-27b-fp8
      - --served-model-name
      - qwen3.8-27b
      - qwen3.8-27b-fp8
      - --quantization
      - fp8
      - --dtype
      - bfloat16
      - --tensor-parallel-size
      - "${TP:-2}"
      - --pipeline-parallel-size
      - "${PP:-1}"
      - --max-model-len
      - "${MAX_MODEL_LEN:-262144}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.92}"
      - --max-num-seqs
      - "${MAX_NUM_SEQS:-2}"
      - --max-num-batched-tokens
      - "${MAX_NUM_BATCHED_TOKENS:-8192}"
      # Head-of-line-blocking mitigation (Zylone's vLLM tip; qwen3.6 dual-fast precedent).
      # Interleaves a long prefill with concurrent decodes so a short/agentic request
      # isn't starved. Valid range [block_size ~1600, max-num-batched-tokens 8192);
      # 4096 = qwen3.6's measured 2.7x short-TTFT point (5.8x at 2048).
      # ⚠️ INERT at max_num_seqs=1 (the shipped default) — preparatory for concurrency.
      # LONG_PREFILL_TOKEN_THRESHOLD=0 disables.
      - --long-prefill-token-threshold
      - "${LONG_PREFILL_TOKEN_THRESHOLD:-4096}"
      # fp8 == e4m3 here. NOT fp8_e5m2 — hard-rejected with fp8 checkpoints.
      - --kv-cache-dtype
      - "${KV_CACHE_DTYPE:-fp8}"
      - --trust-remote-code
      # No --chat-template: the model dir's own chat_template.jinja is used.
      - --reasoning-parser
      - qwen3
      # Stack-wide default: thinking OFF. On this model that ALSO suppresses the
      # template's xhigh reasoning-effort preamble (it is gated on thinking).
      # Callers opt in per-request; the server default below is "low", so send
      # "reasoning_effort":"medium" (un-nudged) or "xhigh" (deliberate) to override.
      # ⭐ THINKING GATE — flip the server default with ENABLE_THINKING=true.
      #   The card's matching sampler row follows AUTOMATICALLY now: the
      #   entrypoint keys --override-generation-config off the same flag, so an
      #   explicit TEMP/TOP_P/PRESENCE_PENALTY is the only way to deviate. See
      #   the SAMPLER header block.
      - --default-chat-template-kwargs
      # ⭐ reasoning_effort default = low (2026-08-16). It is a PER-REQUEST OpenAI
      # control, so this is only the fallback for callers that send nothing — any
      # agent still picks its own level per request.
      # ⚠️ ACTIVE on every request since the 2026-09-01 thinking flip. The template
      # only reads reasoning_effort inside `if enable_thinking is undefined or true`,
      # so it goes INERT only under ENABLE_THINKING=false.
      # ⚠️ low is an ACTIVE instruction, not "less of medium" — it injects
      # "Keep your thinking brief and focused, moving directly to the conclusion
      # without unnecessary elaboration." The three levels are NOT a scale with a
      # middle: medium has NO branch and injects nothing (the un-nudged baseline),
      # xhigh adds "think carefully, validate assumptions, consider alternatives"
      # which is what makes it slow and timeout-prone. REASONING_EFFORT=medium if
      # you want the model un-nudged rather than pushed toward brevity.
      # ⚠️ Valid values are xhigh | medium | low. Anything else RAISES at template
      # render (`high` included — it does NOT silently remap).
      - '{"enable_thinking": ${ENABLE_THINKING:-true}, "reasoning_effort": "${REASONING_EFFORT:-low}"}'
      - --enable-auto-tool-choice
      # The 3.8 template emits the same <tool_call><function=…><parameter=…> XML
      # as 3.6 (verified by reading the template), so this parser applies.
      - --tool-call-parser
      - qwen3_coder
      # Prefix caching ON, matching the rest of this hybrid family: the
      # vllm#43559 fix (vllm#48375) is VENDORED here and applied at boot by the
      # entrypoint, which is what makes MTP + prefix caching safe to pair.
      # ⚠️ The evidence for the pair being clean is qwen3.6-27b / Tess-4-27B
      # production data, INHERITED — not measured on 3.8.
      # Opt out: PREFIX_CACHE_ARG=--no-enable-prefix-caching
      - "${PREFIX_CACHE_ARG:---enable-prefix-caching}"
      - --enable-chunked-prefill
      # ⭐ mamba-align prefix caching (2026-08-23, A/B validated on dual-fast MTP):
      # makes the DeltaNet/SSM state prefix-cacheable → cuts BETWEEN-TURN TTFT
      # 15-38% on agent traffic (bench-agentic), flatter TTFT-vs-ctx growth
      # (6.8x vs 9.7x); decode-neutral, soak PASS (0 leak). ⚠️ align mode is
      # upstream-EXPERIMENTAL + adds ~100ms cold-start TTFT (precopy JIT). Disable
      # with MAMBA_CACHE_MODE=none. pmu is inert unless align is active.
      - --mamba-cache-mode
      - "${MAMBA_CACHE_MODE:-align}"
      - --prefix-match-unit
      - "${PREFIX_MATCH_UNIT:-16}"
      # SAMPLER moved INTO the entrypoint (#984/#1014): at boot it derives
      # --override-generation-config from the model-card row matching
      # ENABLE_THINKING (THINKING by default since 2026-09-01; instruct when
      # false); explicit
      # TEMP/TOP_P/PRESENCE_PENALTY still win. Both rows: "SAMPLER" header above.
      - --host
      - 0.0.0.0
      - --port
      - "8000"

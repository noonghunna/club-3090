# ===========================================================================
# Profile (at-a-glance):
#   Model:     Qwen3.8-27B FP8 (official Qwen/Qwen3.8-27B-FP8 — e4m3, dynamic
#              activation scale, 128x128 weight blocks; embedded mtp.* head)
#   Topology:  8x 3090 PCIe (TP=8, no NVLink; NVLink/PCIe-P2P auto-detected via NVLINK_MODE)
#   Drafter:   MTP n=3 (built-in — the checkpoint ships mtp.safetensors and
#              text_config.mtp_num_hidden_layers=1). SPEC=off disables it.
#   KV:        fp8 -> e4m3 (1 byte/token/elem; scale=1.0 — weight-only checkpoint,
#              and vLLM disables calculate_kv_scales on this hybrid family).
#              NOT fp8_e5m2 — hard-rejected against an fp8 checkpoint.
#   Vision:    base is a full VLM (vision tower + preprocessors ship in the repo,
#              and the FP8 quant SKIPS the vision tower) — UNTESTED on this serve.
#   Template:  native — the repo's own chat_template.jinja. NOT froggeric.
#              See the dual sibling's "Chat template" section for the full diff.
#   Max ctx:   262144 — the architectural ceiling. COMPUTED + inherited, never
#              measured on this model at ANY topology.
#   Genesis:   none — intentionally Genesis-free
#   Status:    🐣 Incubating
#   Caveats:   TWO independent reasons, and neither is a TODO that this rig can close.
#              (1) NOTHING HAS BOOTED, on any card count. Authored 2026-08-14; the
#                  weights have since landed and verified (30.87 GB / 28.75 GiB,
#                  all 66 safetensors CRC32-clean against the repo manifest), but
#                  no engine has ever loaded them. No verify-full (0/8), no
#                  verify-stress, no NIAH, no soak, no bench — NO TPS number is
#                  claimed anywhere — and no 8-pack, so there is deliberately no
#                  `Quality:` field. Max ctx 262144 is arithmetic plus a sibling
#                  analogy, never filled; allocating a context is not filling it.
#                  Engine compatibility is likewise an inference: the v0.25.1 pin
#                  predates this model, though it does serve the same
#                  Qwen3_5ForConditionalGeneration arch (qwen3.6-27b FP8, Tess-4-27B).
#              (2) ⛔ 8-CARD IS COMMUNITY-VALIDATED BY DESIGN — a PERMANENT property
#                  of this slug on the reference rig, NOT pending work. The
#                  maintainer rig has exactly TWO 3090s, so TP=8 can never boot here
#                  and nobody should file it as an open task. The on-rig proxy is
#                  vllm/qwen38-27b-dual-max: the SAME serving config at TP=2, which
#                  is what will be exercised locally. Everything TP=8-specific
#                  (NCCL topology across 8 PCIe cards, the 8-way weight shard, the
#                  larger KV pool) is validated by whoever first runs it on 8 cards
#                  — that first community boot IS the validation, not a confirmation
#                  of ours. Report numbers via the `numbers-from-your-rig` template.
#              • ⚠️ MTP × hybrid-GDN wild write — vllm#50021, OPEN and LIVE IN THIS PIN.
#                Inherited exposure: Qwen3.8-27B is the same Qwen3-Next/DeltaNet
#                hybrid-GDN family as qwen3.6-27b and Tess-4-27B, and the fault is an
#                UNBOUNDED index in the shared GDN spec-decode path — quant-,
#                topology- and depth-independent. See "Upstream-risk" below.
#              Promote to 🧪 only after a clean boot + verify-full on a real 8-card
#              host; to ⚠️/✅ only after the full gate there.
#   Upstream-risk:  • ⚠️ MTP × hybrid-GDN wild write — vllm#50021, OPEN and LIVE IN THIS PIN.
#                The GDN spec-decode path builds a state-block index from an UNBOUNDED
#                accepted-token count; a zero/stale count dereferences a wild address →
#                `CUDA error: unspecified launch failure` + Xid 13/31 and a dead worker,
#                typically after minutes of agent-shaped traffic rather than at boot.
#                Not quant-, topology- or depth-specific: hit on Ampere+Ada and on
#                2× 5090 across NVFP4 AND W4A8 alike. The vendored pr48375 fixes
#                vllm#43559 (corruption) and does NOT cover this fault.
#                ⚠️ This model has never run, so it has never been OBSERVED to crash —
#                absence of evidence, not evidence of absence. The exposure is
#                structural (same hybrid-GDN kernel, MTP on) and carries over.
#                MITIGATION: run the drafter off — SPEC=off. Lower n cuts frequency,
#                NOT exposure (n=3 was called stable on one rig and crashed AT n=3 on
#                another). Clears when #50021 merges and a pin bump inherits it;
#                v0.26.0 PREDATES the fix. Detail + re-test trigger: docs/UPSTREAM.md.
#   Best for:  max-weight-fidelity Qwen3.8-27B on 8 cards — the topology buys KV pool
#              and concurrency, not single-stream decode. NOT yet recommendable for
#              anything; see Caveats.
# ---------------------------------------------------------------------------
# Sibling composes for this model:
#
#   | Slug                             | Cards | Engine    | Weights          | KV   | Max ctx | Drafter   |
#   |----------------------------------|-------|-----------|------------------|------|---------|-----------|
#   | llamacpp/qwen38-27b-single-iq4nl | 1     | llama.cpp | IQ4_NL 16.3 GB   | q8_0 | 131072  | draft-mtp |
#   | llamacpp/qwen38-27b-dual-q8kxl   | 2     | llama.cpp | UD-Q8_K_XL 31.5G | q8_0 | 262144  | draft-mtp |
#   | vllm/qwen38-27b-dual-max         | 2     | vLLM      | official FP8 31G | fp8  | 262144  | MTP n=3   |
#   | vllm/qwen38-27b-multi4-max       | 4     | vLLM      | official FP8 31G | fp8  | 262144  | MTP n=3   |
#   | vllm/qwen38-27b-multi8-max (THIS)| 8     | vLLM      | official FP8 31G | fp8  | 262144  | MTP n=3   |
#
# All FIVE are 🐣 Incubating. THIS FILE IS THE multi4/fp8/mtp.yml SIBLING WITH THREE
# LINES CHANGED — `--tensor-parallel-size`, the required gpu-count, and the port. Keep them
# in lockstep: a change to one that is not mirrored is a bug, not a variant.
#
# ---------------------------------------------------------------------------
# WHAT 8 CARDS ACTUALLY BUY (structural, NOT measured here):
#   The weights are ~28.8 GiB total whatever the split, so TP=8 does not unlock
#   context that TP=2 or TP=4 lacks — 262144 is already the architectural ceiling.
#   What TP=8 buys over TP=4 is WEIGHT headroom only: ~3.6 GiB/card instead of
#   ~7.2. It does NOT halve KV again — num_kv_heads=4 < 8, so KV heads REPLICATE
#   across rank pairs and per-card KV stays at roughly the TP=4 figure (see the
#   warning at --tensor-parallel-size). So the 8-card win is smaller than the
#   4-card one, and on the qwen3.6-27b tier single-stream decode was already
#   ~flat from 2 cards to 4. Expect flat-or-worse decode with more all-reduce
#   traffic; expect nothing quantitative until someone measures it.
#   ⚠️ And on PCIe with no NVLink, more ranks means more all-reduce traffic on a
#   slow interconnect — custom all-reduce stays disabled (see the entrypoint).
#
# ARCHITECTURE / QUANTIZATION / CONTEXT BUDGET / KV CHOICE / CHAT TEMPLATE:
#   Identical to the dual sibling in every respect — see
#   `models/qwen3.8-27b/vllm/compose/dual/fp8/mtp.yml` for the full write-up:
#   the 16-growing / 48-linear hybrid split (naive 64-layer KV math overestimates
#   the pool ~4x), the dense-not-MoE confirmation from the tensor table, the
#   32,768 B/token fp8 KV figure (8.00 GiB at 262K; ⚠️ per-card KV at TP=8 is
#   ~2.00 GiB — the TP=4 figure, NOT ~1.00, because KV heads replicate; see the
#   warning at --tensor-parallel-size), the
#   30.9 GB decimal / 28.8 GiB weights unit trap, why fp8_e5m2 is rejected, and
#   why the froggeric template that the qwen3.6/Tess composes pin is WRONG here.
#
# ⚠️ AMPERE REALITY — FP8 WEIGHTS ARE A MEMORY WIN, NOT A DECODE WIN:
#   RTX 3090 is Ampere sm_86 with NO native FP8 compute. vLLM serves these
#   weights weight-only through the Marlin FP8 kernel (W8A16: 8-bit in VRAM,
#   16-bit GEMM). FP8 buys the ~31 GB footprint and 8-bit fidelity — NOT
#   throughput. Do not read "FP8" as "faster" on this hardware. Native FP8 GEMM
#   is real on Ada / Hopper / Blackwell (the launchers inject
#   VLLM_USE_DEEP_GEMM=0 on sm_120/121, where DeepGEMM has no recipe).
#
# ⚠️ tools/kv-calc.py CANNOT model this hybrid (kv_calc_supported: false in the
#   model profile; kvcalc_key="SKIP" on both vLLM entries). No prediction row is
#   expected, and none should be added without a real 8-card boot log.
#
# Dependencies:
#   - 4x RTX 3090 (Ampere SM 8.6), PCIe-only (no NVLink needed; auto-detected at
#     boot via NVLINK_MODE where present)
#   - vLLM STABLE image — the version of record lives in the `vllm-stable`
#     engine profile's install.spec (#254); the launchers INJECT it over the
#     compose default below, so bump the profile, not this line.
#   - The vendored vllm#48375 install script, shared from the qwen3.6-27b tree.
#
# PORT — 8092, NOT 8089/8090. The qwen3.8 block starts at 8086/8087 (the GGUF
#   siblings) but 8088 is SearXNG and 8090 is the AI-Studio director — both
#   always-on support services on the reference rig, so a slug parked there
#   collides with something already listening. 8091 (the dual sibling) and 8092
#   were checked free three ways: unused in compose_registry.py, unbound in
#   `ss -ltn`, unclaimed by services/ and the AI-Studio docs. A free registry
#   slot is NOT the same as a free host port — check all three before moving it.
#
# SAMPLER — follows the Qwen3.8-27B MODEL CARD, identical to the dual sibling.
#   Card rows: Thinking = temp 1.0 / top_p 0.95 / top_k 20 / min_p 0.0 /
#   presence_penalty 0.0; Instruct = temp 0.7 / top_p 0.80 / top_k 20 /
#   min_p 0.0 / presence_penalty 1.5. This compose ships thinking OFF, so it
#   ships the INSTRUCT row. ⚠️ The sampler does NOT follow the reasoning flag —
#   the two are set independently and mismatching them is SILENT. This deviates
#   from the other Qwen composes on the stack (temp 0.6 / top_p 0.95, tuned on
#   Qwen3.6): deliberate, because the card is the only evidence for 3.8.
#   ⚠️ SERVING defaults only — scripts/bench.sh sends its own canonical sampler.
#
# ⭐ THINKING MODE — set all four together:
#     ENABLE_THINKING=true TEMP=1.0 TOP_P=0.95 PRESENCE_PENALTY=0.0 \
#       bash scripts/switch.sh --force vllm/qwen38-27b-multi8-max
#   (top_k 20 / min_p 0.0 / repetition_penalty 1.0 are identical in both card
#   rows, so they need no override.) Per-request thinking works without any of
#   this — send chat_template_kwargs {"enable_thinking": true} plus the thinking
#   sampler; --reasoning-parser qwen3 is already on, so <think> is routed to
#   reasoning_content either way.
#
#   ⚠️ Four vars, not the llama.cpp siblings' single THINKING=1 — same reason as
#   the dual sibling: exec-form arg LIST + single-JSON payload flags, and compose
#   interpolation has no if/else (`${THINKING:-x}` expands to THINKING's own
#   VALUE when set, so the last-wins append trick is inexpressible). See
#   club-3090 #984 for the real fix.
#
# Quick start (weights first):
#   WEIGHT_KEY=qwen3.8-27b:fp8 bash scripts/setup.sh qwen3.8-27b
#   bash scripts/switch.sh --force vllm/qwen38-27b-multi8-max
#   (--force is REQUIRED: 🐣 Incubating slugs are launch-gated and hidden from
#    `switch.sh --list`; reveal with `--list --all`.)
#
# Run (direct docker):
#   cd <repo>/models/qwen3.8-27b/vllm/compose
#   docker compose -f multi8/fp8/mtp.yml up -d
# ===========================================================================
# Hardware metadata (parsed by scripts/preflight.sh):
# Requires-min-vram-gb: 24
# Engine-profile: vllm-stable
# Requires-min-gpu-count: 8
# Tensor-parallel: 4
services:
  vllm-qwen38-27b-multi8-max:
    # Pinned to a vLLM STABLE release (immutable — never purged, unlike
    # nightlies; the #407 pin-drift fix). The launchers resolve the real image
    # from the `vllm-stable` engine profile and inject it over this default,
    # so this literal only bites a raw `docker compose` invocation (#254).
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.25.1}
    container_name: "${ESTATE_CONTAINER:-vllm-qwen38-27b-multi8-max}"
    restart: ${CLUB3090_RESTART:-unless-stopped}
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8093}}:8000"
    volumes:
      - ${MODEL_DIR:-../../../../../../models-cache}:/root/.cache/huggingface
      # torch.compile + Triton kernel caches — first boot warms (~60-90 sec);
      # subsequent boots reuse the compiled graphs.
      - ../../../cache/torch_compile:/root/.cache/vllm/torch_compile_cache
      - ../../../cache/triton:/root/.triton/cache
      # NO chat-template mount — this model serves its OWN chat_template.jinja
      # from the model dir. See the dual sibling's "Chat template" section.
      # NVLink auto-detection — runs inside the container at boot.
      - ../../../../../../scripts/detect_nvlink.sh:/etc/club3090/detect_nvlink.sh:ro
      # Vendored vllm#48375 (MambaManager drop_eagle_block) — SHARED from the
      # qwen3.6-27b tree (same Qwen3-Next hybrid family). Load-bearing because
      # this compose ships BOTH MTP and prefix caching, the pair vllm#43559
      # corrupts. Anchor drift => the install script REFUSES the boot rather
      # than half-wiring it. See patches.yml.
      - ../../../../../qwen3.6-27b/vllm/patches/vllm-pr48375-mamba-drop-eagle-block:/etc/club3090/pr48375:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=${ESTATE_GPUS:-${NVIDIA_VISIBLE_DEVICES:-all}}
      # CUDA-level GPU mask — the runtime-agnostic half of GPU selection (#610).
      # CDI runtimes (NixOS, nvidia-ctk cdi) IGNORE NVIDIA_VISIBLE_DEVICES, so
      # this is what actually pins cards there. Unset => absent (no masking).
      - CUDA_VISIBLE_DEVICES
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-${OFFLINE:-0}}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-${OFFLINE:-0}}
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - NVLINK_MODE=${NVLINK_MODE:-auto}
      # Opt-in transfer check: VLLM_SKIP_P2P_CHECK=0 makes vLLM PROVE peer access
      # by moving bytes. Bare passthrough — absent unless set. docs/PCIE_P2P.md §7.
      - VLLM_SKIP_P2P_CHECK
      - NCCL_CUMEM_ENABLE=0
      # Safe PCIe-only default. Rigs with proven working P2P set
      # NCCL_P2P_DISABLE=0 — worth trying at TP=8, where all-reduce volume is
      # highest, but PROVE peer access with a real transfer check first: a
      # "topo -p2p OK" line can report a grant that does not move bytes.
      - NCCL_P2P_DISABLE=${NCCL_P2P_DISABLE:-1}
      - VLLM_NO_USAGE_STATS=1
      # FlashInfer sampler OFF by default, env-overridable — kept IDENTICAL to
      # the dual sibling on purpose. (The qwen3.6 pair it derives from disagrees
      # with itself: its dual sets 0, its multi4 sets 1; that inconsistency is
      # deliberately NOT propagated here.) The reason to default 0 is MECHANISM:
      # with MTP active, sampling routes through the rejection-sampler path where
      # the FlashInfer kernel adds overhead, and it trims sampler workspace.
      # ⚠️ The supporting A/B is a QWEN3.6 measurement. Nothing is benched on 3.8.
      - VLLM_USE_FLASHINFER_SAMPLER=${VLLM_USE_FLASHINFER_SAMPLER:-0}
      - OMP_NUM_THREADS=1
      # DeepGEMM (vLLM's fp8-GEMM path) is built for Hopper (sm_90) + datacenter
      # Blackwell. Consumer Blackwell (sm_120/121) has no recipe and hard-fails
      # "recipe not found" at boot (disc #571). switch.sh/launch.sh auto-inject
      # VLLM_USE_DEEP_GEMM=0 there; a raw `docker compose` user on those cards
      # must set it. Irrelevant on Ampere (no FP8 compute at all).
      - VLLM_USE_DEEP_GEMM
      # SPEC=off drops the built-in MTP drafter at boot — the documented
      # mitigation for vllm#50021 (see Caveats / Upstream-risk) and the fallback
      # if the head proves net-negative. Bare passthrough; default on.
      - SPEC
      # expandable_segments:True crashes boot on some setups (cuMemMap path):
      # known on NVLink rigs and WSL2/WDDM. Override via .env:
      # PYTORCH_CUDA_ALLOC_CONF=expandable_segments:False
      - PYTORCH_CUDA_ALLOC_CONF=${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True,max_split_size_mb:512}
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - bash
      - -c
      - |
        # VLLM_ENFORCE_EAGER=1 in .env disables CUDA graphs — the mitigation if
        # you see mid-generation hangs at depth on this hybrid family. Costs
        # ~20-30% TPS in exchange for stability. UNTESTED on this model.
        # SPEC=off drops the built-in MTP drafter — the vllm#50021 mitigation.
        SPEC_ARGS=()
        if [ "$${SPEC:-on}" != "off" ]; then
          SPEC_ARGS=(--speculative-config '{"method":"mtp","num_speculative_tokens":3}')
        else
          echo "[qwen38] SPEC=off — built-in MTP drafter disabled (no spec-dec)" >&2
        fi
        # NVLink auto-detection (sets NCCL env vars, _NVLINK_ENABLED).
        # Without NVLink, custom all-reduce is DISABLED: its NVLink-assumed
        # paths break on PCIe-only multi-GPU, and that matters most at TP=8.
        source /etc/club3090/detect_nvlink.sh
        bash /etc/club3090/pr48375/install.sh || exit 1
        if [ "$${_NVLINK_ENABLED:-0}" = "1" ]; then
          exec vllm serve $${VLLM_ENFORCE_EAGER:+--enforce-eager} "$$@" "$${SPEC_ARGS[@]}"
        else
          exec vllm serve $${VLLM_ENFORCE_EAGER:+--enforce-eager} --disable-custom-all-reduce "$$@" "$${SPEC_ARGS[@]}"
        fi
      - --
    command:
      - --model
      - /root/.cache/huggingface/qwen3.8-27b-fp8
      - --served-model-name
      - qwen3.8-27b
      - qwen3.8-27b-fp8
      - --quantization
      - fp8
      - --dtype
      - bfloat16
      # ⚠️⚠️ TP=8 IS NOT THE SAME KIND OF SHARD AS TP=2 / TP=4 — DO NOT ASSUME IT
      # SCALES THE SAME WAY. This model has num_kv_heads=4. At TP=2 and TP=4 the
      # KV heads divide cleanly and every rank owns whole heads. At TP=8 they do
      # NOT: 4 < 8, so vLLM REPLICATES KV heads across ranks (two ranks share each
      # head) instead of splitting them. Consequences — none measured here:
      #   - KV does NOT shrink 8x per card. It shrinks ~4x and is then duplicated
      #     across the rank pairs, so per-card KV is roughly the TP=4 figure, NOT
      #     half of it: budget ~2.00 GiB/card at 262K, not ~1.00.
      #   - only the WEIGHTS take the full 8-way split (~3.6 GiB/card).
      #   - more ranks on PCIe with no NVLink = more all-reduce on a slow bus;
      #     custom all-reduce stays disabled (see entrypoint).
      # Whether 8-way actually BEATS 4-way here is an open question, not a claim:
      # on the qwen3.6-27b equivalent single-stream decode was ~flat 2 -> 4 cards,
      # and 4 -> 8 may be flat or worse while the KV pool stops growing as fast.
      # Measure before recommending. This is the ONLY serving difference from the
      # multi4 sibling besides the gpu-count metadata and the port.
      - --tensor-parallel-size
      - "${TP:-8}"
      - --pipeline-parallel-size
      - "${PP:-1}"
      - --max-model-len
      - "${MAX_MODEL_LEN:-262144}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.92}"
      - --max-num-seqs
      - "${MAX_NUM_SEQS:-2}"
      - --max-num-batched-tokens
      - "${MAX_NUM_BATCHED_TOKENS:-8192}"
      # fp8 == e4m3 here. NOT fp8_e5m2 — hard-rejected with fp8 checkpoints.
      - --kv-cache-dtype
      - "${KV_CACHE_DTYPE:-fp8}"
      - --trust-remote-code
      # No --chat-template: the model dir's own chat_template.jinja is used.
      - --reasoning-parser
      - qwen3
      # Stack-wide default: thinking OFF. On this model that ALSO suppresses the
      # template's xhigh reasoning-effort preamble (it is gated on thinking).
      # ⭐ THINKING GATE — flip the server default with ENABLE_THINKING=true.
      #   Pair it with the card's thinking sampler (see the header); the two are
      #   independent and mismatching them is SILENT.
      - --default-chat-template-kwargs
      - '{"enable_thinking": ${ENABLE_THINKING:-false}}'
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      # Prefix caching ON, matching the rest of this hybrid family: the
      # vllm#43559 fix (vllm#48375) is VENDORED here and applied at boot.
      # ⚠️ Evidence for the pair being clean is qwen3.6-27b / Tess-4-27B
      # production data, INHERITED — not measured on 3.8, and not at TP=8.
      # Opt out: PREFIX_CACHE_ARG=--no-enable-prefix-caching
      - "${PREFIX_CACHE_ARG:---enable-prefix-caching}"
      - --enable-chunked-prefill
      # SAMPLER = the model card's INSTRUCT row (this compose ships thinking
      # OFF). ⚠️ The sampler does NOT follow ENABLE_THINKING — for thinking mode
      # set all four together: ENABLE_THINKING=true TEMP=1.0 TOP_P=0.95
      # PRESENCE_PENALTY=0.0. Mismatching them is silent.
      # Both card rows + rationale in the "SAMPLER" header block above.
      - --override-generation-config
      - '{"temperature":${TEMP:-${TEMPERATURE:-0.7}},"top_p":${TOP_P:-0.80},"top_k":${TOP_K:-20},"min_p":${MIN_P:-0.0},"presence_penalty":${PRESENCE_PENALTY:-1.5},"repetition_penalty":${REPEAT_PENALTY:-1.0}}'
      - --host
      - 0.0.0.0
      - --port
      - "8000"

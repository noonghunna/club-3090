# ===========================================================================
# Profile (at-a-glance):
#   Model:     Qwen3.8-27B (Qwen3-Next hybrid GDN, arch `Qwen3_5ForConditionalGeneration`)
#              OFFICIAL Qwen/Qwen3.8-27B-FP8 — block-quantised e4m3
#              (weight_block_size [128,128], activation_scheme dynamic), ~29 GB.
#   Engine:    SGLang STOCK v0.5.20 (`lmsysorg/sglang:v0.5.20`) — engine profile
#              `sglang-stable`. ⚠️ NO PATCHES. That is the POINT of this compose.
#   Topology:  Dual 3090 PCIe (TP=2, no NVLink)
#   Drafter:   native MTP head, in-checkpoint (29 `mtp.*` tensors,
#              text_config.mtp_num_hidden_layers=1) — NOT an external drafter.
#   KV:        fp8_e4m3 — half the bytes of bf16, which is what keeps the full context in pool.
#   Vision:    ✅ tower present — verify-full scored 4/4 on ground truth here 2026-09-10.
#   Max ctx:   163840 — ⚠️ NOT the 262144 architectural ceiling. VRAM-bound and
#              MEASURED: the pool holds 157,875 tokens at mem-fraction 0.92.
#   Genesis:   N/A — Genesis is a vLLM construct.
#   Status:    🧪 Experimental — BOOTED + benched + verify-full PASS 2026-09-10.
#   Best for:  fidelity reference — OFFICIAL Qwen weights, for quality A/Bs against the int4 tiers
# ---------------------------------------------------------------------------
# ⭐⭐ WHY THIS COMPOSE EXISTS: to find out what STOCK v0.5.19 does.
#
#   The evidence we are chasing is @jb-seo's club-3090 discussion #1178: 97.4
#   narrative / 121.2 code decode TPS on 2x3090, TP=2, this quant, native MTP
#   n=4, flashinfer full attention, KV fp8_e4m3. Against our vLLM MTP tier that
#   would be a large win.
#
#   ⚠️⚠️ BUT HIS NUMBERS ARE v0.5.18 + THREE IN-CONTAINER PATCHES, NOT STOCK:
#     1. backport of sgl-project/sglang#34623 (UNMERGED upstream) — concurrent
#        chunked prefill, i.e. `--long-prefill-token-threshold`
#     2. attention-backend logging (auto-selection fell back to triton silently)
#     3. `--decode-passes-per-prefill` (FORK-LOCAL) — stock gives every
#        scheduling pass to prefill while one exists, so a 114K prompt at 4096
#        chunks stops ALL generation for ~28 passes: "one window compacts, every
#        other window freezes"
#   He states the pin is load-bearing: v0.5.19 is 794 commits later and rewrites
#   all four files the patches touch, and patch 1 does not apply.
#
#   ⭐ VERIFIED HERE 2026-09-10 against the real image — both flags his patches
#   add are ABSENT from stock v0.5.19:
#       --long-prefill-token-threshold   ABSENT
#       --decode-passes-per-prefill      ABSENT
#   Everything else this compose uses IS present.
#
#   ⇒ So this compose deliberately measures STOCK FIRST. If single-stream decode
#     lands near his numbers, the patches are a concurrency/multi-window story
#     and not needed for the shipped `--max-running-requests 1`. If it does not,
#     we rebase his patches into our own tree and say why. Do NOT vendor them
#     before that measurement exists.
#
# ⚠️ HIS OWN OPEN CAVEATS, carried so nobody re-discovers them:
#   - ~2x vLLM wall time on prefill-heavy MULTI-SESSION work. He self-corrected
#     this to a W4A16 issue that improved with W4A8. Unverified hypothesis: most
#     layers are GDN on Triton, `--attention-backend` only moves the 16 full-
#     attention layers, and flashinfer's GDN kernels are SM90+ — so on sm_86
#     there is nothing else to select.
#   - TTFT at 90K is ~96 seconds. That, not decode TPS, shapes the experience.
#   - Both scheduling flags are inert at `--max-running-requests 1`. He developed
#     at 4 against a ~440K KV pool; at full context that pool cannot hold two
#     sessions, so 4 was "a testing value this hardware can't honestly ship".
# ---------------------------------------------------------------------------
#   ⛔⛔ AN EARLIER REVISION OF THIS HEADER CARRIED AN --mamba-ssm-dtype BENCH
#   TABLE. Those numbers were from the **INT4** sibling and never belonged on an
#   FP8 compose. Removed 2026-09-11. The A,B,A,B repeat-boot that superseded
#   them (int4, 2026-09-11) gives code decode +8.0% and prefill **-1.3%** — the
#   old "+2.5% prefill" flipped sign. Effect on an FP8 target is UNMEASURED.
#
#   ⛔ DO NOT CITE the `decode tok/s @ Nk depth` rows bench.sh prints in the
#     prefill probe (+33%/+47% here). That probe runs `max_tokens=16`, so it
#     times a ~0.15 s decode window after a 95 s prefill at n=3 / n=1. The
#     citable decode numbers are the narrative/code legs — those are
#     fixed-length. (instrument_sampler_and_length_confounds, re-earned.)
#
#   ⚠️⚠️ VS OUR vLLM TIER — READ THE QUANT BEFORE THE DELTA. Raw numbers vs
#     `vllm/qwen38-27b-dual-fast` are narrative +22%, code +2%, prefill −33% at
#     10K. ⛔ THOSE ARE QUANT-CONFOUNDED AND MUST NOT BE QUOTED AS ENGINE
#     DELTAS: that tier ships **W4A8** (int8 activations, our vendored Marlin
#     negscale fold), while stock SGLang serves this checkpoint at **W4A16** and
#     offers no activation knob — `auto-round` declares
#     `get_supported_act_dtypes() -> [half, bfloat16]`. Against vLLM W4A16
#     (1219.51 @10K) our 1183.41 is ≈ −3%; correcting decode for W4A8's ~8% tax
#     puts us near +13% / +3%. ⭐ W4A8 IS reachable on SGLang — @jb-seo patched
#     it (club-3090#1178, commit 5f48455e) for prefill 1200 -> 1770 (+47.5%).
#     Porting that is the top lever for this tier.
#   ⛔ `--linear-attn-backend` IS STILL NOT THE FIX — checked in source 2026-09-10: on a GDN model at sm_86, helion and
#     intel_xpu hard-error, flashkda/nvidia_kda/ptx_kda are KDA-only and are
#     not in the GDN branch at all, flashinfer GDN is SM90+, and cutedsl's
#     prefill kernel requires SM100+ and SILENTLY FALLS BACK TO TRITON below
#     it. Triton is the ONLY viable GDN backend on Ampere. ⚠️ But note GDN is
#     Triton-only on sm_86 in BOTH engines, so dispatch was never what separated
#     them — this closes the flag, NOT the prefill question. Grep the boot log for
#     `GDN kernel dispatcher:` — that line shows what was SELECTED; the
#     `server_args=` dump only shows what was REQUESTED.
#
#   ⭐ VISION WORKS on SGLang for this model — verify-full [10] scored 4/4 on
#     ground truth. First time measured on this engine.
#
#   ⏭️ DFlash2 is deliberately NOT here. It belongs to a future sglang
#     `dual-superfast` slug, mirroring the vLLM tier split (maintainer
#     decision 2026-09-10). The drafter `syvai/Qwen3.8-27B-DFlash2-W4A16` is
#     already on disk and SGLang exposes `--speculative-algorithm DFLASH`.
#
# ---------------------------------------------------------------------------
#   ⭐ `--mamba-ssm-dtype bfloat16` — this BUYS SLOTS, it does NOT free VRAM.
#
#   The GDN recurrent state defaults to **float32**: sglang's resolution order is
#   default fp32 -> config `mamba_ssm_dtype` -> `SGLANG_MAMBA_SSM_DTYPE`
#   (configs/mamba_utils.py::mamba2_state_dtype), and this checkpoint's config
#   declares no `mamba_ssm_dtype`. So stock = fp32 state.
#
#   ⚠️ The obvious expectation — "halve the state dtype, get the bytes back" —
#   is WRONG here, because the mamba pool is AUTO-FIT, not fixed. With
#   `--max-mamba-cache-size` unset, kv_cache_configurator.py solves
#       K = (budget - per_req*(1+D)) // (per_req * (1 + D/ratio))
#   for a budget that is a fixed share of free memory. `per_req` is
#   `conv_numel*conv.itemsize + ssm_numel*temporal.itemsize` per layer, so
#   halving the SSM dtype halves `per_req` and the solver simply BUYS TWICE THE
#   SLOTS at the same budget.
#
#   ⛔⛔ THE fp32-vs-bf16 TABLE THAT USED TO SIT HERE WAS THE **int4 SIBLING'S**,
#   NOT THIS TIER'S — corrected 2026-09-15 (club-3090#16). It was labelled
#   "MEASURED on this rig, same boot recipe" and claimed `max_mamba_cache_size`
#   26/55 and a KV pool of 394,661/409,552. Booting THIS compose at its own
#   shipped defaults gives:
#
#     | boot line              | claimed (wrong) | MEASURED 2026-09-15 |
#     |------------------------|----------------:|--------------------:|
#     | max_total_num_tokens   |         409,552 |        **158,116**  |
#     | max_mamba_cache_size   |              55 |             **21**  |
#     | context_len            |         262,144 |        **131,072**  |
#     | available_gpu_mem      |               — |          1.67 GB    |
#
#   Both rows were overstated ~2.6x. The registry `status_note` for this slug was
#   right all along ("0.92 yields 157,875") — measured 158,116, within 0.15%.
#
#   ⚠️ WHY THE MAMBA ROW CANNOT BE SHARED BETWEEN QUANT TIERS, which is what made
#   the copy look plausible: K is AUTO-FIT from the memory left AFTER weights, so
#   it is not an architectural constant. fp8 commits ~14.75 GB/rank of weights
#   plus a 2.67 GB MTP head before KV; int4 commits ~9.1 GB/rank. Same solver,
#   very different budget -> 21 slots here vs 55 there. Only per-slot BYTE sizes
#   (conv_state/ssm_state shapes) are quant-independent; the slot COUNT is not.
#
#   ⇒ READ YOUR OWN BOOT LINE. The five dual composes measure 55 / 34 / 33 / 21 / 8.
#
#   The fp32-vs-bf16 SSM-dtype A/B has NOT been re-run on this tier, so no such
#   table is published here. The mechanism above (auto-fit spends a halved
#   `per_req` on twice the slots rather than returning bytes) still applies; only
#   the int4 numbers demonstrating it were ever measured, and they live in
#   `dual/autoround-int4/mtp.yml` where they belong.
#
#   ⭐ WHY MORE SLOTS IS THE POINT: the pool is not just per-request scratch —
#   `uses_mamba_radix_cache: True` and the Unified Radix Cache carries
#   `ComponentType.MAMBA`, so surplus slots hold the GDN recurrent state of
#   CACHED PREFIXES. On a hybrid model prefix reuse is gated by the KV pool AND
#   the mamba pool; at 26 slots the mamba side was the tighter of the two. This
#   is the same axis as the vLLM `mamba-cache-mode=align` win (club-3090 #1093,
#   between-turn TTFT -15-38%) — ⚠️ but that TTFT gain is NOT measured here yet.
#
#   ⚠️ PRECISION CAVEAT, deliberately accepted, not measured away: bf16 keeps
#   fp32's exponent range but drops the mantissa 24 -> 8 bits, and the recurrent
#   state is ACCUMULATED across the whole sequence. sglang's own source says fp32
#   "keeps the SSM checkpoint bit-exact" and warns a narrower state "may drift
#   over long sequences" (arg_groups/attention_hook.py). We serve 262K. The
#   stochastic-rounding mitigation (`--enable-mamba-cache-stochastic-rounding`)
#   is fp16-only AND SM100-only, so it is not available to us. Set
#   `MAMBA_SSM_DTYPE=float32` to revert; a long-context quality leg is OPEN.
#
#   ⚠️ NOT COPIED from the RTX PRO 6000 recipes that suggested this flag:
#   `--mamba-full-memory-ratio 5.61/6.08`. Solving their formula backwards those
#   imply a target request length of ~4.3-4.7K tokens (short-request serving at
#   high concurrency). Our derived ratio at 262K is 0.143 — BELOW the 0.9 default
#   we already ship — so copying theirs would over-allocate mamba state ~40x and
#   eat the KV pool for a workload we do not run.
#
# ---------------------------------------------------------------------------
#   ⚠️⚠️ PARSERS ARE NOT OPTIONAL ON A THINKING MODEL. Without `--reasoning-parser`
#   the chain-of-thought lands INLINE in `content` with a bare `</think>`, and
#   `reasoning_tokens` reports 0 — observed on the first boot here 2026-09-10.
#   That silently corrupts any benchmark: bench.sh takes TTFT from the first
#   `content` delta, so it would fire on the first THINKING token instead of the
#   first answer token. That is the mirror image of the #1096 harness bug (which
#   charged reasoning time to prefill), and it would make these numbers
#   non-comparable to the vLLM tier. Values match vllm/qwen38-27b-dual-fast
#   exactly: reasoning `qwen3`, tools `qwen3_coder`.
#
#   Provenance: engine mechanics copied from the VALIDATED sglang sibling
#              models/qwen3.6-27b/sglang/compose/dual/autoround-int4/
#              eagle3-experimental.yml (bash -c + sglang.launch_server shape,
#              port 30000, --disable-custom-all-reduce). Model specifics from
#              vllm/qwen38-27b-dual-fast. Nothing authored from first principles.
# ---------------------------------------------------------------------------
#   ⭐⭐ MEASURED ON THIS COMPOSE, 2× RTX 3090, 2026-09-10 — and the context
#   ceiling is the headline, not the throughput.
#
#     verify-full         ALL CHECKS PASSED (8 scored; Genesis N/A + the
#                         MTP-acceptance check SKIPPED — it greps for vLLM's
#                         `SpecDecoding metrics` line, which SGLang never emits)
#     bench (ENABLE_THINKING=1, n=5/5/3/1)
#       narrative decode  67.33 TPS  (CV 3.8%)
#       code decode       75.58 TPS  (CV 7.0%; median 76.56 — run 5 returned
#                                     465 tok, this model self-terminates)
#       prefill @10K      1120.80 tok/s (CV 0.8%)
#       prefill @90K       906.70 tok/s
#     MTP accept len      2.92 (n=147)
#     vision              4/4 on ground truth
#
#   ⚠️⚠️ THE POOL IS THE CONSTRAINT, AND IT IS NOT TUNABLE TO 262K:
#     mem-fraction 0.86 -> KV pool  92,507 tokens (3.43 GB left idle)
#     mem-fraction 0.92 -> KV pool 157,875 tokens (1.96 GB left, graphs OK)
#   Per rank at 0.92: weights 14.75 GB + MTP head 2.67 + mamba 0.84 = ~18.3 GB
#   committed before KV. At ~15.3 KB/token a full 262,144 context needs ~4.02 GB
#   of KV and there is nowhere near that much left. 0.92 is the practical
#   ceiling — above it the prefill cudagraph capture OOMs. Hence CONTEXT_LENGTH
#   ships at 131072, which the pool covers with ~27K tokens of radix headroom.
#
#   ⭐ WHY THIS TIER IS STILL WORTH SHIPPING AT HALF THE CONTEXT (maintainer
#   decision 2026-09-10, taken with the numbers above in hand):
#     1. It is the ONLY sglang tier on OFFICIAL Qwen weights. Every other slug
#        in the sgl/ matrix is community AutoRound INT4. That makes this the
#        on-rig QUALITY REFERENCE for A/Bs against the int4 tiers — a role
#        nothing else can fill, and one that does not depend on throughput.
#     2. It is the MEASURED proxy for four never-bootable multi-card slugs
#        (sgl/qwen38-27b-multi{4,8}-{max,supermax}), which cite these numbers.
#   ⚠️ For raw throughput at 2×24GB use sgl/qwen38-27b-dual-{fast,superfast}
#   (int4): 89.24/112.50 and 115.08/171.16 decode, at 409,552 / 279,595 pool.
#   ⚠️ dual-fast RE-DEFAULTED 2026-09-15 (#1329) to 0.95 / max-running-requests 2:
#   its pool is now 451,633 and its decode is HIGHER: 101.26/135.63 on a dedicated
#   fresh boot (+13.5%/+20.6% over the 89.24/112.50 above). ⛔ An earlier
#   '-17.1% regression' is RETRACTED — that reading came from benching third in a
#   gate chain, which under-reports ~25-27%. Bench on its own boot.
#   This tier is SLOWER and SHORTER by construction. That is the trade, not a bug.
# ---------------------------------------------------------------------------
#   ⭐⭐ WHY AN FP8 TIER ON AMPERE AT ALL — read this before "optimising" it.
#
#   This is the FIDELITY series, and on sm_86 it is DELIBERATELY SLOWER than the
#   int4 speed series. Ampere has NO native FP8 compute, so the weights are
#   served weight-only through Marlin with activations upcast. On vLLM the same
#   trade measures dual-max 87 code TPS vs dual-fast 100. Expect the same shape
#   here. You are buying the OFFICIAL Qwen weights (no community quantisation
#   damage), not throughput. Do not "fix" it by reaching for the int4 tier —
#   that is a different product.
#
#   ⭐ THE AMPERE PATH IS REAL AND AUTOMATIC, verified in source 2026-09-10:
#     fp8_utils.py::can_auto_enable_marlin_fp8() -> `80 <= sm < 89`, so sm_86
#     auto-enables Marlin FP8 with no flag.
#   ⚠️ AND IT SURVIVES BLOCK QUANT: this checkpoint is BLOCK-quantised
#     (`weight_block_size: [128, 128]`, DeepSeek-style), not per-tensor. That is
#     the combination that usually has no Ampere path — but fp8.py:960-962 sets
#     `layer.weight_block_size` and calls
#     `prepare_fp8_layer_for_marlin(layer, not self.block_quant)`, i.e. Marlin
#     handles the block case explicitly. If a future pin drops that, this tier
#     dies silently-or-loudly at load; check those lines first.
#
#   ⚠️ VRAM IS THE BINDING CONSTRAINT, NOT CONTEXT. FP8 weights are ~29 GB
#   (~14.5 GB/rank at TP=2) against int4's ~9.1 — and SGLang additionally
#   carries a multi-GB auto-fit MAMBA pool that vLLM does not size the same way.
#   MEM_FRACTION and CONTEXT_LENGTH here are STARTING POINTS pending a boot, not
#   measured ceilings. Read `KV Cache is allocated ... #tokens:` and compare it
#   against CONTEXT_LENGTH before believing the header.
# ---------------------------------------------------------------------------
#   ---------------------------------------------------------------------------
#   ⭐ W4A8 (int8 activations) — OPT-IN, and the patch IS VENDORED AND MOUNTED
#   BY DEFAULT (see the w4a8 mount below). `W4A8=1` is all you need.
#
#   It is OFF by default because it is a PREFILL optimisation that costs decode:
#   ~+44% prefill for ~-11% code decode on the MTP tier — MEASURED on the
#   reference rig 2026-09-11, table below. Turn it on when you are
#   prefill-bound (long prompts, agent work, high TTFT); leave it off when you
#   are decode-bound. That is the same trade the fp8-KV and NVFP4 paths make —
#   the cheaper numeric format buys prefill and costs tokens/s.
#
#   The patch is @A1RM4X's re-cut of jb-seo's AutoRound W4A8 patch
#   (club-3090#1226, vendored via #1248 on 2026-09-11) at
#   sglang/patches/sglang-autoround-w4a8-v0.5.19/. jb-seo's original
#   (club-3090#1178) was cut against v0.5.18 and its eligibility gate omitted the
#   per-shard `K%128==0 / N%64==0` constraint that `prepare_w4a8` hard-asserts,
#   so it crashed on the GDN merged `in_proj_ba` tensor (N=96 -> 48/rank at TP4,
#   not 64-divisible). The vendored re-cut is against v0.5.19 (our pin THEN; bumped to v0.5.20 2026-09-19, on which the patch was re-verified to apply, boot and serve) AND adds
#   the shape guard, which is the reason it is carried rather than referenced.
#
#   ⚠️ `W4A8=1` still HARD-FAILS if the installer is missing, rather than
#   silently serving W4A16 — a silent fallback would be indistinguishable from
#   the feature working.
#
#   ⭐ MEASURED on this rig 2026-09-11 with #1226 applied (Frozenlock @ TP=2 —
#   a different checkpoint and topology from his Avuja @ TP=4):
#     | tier      | prefill@10K         | prefill@90K        | code decode | accept |
#     |-----------|---------------------|--------------------|-------------|--------|
#     | fast      | 1183 -> 1710 +44.5% | 953 -> 1276 +33.9% |   -11.1%    | 2.86 = |
#     | superfast | 1234 -> 1779 +44.1% | 973 -> 1345 +38.3% |   ~flat     | 3.72 = |
#   Numerically clean (greedy 17*23=391, verify-full ALL PASS, vision 4/4), and
#   the drafter is untouched on both tiers. ⭐ The quantized-MTP-head case passes:
#   520 layers W4A8-prepared, no shape-guard fallback, acceptance unchanged.
#
#   ⚠️ IT IS A TRADE, NOT A FREE WIN: ~+44% prefill for ~-11% code decode on the
#   MTP tier. Prefill-heavy and agentic work wants it; long-generation chat does
#   not. Same shape the vLLM tiers encode with their own W4A8 toggle.
#
#   ⚠️ SGLang ACTIVATION DIFFERS FROM vLLM: there is no
#   `VLLM_MARLIN_INPUT_DTYPE`-style runtime gate — the patch flips
#   `experimental_w4a8 = True` unconditionally, so APPLYING it IS the activation.
#   That is why this toggle gates the INSTALL, not a runtime env var.
#
#   ⚠️ DEBUGGING A W4A8 FAILURE: this compose ships
#   `restart: ${CLUB3090_RESTART:-unless-stopped}`, so a hard-fail RESTART-LOOPS
#   and `docker ps` reports "Restarting" rather than "Exited". Set
#   `CLUB3090_RESTART=no` to make the failure sit still and be readable.
#   ---------------------------------------------------------------------------
# ===========================================================================
services:
  sglang-qwen38-27b-max-dual:
    image: ${SGLANG_IMAGE:-lmsysorg/sglang:v0.5.20}
    container_name: ${ESTATE_CONTAINER:-sglang-qwen38-27b-max-dual}
    restart: ${CLUB3090_RESTART:-unless-stopped}
    init: true
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8145}}:30000"
    volumes:
      - "${MODEL_DIR:-../../../../../../models-cache}:/models:ro"
      - "${W4A8_PATCH_DIR:-../../../patches/sglang-autoround-w4a8-v0.5.19}:/etc/club3090/w4a8:ro"
    ipc: host
    shm_size: "16gb"
    environment:
      - SPEC_N
      - CONTEXT_LENGTH
      - MEM_FRACTION
      - KV_CACHE_DTYPE
      - ATTENTION_BACKEND
      - MAX_RUNNING_REQUESTS
      - MAX_MAMBA_CACHE_SIZE
      # ── Prefix-cache policy (opt-in, OFF by default) — club-3090#1319 ──
      # ⚠️ BARE pass-throughs. `- VAR=${X:-}` sets the EMPTY STRING, and
      # SGLANG_ENABLE_UNIFIED_RADIX_TREE is an EnvBool where empty != unset.
      # Bare means docker forwards them ONLY when the host sets them.
      - SESSION_RADIX_CACHE
      - RADIX_EVICTION_POLICY
      - MAMBA_SSM_DTYPE
      - W4A8
      - ENABLE_THINKING
      - TEMP
      - TOP_P
      - TOP_K
      - MIN_P
      - PRESENCE_PENALTY
      - REPEAT_PENALTY
      - REASONING_EFFORT
      - QUANTIZATION
      - CHUNKED_PREFILL_SIZE
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${ESTATE_GPUS:-0,1}']
              capabilities: [gpu]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        M=/models/qwen3.8-27b-fp8
        # ⚠️ SPEC_N=0 removes the speculative flags entirely rather than passing
        # n=0 — the same rule the GLM composes use, so a typo can never
        # masquerade as "drafter off".
        _n="${SPEC_N:-4}"
        case "$$_n" in ""|*[!0-9]*) echo "[spec] SPEC_N='$$_n' is not a non-negative integer" >&2; exit 1 ;; esac
        SPEC=()
        if [ "$$_n" -gt 0 ]; then
          # Native MTP: the draft path is the SAME checkpoint. sglang rewrites
          # Qwen3_5ForConditionalGeneration -> Qwen3_5ForCausalLMMTP when
          # is_draft_model (model_config.py:751), which loads the in-checkpoint
          # mtp.* tensors. There is no separate drafter file to download.
          SPEC=(--speculative-algorithm EAGLE
                --speculative-draft-model-path "$$M"
                --speculative-num-steps "$$_n"
                --speculative-eagle-topk 1
                --speculative-num-draft-tokens $$(( _n + 1 )))
          echo "[spec] native MTP ON (n=$$_n)" >&2
        else
          echo "[spec] drafter OFF (SPEC_N=0)" >&2
        fi
        # --- Prefix-cache policy opt-ins (club-3090#1319) -------------------
        # ⚠️ SESSION_RADIX_CACHE is a 0/1 GATE, not the flag: the feature needs
        # BOTH the env var and the CLI flag (upstream: "implemented only by
        # UnifiedRadixCache"). Setting one alone is the footgun, so one switch
        # sets both — same reasoning as the W4A8 boolean.
        CACHE=()
        _src="${SESSION_RADIX_CACHE:-0}"
        case "$$_src" in 0|1) : ;; *) echo "[cache] SESSION_RADIX_CACHE='$$_src' must be 0 or 1" >&2; exit 1 ;; esac
        if [ "$$_src" = "1" ]; then
          export SGLANG_ENABLE_UNIFIED_RADIX_TREE=1
          CACHE+=(--enable-session-radix-cache)
          echo "[cache] session-aware radix cache ON — eviction consumes UNREFERENCED" >&2
          echo "[cache] entries before referenced ones. ⚠️ INERT unless clients send a" >&2
          echo "[cache] session_id; close finished sessions via POST /close_session." >&2
        fi
        if [ -n "${RADIX_EVICTION_POLICY:-}" ]; then
          CACHE+=(--radix-eviction-policy "$${RADIX_EVICTION_POLICY}")
          echo "[cache] radix eviction policy: $${RADIX_EVICTION_POLICY} (default lru)" >&2
        fi
        # ⛔ NO --radix-eviction-policy-config KNOB. Upstream docs describe it (it
        # tunes slru's protected_threshold) but it does NOT exist in the pinned
        # v0.5.19 — passing it hard-fails the boot with "unrecognized arguments".
        # Verified by booting, not by reading docs. Add it when the pin moves.
        #
        # ⛔ NO HiCache KNOB — DELIBERATELY. `--enable-hierarchical-cache` on a
        # hybrid GDN model allocates host pools, backs up to them, retains them,
        # and then NEVER serves a host hit: upstream sgl-project/sglang#33713
        # (open) prunes the MAMBA node from the radix tree on device eviction
        # instead of downgrading it, so the host bytes are orphaned. Measured
        # here twice on 2026-09-14 (backup ok, dropped=0, host 37% free, yet
        # load-back kv=0 mamba=0 and cache_source="host" never even instantiated).
        # It costs ~HICACHE_GB x TP of host RAM for nothing. Re-test when #33713
        # merges. See learnings/sglang-engine.md 2026-09-14.
        # --- W4A8 opt-in (patch from club-3090#1226; not vendored here) ---
        # ⛔ STAYS 0 — deliberately, unlike the autoround-int4 siblings which
        # went default-on 2026-09-19. The vendored patch adds an AUTO-ROUND
        # W4A8 Marlin kernel; this compose serves `--quantization fp8`, so the
        # patched path is never selected. W4A8=1 here buys nothing and only costs
        # patch-application time plus a misleading "[w4a8] applying..." log line.
        _w4a8="${W4A8:-0}"
        case "$$_w4a8" in 0|1) : ;; *) echo "[w4a8] W4A8='$$_w4a8' must be 0 or 1" >&2; exit 1 ;; esac
        if [ "$$_w4a8" = "1" ]; then
          _p=/etc/club3090/w4a8
          if [ ! -f "$$_p/install.sh" ]; then
            echo "[w4a8] W4A8=1 but no installer at $$_p." >&2
            echo "[w4a8] The patch IS vendored (models/qwen3.8-27b/sglang/patches/" >&2
            echo "[w4a8] sglang-autoround-w4a8-v0.5.19) and mounted there by default, so this" >&2
            echo "[w4a8] means the mount did not resolve - a W4A8_PATCH_DIR override pointing" >&2
            echo "[w4a8] somewhere else, or docker created an empty dir because the path was" >&2
            echo "[w4a8] missing. Refusing to serve W4A16 silently." >&2
            exit 1
          fi
          bash "$$_p/install.sh" || { echo "[w4a8] install FAILED" >&2; exit 1; }
          bash "$$_p/install.sh" --verify || { echo "[w4a8] post-install verify FAILED" >&2; exit 1; }
          echo "[w4a8] ON - int8 activations (patch by @A1RM4X, club-3090#1226; re-cut of @jb-seo's)" >&2
        else
          echo "[w4a8] off (W4A8=1 to enable; ~+44% prefill, ~-11% code decode)" >&2
        fi
        # ⚠️ CLIENT COMPATIBILITY — three OpenAI-extension fields that work on our vLLM
        # slugs are REFUSED by SGLang when stream=true (serving_chat.py, an explicit
        # guard, not a bug):
        #     return_token_ids · return_prompt_token_ids · return_meta_info
        # e.g. "return_token_ids is not supported with streaming on /v1/chat/completions.
        # Please set stream=false when using return_token_ids=true."
        # vLLM streams return_token_ids fine and llama.cpp has no such restriction, so an
        # client that works against vllm/qwen38-27b-* can fail here at REQUEST time — after
        # you have already committed to the slug. No workaround short of stream=false.
        # Reported by @Naelith (Discord), surfaced behind an API-switching proxy — the worst
        # shape of this: the proxy makes the backends look interchangeable right up until a
        # field one of them refuses.
        # ✅ MEASURED 2026-09-11 — the clients we ship and run are all CLEAN. Each was pointed
        # at a request-recording mock endpoint and its actual payload inspected:
        #     pi      streams; sends max_completion_tokens, messages, model, store, stream,
        #             stream_options, tools — none of the three
        #     hermes  streams; sends messages, model, reasoning_effort, stream,
        #             stream_options, thinking, tools — none of the three
        #     8-pack  benchlocal-cli + the HermesAgent sandbox set none of them and do not
        #             stream, so quality runs against sgl/ slugs are fine
        # ⇒ If you hit this, suspect the PROXY or a bespoke benchmarking client, not the
        #   agent — a translation layer is the thing likely to add return_token_ids for
        #   token accounting.
        # ⓘ hermes also sends `thinking`, which SGLang does not declare. It is TOLERATED
        #   (the request model ignores extras) but therefore silently DROPPED, not honoured
        #   — thinking must go via chat_template_kwargs / ENABLE_THINKING here.
        # ⓘ return_meta_info being non-streaming-only is also the ONLY clean way to read
        # per-request spec_accept_length out of this engine — see the accept-len A/B in
        # learnings/sglang-engine.md, which had to run non-streaming for exactly this reason.
        # --- sampler row + thinking default, mirroring the vLLM tiers (#1014) ---
        # The model card publishes TWO sampler rows; ENABLE_THINKING selects one.
        # Values verified against Qwen/Qwen3.8-27B's card 2026-09-11, and re-checked
        # on every provider we serve: the official FP8 and unsloth GGUF cards restate
        # both rows verbatim; Frozenlock / RadixArk / syvai / z-lab add no sampling
        # guidance of their own, so the base card governs for those checkpoints too.
        #
        # ⚠️⚠️ ONLY THE THINKING ROW ACTUALLY LANDS HERE — AND NOT BECAUSE OF THE
        # --preferred-sampling-params FLAG BELOW. Three mechanisms, two of which bite:
        #   1. --default-chat-template-kwargs IS enforced (applied to every request
        #      unless the request overrides it) -> the thinking MODE is real, and so
        #      is reasoning_effort.
        #   2. --sampling-defaults model (pinned below) makes the engine read the
        #      checkpoint's generation_config.json, which ships temperature 1.0 /
        #      top_k 20 / top_p 0.95 — EXACTLY the card's thinking row. THAT is what
        #      serves the thinking row: Qwen's file, not our flag. The file is
        #      byte-identical across our int4 and fp8 checkpoints, and there is no
        #      instruct row anywhere in any of them.
        #   3. --preferred-sampling-params is INERT on /v1/chat/completions. It IS
        #      merged (tokenizer_manager.py:1353, `{**preferred, **request}`), but the
        #      chat adapter's to_sampling_params resolves EVERY key eagerly through
        #      get_param() — user -> generation_config.json -> OpenAI default — so the
        #      request dict is always fully populated and always wins the merge. The
        #      merged result is byte-identical to the unmerged one. It bites only on
        #      the native /generate endpoint. (SGLang's own Responses-API path,
        #      protocol.py:1793, omits unset keys SPECIFICALLY so they fall through to
        #      this flag; the chat path does not — sglang#39096.)
        # ⇒ ENABLE_THINKING=false genuinely turns thinking OFF, but the SAMPLER STAYS
        #   ON THE THINKING ROW. A client wanting the instruct row must send
        #   temperature/top_p/presence_penalty itself — which is exactly what the
        #   model card's own non-thinking example does, and what bench.sh does.
        # ⇒ presence_penalty cannot be pinned server-side on EITHER engine: vLLM's
        #   get_diff_sampling_param() and SGLang's get_default_sampling_params() share
        #   the same allowlist (repetition_penalty, temperature, top_k, top_p, min_p),
        #   and both chat adapters declare presence_penalty with a hard 0.0 default, so
        #   it is always present in the request and always wins. The card anticipates
        #   this: "support for sampling parameters varies according to inference
        #   frameworks." It is a client-side parameter, full stop.
        # We keep the flag because /get_model_info then advertises the correct row to
        # clients that introspect it — the one thing it genuinely does.
        _think="${ENABLE_THINKING:-true}"
        _temp="${TEMP:-}"
        if [ "$$_think" = "true" ]; then
          : "$${_temp:=1.0}" "$${TOP_P:=0.95}" "$${PRESENCE_PENALTY:=0.0}"
          echo "[sampler] thinking row (ENABLE_THINKING=true): temp=$$_temp top_p=$${TOP_P} presence=$${PRESENCE_PENALTY}" >&2
          echo "[sampler]   temp/top_p/top_k served via generation_config.json (--sampling-defaults model)" >&2
        else
          : "$${_temp:=0.7}" "$${TOP_P:=0.80}" "$${PRESENCE_PENALTY:=1.5}"
          echo "[sampler] instruct row (ENABLE_THINKING=false): temp=$$_temp top_p=$${TOP_P} presence=$${PRESENCE_PENALTY}" >&2
          echo "[sampler]   ⚠️ thinking is OFF but the SAMPLER IS NOT: the engine still serves the" >&2
          echo "[sampler]   ⚠️ thinking row from generation_config.json. Send temperature/top_p/" >&2
          echo "[sampler]   ⚠️ presence_penalty per-request to get the instruct row." >&2
        fi
        echo "[sampler] ⚠️ presence_penalty is CLIENT-SIDE on both engines (engine allowlists drop it)" >&2
        # ⚠️⚠️ reasoning_effort MUST travel with enable_thinking. This checkpoint's
        # BUILT-IN template does `reasoning_effort|default('xhigh')` — the SLOWEST,
        # longest rung — so leaving it unset serves xhigh on EVERY request. The
        # vLLM tiers for this same model pin `low` (2026-08-16), so an unset value
        # here would make the two engines serve DIFFERENT reasoning depth by
        # default and stop being comparable at all.
        # ⚠️ Ladder is low / medium / xhigh — there is NO `high` rung. The vLLM
        # tiers mount a patched template that maps high -> xhigh; we use the
        # checkpoint's built-in template, which has no such mapping.
        _reff="${REASONING_EFFORT:-low}"
        case "$$_reff" in low|medium|xhigh) : ;; *) echo "[sampler] REASONING_EFFORT='$$_reff' must be low|medium|xhigh" >&2; exit 1 ;; esac
        echo "[sampler] reasoning_effort=$$_reff (template default would be xhigh)" >&2
        SAMPLER=(--default-chat-template-kwargs "{\"enable_thinking\": $$_think, \"reasoning_effort\": \"$$_reff\"}"
                 --sampling-defaults model
                 --preferred-sampling-params "{\"temperature\": $$_temp, \"top_p\": $${TOP_P}, \"top_k\": $${TOP_K:-20}, \"min_p\": $${MIN_P:-0.0}, \"presence_penalty\": $${PRESENCE_PENALTY}, \"repetition_penalty\": $${REPEAT_PENALTY:-1.0}}")
        # ⭐ MAMBA STATE SLOTS vs CONCURRENCY — measured 2026-09-13 (club-3090#1264).
        # `--max-running-requests` is not just a concurrency cap here: each running
        # request LOCKS 3 GDN state slots (1 active + 2 radix checkpoints — SGLang
        # calls this a FLOOR, not headroom), plus 1 global sink slot. So:
        #
        #     usable warm-prefix slots = max_mamba_cache_size - 1 - 3 x max_running_requests
        #
        # ⭐ MEASURED on the reference 2x3090 TP=2, 2026-09-14:
        #     max_mamba_cache_size = 21
        # ⚠️ READ YOUR OWN BOOT LINE — this differs per weight tier, drafter tier
        # and topology. The five dual composes measured 55 / 34 / 33 / 21 / 8;
        # a single pasted constant was wrong on four of them (club-3090#1319).
        #     Mamba Cache is allocated. max_mamba_cache_size: N
        #
        #     usable working slots = K - k x max_running_requests
        #
        # where k is set by --mamba-radix-cache-strategy (common.py:26-29):
        #     extra_buffer=3 (default) · extra_buffer_lazy=2 · no_buffer=1
        # ⚠️ There is NO -1 for a sink slot: MambaSlotAllocator's free list is
        # arange(1, K+1) with slot 0 reserved separately, so K is already net.
        # On this compose (K=21, k=3):
        #     max-running-requests=1   ->  18 usable
        #     max-running-requests=2   ->  15 usable
        #     max-running-requests=4   ->   9 usable
        #
        # ⭐ THE CONCURRENCY CLAMP USES A DIFFERENT RATIO. _calculate_mamba_ratio()
        # gives r=5 (extra_buffer+overlap) / 4 (lazy) / 3 (no_buffer), and
        # resolve_max_num_reqs() caps at K // r. Here that is 21 // 5 = 4,
        # so a request for 8 resolves to 4.
        # ⚠️ `server_args=` echoes the REQUEST; the later
        # `max_total_num_tokens=... max_running_requests=N ...` line is EFFECTIVE.
        #
        # ⚠️ extra_buffer_lazy is NOT a free saving: the auto-fit solve
        # K = floor((B - p(1+D)) / (p(1+D/r))) uses r, so 5->4 raises the
        # denominator and can SHRINK K. Measure K and capacity together.
        #
        # ⚠️ A slot caches ONE DISTINCT PREFIX. Depth is nearly free — measured:
        # a 14-turn / ~33K-token conversation never evicted at 14 slots. BREADTH is
        # what costs: at 14 slots, opening 20 distinct conversations evicted the
        # first (re-query 1.558s == its cold 1.540s) while the newest stayed warm
        # (0.086s). At 29 slots the same 20 conversations did NOT evict it (0.362s).
        #
        # So raising concurrency spends the prefix cache twice over — 3 slots per
        # stream, and more distinct conversations competing for what is left.
        # If you raise --max-running-requests, check the arithmetic above before
        # assuming prefix reuse still works.
        #
        # --mamba-full-memory-ratio trades state slots against KV tokens within a
        # FIXED budget (VRAM was identical in both arms, within 10 MiB):
        #     ratio 0.9 (default) -> 33 slots, 279,595 KV tokens
        #     ratio 0.3           -> 14 slots, 314,251 KV tokens  (+12.4% KV)
        # Lower it only for SINGLE-STREAM work, where few distinct prefixes are kept
        # warm and KV is the real constraint. For a multi-conversation estate the
        # cookbook's warning applies and 0.9 is right. Not changed by default.
        # ⭐ --enable-cache-report (club-3090#1297). Without it SGLang sets
        # usage.prompt_tokens_details to NULL on every response, streaming and
        # non-streaming alike — entrypoints/openai/usage_processor.py gates the
        # whole block on this flag (`enable_cache_report: bool = False`). So a
        # client cannot see how much of its prompt the prefix cache served, and
        # `null` is indistinguishable from "nothing was reused". Measured here:
        # 4,160 of a 4,212-token prompt served from cache (TTFT 3.150s -> 0.100s
        # on the repeat) while the API reported nothing at all.
        # Pure response shaping — the counters already exist, so it costs nothing
        # in the inference path. SGLang counterpart of vLLM's
        # --enable-prompt-tokens-details (#1246).
        # ⚠️⚠️ ABSENT IS NOT ZERO ON SGLANG. Even with the flag ON, SGLang OMITS
        # cached_tokens when the value is genuinely 0; vLLM instead sends
        # `cached_tokens: 0` explicitly. A consumer that reads a missing field as
        # "nothing was reused" cannot tell no-reuse from reporting-off — the same
        # misreading, one layer up. Read absent as UNKNOWN, not 0.
        # ⭐⭐ K IS PINNED AT 10 AND ctx RAISED TO 163840 — MEASURED, NOT ESTIMATED
        # (club-3090#16 follow-up, 2026-09-15). Auto-fit gives K=21 on this tier and
        # spends the surplus slots on breadth this slug does not use: it ships
        # --max-running-requests 1 and its role is a single-stream fidelity reference.
        #
        #   K   | max_total_num_tokens | avail mem | measured
        #   ----|----------------------|-----------|----------
        #   21  | 158,116              | 1.67 GB   | auto-fit (previous default)
        #   10  | 182,901              | 1.66 GB   | this default
        #
        # The exchange rate is EXACTLY the one measured on the int4 tier — 2,253.2 KV
        # tokens per mamba slot. Predicted 158,116 + 11 x 2,253.2 = 182,901; measured
        # 182,901. It is quant-INDEPENDENT because per-slot SSM bytes (conv/ssm shapes)
        # and per-token KV bytes (fp8_e4m3 over 17 KV-bearing layers incl. the MTP head)
        # are identical across the two tiers; only the BUDGET differs.
        #
        # ⚠️ WHAT THIS COSTS: usable warm-prefix slots = K - 3 x max_running_requests,
        # so 18 -> 7. Depth is unaffected (a long conversation occupies one slot);
        # BREADTH is what shrinks. If you keep many distinct conversations warm, raise
        # MAX_MAMBA_CACHE_SIZE back toward 21 and lower CONTEXT_LENGTH to match.
        # ⚠️ Draft acceptance was NOT measurably hurt (2.77 / 3.85 / 3.05 at K=10), but
        # accept len is noisy at N=1 — read that as "drafter alive", not "undegraded".
        #
        # ⚠️ ctx 163840 deliberately leaves ~19,061 tokens of radix headroom (1.12x).
        # 180224 would fit arithmetically at ~1.01x and is NOT chosen: this tier has the
        # slowest prefill on the rig (sm_86 has no native fp8 compute, so weights serve
        # weight-only through Marlin), and zero headroom means every miss is repaid at
        # full price. Do not raise ctx without re-reading the pool from YOUR boot line.
        #
        # ⚠️ HARD FLOOR: K >= 5 or the engine refuses to boot (max_num_reqs=0), and the
        # concurrency clamp is C = K // 5, so K=10 admits C=2. K=5 buys only ~11K more
        # tokens (~6%) while leaving 2 usable prefix slots — not worth it.
        # --mamba-radix-cache-strategy: env seam, default auto (no-op — resolves
        # to extra_buffer on both rigs). Sets k (slots/request) + r (clamp
        # divisor); see the k/r note in this header + docs/engines/SGLANG.md.
        exec python3 -m sglang.launch_server \
          --model-path "$$M" \
          --tp-size 2 \
          --disable-custom-all-reduce \
          --quantization "${QUANTIZATION:-fp8}" \
          --kv-cache-dtype "${KV_CACHE_DTYPE:-fp8_e4m3}" \
          --mamba-ssm-dtype "${MAMBA_SSM_DTYPE:-bfloat16}" \
          --mamba-radix-cache-strategy "${MAMBA_RADIX_CACHE_STRATEGY:-auto}" \
          --chunked-prefill-size "${CHUNKED_PREFILL_SIZE:-2048}" \
          --attention-backend "${ATTENTION_BACKEND:-flashinfer}" \
          --context-length "${CONTEXT_LENGTH:-163840}" \
          --mem-fraction-static "${MEM_FRACTION:-0.92}" \
          --max-running-requests "${MAX_RUNNING_REQUESTS:-1}" \
          --max-mamba-cache-size "${MAX_MAMBA_CACHE_SIZE:-10}" \
          "$${CACHE[@]}" \
          --trust-remote-code \
          --enable-metrics \
          --enable-cache-report \
          "$${SAMPLER[@]}" \
          --reasoning-parser "${REASONING_PARSER:-qwen3}" \
          --tool-call-parser "${TOOL_CALL_PARSER:-qwen3_coder}" \
          --host 0.0.0.0 --port 30000 \
          --served-model-name qwen3.8-27b \
          "$${SPEC[@]}"
    healthcheck:
      # ⚠️ club-3090#1295 — probe the container's ROUTABLE address, NEVER
      # loopback. The old probe was `curl -sf http://localhost:30000/health`,
      # which runs INSIDE the container against 127.0.0.1 — the one path that
      # stays up when the bind address is wrong. When #1292 silently dropped
      # `--host 0.0.0.0` this compose bound 127.0.0.1 and `docker ps` reported
      # "healthy" for 27 minutes while every external client got an instant
      # connection reset. It would have passed identically with the port mapping
      # deleted outright: it tested that the process was alive and READ as "the
      # service is reachable".
      # $${HOSTNAME} resolves (via the /etc/hosts entry docker writes) to the
      # address docker's port forward actually targets, so this check fails when
      # the server is bound somewhere a client cannot reach.
      # ⚠️ There is deliberately NO loopback fallback: degrading to the old probe
      # would restore the silent pass. Nothing in this repo gates on container
      # health (no depends_on: service_healthy, and switch.sh's ready probe curls
      # the endpoint from the HOST), so an unhealthy mark is a visible signal
      # rather than a boot blocker.
      test: ["CMD-SHELL", "curl -sf \"http://$${HOSTNAME:-$$(hostname)}:30000/health\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 900s

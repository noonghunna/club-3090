# ===========================================================================
# Profile (at-a-glance):
#   Model:     Qwen3.8-27B (4-bit GGUF + mmproj; default IQ4_NL)
#   Engine:    llama.cpp (mainline server-cuda)
#   Topology:  Single 3090 (TP=1)
#   Drafter:   MTP n=3 (built-in multi-token prediction)
#   KV:        q4_0 K + q4_0 V
#   Vision:    YES (mmproj mounted - multimodal input enabled)
#   Max ctx:   150000 default @ 1M-px (vision overhead eats ~50K headroom)
#   Status:    incubating - unbenchmarked on 3090
#   Engine-profile: llama-cpp-local
#   Best for:  Multimodal chat, screenshot-debugging, vision-aware code review.
# ---------------------------------------------------------------------------
# Qwen3.8-27B on llama.cpp - single 3090, 4-bit (default IQ4_NL) + vision.
#
# Vision overhead (mmproj BF16 projector + image encode buffers) consumes
# ~1.7 GB, so the safe context ceiling drops from 200K -> 150K.
#
# Weights source: bartowski/Qwen3.8-27B-GGUF
#   mmproj-Qwen3.8-27B-bf16.gguf - BF16 vision projector (~0.9 GB)
#
# Unsloth alternative: unsloth/Qwen3.8-27B-GGUF
#   mmproj-BF16.gguf - identical BF16 projector, same size
#   (swap the GGUF + mmproj paths if using unsloth weights)
#
# VRAM budget on 24 GB (IQ4_NL + vision); bench rig: Q4_K_M @ 131K:
#   weights (IQ4_NL):              ~16.3 GB
#   NOTE: bench rig used Q4_K_M (17.8 GB) at CTX_SIZE=131072; 200K-class ctx with
#         Q4_K_M OOMs. 150K + IQ4_NL + mmproj should fit (~20 GB) — untested.
#   KV at 150K (q4_0 K+V):         ~5.0 GB
#   mmproj BF16 (vision projector): ~0.9 GB
#   MTP draft head + overhead:      ~0.5 GB
#   image-encode tile buffers:      ~0.5 GB
#   total:                         ~21.7 GB
#   headroom:                      ~2.3 GB for prompt + activation peaks
#
# Quick start:
#   1. Get the GGUF + mmproj:
#        hf download bartowski/Qwen3.8-27B-GGUF Qwen3.8-27B-IQ4_NL.gguf \
#          --local-dir $MODEL_DIR/qwen3.8-27b-gguf/iq4ks
#        hf download bartowski/Qwen3.8-27B-GGUF mmproj-Qwen3.8-27B-bf16.gguf \
#          --local-dir $MODEL_DIR/qwen3.8-27b-gguf
#   2. From this directory:
#        MODEL_DIR=/your/models/dir docker compose -f iq4ks-vision.yml up -d
#   3. curl http://localhost:8020/v1/models  -> should list the model.
#
# Override defaults via .env or shell:
#   MODEL_DIR              host dir to mount as /models
#   GGUF_FILE              path under /models  (default: qwen3.8-27b-gguf/Qwen3.8-27B-IQ4_NL.gguf)
#   MMPROJ_FILE            path under /models  (default: qwen3.8-27b-gguf/mmproj-Qwen3.8-27B-bf16.gguf)
#   IMAGE_MIN_TOKENS       min tokens / image  (default: 1024)
#   IMAGE_MAX_TOKENS       max tokens / image  (default: 1024 = ~1M px)
#   CTX_SIZE               KV pool size        (default: 150000)
#   BATCH_SIZE             llama.cpp -b        (default: 1024)
#   UBATCH_SIZE            llama.cpp -ub       (default: 512)
#   KV_TYPE                K and V quant type  (default: q4_0)
#   NP                     parallel slots      (default: 1)
#   MTP_DRAFT_N_MAX        MTP draft tokens    (default: 3)
#   REASONING              thinking gate       (default: off)
#   REASONING_FORMAT       reasoning routing   (default: deepseek)
#   PORT                   host port           (default: 8020)
#   CUDA_VISIBLE_DEVICES   which GPU to use    (default: 0)

services:
  llama-cpp-qwen38-27b-iq4ks-vision:
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda-b9246}
    container_name: "${ESTATE_CONTAINER:-llama-cpp-qwen38-27b-iq4ks-vision}"
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8020}}:8080"
    volumes:
      - "${MODEL_DIR:-../../../../../../models-cache}:/models:ro"
    command: >-
      --host 0.0.0.0
      --port 8080
      -m /models/${GGUF_FILE:-qwen3.8-27b-gguf/Qwen3.8-27B-IQ4_NL.gguf}
      --mmproj /models/${MMPROJ_FILE:-qwen3.8-27b-gguf/mmproj-Qwen3.8-27B-bf16.gguf}
      --image-min-tokens ${IMAGE_MIN_TOKENS:-1024}
      --image-max-tokens ${IMAGE_MAX_TOKENS:-1024}
      -c ${CTX_SIZE:-150000}
      -b ${BATCH_SIZE:-1024}
      -ub ${UBATCH_SIZE:-512}
      -ngl 99
      -fa on
      --cache-type-k ${KV_TYPE:-q4_0}
      --cache-type-v ${KV_TYPE:-q4_0}
      -np ${NP:-1}
      --spec-type draft-mtp
      --spec-draft-n-max ${MTP_DRAFT_N_MAX:-3}
      --jinja
      --reasoning ${REASONING:-off}
      --reasoning-format ${REASONING_FORMAT:-deepseek}
      --temp ${TEMP:-${TEMPERATURE:-0.6}}
      --top-p ${TOP_P:-0.95}
      --top-k ${TOP_K:-20}
      --min-p ${MIN_P:-0.0}
      --repeat-penalty ${REPEAT_PENALTY:-1.0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ESTATE_GPUS:-${CUDA_VISIBLE_DEVICES:-0}}"]
              capabilities: [compute, utility]

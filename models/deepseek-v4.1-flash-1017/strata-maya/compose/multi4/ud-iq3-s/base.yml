# ===========================================================================
# Profile (at-a-glance):
#   Model:     DeepSeek-V4.1-Flash-1017 — unsloth's UD-IQ3_S GGUF (8 shards, 423.6 GB): routed experts IQ2_S /
#              IQ3_XXS / IQ3_S / Q3_K / MXFP4 by layer, dense weights Q8_0 / BF16, the Engram tables Q6_K in the
#              last shard (161.3 GB) (unsloth/DeepSeek-V4.1-Flash-1017-GGUF @8a6ec9cf, the revision Maya pins)
#   Engine:    Project Maya's maya-ds4 (DeepSeek's engine in Project Maya, a Strata fork) —
#              ghcr.io/noonghunna/strata-maya-club3090, built by club-3090 at the release commit
#              (models/glm-5.3-flash/strata-maya/image/)
#   Topology:  4× 24 GB, layer split over four cards (--tp 1: each card holds its own layers' dense part and an
#              expert pool of whole experts). No NCCL, no P2P needed. Tensor parallel is opt-in (Caveats)
#   Drafter:   none (DSpark off, as on the dual slug, where neither drafter build sped this quant up)
#   KV:        fp16 latent cache (maya-ds4 has no other)
#   Vision:    no (the image never fetches DeepSeek's vision tower: --vision off)
#   Max ctx:   65536
#   Genesis:   N/A — Genesis is Qwen3-Next-specific
#   Status:    🐣 Incubating
#   Caveats:   Not gate-passing yet: one request at a time, and NEVER BOOTED on the reference rig (2 GPUs):
#              multi4 is community-validated by design; its numbers come from community reports
#              (numbers-from-your-rig). The dual slug's measurements and 8-pack are in its header (same weights,
#              same engine). ⚠️ Host RAM: Maya copies the CPU lane's experts into RAM only when they all fit with
#              8 GiB to spare beside 8 GiB for the system (--mmap-experts auto; DS4_RAM_MARGIN_GB and MMAP_EXPERTS as
#              on the dual slug), and otherwise reads them in place from the files through the page cache, much
#              slower. Four cards hold more experts in VRAM than two, so the lane to copy is smaller than the
#              dual's 219 GB; by how much is not measured. The Engram tables stay on the disk either way (read a
#              row at a time). The FIRST start SHA-256-checks the 8 files (~424 GB) and builds Maya's pack on the
#              data volume (an index, no weights copied), in the same ud-iq3-s folder as the dual slug; later starts
#              skip both. Tensor parallel: MAYA_TP=4 alone does NOT form a group with this quant. Its experts'
#              256-value blocks don't split DeepSeek's FFN width (2304) into four whole parts, so the engine logs
#              "tensor parallel 4 -> 1" and runs this same layer split. MAYA_TP=4 MAYA_DS4_TP_GGUF_UNEVEN=1 forms a
#              four-wide group (whole blocks, 2-3 a member), the shape measured for Maya-XS and ISTA on four RTX 5080s
#              (#2047, #2054), not with this quant. Maya's own notes (tools/calibrate_ds4_tp.py, #502) put the
#              layer split on 2x RTX 3090 at ~22% more experts in VRAM and 1.55x the prompt reading of tensor
#              parallel, its decode 5-8% lower; Maya's ./maya.sh --calibrate tries both on your PC. Thinking: on by
#              default (effort high, Maya's own for DeepSeek); a request's enable_thinking false or reasoning_effort
#              none answers in DeepSeek's chat mode. Host needs NVIDIA driver >= 580 (CUDA 13) and an AVX2 CPU;
#              x86-64 only.
# CPU-Offload-Host-RAM-GB: 229
#   ⤷ NOT MEASURED (never booted here): the dual slug's 229 GB is the upper bound, as four cards keep more
#     experts in VRAM and leave a smaller CPU lane to copy into RAM. Maya sizes that copy from FREE memory at
#     start (see Caveats), so a host near this figure can pass preflight and still read the experts in place.
#   Best for:  the closer-to-original DeepSeek-V4.1-Flash on four 24 GB cards, on a host with RAM to spare
#              (the dual slug, strata-maya/deepseek41-flash-dual-ud-iq3-s, measured ~240 GB on two)
# ---------------------------------------------------------------------------
# Project Maya (github.com/mw00/project-maya) runs DeepSeek-V4.1-Flash-1017 on its own maya-ds4 engine: see
# docs/engines/STRATA_MAYA.md. UD-IQ3_S is in Maya's own setup list (--ds4-quant gguf-iq3_s); this compose uses
# the same files and SHA-256s.
# Siblings: ../../dual/ud-iq3-s/base.yml (dual); the other quants sit in ../../dual/.
#   bash scripts/switch.sh --force strata-maya/deepseek41-flash-multi4-ud-iq3-s
# The launcher (../../../launcher/) checks the files' SHA-256 once, builds Maya's pack on the data volume, writes
# the config and starts Maya's server. By hand: SETUP_ONLY=1 docker compose -f base.yml run --rm strata-maya,
# then up -d.
services:
  strata-maya:
    image: ${STRATA_MAYA_IMAGE:-ghcr.io/noonghunna/strata-maya-club3090@sha256:5d0b1f8d1c623a6f10485b69053a6d7f1f9076e33e38f0845e11d62136371f99}
    container_name: ${ESTATE_CONTAINER:-strata-maya-deepseek41-flash-multi4-ud-iq3-s}
    restart: ${CLUB3090_RESTART:-unless-stopped}
    # root, with the launcher's group: what Maya writes to the data volume stays removable by the user
    # (the entrypoint sets umask 0002)
    user: "0:${DOCKER_GID:-1000}"
    entrypoint: ["/bin/sh", "/opt/club3090/ds4-entrypoint.sh", "ud-iq3-s"]
    ulimits:
      memlock: -1            # Maya pins (locks) the experts it copies into RAM for the GPUs
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8208}}:8080"
    environment:
      CONTEXT: "${CONTEXT:-65536}"
      SETUP_ONLY: "${SETUP_ONLY:-0}"
      REPACK: "${REPACK:-0}"
      VERIFY: "${VERIFY:-1}"
      MAYA_GPUS: "${MAYA_GPUS:-0,1,2,3}"
      # 1 = a layer split over the four cards. MAYA_TP=4 needs MAYA_DS4_TP_GGUF_UNEVEN=1 below with this quant,
      # or the engine logs "tensor parallel 4 -> 1" and runs the layer split anyway (header, Caveats)
      MAYA_TP: "${MAYA_TP:-1}"
      # Maya's server defaults, written into maya-ds4.json at every boot by ds4_prepare.py
      # (launcher/ds4_settings.py maps each); unset = effort high, sampling 1.0 / 1.0, the name deepseek-v4.1-flash,
      # a CPU lane of half the CPUs (nproc / 2), the loop guard on (Maya's own)
      REASONING_EFFORT:
      ENABLE_THINKING:
      THINKING_BUDGET:
      TEMP:
      TOP_P:
      TOP_K:
      MIN_P:
      PRESENCE_PENALTY:
      REPEAT_PENALTY:
      SERVED_NAME:
      LOOP_GUARD:
      THREADS:
      # how maya-ds4 holds the CPU lane's experts (#2042): on = read in place from the files, off = copied into
      # RAM, auto (Maya's default) = copied when they all fit. Picks the mode directly instead of through
      # DS4_RAM_MARGIN_GB's sizing; ds4_settings.py writes it as --mmap-experts and refuses any other word
      MMAP_EXPERTS:
      # Maya's model load/unload endpoints (/models/load, /models/unload, /models/sse; on by default from
      # v1.1.47) and, from v1.1.50, its model API (/api/tags, /api/ps, /api/chat, ...). These composes set
      # no API key, so anyone who reaches the port can unload the model; /api/pull, /api/delete and a model
      # switch are refused from outside the container. MAYA_MODEL_MANAGEMENT=0 turns all of them off
      MAYA_MODEL_MANAGEMENT:
      # maya-ds4's RAM headroom (from v1.1.51): the GiB its memory planning leaves to everything else when it
      # sizes the expert copies, the warm-up and the prompt caches (0 to 4096). Unset = Maya's 8
      DS4_RAM_MARGIN_GB:
      # maya-ds4's prompt reading on a layer split (MAYA_TP=1, from v1.1.53): DS4_FLOW_COPY_DMA=1 DMAs a
      # streamed expert straight from its pinned RAM copy instead of copying it into staging first (the
      # same bytes). Only with the experts copied into RAM; nothing under MAYA_TP=2. Unset = off
      DS4_FLOW_COPY_DMA:
      # maya-ds4 tensor parallel on a GGUF pack (MAYA_TP >= 2; #2042), both read by the engine itself
      # (src/ds4/ds4_model.cu): MAYA_DS4_TP_GGUF_UNEVEN=1 splits each expert's FFN in whole blocks, as even as they
      # go, so a group whose members can't take equal parts still forms (Maya-XS on four cards); DS4_TP_SHARES=w0,w1,..
      # sets each member's share by hand, `off` the split as before. Unset = Maya's own (off; shares from each
      # member's free VRAM). More cards also need MAYA_GPUS and the launcher's --gpus
      MAYA_DS4_TP_GGUF_UNEVEN:
      DS4_TP_SHARES:
      # the PCIe expert lane on more than one GPU (v1.1.64, mw00/project-maya#956; read by maya-ds4): keep = it
      # streams as before v1.1.64, off = the lane off. Unset = Maya's own rule: a layer split turns the lane off
      # unless it measures faster, and the times file keeps that for the next start
      DS4_STREAM_TIE:
      # tensor parallel on Maya's own quants (MAYA_TP >= 2 with MAYA_DS4_TP_GGUF_UNEVEN; read by maya-ds4):
      # DS4_FLOW_TP=1 has the group's members read prompts on the flow too, each streaming its own rows (off the
      # flow, a box that streams experts from the disk reads prompts much slower). Unset = off
      DS4_FLOW_TP:
      # tensor parallel groups of 3 on a GGUF pack (experimental; read by maya-ds4): DS4_TP_UNEVEN_HEADS=1 keeps a
      # width the 64 attention heads don't split into evenly, the extra member computing only its FFN share.
      # Unset = off
      DS4_TP_UNEVEN_HEADS:
      # conversations kept (read by maya-ds4 and Maya's server): MAYA_DS4_SLOT_KEEP=1 keeps a conversation's state
      # when another one takes the model, so an agent's parent and workers each continue their own instead of
      # reading it again from token 0; MAYA_DS4_KEEP_THINKING=1 keeps earlier turns' reasoning in the prompt,
      # which a chat without tools needs beside it (a request with tools keeps it already). Unset = off for both
      MAYA_DS4_SLOT_KEEP:
      MAYA_DS4_KEEP_THINKING:
      # DeepSeek's idle sleeps (v1.1.66, mw00/project-maya#951; read by maya-ds4): an idle engine's service thread
      # naps MAYA_DS4_SERVICE_NAP_US microseconds between looks for work (1..10000), then MAYA_DS4_SERVICE_SLEEP_MS
      # milliseconds after a longer quiet (1..1000). Longer sleeps lower a waiting server's CPU use; the first token
      # after a pause can wait up to one sleep. Unset = Maya's 100 us / 2 ms
      MAYA_DS4_SERVICE_NAP_US:
      MAYA_DS4_SERVICE_SLEEP_MS:
      # the entrypoint passes --host 0.0.0.0 and --port 8080 itself
    volumes:
      # the quant's own folder (unsloth's repo layout: one folder a quant); no drafter is mounted, so the pack
      # holds none (pack_gguf.py would otherwise take <model>/../dspark/)
      - "${MODEL_DIR:-../../../../../../models-cache}/deepseek-v4.1-flash-1017-gguf/UD-IQ3_S:/gguf:ro"
      # one folder per quant (Maya's pack, the config, the engine's log); the launchers put it under
      # ~/.local/share/club-3090, beside the GLM-5.3-Flash quants' folders
      - "${STRATA_MAYA_DATA_DIR:-${CLUB3090_DATA_DIR:-../../..}/strata-maya-data}:/data"
      - "../../../launcher:/opt/club3090:ro"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${ESTATE_GPUS:-${CUDA_VISIBLE_DEVICES:-0,1,2,3}}']
              capabilities: [gpu]

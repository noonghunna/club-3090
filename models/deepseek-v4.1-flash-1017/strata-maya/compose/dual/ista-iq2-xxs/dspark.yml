# ===========================================================================
# Profile (at-a-glance):
#   Model:     DeepSeek-V4.1-Flash-1017 — ISTA-DASLab's GSQ-RCO IQ2_XXS GGUF (4 shards, 138.2 GB) + the shared Engram
#              tables in IQ4_NL (110.6 GB): routed experts IQ1_M / IQ2_XXS / IQ2_XS by ISTA's own allocation, dense
#              weights Q5_K (ISTA-DASLab/DeepSeek-V4.1-Flash-1017-GSQ-RCO-GGUF @85d6710f)
#   Engine:    Project Maya's maya-ds4 (DeepSeek's engine in Project Maya, a Strata fork) —
#              ghcr.io/noonghunna/strata-maya-club3090, built by club-3090 at the release commit
#              (models/glm-5.3-flash/strata-maya/image/)
#   Topology:  Dual 3090, layer split (--tp 1 on two GPUs): each card holds its own layers' dense part and an
#              expert pool of whole experts, so both cards fill (with tensor parallel the second card keeps
#              ~4 GB it can't use when the drafter is on). No NCCL, no P2P needed
#   Drafter:   DSpark: peasantsmith's dspark-xs2 (Maya-XS's 2-bit drafter, 4.25 GB; draft block 5)
#   KV:        fp16 latent cache (maya-ds4 has no other)
#   Vision:    no (the image never fetches DeepSeek's vision tower: --vision off)
#   Max ctx:   65536
#   Genesis:   N/A — Genesis is Qwen3-Next-specific
#   Status:    🐣 Incubating
#   Caveats:   Not gate-passing yet: quality unmeasured here (8-pack pending), one request at a time. The FIRST
#              start SHA-256-checks the 7 files (~255 GB: 2 min on the reference rig) and builds Maya's pack on
#              the data volume (under a second: an index, no weights copied): ready in 183 s. A later start
#              skips both: ready in 56 s on the reference rig, from a cold page cache.
#              Maya v1.1.27-v1.1.29's pack builder left the DSpark geometry at 0 for ISTA's GGUF, which carries none,
#              so the drafter loaded and never drafted unless the launcher wrote the values in; v1.1.30's pack
#              builder fills in DeepSeek-V4.1-Flash's own (docs/UPSTREAM.md). Maya copies every CPU-side expert into RAM when it
#              fits (--mmap-experts auto): 100.4 GB here, so a host with less RAM reads them from the files while
#              it answers (slower, not measured). The CPU lane's threads default to half the CPUs (nproc / 2,
#              safe on any host); a rig that has measured its own sets THREADS. The reference rig runs 24 of 32:
#              the best count in Strata's port of this engine, where 16 cost 4-5% of decode and the engine's own
#              default (a thread a core, two left spare: ~30) ~40%; not re-measured on maya-ds4. Thinking: on by
#              default (effort high, Maya's own for DeepSeek); a request's enable_thinking false or
#              reasoning_effort none answers in DeepSeek's chat mode. Host needs NVIDIA driver >= 580 (CUDA 13)
#              and an AVX2 CPU; x86-64 only.
#              MEASURED 2026-10-25 on two 3090s capped at 230 W (v1.1.28 image, through switch.sh, bench.sh on
#              its own boot, 24 CPU threads, the default then, effort high): 45.34 / 52.46 tok/s decode
#              (narrative / code), 799 / 911 / 1,055 tok/s prefill @6K / @10K / @60K; DSpark kept 82.7% of
#              drafts; verify-full all ✓ (vision n/a); VRAM 23,700 MiB a card. At STOCK power (370 / 420 W,
#              2026-10-26, its own boot): prefill 1,045 / 1,186 / 1,390 (+30-32%), decode 45.79 / 50.97 (the
#              same within noise). Prompt reading is GPU-bound; decode is set by the CPU lane.
# CPU-Offload-Host-RAM-GB: 106
#   ⤷ MEASURED 2026-10-25 on this compose (v1.1.28): MemAvailable fell 106 GB (decimal) at its peak on the
#     first start, 105.6 GB on the bench boot; the CPU lane's 100.4 GB of experts copied into RAM
#     (--mmap-experts auto), on a 224 GB host.
#   Best for:  DeepSeek-V4.1-Flash on two 24 GB cards with ~128 GB+ of host RAM; long prompts (agents): in a
#              hand-run test at 8K context a layer split read a 6K prompt 55% faster than tensor parallel
# ---------------------------------------------------------------------------
# Project Maya (github.com/mw00/project-maya) runs DeepSeek-V4.1-Flash-1017 on its own maya-ds4 engine: see
# docs/engines/STRATA_MAYA.md.
#   bash scripts/switch.sh --force strata-maya/deepseek41-flash-dual-ista-iq2-xxs
# The launcher (../../../launcher/) checks the files' SHA-256 once, builds Maya's pack on the data volume, writes
# the config and starts Maya's server. By hand: SETUP_ONLY=1 docker compose -f dspark.yml run --rm strata-maya,
# then up -d. MAYA_TP=2 runs tensor parallel instead (in that hand-run test, 2026-10-25: decode +9% / +5%,
# a 6K prompt -35%; not re-measured on this compose).
services:
  strata-maya:
    image: ${STRATA_MAYA_IMAGE:-ghcr.io/noonghunna/strata-maya-club3090@sha256:e8a413a830642e1a700aa4fdd97b619f05a4de3bd36b51063d5a2780ea13f6b9}
    container_name: ${ESTATE_CONTAINER:-strata-maya-deepseek41-flash-dual-ista-iq2-xxs}
    restart: ${CLUB3090_RESTART:-unless-stopped}
    # root, with the launcher's group: what Maya writes to the data volume stays removable by the user
    # (the entrypoint sets umask 0002)
    user: "0:${DOCKER_GID:-1000}"
    entrypoint: ["/bin/sh", "/opt/club3090/ds4-entrypoint.sh", "ista-iq2-xxs"]
    ulimits:
      memlock: -1            # Maya pins (locks) the experts it copies into RAM for the GPUs
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8047}}:8080"
    environment:
      CONTEXT: "${CONTEXT:-65536}"
      SETUP_ONLY: "${SETUP_ONLY:-0}"
      REPACK: "${REPACK:-0}"
      VERIFY: "${VERIFY:-1}"
      MAYA_GPUS: "${MAYA_GPUS:-0,1}"
      MAYA_TP: "${MAYA_TP:-1}"
      # Maya's server defaults, written into maya-ds4.json at every boot by ds4_prepare.py
      # (launcher/ds4_settings.py maps each); unset = effort high, sampling 1.0 / 1.0, the name deepseek-v4.1-flash,
      # a CPU lane of half the CPUs (nproc / 2), the loop guard on (Maya's own)
      REASONING_EFFORT:
      ENABLE_THINKING:
      THINKING_BUDGET:
      TEMP:
      TOP_P:
      TOP_K:
      MIN_P:
      PRESENCE_PENALTY:
      REPEAT_PENALTY:
      SERVED_NAME:
      LOOP_GUARD:
      THREADS:
      # the entrypoint passes --host 0.0.0.0 and --port 8080 itself
    volumes:
      - "${MODEL_DIR:-../../../../../../models-cache}/deepseek-v4.1-flash-1017-gsq-rco-gguf:/gguf:ro"
      - "${MODEL_DIR:-../../../../../../models-cache}/deepseek-v4.1-flash-1017-maya-gguf/dspark:/dspark:ro"
      # one folder per quant (Maya's pack, the config, the engine's log); the launchers put it under
      # ~/.local/share/club-3090, beside the GLM-5.3-Flash quants' folders
      - "${STRATA_MAYA_DATA_DIR:-${CLUB3090_DATA_DIR:-../../..}/strata-maya-data}:/data"
      - "../../../launcher:/opt/club3090:ro"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${ESTATE_GPUS:-${CUDA_VISIBLE_DEVICES:-0,1}}']
              capabilities: [gpu]

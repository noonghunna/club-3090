# ===========================================================================
# Profile (at-a-glance):
#   Model:     DeepSeek-V4.1-Flash-1017 — Project Maya's Maya-XS v2 GGUF (3 shards, 116.8 GB: every routed expert
#              IQ1_S with error-feedback rounding, dense weights Q8_0) + the Q6_K Engram table pair it shares with
#              Maya-S (161.3 GB, the two shards the repo keeps in the same folder) — 278.1 GB
#              (peasantsmith/DeepSeek-V4.1-Flash-1017-Maya-GGUF @c33d87b8, the revision Maya pins)
#   Engine:    Project Maya's maya-ds4 (DeepSeek's engine in Project Maya, a Strata fork) —
#              ghcr.io/noonghunna/strata-maya-club3090, built by club-3090 at the release commit
#              (models/glm-5.3-flash/strata-maya/image/)
#   Topology:  Dual 3090, layer split (--tp 1 on two GPUs): each card holds its own layers' dense part and an
#              expert pool of whole experts. No NCCL, no P2P needed
#   Drafter:   DSpark: peasantsmith's dspark-xs2 (this quant's own 2-bit drafter, 4.25 GB; draft block 5)
#   KV:        fp16 latent cache (maya-ds4 has no other)
#   Vision:    no (the image never fetches DeepSeek's vision tower: --vision off)
#   Max ctx:   65536
#   Genesis:   N/A — Genesis is Qwen3-Next-specific
#   Status:    🐣 Incubating
#   Caveats:   Not promoted yet: measured on one community rig (#1989), and its v1.1.56 run lost the engine
#              twice (below). One request at a time. That rig has run bench, verify-full, verify-stress,
#              soak-continuous (PASS) and the 8-pack on both legs (BENCHMARKS.md).
#              This is the DeepSeek-V4.1-Flash quant for a ~92 GB host: Maya's manifest
#              (tools/ds4/download_gguf.json, maya/quants/Maya-XS) says 121 GB of VRAM + RAM hold it, its drafter
#              included, so on two 24 GB cards the CPU lane's share is ~75-80 GB — under this rig's 91.9 GiB, but
#              not by much. Maya pins the CPU experts in RAM only when they fit with DS4_RAM_MARGIN_GB (Maya's 8)
#              to spare (--mmap-experts auto); a host that falls short reads them in place from the files through
#              the page cache instead. ⚠️ This rig's 92 GB boot landed in that second mode: the engine read 85.0 GB
#              free against the 74.1 GB it prices that choice with — its own line is "the most-routed 74.1 GB read
#              ahead", a read-ahead set, not the whole lane: the 10,427 experts on it together are the 74.5 GB the
#              measured note below and the registry quote. It left every one of them in place in the files,
#              nothing pinned. DS4_RAM_MARGIN_GB is the knob that decides which mode a host gets.
#              What the mode costs on this rig (#1989, one boot each, v1.1.56 / v1.1.57): in place, 45.6 /
#              40.8 tok/s narrative decode, 54.7 code, 1,034 / 1,105 prefill at 10K; DS4_RAM_MARGIN_GB=0 pinned the
#              whole CPU lane (10,416 experts, 74.7 GB, ~34 s at boot) and gave 52.0 / 60.4 decode but 907 prefill,
#              with 8.1 GiB left to the host. So 0 is the faster interactive setting on a ~92 GB host that runs
#              nothing else, at a prefill cost; the default stays Maya's 8 until the pinned arm has a second boot
#              and a continuous soak. (The UD-IQ3_S slug's 7x slower prompt reads on a near-miss host came from
#              another quant's logit-dump path; on this quant the in-place mode read prompts faster at 10K.)
#              ⚠️ In place on a 92 GiB host, once (v1.1.56, a host 38.5 h up): the kernel's global OOM killer took
#              maya-ds4 (77.1 GiB of it file-backed) and, 20 minutes later, 14 more processes, the restarted
#              engine and the gateway among them. Not seen since on a fresh host boot, in place or pinned. The
#              same run's other death was a segfault (-11) reading a 247-token prompt, with no OOM record near it.
#              Stop whatever else holds RAM before booting. The 161.3 GB Engram tables stay on the disk either way
#              (read a few rows a token, ~0.3 MB a token) — a fast NVMe is part of the design.
#              The FIRST start SHA-256-checks the 7 files (278 GB of model and tables plus 4.25 GB of drafter) and
#              builds Maya's pack on the data volume (an index, no weights copied); later starts skip both.
#              Quality vs the sibling quants: Maya's card gives Maya-XS 87.5% the same top token as the original and
#              +8.7% next-token loss, against Maya-S's 92.6% / +3.2%; UD-IQ3_S measured 4.56 perplexity and ISTA's
#              IQ2_XXS 4.97 on one 4,096-token sequence (2026-11-02), Maya-XS not run through that comparison.
#              Thinking: on by default (effort high, Maya's own for DeepSeek); a request's enable_thinking false or
#              reasoning_effort none answers in DeepSeek's chat mode.
#              Host needs NVIDIA driver >= 580 (CUDA 13) and an AVX2 CPU; x86-64 only.
#   Quality:   toolcall-15 13/15 (87%) · instructfollow-15 15/15 (100%) · structoutput-15 14/15 (93%) · dataextract-15 11/15 (73%) · reasonmath-15 15/15 (100%) · bugfind-15 15/15 (100%) · hermesagent-20 15/20 (75%) · cli-40 32/40 (80%) (--full, thinking ON, sampling=server, validity=valid, packs tc1.0.1·if2.0.0·so2.1.0·de1.2.0·rm1.1.0·bf1.0.1·hm1.0.0·cli1.0.2, 2026-11-09)
#              Total 130/150 pass@1, 137/150 pass@3, 7 flaky, 1 runaway (cli-40 CLI-33, token_limit). v1.1.56
#              image on its own boot through switch.sh, REASONING_EFFORT=low (the slug's default is high), the
#              wrapper's budgets (4,096 an answer, 16,384 of thinking), the server's sampler (temperature 1.0,
#              top_p 1.0), 1h33m. The thinking leg only; #1989's rig has run both legs since (BENCHMARKS.md).
#              Against the UD-IQ3_S slug's thinking leg (2026-11-03, effort HIGH, so not a controlled A/B), the
#              totals are identical, 130/150 and 137/150, reached differently: this quant +2 on reasonmath, -2 on
#              dataextract, -1 on hermesagent, +1 on cli-40. The 87.5%-top-token quant holds the 423.6 GB one on
#              this harness, on a host with a quarter of its RAM.
# CPU-Offload-Host-RAM-GB: 80
#   ⤷ DERIVED from the built pack's tensor table. Everything the engine must hold except
#     the Engram tables is 121.09 GB - routed experts 109.57 (40 layers x 384 experts x w1/w2/w3, IQ1_S 95.55 +
#     IQ2_XXS 14.01), dense + attention + head 7.27, the drafter's 4.25 - which is exactly Maya's manifest
#     memory_gb: 121; the 161.28 GB of Q6_K tables never enter RAM. Two 24 GB cards hold at most ~51.5 of the 121
#     (and not all of that: KV, activations, the CUDA context), so the host carries the rest - ~73 GB if the cards'
#     expert pool fills to its ceiling, ~85 if it keeps only ~35. 80 is the gate's worst case.
#     First boot (2026-11-09, a 91.9 GiB rig, v1.1.56, through switch.sh) agrees with the split: the two pools
#     filled to 19.21 / 19.62 GB of experts (2,558 of 7,680 and 2,759 of 8,064 routed experts, 582 / 584 MiB
#     free), the CPU lane kept the other 10,427 (74.5 GB), and maya-ds4's own reading of the RAM free for them
#     was 85.0 GB - inside the 73-85 band, and above the 80 the gate asks for. Still DERIVED, not MEASURED: the
#     sibling slugs' numbers (ISTA IQ2_XXS 106 GB, UD-IQ3_S 229 GB, both decimal on a 224 / 257 GB host) are the
#     MemAvailable fall across a boot, which this one never recorded.
#   Best for:  DeepSeek-V4.1-Flash on two 24 GB cards on a host with ~92-128 GB of RAM — the only quant of this
#              model that fits here: the ISTA IQ2_XXS slug (strata-maya/deepseek41-flash-dual-ista-iq2-xxs) needs
#              ~106 GB of host RAM and unsloth's UD-IQ3_S ~229 GB measured (263 in Maya's manifest)
# ---------------------------------------------------------------------------
# Project Maya (github.com/mw00/project-maya) runs DeepSeek-V4.1-Flash-1017 on its own maya-ds4 engine: see
# docs/engines/STRATA_MAYA.md. Maya-XS is in Maya's own setup list (`./setup.sh --setup --model
# DeepSeek-V4.1-Flash-1017 --ds4-quant maya-xs`, setup id deepseek-maya-xs, v1.1.22+); this compose uses the same
# files and SHA-256s. The Q6_K table pair is a GGUF set of its own, not shards of the model's split, and pack_gguf.py
# stops at "the shards of more than one GGUF split (-of-00003, -of-00005): name the model's own with --shards", so the
# two files are mounted at /engram and the pack indexes them with --engram - Maya's own layout, which keeps them in an
# Engram-Q6_K/ folder beside the quant. The Hugging Face repo keeps them inside Maya-XS/, so they are mounted as two
# files rather than a folder of their own; the pack records them as ../engram/<name> against model_dir /gguf.
#   bash scripts/switch.sh --force strata-maya/deepseek41-flash-dual-maya-xs
# The launcher (../../../launcher/) checks the files' SHA-256 once, builds Maya's pack on the data volume, writes
# the config and starts Maya's server. By hand: SETUP_ONLY=1 docker compose -f dspark.yml run --rm strata-maya,
# then up -d.
services:
  strata-maya:
    image: ${STRATA_MAYA_IMAGE:-ghcr.io/noonghunna/strata-maya-club3090@sha256:7696232074064ea69012fcd9bc4366b84fcca7c03400b55661b5bde4b6204ec3}
    container_name: ${ESTATE_CONTAINER:-strata-maya-deepseek41-flash-dual-maya-xs}
    restart: ${CLUB3090_RESTART:-unless-stopped}
    # root, with the launcher's group: what Maya writes to the data volume stays removable by the user
    # (the entrypoint sets umask 0002)
    user: "0:${DOCKER_GID:-1000}"
    entrypoint: ["/bin/sh", "/opt/club3090/ds4-entrypoint.sh", "maya-xs"]
    ulimits:
      memlock: -1            # Maya pins (locks) the experts it copies into RAM for the GPUs
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8146}}:8080"
    environment:
      CONTEXT: "${CONTEXT:-65536}"
      SETUP_ONLY: "${SETUP_ONLY:-0}"
      REPACK: "${REPACK:-0}"
      VERIFY: "${VERIFY:-1}"
      MAYA_GPUS: "${MAYA_GPUS:-0,1}"
      MAYA_TP: "${MAYA_TP:-1}"
      # Maya's server defaults, written into maya-ds4.json at every boot by ds4_prepare.py
      # (launcher/ds4_settings.py maps each); unset = effort high, sampling 1.0 / 1.0, the name deepseek-v4.1-flash,
      # a CPU lane of half the CPUs (nproc / 2), the loop guard on (Maya's own)
      REASONING_EFFORT:
      ENABLE_THINKING:
      THINKING_BUDGET:
      TEMP:
      TOP_P:
      TOP_K:
      MIN_P:
      PRESENCE_PENALTY:
      REPEAT_PENALTY:
      SERVED_NAME:
      LOOP_GUARD:
      THREADS:
      # Maya's model load/unload endpoints (/models/load, /models/unload, /models/sse; on by default from
      # v1.1.47) and, from v1.1.50, its model API (/api/tags, /api/ps, /api/chat, ...). These composes set
      # no API key, so anyone who reaches the port can unload the model; /api/pull, /api/delete and a model
      # switch are refused from outside the container. MAYA_MODEL_MANAGEMENT=0 turns all of them off
      MAYA_MODEL_MANAGEMENT:
      # maya-ds4's RAM headroom (from v1.1.51): the GiB its memory planning leaves to everything else when it
      # sizes the expert copies, the warm-up and the prompt caches (0 to 4096). Unset = Maya's 8. On a 92 GB host
      # this is the knob that decides whether the CPU experts get pinned or read in place
      DS4_RAM_MARGIN_GB:
      # maya-ds4's prompt reading on a layer split (MAYA_TP=1, from v1.1.53): DS4_FLOW_COPY_DMA=1 DMAs a
      # streamed expert straight from its pinned RAM copy instead of copying it into staging first (the
      # same bytes). Only with the experts copied into RAM; nothing under MAYA_TP=2. Unset = off
      DS4_FLOW_COPY_DMA:
      # the entrypoint passes --host 0.0.0.0 and --port 8080 itself
    volumes:
      # the quant's own folder (Maya's repo layout: one folder a quant) and, beside it, the shared dspark/ folder the
      # pack reads with --drafter
      - "${MODEL_DIR:-../../../../../../models-cache}/deepseek-v4.1-flash-1017-maya-gguf/Maya-XS:/gguf:ro"
      - "${MODEL_DIR:-../../../../../../models-cache}/deepseek-v4.1-flash-1017-maya-gguf/dspark:/dspark:ro"
      # the Q6_K Engram table pair, as a folder of its own. The Hugging Face repo keeps these two inside Maya-XS/
      # (they are v1's files 4-5; v2 replaced the model files only), but they are a GGUF set, not shards of the
      # model's split: pack_gguf.py stops at "the shards of more than one GGUF split (-of-00003, -of-00005): name the
      # model's own with --shards". So the two files are mounted into /engram, which the pack indexes with --engram
      # and the engine reads the tables from at runtime. Two file mounts rather than the folder again: a second mount
      # of Maya-XS/ would hand the pack the model's own shards as part of the set.
      - "${MODEL_DIR:-../../../../../../models-cache}/deepseek-v4.1-flash-1017-maya-gguf/Maya-XS/DeepSeek-V4.1-Flash-1017-Maya-XS-IQ1_S-00004-of-00005.gguf:/engram/DeepSeek-V4.1-Flash-1017-Maya-XS-IQ1_S-00004-of-00005.gguf:ro"
      - "${MODEL_DIR:-../../../../../../models-cache}/deepseek-v4.1-flash-1017-maya-gguf/Maya-XS/DeepSeek-V4.1-Flash-1017-Maya-XS-IQ1_S-00005-of-00005.gguf:/engram/DeepSeek-V4.1-Flash-1017-Maya-XS-IQ1_S-00005-of-00005.gguf:ro"
      # one folder per quant (Maya's pack, the config, the engine's log); the launchers put it under
      # ~/.local/share/club-3090, beside the other DeepSeek quants' folders
      - "${STRATA_MAYA_DATA_DIR:-${CLUB3090_DATA_DIR:-../../..}/strata-maya-data}:/data"
      - "../../../launcher:/opt/club3090:ro"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${ESTATE_GPUS:-${CUDA_VISIBLE_DEVICES:-0,1}}']
              capabilities: [gpu]

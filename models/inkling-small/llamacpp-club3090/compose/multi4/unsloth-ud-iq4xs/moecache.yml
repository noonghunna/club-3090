# ===========================================================================
# Profile (at-a-glance):
#   Model:     Inkling-Small (263B MoE, Thinking Machines — unsloth UD-IQ4_XS,
#              119 GB across 4 shards. ⚠️ MIXED expert precision: iq3_s +
#              iq4_xs + q6_K, which the cache allocates as THREE pools per card)
#   Engine:    llamacpp-club3090-v1.1 (fork: leloch's MoE expert cache + our
#              L1/L3/E ports and bypass warn-split, PLUS vendored ggml-org#25731
#              for the inkling arch — a separate pin from the v1 engine)
#   Topology:  Quad 3090 PCIe (layer-split -ts 1,1,1,1, no NVLink)
#   Drafter:   none — the GGUF carries no MTP head and no drafter is converted
#   KV:        fp16 (llama.cpp default — iSWA keeps it to 7.5 GB even at 262K)
#   Vision:    no (upstream model is multimodal; this GGUF ships no mmproj)
#   Max ctx:   262144
#   Genesis:   N/A — llama.cpp engine
#   Status:    🧪 Experimental
#   Caveats:   • ⏸️ VENDORS AN UNMERGED UPSTREAM PR. The `inkling` architecture
#                is NOT in llama.cpp mainline — it lives in the open draft
#                ggml-org/llama.cpp#25731, vendored into the engine this slug
#                pins (`llamacpp-club3090-v1.1`). Stock llama.cpp fails with
#                `unknown model architecture: 'inkling'`. When #25731 merges the
#                vendored copy is dropped and this repoints to the v1 engine.
#              • ⚠️ ATTRIBUTION: the MoE expert cache is **leloch's** work
#                (github.com/leloch/llama.cpp, RFC ggml-org#24528). This slug
#                packages it. The inkling arch is @danielhanchen's PR, vendored,
#                not ours — we maintain neither.
#              • ⚠️ REASONING IS ON BY DEFAULT at effort 0.9. This model reads
#                `reasoning_effort` (none/minimal/low/medium/high/xhigh/max, or a
#                float 0.0-0.99) — NOT `enable_thinking`, which it IGNORES
#                SILENTLY. A client sending a small max_tokens without setting
#                effort gets an EMPTY answer and no error. Set it explicitly:
#                  {"reasoning_effort": "none",
#                   "chat_template_kwargs": {"reasoning_effort": "none"}}
#                Both are needed: llama.cpp parses the top-level parameter but
#                only maps the value "none", onto a variable this template does
#                not read, so the kwargs copy is what actually lands.
#              • ⚠️ SAMPLING: Unsloth specifies temp 1.0 / top_p 1.0 / min_p 0.0
#                for this model, NOT the stack-canonical Qwen 0.6/0.95. The
#                bench numbers below were taken at the canonical setting (which
#                is throughput-safe); any QUALITY work must use the model's own.
#              • ⚠️ QUALITY IS UNTESTED. No 8-pack has been run.
#              • Length-dependent logit scaling engages above 128K context
#                (`log_scaling_n_floor`), so behaviour at 8K does not
#                extrapolate to 512K. Do not A/B across that boundary.
#              • ⚠️ COLD-START TAX, and it is LONG: the expert cache was still
#                filling after 25 turns of soak (+49% decode session 1 → 5).
#                Never benchmark early requests, and treat any short-run decode
#                figure on this config as a LOWER BOUND.
#              • Tuning is 2×24 GB SPECIFIC (RESERVE_MB=1536, ADMIT_AFTER=64,
#                inherited from the DeepSeek derivation on this topology).
#                Re-derive for any other card count or VRAM size.
#              • 1M context does NOT fit: the KV allocates fine, but the prefill
#                compute buffer wants 9,450 MiB on device 0 and the boot dies.
#                262K is a deliberate choice, not the model's ceiling.
#              • Needs ~121 GB of HOST RAM — a HARD gate, and it does NOT fall
#                with card count. All 40 routed-expert layers stay on CPU on any
#                number of cards; more cards buy a bigger expert-cache POOL, not
#                a smaller CPU buffer, because the cache is a VRAM-side COPY.
#                preflight REFUSES below it; arithmetic in the
#                CPU-Offload-Host-RAM-GB block near the bottom of this header.
#                A host-RAM-bound owner wants the dual `residency.yml` instead,
#                which PINS bundles into VRAM (no 4-card sibling of it exists —
#                the reference rig has 2 cards, so nothing 4-card is derivable).
#              • Load takes several minutes (--no-mmap).
#              • ⚠️⚠️ NOTHING IN THIS FILE WAS MEASURED ON 4 CARDS. Every number,
#                and every tuning constant, is INHERITED from the validated dual
#                slug — same precedent as the DeepSeek multi4 sibling. This
#                config has never been booted. Treat it as a starting point to
#                validate, not a result.
#              • ⚠️ RESERVE_MB/ADMIT_AFTER were derived from a MEASURED
#                compute-buffer swing on 2×24 GB. They are topology-specific and
#                are almost certainly WRONG here — re-derive before trusting any
#                number this config produces.
#   Quality:   toolcall-15 12/15 · instructfollow-15 12/15 · structoutput-15 14/15
#              · dataextract-15 13/15 · reasonmath-15 12/15 · bugfind-15 14/15
#              · hermesagent-20 9/20 · cli-40 24/40
#              = 110/150 reasoning-OFF (pass@3 121/150)
#              Reasoning-ON leg: 115/150 (pass@3 125/150) at the default effort 0.9.
#              ⚠️ Sampling = the MODEL's (temp 1.0 / top_p 1.0 / min_p 0.0), not canonical.
#              ⚠️ Reasoning is +5 pass@1 / +4 pass@3 overall but NOT uniform: toolcall
#                 12->11 (-2 pass@3) and hermesagent 9->7 pass@1 with pass@3 IDENTICAL
#                 at 12/20. Tool-calling workloads: use reasoning_effort "none".
#              (measured on the DUAL slug — this config has never been booted)
#   Best for:  Long-context and agentic Inkling serving once the engine gate
#              clears — sub-linear TTFT growth to 30K accumulated context.
# ---------------------------------------------------------------------------
# WHY THIS EXISTS
#   Inkling-Small is the SECOND architecture proven on the club-3090 expert
#   cache, and the evidence the engine is not a DeepSeek-only curiosity. On this
#   config the cache reaches a HIGHER hit rate than DeepSeek does — 76-78% vs
#   ~57% — because inkling's resident non-expert weights are tiny (5.1 GB across
#   both cards), leaving far more VRAM for the pool: ~6,908 expert slots against
#   DeepSeek's ~5,300, i.e. 67.5% spatial coverage vs 48.1%.
#
#   Measured 2026-08-12 on the reference rig, 262K, no drafter, thinking-off:
#     decode        32.01 t/s narrative · 31.15 t/s code
#     prefill       401.6 t/s @10K · 385.7 t/s @90K  (essentially FLAT with depth)
#     TTFT          ~766 ms short-prompt
#     verify-full   9/9 · soak-continuous PASS (0 MiB growth, 0/25 silent-empty)
#     agentic       context 31.4x -> TTFT 4.8x (sub-linear), decode 26-34 t/s
#
#   ⚠️ Those decode figures are a canonical-bench measurement and therefore a
#   LOWER BOUND — see the cold-start caveat. The soak reached 41.88 t/s
#   session-mean and was still climbing.
#
#   ⚠️ TTFT at depth is the real cost: 225 s for an 87K prompt. 262K is a
#   CAPACITY number, not a serving latency.
#
#   WHY 4 CARDS IS PLAUSIBLY MORE THAN "BIGGER"
#   On this model, cache hit rate tracks SPATIAL COVERAGE — the fraction of the
#   10,240 routed experts held resident. Two cards give ~6,908 slots = 67.5%
#   coverage at 76-78% hits. Four cards roughly double the pool budget, so
#   coverage could approach saturation and take the hit rate with it. That is a
#   HYPOTHESIS from the dual measurements, not a result: the compute buffers and
#   the layer split also change, and more cards means more PCIe hops on a rig
#   with no NVLink. Measure it; do not assume it.
#
#   The engine is published as `llamacpp-club3090-v1.1` (digest sha256:55f43424…),
#   built from `stack/club3090-moecachev1.1`. DeepSeek's slugs deliberately stay
#   on the v1 digest they were validated on — but the v1.1 binary was checked
#   against DeepSeek anyway, since the merge conflict sat on its expert-cache
#   gate path: verify-full all-pass, decode 21.4-21.6 t/s vs 21.91 on v1.
# ---------------------------------------------------------------------------
#
# CPU-Offload-Host-RAM-GB: 121
#   ⚠️ IDENTICAL to the dual moe-cache sibling, and that is the POINT: host RAM
#   here does NOT fall with card count. This compose's `-ot` is an unconditional
#   all-experts→CPU catch-all, so all 40 routed-expert layers stay in host memory
#   on any number of cards; the extra VRAM buys expert-cache POOL SLOTS, which
#   are COPIES, while the CPU master buffer stays whole. (Contrast the DeepSeek
#   stock multi4 slug, whose need genuinely falls with card count — that one pins
#   expert bundles back onto the GPUs.)
#   MEASURED (2×3090 boot log; the buffer is card-count-independent, `--no-mmap`):
#       CUDA_Host model buffer   116354.33 MiB = 113.63 GiB   <- the HARD floor
#                                = 115,520.00 MiB routed expert bundles
#                                + 834.33 MiB `token_embd.weight` (Q8_0), which
#                                  llama.cpp keeps host-side whatever -ngl says
#     + ~8 GiB   process overhead (1,098.86 MiB CUDA_Host compute buffer, CPU FFN
#                scratch, CUDA host allocations) — the same constant the DeepSeek
#                headers carry.
#     = 121.
#   ⚠️ HARD floor, not a recommendation. `--no-mmap` makes the loader
#   `cudaMallocHost` the whole offloaded set: pinned pages are non-evictable and
#   cannot be oversubscribed, so a short box does not degrade — it dies inside
#   the allocation, which presents as "loads the model into RAM, then the
#   container is OOM-killed" (club-3090 #978).
#   ⚠️ NO residency headers here, DELIBERATELY — there are no ${OT_G*} slots in
#   the `-ot` below, so nothing is ever pinned back and the gate must NOT
#   subtract a grant. offload_residency_grant_mib() returns 0 without
#   CPU-Offload-Bundle-MiB, which is the correct answer for this compose.
# ===========================================================================
services:
  llama-cpp-inkling-small-iq4xs-moecache-multi4:
    # Digest-pinned, not tag-pinned: tags move, digests do not (#940 precedent).
    # Built 2026-08-12 from stack/club3090-moecachev1.1 — the published engine
    # branch PLUS vendored #25731. A SEPARATE profile from the v1 image on
    # purpose: DeepSeek keeps the digest it was validated on and is not re-pinned
    # onto a build whose only justification is this model. ⛔ Both collapse back
    # into one when #25731 merges — see engines/llamacpp-club3090-v1.1.yml.
    # MIGRATED v1.1 -> v1.5 2026-08-29 (revision 7104d5f4e, base b10675).
    # Validated on THIS binary first: verify-full 10/10, moe-cache pools on
    # both cards. Needed TWO changes beyond the pin — an explicit entrypoint
    # (v1.5's image default is /app/tools.sh, which rejects `-m`) and the
    # preflight off-payload fix (top-level reasoning_effort was defeating the
    # template kwarg). Ledger: /opt/ai/moecache-releases.md.
    image: ${LLAMACPP_CLUB3090_IMAGE:-ghcr.io/noonghunna/llamacpp-club3090@sha256:1c228a52b8193df26a3c7e8b497814739ca06ff34075a2a1ce02989210068210}
    container_name: ${ESTATE_CONTAINER:-llama-cpp-inkling-small-iq4xs-moecache-multi4}
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8085}}:8080"
    volumes:
      - "${MODEL_DIR:-../../../../../../models-cache}:/models:ro"
    environment:
      # Bare passthrough — docker forwards ONLY what is declared here, so without
      # this line the entrypoint's THREADS branch can never fire and the knob is
      # inert. Never write `- THREADS=${THREADS:-}`: that sets it EMPTY.
      - THREADS
      # Expert-cache tuning — inherited from the 2×24 GB DeepSeek derivation.
      - GGML_CUDA_MOE_CACHE_ADMIT_AFTER=${MOE_ADMIT_AFTER:-64}
      - GGML_CUDA_MOE_CACHE_RESERVE_MB=${MOE_RESERVE_MB:-1536}
      # ⛔ PREFETCH OFF BY DEFAULT — maintainer decision 2026-08-28.
      # The engine defaults it ON, but on this rig it costs 2176 MiB (2 x 1088) on the FIRST
      # CUDA device only, allocated LAZILY on the first prefill -- AFTER the moe-cache pool has
      # already been sized from free-minus-reserve. Nothing budgets for it, so it lands on the
      # tighter card as pure extra pressure. For scale: that is more than TWICE the entire KV
      # cost of this compose's 204800 context (~1035 MiB), i.e. ~430K tokens of headroom.
      # Its only measured justification (+14.5%/+15.0% prefill) was taken on a build carrying
      # the n_copies==1 scheduler race fixed in ce8743a05, so it is WITHDRAWN pending re-measure.
      # ⚠️ Explicit `=0`, not a bare passthrough: bare would inherit the engine default (ON).
      # Re-enable only with a number from a post-ce8743a05 A/B. See moecache-engine-playbook.md.
      - GGML_EXPERT_PREFETCH=${EXPERT_PREFETCH:-0}
      # Cache hit/miss telemetry. Needs BOTH knobs — measured on a live 2-arm boot
      # 2026-08-26: STATS alone at default verbosity emitted 0 `[moe-cache]` lines of
      # ANY kind; STATS + verbosity 4 emitted 228. `stats_every` defaults to 0
      # (moe-cache.cu:169, gate at :2795) and MOE_CACHE_LOG is GGML_LOG_INFO, which the
      # server's verbosity threshold drops below 4.
      # ⚠️ Both were previously ABSENT here, so docker forwarded neither and NO caller
      # could switch telemetry on (club-3090 #1105/#1106 were filed with no usable
      # cache data for exactly this reason).
      # `=${VAR:-N}` is safe for STATS: moe_cache_env_i64 rejects unset AND empty
      # before parsing (moe-cache.cu:509), so it cannot hit the atoi("")==0 trap.
      # ⚠️ DEFAULT IS 0 (OFF) — telemetry is OPT-IN, on principle rather than on a
      # measured cost: instrumentation should not run when nothing reads it.
      # ⛔ An earlier version of this comment claimed the counters cost ~6% decode.
      # That is RETRACTED (2026-08-26). Two A/B runs could not support it — the
      # SHIPPED image itself measured 20.05 then 18.36 narrative TPS across runs
      # with no code change, so run-to-run variance swamps the effect. Arithmetic
      # agrees: ~175 bypassed nodes per bench x ~4 atomics is ~1e-4 % of wall time.
      # The shipped v1.2 engine does NOT gate these counters at all, so on it this
      # knob controls EMISSION only.
      # Turn it on for a bench/report run: MOE_STATS=200 LLAMA_ARG_LOG_VERBOSITY=4.
      # Verbosity stays BARE (caller-owned): 4 is loud for a serving deployment.
      - GGML_CUDA_MOE_CACHE_STATS=${MOE_STATS:-0}
      - LLAMA_ARG_LOG_VERBOSITY
      # `--cache-reuse` via env. Inert unless the caller sets it; declared so
      # trying it produces the ENGINE's answer (it can refuse — see the deepseek
      # sibling's MLA+SWA note) instead of silence from an undeclared var.
      - LLAMA_ARG_CACHE_REUSE
      # Ring size for the above. Inert unless the caller sets it.
      - GGML_EXPERT_PREFETCH_SLOTS
      # Bare passthrough — inert unless the caller sets it. Declared so a
      # graph-reuse A/B can run through the REAL delivery path: docker forwards
      # only what is listed here, so without this line the two arms of the
      # experiment are byte-identical and the null result is an artifact of the
      # harness rather than a measurement. Measured cost of losing reuse on
      # Qwen3.8-Flash-Next: ~3.9 ms/token (+13.5% decode with it on, 2 boots/arm,
      # 2026-09-04) — see learnings/moe-cache-engine.md §8b.
      - LLAMA_GRAPH_REUSE_DISABLE
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${ESTATE_GPUS:-0,1,2,3}']
              capabilities: [gpu]
    # ⚠️ LIST FORM, NOT a folded `command: >-` string — REQUIRED, not style.
    # Docker Compose's command-line parser REJECTS `(gate|up|down)` inside a
    # folded string. The list form skips shell parsing, so the regex survives
    # byte-for-byte.
    # ── Explicit entrypoint (added 2026-08-29) ──────────────────────────────
    # WHY: without this the compose inherits the IMAGE's default entrypoint, which
    # silently couples it to one engine build. v1.1's default runs the server
    # directly; v1.5's is `/app/tools.sh`, a DISPATCHER that rejects the `-m …`
    # argv below — MEASURED 2026-08-29: `Unknown command: -m`, container crash-loop.
    # DeepSeek survived the same engine swap untouched precisely because its
    # compose defines its own entrypoint. Pinning it here makes this file portable
    # across images instead of dependent on one image's default.
    entrypoint:
      - /bin/bash
      - -c
      - |
        # -- Threads -------------------------------------------------------------
        # Resolved HERE, not as a `-t` CLI arg: CLI beats env, so a command-line -t
        # silently overrides anything set below. PORTABLE DEFAULT = nproc/2, matching
        # the launcher's resolve_offload_threads so both paths agree. The old `-t 8`
        # was far below optimum on any capable host; nproc/2 is the safe choice when
        # the operator's core count is unknown. ⚠️ Still a FLOOR, not the optimum --
        # the useful zone is an ABSOLUTE ~24-32 threads. Set THREADS=<n> to tune.
        if [ -n "$${THREADS:-}" ]; then
          export LLAMA_ARG_THREADS="$${THREADS}"
          echo "[threads] -t $${LLAMA_ARG_THREADS} (THREADS set explicitly)" >&2
        else
          _np=$$(nproc 2>/dev/null || echo 8)
          _half=$$(( _np / 2 )); [ "$$_half" -lt 1 ] && _half=1
          export LLAMA_ARG_THREADS="$$_half"
          echo "[threads] -t $${LLAMA_ARG_THREADS} (auto = nproc/2, nproc=$$_np)" >&2
        fi

        exec /app/llama-server "$$@"
      - --
    command:
      # ── Sampler + reasoning effort (vendor: unsloth.ai/docs/models/inkling) ──
      # Sampling: the card gives ONE row for all modes (no thinking/instruct
      # split, unlike qwen3.8/glm-5.3) — temp 1.0, top_p 1.0 (disabled), min_p 0.0.
      # ⚠️ These were previously UNSET, so llama.cpp's own defaults applied
      # (top_k 40 / min_p 0.05) — NOT the vendor row.
      - '--temp'
      - '${TEMP:-1.0}'
      - '--top-p'
      - '${TOP_P:-1.0}'
      - '--min-p'
      - '${MIN_P:-0.0}'
      # Reasoning effort. ⚠️⚠️ THIS MODEL READS `reasoning_effort` FROM THE CHAT
      # TEMPLATE, NOT `enable_thinking` — it ignores the latter SILENTLY, and the
      # top-level OpenAI `reasoning_effort` field does NOT reach it either
      # (MEASURED 2026-08-29: `reasoning_effort: none` still produced 204 chars of
      # reasoning). The template kwarg below is the vendor's documented control.
      # Levels: none(0) low(0.2) medium(0.7) high(0.9) xhigh(0.99) max(0.99).
      # SHIPPED `low`: reasoning stays ON (the vendor default behaviour — this
      # model has no instruct mode) but at 0.2 instead of the vendor's 0.9, because
      # 0.9 spends a large share of a short reply's budget on thinking. Agents dial
      # up per request. Set REASONING_EFFORT to override.
      - '--chat-template-kwargs'
      - '{"reasoning_effort":"${REASONING_EFFORT:-low}"}'
      - '-m'
      - '/models/inkling-small-gguf/UD-IQ4_XS/Inkling-Small-UD-IQ4_XS-00001-of-00004.gguf'
      - '--host'
      - '0.0.0.0'
      - '--port'
      - '8080'
      - '--alias'
      - 'inkling-small'
      # Slots. ⚠️ `-np N` SPLITS `-c` into ctx/N per slot, so the pool and the
      # compute buffer change with it — a concurrency A/B must re-measure, not
      # reuse single-stream rows. Default 1 keeps shipped behaviour identical.
      # ⚠️ LLAMA_ARG_N_PARALLEL cannot override this: common/arg.cpp applies env
      #    BEFORE argv (~L783 vs ~L808), so the command line always wins.
      - '-np'
      - '${NPARALLEL:-1}'
      - '-c'
      - '${CTX:-262144}'
      - '-ngl'
      - '99'
      - '-sm'
      - 'layer'
      - '-ts'
      - '1,1,1,1'
      - '-fa'
      - 'on'
      # ⚠️ SINGLE -ot with comma-separated rules. Mainline DEPRECATES repeated
      # -ot and honours ONLY THE LAST occurrence (#948/#949). All routed experts
      # to CPU; the cache decides residency dynamically. NOTE the 2 SHARED
      # experts are `_shexp` and do NOT match this regex — they stay GPU-resident
      # by design, which is correct: every token uses them.
      - '-ot'
      - 'blk\.[0-9]+\.ffn_(gate|up|down)_exps\.weight=CPU'
      # ⚠️ The bare-compose default is deliberately conservative. Under the
      # launchers THREADS is injected; llama.cpp's own default collapses
      # CPU-offload decode by ~31%, so never leave this to the engine.
      - '-ub'
      - '${UBATCH:-2048}'
      - '-b'
      - '${UBATCH:-2048}'
      - '--cache-prompt'
      - '--no-mmap'
      - '--moe-cache'
      - '${MOE_CACHE:-auto}'
      # ⚠️ LOAD-BEARING: `--fit` silently overrides -ngl and places layers itself,
      # after which the cache reports "kept stock placement" and no-ops. Whenever
      # -ot is deciding placement, --fit must be off.
      - '--fit'
      - 'off'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 900s

# ===========================================================================
# Profile (at-a-glance):
#   Model:     Inkling-2-Mini (thinkingmachines' own NVFP4 + MXFP8 ModelOpt checkpoint, 20.2 GB with its drafter)
#   Engine:    vllm-inkling — vLLM's Inkling image with its op libraries rebuilt for sm_86 and an sm_8x diff
#              baked in (ghcr.io/noonghunna/vllm-inkling-club3090, club-3090's image)
#   Topology:  Single card (TP=1)
#   Drafter:   none
#   KV:        fp8 (E4M3, converted in software on sm_8x: Triton has no fp8e4nv below sm_89)
#   Vision:    yes (the checkpoint's vision encoder; image input)
#   Max ctx:   240000 (the most that fits at util 0.94 on image r2, 2026-11-28; the maintainer's cap is 262K);
#              KV pool 243,989 tokens
#   Genesis:   N/A — Genesis is Qwen3-Next-specific
#   Status:    🐣 Incubating
#   Caveats:   sm_86 only: the image has no code for sm_90+ or a 5090 (its FA2 vision library is sm_80
#              cubins). A club-built image. This slug stays on it for FP8 KV after a vLLM release runs
#              Inkling-2-Mini on sm_86 (stock vLLM gates Inkling's FP8 KV to SM12x; maintainer decision
#              2026-11-22; models/inkling-2-mini/vllm-inkling/image/README.md).
#              This window needs FP8 KV (BF16 topped out at ~97K on one card on image r1) and
#              --max-num-batched-tokens 512 --max-num-seqs 2 --no-async-scheduling (the sliding-window and
#              conv-state caches reserve window + in-flight tokens per request). 262K doesn't fit: one request
#              needs 4.51 GiB of KV against 4.24 GiB at util 0.94 (vLLM's estimate: 244,480 tokens), and util
#              0.95 leaves under verify-stress's 1,024 MB margin (1,017 MB on r1). Int8 weights
#              (VLLM_INKLING_W8, on by default): quality not measured here; lulakien/inkling2-mini-3090-recipe
#              reports MMLU 911 vs 908 in bf16. The model card documents long reasoning loops "particularly when
#              debugging code" and recommends output-token caps: cap max_tokens on agent traffic. ALWAYS REASONS
#              (default effort high); `none` is not off. Quality not measured (no 8-pack); no soak.
#   Best for:  Inkling-2-Mini's longest window on one 24 GB card
# ---------------------------------------------------------------------------
# Requires-min-vram-gb: 24
# Requires-min-gpu-count: 1
# Tensor-parallel: 1
#
# Measured 2026-11-27 through switch.sh on a local build of image r2 (int8 weights on), one RTX 3090 (GPU0) at 230 W
# (bench.sh 3 warm + 5 on its own boot at a 180K window, temperature 0.6 / top_p 0.95 / top_k 20): narrative 88.03
# / code 87.55 wall tok/s, TTFT 117 / 119 ms, prefill 2,737 tok/s at 10K (the first of three runs read 1,214,
# cold) and 1,643 at 90K, peak VRAM 22,902 MiB. On r1, same card, 2026-11-27: 76.65 / 76.39, prefill ~2,780 /
# 1,683 (r2's run had a 7% higher SM clock). At 240K (2026-11-28, same build): KV pool 243,989 tokens (1.02x);
# verify-full all pass; verify-stress all pass, the ceiling ladder recalled to 220,254 tokens (91% of 240K) with
# 1,218 MB free throughout. The pushed build (80afbe99, built from master)
# booted through switch.sh, verify-full all pass, 2026-11-28.
# On image r1 (bf16 weights; 2026-11-22, the old GPU1, 180K): 76.87 / 76.85, prefill 2,881 / 1,822, pool 187,450
# tokens, ladder to 165,220 with 1,259 MB free. The overlay the image bakes (2026-11-21, at 200K / util 0.95):
# 76.68 / 76.68.
#
#   bash scripts/setup.sh vllm/inkling-2-mini-single-max
#   bash scripts/switch.sh --force vllm/inkling-2-mini-single-max
#
# Knobs:
#   REASONING_EFFORT      server-default effort for requests that send none: minimal | low | medium | high
#                         (default, the template's own) | xhigh | max (= xhigh) | none (0.0: NOT off). A request's
#                         own chat_template_kwargs.reasoning_effort or top-level reasoning_effort wins.
#   MAX_MODEL_LEN         default 240000 (vLLM's estimate of what fits at util 0.94: 244,480 tokens)
#   GPU_MEMORY_UTILIZATION  default 0.94 (1,218 MB free at the ceiling; 0.95 left 1,017 MB on r1, under
#                         verify-stress's 1,024 MB margin)
#   VLLM_INKLING_W8       layers stored as int8 per output channel, quantized at load: attn (attention qkvr), head
#                         (the LM head); markov and draft apply only with a drafter, which this slug has none of.
#                         Default attn,head,markov,draft. Empty keeps them bf16, as image r1 ran: then the window
#                         has to come down to 180000
# Sampling: the checkpoint's generation_config (temperature 1.0), what a request that names none gets.
services:
  vllm-inkling-2-mini-single-max:
    image: ${VLLM_IMAGE:-ghcr.io/noonghunna/vllm-inkling-club3090@sha256:80afbe992065e8d1e6e91079c23e72e9cd1ffe15a0e005731aac97bc0c9fe275}
    container_name: "${ESTATE_CONTAINER:-vllm-inkling-2-mini-single-max}"
    user: "0:${DOCKER_GID:-1000}"
    restart: ${CLUB3090_RESTART:-unless-stopped}
    shm_size: "16gb"
    ipc: host
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8227}}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${MODEL_DIR:-../../../../../../models-cache}:/root/.cache/huggingface
      - ${CLUB3090_ENGINE_CACHE_DIR:-../../../cache}/torch_compile:/root/.cache/vllm/torch_compile_cache
      - ${CLUB3090_ENGINE_CACHE_DIR:-../../../cache}/triton:/root/.triton/cache
    environment:
      # Our launch knob, read by the entrypoint below.
      - REASONING_EFFORT
      # int8 per-channel weights, quantized at load (r2 image; from lulakien/inkling2-mini-3090-recipe):
      # attention qkvr, the LM head, DSpark's Markov fold and draft layers. VLLM_INKLING_W8= (empty) keeps bf16.
      - VLLM_INKLING_W8=${VLLM_INKLING_W8-attn,head,markov,draft}
      - NVIDIA_VISIBLE_DEVICES=${ESTATE_GPUS:-${NVIDIA_VISIBLE_DEVICES:-all}}
      # CUDA-level GPU mask (#610): launch.sh --gpus exports GPU UUIDs here. Unset -> absent.
      - CUDA_VISIBLE_DEVICES
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-${OFFLINE:-0}}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-${OFFLINE:-0}}
      - VLLM_NO_USAGE_STATS=1
      - OMP_NUM_THREADS=1
      - TRITON_CACHE_DIR=/root/.triton/cache
    entrypoint:
      - bash
      - -c
      - |
        umask 0002
        set -e
        # -- REASONING_EFFORT -> the template's default effort for requests that send none --------
        # The template takes these names (none = 0.0, minimal 0.1 ... high 0.9, xhigh / max 0.99) and raises on
        # any other; checked here so a typo refuses the boot instead of 400-ing every request.
        _reff="${REASONING_EFFORT:-high}"
        case "$$_reff" in none|minimal|low|medium|high|xhigh|max) : ;; *) echo "[reasoning] REASONING_EFFORT='$$_reff' must be one of none|minimal|low|medium|high|xhigh|max" >&2; exit 1 ;; esac
        echo "[reasoning] default reasoning_effort=$$_reff (a request's own effort wins)" >&2
        exec vllm serve "$$@" --default-chat-template-kwargs "{\"reasoning_effort\":\"$$_reff\"}"
      - --
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - /root/.cache/huggingface/Inkling-2-Mini
      # SERVED_NAME renames the model the API serves (default: inkling-2-mini).
      - --served-model-name
      - ${SERVED_NAME:-inkling-2-mini}
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "${MAX_MODEL_LEN:-240000}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.94}"
      # vLLM v0.34's extensible KV cache holds back ~2.9 GiB a card on this model (vllm#68184, docs/UPSTREAM.md).
      - --no-enable-extensible-kv-cache
      # One card: the sliding-window and conv-state caches reserve window + in-flight tokens per request, so
      # small batches are what leave room for 240K.
      - --max-num-batched-tokens
      - "512"
      - --max-num-seqs
      - "2"
      - --no-async-scheduling
      - --kv-cache-dtype
      - fp8
      - --enable-auto-tool-choice
      - --tool-call-parser
      - inkling
      - --reasoning-parser
      - inkling
    healthcheck:
      # The container's own hostname, not loopback, so a bad bind address can't look healthy.
      test: ["CMD-SHELL", "curl -sf \"http://$${HOSTNAME}:8000/health\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s

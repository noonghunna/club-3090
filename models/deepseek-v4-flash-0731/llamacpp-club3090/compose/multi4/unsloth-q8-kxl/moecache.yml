# ===========================================================================
# Profile (at-a-glance):
#   Model:     DeepSeek-V4-Flash-0731 (284B MoE, unsloth UD-Q8_K_XL — MXFP4
#              experts + BF16 attention, 151 GB across 5 shards)
#   Engine:    llamacpp-club3090 (fork: leloch's MoE expert cache v2 + our L1/L3/E
#              ports, bypass warn-split, and multi-row top-k batching)
#   Topology:  4× CUDA (layer-split -ts 1,1,1,1)
#   Drafter:   DSpark n=5 external, PINNED TO CPU (-devd none)
#              Toggle: SPEC_N=<n> sets depth; SPEC_N=0 (or SPEC=off) disables
#              (removes the flags — n-max=0 would leave the draft context allocated)
#   KV:        fp16
#   Vision:    no
#   Max ctx:   204800
#   Genesis:   N/A — llama.cpp engine
#   Status:    🧪 Experimental
#   Caveats:   • ⚠️⚠️ THE TUNING BELOW IS INHERITED, NOT DERIVED — this is the
#                single most important caveat on this file. `RESERVE_MB=1536`
#                and `-ub 2048` were measured on **2×24 GB** against a MEASURED
#                1,128 MiB compute-buffer swing. On 4 cards the per-card free
#                VRAM, the swing, and the pool/compute balance are all different,
#                and on 32 GB Blackwell they are different again. On 2×24 GB the
#                neighbouring value (1024) was ~11% SLOWER — the knee is sharp.
#                **Re-derive both per topology before trusting this file.**
#                Procedure: boot with `-lv 4` + `GGML_CUDA_MOE_CACHE_STATS=50`,
#                read the compute-buffer swing, set RESERVE above it, then sweep
#                on WALL-CLOCK (never on hit rate).
#              • ⚠️ NOT VALIDATED ON THIS RIG. The reference rig has 2 cards.
#                Every number in the dual sibling is 2×3090; nothing here has
#                been booted. This file is scaffolding pending 4-card rig time.
#              • ⚠️ BLACKWELL (sm_120) IS UNVERIFIED. The cache has a compute
#                capability gate and all measurements are Ampere (sm_86). Do not
#                claim 5090 support until the image is built for sm_120 AND a
#                boot + hit-rate check passes on that hardware.
#              • ⚠️ ATTRIBUTION: the MoE expert cache is **leloch's** work
#                (github.com/leloch/llama.cpp, RFC ggml-org#24528).
#              • UNMERGED ENGINE — pins a fork image; not reproducible on stock.
#              • QUALITY IS UNTESTED. No 8-pack has been run on any topology.
#              • COLD-START TAX: the first request after boot is slow while the
#                expert pool fills. Do not benchmark it.
#              • `-devd none` is LOAD-BEARING: with the drafter GPU-resident the
#                cache records ZERO hits (shared-draft device-list reorder).
#              • Needs ~156 GB of HOST RAM — a HARD gate, and it does NOT fall
#                with card count the way the stock multi4 slug's does: that one
#                pins expert bundles back onto the GPUs, this one keeps all 43
#                layers on CPU unconditionally and adds the 10.1 GiB drafter to
#                host memory as well. A 128 GB box CANNOT run this slug — use
#                the stock 4-card offload slug (llamacpp/deepseek-flash-multi4-q8)
#                instead, ~120 GB on a real 4×24. Arithmetic in the
#                CPU-Offload-Host-RAM-GB block below.
#   Best for:  Decode-heavy DeepSeek serving on 4 cards — PENDING VALIDATION. ⭐
# ---------------------------------------------------------------------------
# WHY THIS EXISTS
#   The 4-card sibling of the dual moe-cache slug. More aggregate VRAM should
#   mean a larger expert pool and a higher resident fraction (dual reaches ~47%
#   of 11,008 experts); whether that converts into decode throughput is exactly
#   what needs measuring, because on this stack a bigger pool with better hit
#   rates has repeatedly been SLOWER. Treat the dual numbers as a hypothesis
#   for this topology, not a prediction.
# ---------------------------------------------------------------------------
#
# CPU-Offload-Host-RAM-GB: 156
#   ⚠️ IDENTICAL to the dual moe-cache sibling, and that is the POINT: unlike
#   the stock multi4 slug, host RAM here does NOT fall with card count. The
#   stock slug pins expert bundles back onto the GPUs (that is what takes it
#   from ~146 to ~120 on a real 4×24); this compose's `-ot` is an unconditional
#   all-experts→CPU catch-all, so all 43 layers stay in host memory on any
#   number of cards. More cards buy a bigger expert-cache POOL, not a smaller
#   CPU buffer — the cache is a VRAM-side COPY and the master stays allocated.
#   MEASURED (2×3090 boot log; the buffer is card-count-independent, `--no-mmap`):
#       experts    141362.00 MiB   load_tensors: CUDA_Host model buffer size
#     + drafter     10386.28 MiB   `-devd none` -> DSpark lives in host memory
#     = pinned     151748.28 MiB = 148.19 GiB   <- the HARD floor
#     + ~8 GiB     process overhead (CUDA_Host compute/output buffers, CPU FFN
#                  scratch, CUDA host allocations) — the same constant both
#                  stock headers carry (141362 MiB→146, 80268 MiB→86).
#     = 156.
#   ⚠️ HARD floor, not a recommendation. `--no-mmap` makes the loader
#   `cudaMallocHost` the whole offloaded set: pinned pages are non-evictable and
#   cannot be oversubscribed, so a short box does not degrade — it dies inside
#   `cudaMallocHost`, which presents as "loads the model into RAM, then fails to
#   load". A 4-card/128 GB owner wants the stock multi4 offload slug instead.
#   ⚠️ NO residency headers here, DELIBERATELY — there are no ${OT_G*} slots in
#   the `-ot` below, so nothing is ever pinned back and the gate must NOT
#   subtract a grant. offload_residency_grant_mib() returns 0 without
#   CPU-Offload-Bundle-MiB, which is the correct answer for this compose.
# ===========================================================================
services:
  llama-cpp-deepseek-flash-q8-moecache-multi4:
    # Digest-pinned, not tag-pinned (#940 precedent). Engine profile is authoritative.
    # Built 2026-08-10 from stack/club3090-moe-cache @ e0a208949, CUDA arch 86;89;120.
    image: ${LLAMACPP_CLUB3090_IMAGE:-ghcr.io/noonghunna/llamacpp-club3090@sha256:17824d4483dbd60c297613bddf130f25e739d3edc7e633e4d973edc4e2165649}
    container_name: ${ESTATE_CONTAINER:-llama-cpp-deepseek-flash-q8-moecache-multi4}
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8116}}:8080"
    volumes:
      - "${MODEL_DIR:-../../../../../../models-cache}:/models:ro"
    environment:
      # Drafter toggle - docker forwards only what is declared here.
      - SPEC_N=${SPEC_N:-}
      - SPEC=${SPEC:-}
      # ⚠️ PLACEHOLDER VALUES inherited from the 2-card sibling. Re-derive.
      - GGML_CUDA_MOE_CACHE_ADMIT_AFTER=${MOE_ADMIT_AFTER:-64}
      - GGML_CUDA_MOE_CACHE_RESERVE_MB=${MOE_RESERVE_MB:-1536}
      # Cache hit/miss telemetry. Needs BOTH knobs — measured on a live 2-arm boot
      # 2026-08-26: STATS alone at default verbosity emitted 0 `[moe-cache]` lines of
      # ANY kind; STATS + verbosity 4 emitted 228. `stats_every` defaults to 0
      # (moe-cache.cu:169, gate at :2795) and MOE_CACHE_LOG is GGML_LOG_INFO, which the
      # server's verbosity threshold drops below 4.
      # ⚠️ Both were previously ABSENT here, so docker forwarded neither and NO caller
      # could switch telemetry on (club-3090 #1105/#1106 were filed with no usable
      # cache data for exactly this reason).
      # `=${VAR:-N}` is safe for STATS: moe_cache_env_i64 rejects unset AND empty
      # before parsing (moe-cache.cu:509), so it cannot hit the atoi("")==0 trap.
      # ⚠️ DEFAULT IS 0 (OFF) — telemetry is OPT-IN, on principle rather than on a
      # measured cost: instrumentation should not run when nothing reads it.
      # ⛔ An earlier version of this comment claimed the counters cost ~6% decode.
      # That is RETRACTED (2026-08-26). Two A/B runs could not support it — the
      # SHIPPED image itself measured 20.05 then 18.36 narrative TPS across runs
      # with no code change, so run-to-run variance swamps the effect. Arithmetic
      # agrees: ~175 bypassed nodes per bench x ~4 atomics is ~1e-4 % of wall time.
      # The shipped v1.2 engine does NOT gate these counters at all, so on it this
      # knob controls EMISSION only.
      # Turn it on for a bench/report run: MOE_STATS=200 LLAMA_ARG_LOG_VERBOSITY=4.
      # Verbosity stays BARE (caller-owned): 4 is loud for a serving deployment.
      - GGML_CUDA_MOE_CACHE_STATS=${MOE_STATS:-0}
      - LLAMA_ARG_LOG_VERBOSITY
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${ESTATE_GPUS:-0,1,2,3}']
              capabilities: [gpu]
    # ⚠️ LIST FORM, NOT a folded string — compose rejects `(gate|up|down)` in a
    # folded `command: >-`.
    # The image ENTRYPOINT is ["/app/llama-server"] on every engine we ship
    # (mainline, ik-llama, beellama, llamacpp-club3090 — all verified). This
    # wrapper is equivalent to it plus the drafter toggle.
    entrypoint:
      - /bin/bash
      - -c
      - |
        # -- Drafter toggle: the same contract on every club-3090 compose --------
        #   SPEC_N=<n>  drafter depth; SPEC_N=0 disables
        #   SPEC=off    back-compat alias for SPEC_N=0
        # Disabling REMOVES the drafter flags rather than passing n=0. At
        # --spec-draft-n-max 0 llama.cpp sets drafting=false but still builds the
        # draft context (server-context.cpp), and still loads an external draft
        # model when one is named -- so the memory stays spent. Removing the
        # flags is the only clean off. A non-numeric SPEC_N is a hard error, so a
        # typo can never masquerade as a silent "drafter off".
        _spec_n="$${SPEC_N:-1}"
        case "$${SPEC:-}" in off|OFF|Off|false|no|0) _spec_n=0 ;; esac
        case "$$_spec_n" in ""|*[!0-9]*)
          echo "[spec] SPEC_N='$$_spec_n' is not a non-negative integer." >&2
          echo "[spec] Fix: SPEC_N=<n> sets depth; SPEC_N=0 (or SPEC=off) disables." >&2
          exit 1 ;;
        esac
        if [ "$$_spec_n" -gt 0 ]; then
          # Fail loud if the external DSpark drafter GGUF is absent. This model
          # has NO embedded MTP head, so DSpark is the ONLY speculative path --
          # a missing file otherwise crash-loops llama-server on a cryptic
          # "gguf_init_from_file ... No such file" (club-3090#1054). Find the
          # -md/--model-draft path in argv and verify it exists before exec.
          _draft=""; _want=0
          for _a in "$$@"; do
            if [ "$$_want" = 1 ]; then _draft="$$_a"; _want=0; continue; fi
            case "$$_a" in -md|--model-draft|--spec-draft-model) _want=1 ;; esac
          done
          if [ -n "$$_draft" ] && [ ! -f "$$_draft" ]; then
            echo "[spec] FATAL: external DSpark drafter not found:" >&2
            echo "[spec]   $$_draft" >&2
            echo "[spec] This slug REQUIRES the drafter (no embedded MTP head => no other spec path)." >&2
            echo "[spec] Fix one of:" >&2
            echo "[spec]   - download it: hf download unsloth/DeepSeek-V4-Flash-0731-GGUF \\" >&2
            echo "[spec]       --include 'dspark/*Q8_0*' --local-dir <MODEL_DIR>/deepseek-v4-flash-0731-gguf" >&2
            echo "[spec]   - or run drafter-off knowingly: SPEC_N=0 (accepts the lower no-spec TPS)" >&2
            exit 1
          fi
          echo "[spec] drafter ON (SPEC_N=$$_spec_n)" >&2
          exec /app/llama-server "$$@"
        fi
        ARGS=(); _skip=0
        for _a in "$$@"; do
          if [ "$$_skip" = 1 ]; then _skip=0; continue; fi
          case "$$_a" in
            --spec-type|--spec-draft-model|--spec-draft-n-max|--spec-draft-n-min|-md|--model-draft) _skip=1; continue ;;
          esac
          ARGS+=("$$_a")
        done
        echo "[spec] drafter OFF (SPEC_N=0 / SPEC=off) - drafter flags removed" >&2
        exec /app/llama-server "$${ARGS[@]}"
      - --
    command:
      - '-m'
      - '/models/deepseek-v4-flash-0731-gguf/UD-Q8_K_XL/DeepSeek-V4-Flash-0731-UD-Q8_K_XL-00001-of-00005.gguf'
      - '--host'
      - '0.0.0.0'
      - '--port'
      - '8080'
      - '--alias'
      - 'deepseek-v4-flash'
      - '-np'
      - '1'
      - '-c'
      - '${CTX:-204800}'
      - '-ngl'
      - '99'
      - '-sm'
      - 'layer'
      - '-ts'
      - '${TENSOR_SPLIT:-1,1,1,1}'
      - '-fa'
      - 'on'
      # ⚠️ SINGLE -ot, comma-separated: current mainline honours ONLY THE LAST
      # -ot occurrence. All experts to CPU; the cache decides residency.
      - '-ot'
      - 'blk\.[0-9]+\.ffn_(gate|up|down)_exps\.weight=CPU'
      - '-t'
      - '${THREADS:-8}'
      - '-ub'
      - '${UBATCH:-2048}'
      - '-b'
      - '${UBATCH:-2048}'
      - '--cache-prompt'
      - '--no-mmap'
      - '-md'
      - '/models/deepseek-v4-flash-0731-gguf/dspark/dspark-DeepSeek-V4-Flash-0731-Q8_0.gguf'
      - '--spec-type'
      - 'draft-dspark'
      - '--spec-draft-n-max'
      - '${SPEC_N:-5}'
      - '-devd'
      - 'none'
      - '--moe-cache'
      - '${MOE_CACHE:-auto}'
      - '--fit'
      - 'off'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 900s

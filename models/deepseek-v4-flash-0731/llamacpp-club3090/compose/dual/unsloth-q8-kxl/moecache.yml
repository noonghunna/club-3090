# ===========================================================================
# Profile (at-a-glance):
#   Model:     DeepSeek-V4-Flash-0731 (284B MoE, unsloth UD-Q8_K_XL — MXFP4
#              experts + BF16 attention, 151 GB across 5 shards)
#   Engine:    llamacpp-club3090 (fork: leloch's MoE expert cache v2 + our L1/L3/E
#              ports, bypass warn-split, and multi-row top-k batching)
#   Topology:  Dual 3090 PCIe (layer-split -ts 1,1, no NVLink)
#   Drafter:   DSpark n=5 external, PINNED TO CPU (-devd none) — see Caveats
#              Toggle: SPEC_N=<n> sets depth; SPEC_N=0 (or SPEC=off) disables
#              (removes the flags — n-max=0 would leave the draft context allocated)
#   KV:        fp16 (llama.cpp default — MLA + a 4,352-cell SWA window keep it tiny)
#   Vision:    no
#   Max ctx:   204800  (262144 boots on this config — see Caveats)
#   Genesis:   N/A — llama.cpp engine
#   Status:    🧪 Experimental
#   Caveats:   • ⚠️ ATTRIBUTION: the MoE expert cache is **leloch's** work
#                (github.com/leloch/llama.cpp, RFC ggml-org#24528). This slug
#                packages it; it does not originate it. Our additions are the
#                L1 parallel scatter, L3 D2H overlap, no-budget warning, bypass
#                warn-split, and the multi-row top-k batching.
#              • UNMERGED ENGINE. The cache is not in mainline llama.cpp. This
#                slug pins a fork image; it cannot be reproduced with stock.
#              • QUALITY IS UNTESTED. No 8-pack has been run on this config.
#                Both the cache and the CPU drafter touch the generation path.
#                Stays 🧪 until an 8-pack + soak-continuous pass.
#              • ⚠️ COLD-START TAX: the FIRST request after boot is slow (~50-75 s
#                for 900 tokens) while the expert pool fills. Steady state is
#                reached after one generation. Do not benchmark the first request.
#              • `-devd none` is LOAD-BEARING, not a preference. With the drafter
#                GPU-resident the cache records ZERO hits (device-list reorder in
#                the shared-draft path), and on 2×24 GB the drafter also wants
#                10.4 GiB that the pool needs. CPU drafter costs ~7-15% depending
#                on acceptance; the cache more than repays it.
#              • Tuning is 2×24 GB SPECIFIC. RESERVE_MB=1536 was derived from a
#                MEASURED 1,128 MiB compute-buffer swing on this topology; 1024
#                is below that swing and measured ~11% SLOWER despite a larger
#                pool and higher hit rate. Do not copy these values to another
#                card count or VRAM size without re-deriving them.
#              • `-ub/-b 4096` — DEFAULT SINCE 2026-08-25, re-measured. The old
#                2048 default assumed the compute buffer it frees (worth ~1,254
#                more resident experts on CUDA0: 2,624 vs 1,370 slots) bought
#                ~+10% decode. Post-prefetch it does NOT: a 3×3 interleaved soak
#                measured ub4096 vs ub2048 at −1.6% decode (pooled sd 6.6%, so
#                only effects >8% are resolvable), while prefill is +18% @40K
#                and +13% @10K (3 runs/depth, CV ≤2.2%). ⚠️ Pool occupancy spans
#                2× across these configs with no decode difference — the slot
#                count is a diagnostic, not a decode predictor. `UBATCH=2048`
#                restores the old trade; 8192 is NOT better (prefill saturates
#                at +18.0%, decode −30% as the pool is squeezed).
#              • 262144 boots and serves here (unlike the stock slug, which OOMs
#                at 262K with a GPU-resident drafter), but costs ~8% decode and
#                445 expert slots, and this model is PREFILL-BOUND at depth.
#                Set CTX=262144 only if you genuinely need it.
#              • Needs ~156 GB of HOST RAM — a HARD gate, and ~10 GB MORE than
#                the stock Q8 slug because `-devd none` moves the 10.1 GiB
#                drafter off the GPU and into host memory. preflight REFUSES
#                below it; see the CPU-Offload-Host-RAM-GB block near the
#                bottom of this header for the measured arithmetic.
#              • Load takes ~8-10 min (--no-mmap).
#   Quality:   toolcall-15 13/15 (87%) · instructfollow-15 15/15 (100%)
#              · structoutput-15 14/15 (93%) · dataextract-15 12/15 (80%)
#              · reasonmath-15 14/15 (93%) · bugfind-15 15/15 (100%)
#              · hermesagent-20 14/20 (70%) · cli-40 31/40 (78%)
#              = 128/150 reasoning-ON  (--full, 2026-08-11)  # pack versions not recorded pre-#981
#              Reasoning-OFF leg: 122/150. repeat=1 per arm.
#              ⚠️ NO stock-engine comparison arm — this shows the output is
#              sound, NOT that the expert cache is quality-neutral.
#   Best for:  Decode-heavy DeepSeek serving — chat, agentic loops, long
#              generations — where the expert cache pays for itself. ⭐
# ---------------------------------------------------------------------------
# WHY THIS EXISTS
#   The stock Q8 slug keeps a 10.4 GiB DSpark drafter on the GPU and caches
#   nothing, idling ~9.3 GB of VRAM. This config reallocates that: drafter to
#   host, ~5,159 experts (~47% of 11,008) resident in VRAM instead. Measured
#   2026-08-10 on the reference rig, same session, canonical prompts at temp 0:
#
#     stock slug              18.34 narr / 23.51 code
#     this config             23.64 / 22.67 decode · 354.7 t/s prefill @10K
#                             pool 2,579 + 2,580 slots · hit rate ~56%
#
#   ⚠️ The line above was taken at the THEN-default `-ub 2048`; the default is
#   4096 since 2026-08-25 (see the -ub bullet). Prefill at the new default is
#   390.2 t/s @10K / 377.7 @40K. Kept as the historical anchor, not re-stated.
#
#   ≈ +29% decode vs stock, ≈ −19% prefill. Cache hit rate and pool occupancy
#   are DIAGNOSTICS ONLY — three times on this stack a config improved every
#   cache counter and got slower. Tune on wall-clock.
# ---------------------------------------------------------------------------
#
# CPU-Offload-Host-RAM-GB: 156
#   ⚠️ HIGHER than the stock Q8 sibling's 146, and the delta IS THE DRAFTER:
#   `-devd none` puts the DSpark model in HOST memory where the stock slug keeps
#   it in VRAM. Same weights, different host bill — do not copy 146 over.
#   MEASURED (2×3090, `--no-mmap`, all 43 expert layers → CPU):
#       experts    141362.00 MiB   load_tensors: CUDA_Host model buffer size
#     + drafter     10386.28 MiB   same line, second model (CPU-pinned)
#     = pinned     151748.28 MiB = 148.19 GiB   <- the HARD floor
#     + ~8 GiB     process overhead: CUDA_Host compute/output buffers, CPU FFN
#                  scratch, CUDA host allocations. Measured on this model as
#                  147 GiB used vs 138.05 GiB pinned; it is also the constant
#                  both stock headers already carry (141362 MiB→146, 80268→86).
#     = 156.
#   ⚠️ HARD floor, not a recommendation. `--no-mmap` makes the loader
#   `cudaMallocHost` the whole offloaded set: pinned pages are non-evictable and
#   cannot be oversubscribed, so a short box does not degrade — it dies inside
#   `cudaMallocHost`, which presents as "loads the model into RAM, then fails to
#   load". With mmap the same bytes would be file-backed and evictable, and this
#   number would be a recommendation instead.
#   ⚠️ NO residency headers here, DELIBERATELY. This compose's `-ot` is an
#   unconditional all-experts→CPU catch-all with no ${OT_G*} slots, so the
#   launcher never pins bundles back onto the GPUs and the gate must NOT
#   subtract a grant — offload_residency_grant_mib() returns 0 without
#   CPU-Offload-Bundle-MiB, which is the correct answer here. Adding those
#   headers would under-gate every rig. And the expert cache does not help:
#   it is a VRAM-side COPY, so the CPU master buffer stays fully allocated
#   (the 141362 MiB line above is from a cache-ENABLED boot).
# ===========================================================================
services:
  llama-cpp-deepseek-flash-q8-moecache:
    # Digest-pinned, not tag-pinned: tags move, digests do not (#940 precedent).
    # The engine profile is authoritative for this pin; keep them in step.
    # Built 2026-08-10 from stack/club3090-moe-cache @ e0a208949, CUDA arch 86;89;120.
    image: ${LLAMACPP_CLUB3090_IMAGE:-ghcr.io/noonghunna/llamacpp-club3090@sha256:17824d4483dbd60c297613bddf130f25e739d3edc7e633e4d973edc4e2165649}
    container_name: ${ESTATE_CONTAINER:-llama-cpp-deepseek-flash-q8-moecache}
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8030}}:8080"
    volumes:
      - "${MODEL_DIR:-../../../../../../models-cache}:/models:ro"
    environment:
      # Drafter toggle - docker forwards only what is declared here.
      - SPEC_N=${SPEC_N:-}
      - SPEC=${SPEC:-}
      # Expert-cache tuning — every value MEASURED on 2×24 GB, see Caveats.
      - GGML_CUDA_MOE_CACHE_ADMIT_AFTER=${MOE_ADMIT_AFTER:-64}
      - GGML_CUDA_MOE_CACHE_RESERVE_MB=${MOE_RESERVE_MB:-1536}
      # Prefill expert-prefetch (v1.2 default ON, worth +14.5% prefill) and log
      # verbosity. ⚠️ BARE PASS-THROUGH FORM ON PURPOSE — do NOT rewrite these as
      # `- GGML_EXPERT_PREFETCH=${PREFETCH:-}`. The engine tests
      # `if (on && atoi(on) == 0) return nullptr;` (expert-prefetch.cu:126) and
      # atoi("") == 0, so an empty-string default would set the var to "" and
      # SILENTLY DISABLE the prefetch for every user. Bare form leaves the var
      # UNSET in the container unless the caller exports it, which is the only
      # spelling that preserves default-ON.
      #   GGML_EXPERT_PREFETCH=0  stock (no ring; frees ~484 CUDA0 cache slots)
      #                       =2  BALLAST (ring allocated, every node declined) —
      #                           the pool-matched control for mechanism A/Bs
      #   LLAMA_ARG_LOG_VERBOSITY=4  resolved pools + moe-cache statistics
      - GGML_EXPERT_PREFETCH
      - GGML_EXPERT_PREFETCH_SLOTS
      - LLAMA_ARG_LOG_VERBOSITY
      # Prefix reuse via KV shifting (default 0 = OFF). The between-turn TTFT
      # lever for agent traffic — the llama.cpp analogue of the vLLM
      # mamba-align work on the qwen3.8 MTP composes (#1093), though a
      # different mechanism (KV shift, not SSM-state alignment).
      # ⚠️ The server force-disables it when the memory layout cannot shift
      # (server-context.cpp: "cache_reuse is not supported by this context")
      # — MLA + SWA is a plausible refusal case, so CHECK THE BOOT LOG rather
      # than assuming it engaged.
      - LLAMA_ARG_CACHE_REUSE
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${ESTATE_GPUS:-0,1}']
              capabilities: [gpu]
    # ⚠️ LIST FORM, NOT a folded `command: >-` string — REQUIRED, not style.
    # Docker Compose's command-line parser REJECTS `(gate|up|down)` inside a
    # folded string. The list form skips shell parsing, so the regex survives
    # byte-for-byte.
    # The image ENTRYPOINT is ["/app/llama-server"] on every engine we ship
    # (mainline, ik-llama, beellama, llamacpp-club3090 — all verified). This
    # wrapper is equivalent to it plus the drafter toggle.
    entrypoint:
      - /bin/bash
      - -c
      - |
        # -- Drafter toggle: the same contract on every club-3090 compose --------
        #   SPEC_N=<n>  drafter depth; SPEC_N=0 disables
        #   SPEC=off    back-compat alias for SPEC_N=0
        # Disabling REMOVES the drafter flags rather than passing n=0. At
        # --spec-draft-n-max 0 llama.cpp sets drafting=false but still builds the
        # draft context (server-context.cpp), and still loads an external draft
        # model when one is named -- so the memory stays spent. Removing the
        # flags is the only clean off. A non-numeric SPEC_N is a hard error, so a
        # typo can never masquerade as a silent "drafter off".
        _spec_n="$${SPEC_N:-1}"
        case "$${SPEC:-}" in off|OFF|Off|false|no|0) _spec_n=0 ;; esac
        case "$$_spec_n" in ""|*[!0-9]*)
          echo "[spec] SPEC_N='$$_spec_n' is not a non-negative integer." >&2
          echo "[spec] Fix: SPEC_N=<n> sets depth; SPEC_N=0 (or SPEC=off) disables." >&2
          exit 1 ;;
        esac
        if [ "$$_spec_n" -gt 0 ]; then
          # Fail loud if the external DSpark drafter GGUF is absent. This model
          # has NO embedded MTP head, so DSpark is the ONLY speculative path --
          # a missing file otherwise crash-loops llama-server on a cryptic
          # "gguf_init_from_file ... No such file" (club-3090#1054). Find the
          # -md/--model-draft path in argv and verify it exists before exec.
          _draft=""; _want=0
          for _a in "$$@"; do
            if [ "$$_want" = 1 ]; then _draft="$$_a"; _want=0; continue; fi
            case "$$_a" in -md|--model-draft|--spec-draft-model) _want=1 ;; esac
          done
          if [ -n "$$_draft" ] && [ ! -f "$$_draft" ]; then
            echo "[spec] FATAL: external DSpark drafter not found:" >&2
            echo "[spec]   $$_draft" >&2
            echo "[spec] This slug REQUIRES the drafter (no embedded MTP head => no other spec path)." >&2
            echo "[spec] Fix one of:" >&2
            echo "[spec]   - download it: hf download unsloth/DeepSeek-V4-Flash-0731-GGUF \\" >&2
            echo "[spec]       --include 'dspark/*Q8_0*' --local-dir <MODEL_DIR>/deepseek-v4-flash-0731-gguf" >&2
            echo "[spec]   - or run drafter-off knowingly: SPEC_N=0 (accepts the lower no-spec TPS)" >&2
            exit 1
          fi
          echo "[spec] drafter ON (SPEC_N=$$_spec_n)" >&2
          exec /app/llama-server "$$@"
        fi
        ARGS=(); _skip=0
        for _a in "$$@"; do
          if [ "$$_skip" = 1 ]; then _skip=0; continue; fi
          case "$$_a" in
            --spec-type|--spec-draft-model|--spec-draft-n-max|--spec-draft-n-min|-md|--model-draft) _skip=1; continue ;;
          esac
          ARGS+=("$$_a")
        done
        echo "[spec] drafter OFF (SPEC_N=0 / SPEC=off) - drafter flags removed" >&2
        exec /app/llama-server "$${ARGS[@]}"
      - --
    command:
      - '-m'
      - '/models/deepseek-v4-flash-0731-gguf/UD-Q8_K_XL/DeepSeek-V4-Flash-0731-UD-Q8_K_XL-00001-of-00005.gguf'
      - '--host'
      - '0.0.0.0'
      - '--port'
      - '8080'
      - '--alias'
      - 'deepseek-v4-flash'
      - '-np'
      - '1'
      - '-c'
      - '${CTX:-204800}'
      - '-ngl'
      - '99'
      - '-sm'
      - 'layer'
      - '-ts'
      - '1,1'
      - '-fa'
      - 'on'
      # ⚠️ SINGLE -ot with comma-separated rules. Current mainline DEPRECATES
      # repeated -ot and honours ONLY THE LAST occurrence — passing it three
      # times silently drops the GPU pins. All experts to CPU here; the cache
      # decides residency dynamically, so static pins are counter-productive.
      - '-ot'
      - 'blk\.[0-9]+\.ffn_(gate|up|down)_exps\.weight=CPU'
      - '-t'
      - '${THREADS:-8}'
      - '-ub'
      - '${UBATCH:-4096}'
      - '-b'
      - '${UBATCH:-4096}'
      - '--cache-prompt'
      - '--no-mmap'
      - '-md'
      - '/models/deepseek-v4-flash-0731-gguf/dspark/dspark-DeepSeek-V4-Flash-0731-Q8_0.gguf'
      - '--spec-type'
      - 'draft-dspark'
      - '--spec-draft-n-max'
      - '${SPEC_N:-5}'
      # Drafter on the HOST — load-bearing, see Caveats.
      - '-devd'
      - 'none'
      - '--moe-cache'
      - '${MOE_CACHE:-auto}'
      - '--fit'
      - 'off'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 900s

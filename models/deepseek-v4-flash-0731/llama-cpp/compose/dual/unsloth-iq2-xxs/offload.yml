# ===========================================================================
# Profile (at-a-glance):
#   Model:     DeepSeek-V4-Flash-0731 (284B MoE, unsloth UD-IQ2_XXS — ~2.6-bit
#              experts, 85 GB across 3 shards)
#   Engine:    llama.cpp (mainline server-cuda-b10236, external DSpark drafter)
#   Topology:  Dual 3090 PCIe (layer-split -ts 1,1, no NVLink)
#   Drafter:   DSpark n=5 external (--spec-type draft-dspark) — REQUIRES b10236+
#              Toggle: SPEC_N=<n> sets depth; SPEC_N=0 (or SPEC=off) disables
#              (removes the flags — n-max=0 would leave the draft context allocated)
#   KV:        fp16 (llama.cpp default — MLA + a 4,352-cell SWA window keep it tiny)
#   Vision:    no
#   Max ctx:   204800
#   Genesis:   N/A — llama.cpp engine
#   Status:    🧪 Experimental
#   Caveats:   • Canonical bench PUBLISHED 2026-08-09 (BENCHMARKS.md row 3, reference
#                2×3090): decode 15.4 narrative / 24.3 code (canonical sampling),
#                prefill 436 @10K / 311 @90K, TTFT ~165 ms. The 8-pack is still
#                owed — the slug stays INCUBATING until quality lands.
#              • Quality is UNTESTED, and this is the tier where that matters most:
#                ~2.6-bit experts. Our own notes warn the speed ranking is probably
#                the INVERSE of the quality ranking. Treat output with suspicion
#                until an 8-pack lands.
#              • Decode is ~10% SLOWER than the Q8 tier on the reference rig (lower
#                draft acceptance on 2.6-bit experts outweighs smaller expert reads).
#                This tier's argument is the RAM gate (~86 vs ~146 GB), and prefill
#                (+18% @10K) — not decode.
#              • Needs ~76 GB of HOST RAM — a hard gate (still 64 GB less than Q8).
#              • Scoped to dual 24 GB deliberately: on 32 GB cards Q8 becomes
#                comfortable and wins on quality, so there is no 5090 case for this
#                tier and no multi4 IQ2 slug.
#   Best for:  The REACH tier — makes a 284B model fit a constrained box, on a constrained box. ⭐
# ---------------------------------------------------------------------------
# WHY BOTH TIERS EXIST — they are different CAPABILITY profiles, not a speed/quality
# slider, and the decode and prefill optima genuinely sit on DIFFERENT tiers:
#
#   Q8  = the quality tier   — needs ~146 GB host RAM (worst case)
#   IQ2 = the REACH tier     — needs ~86 GB, which is the whole point
#
# So the pick is set by which phase your workload is bound by, and by how much host
# RAM you have. That framing is measured, not positioning.
#
# ⚠️ -ot IS FIRST-MATCH-WINS — device rules MUST precede the catch-all =CPU rule.
#    Reverse them and every expert silently lands on CPU: no error, just a config
#    that quietly isn't what it claims to be.
#
# ⚠️ RESIDENCY IS INJECTED, NOT HARDCODED (OT_G0/OT_G1, resolved from detected free
#    VRAM). The defaults below match NO layer (blk.99999) so a bare
#    `docker compose up` degrades to all-experts-CPU — which runs anywhere — rather
#    than to a config that OOMs. IQ2 fits ~3 bundles per 24 GB card.
# ---------------------------------------------------------------------------
#
#   *4-card residency moves more experts onto GPU, so host RAM FALLS with card count.
#
# CPU-Offload-Host-RAM-GB: 86
#   ⚠️ MUST stay the ALL-experts-on-CPU worst case — preflight_cpu_offload_ram()
#   subtracts this rig's detected residency grant itself (offload_residency_grant_mib),
#   so pre-baking expected residency here would DOUBLE-COUNT it and under-gate.
#   On a real 2x24 the gate computes ~76 (worst case minus 6 resident bundles).
#   Measured, not computed (the quant name does not give you the byte size).
# CPU-Offload-Bundle-MiB: 1840
# CPU-Offload-MoE-Layers: 43
# CPU-Offload-First-MoE-Layer: 0
#   0 = no dense prefix on this model (all 43 layers are MoE). Models WITH one
#   (Laguna=1, Inkling=2) must set it: a residency rule naming a dense layer
#   silently matches nothing, so fewer layers land resident than we granted.
# CPU-Offload-GPU-Reserve-MiB: 16500
#   Inputs for resolve_offload_residency(). RESERVE = this compose's true
#   per-card engine cost (dense split + drafter half + compute buffers + KV).
#   Sizing is additive from DETECTED FREE VRAM (#931 recalibration):
#     fit = (free − reserve − first-card-extra − margin) / bundle
#   16500 (was 14000 in the ×0.55 era) reproduces every measured point: 3/card
#   on 2x24 GB, and the field-validated 7+8 asymmetric on 2x32 GB (#931 —
#   engine cost measured 16543 MiB on the bare card, 17201 on card 0).
# ===========================================================================

services:
  llama-cpp-deepseek-flash:
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda-b10236}
    container_name: "${ESTATE_CONTAINER:-llama-cpp-deepseek-flash-iq2}"
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8031}}:8080"
    volumes:
      - "${MODEL_DIR:-../../../../../../models-cache}:/models:ro"
    shm_size: "16g"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # ⚠️ THREADS is INJECTED by the launcher as nproc/2 — `-t` must track the rig, not
    # a number that suited the reference box. The `:-8` below is the bare-`docker
    # compose up` fallback and is deliberately LOW: the error is ASYMMETRIC.
    # Measured on 35B-A3B: over-subscribing costs -69% (-t 48 on 32 cores, 94% CPU for
    # 31% of peak) while under-subscribing costs -9.6% (-t 8 vs the -t 16 peak). When
    # the core count is unknown, being too low is ~7x cheaper than being too high.
    # ⚠️ LIST FORM, NOT a folded `command: >-` string — REQUIRED, not style.
    # Docker Compose's command-line parser REJECTS `(gate|up|down)` inside a folded
    # string: `invalid command line string`. The alternation is the trigger (verified
    # by bisection; `blk\.[0-9]+\.ffn_exps\.weight=CPU` parses fine, adding the group
    # breaks it). The list form skips shell parsing altogether, so the regex — and any
    # injected OT_G* value — survives byte-for-byte.
    environment:
      # Bare passthrough — docker forwards ONLY what is declared here, so without
      # this line the entrypoint's THREADS branch can never fire and the knob is
      # inert. Never write `- THREADS=${THREADS:-}`: that sets it EMPTY.
      - THREADS
      # Drafter toggle - docker forwards only what is declared here.
      - SPEC_N=${SPEC_N:-}
      - SPEC=${SPEC:-}
    # The image ENTRYPOINT is ["/app/llama-server"] on every engine we ship
    # (mainline, ik-llama, beellama, llamacpp-club3090 — all verified). This
    # wrapper is equivalent to it plus the drafter toggle.
    entrypoint:
      - /bin/bash
      - -c
      - |
        # -- Drafter toggle: the same contract on every club-3090 compose --------
        #   SPEC_N=<n>  drafter depth; SPEC_N=0 disables
        #   SPEC=off    back-compat alias for SPEC_N=0
        # Disabling REMOVES the drafter flags rather than passing n=0. At
        # --spec-draft-n-max 0 llama.cpp sets drafting=false but still builds the
        # draft context (server-context.cpp), and still loads an external draft
        # model when one is named -- so the memory stays spent. Removing the
        # flags is the only clean off. A non-numeric SPEC_N is a hard error, so a
        # typo can never masquerade as a silent "drafter off".
        _spec_n="$${SPEC_N:-1}"
        case "$${SPEC:-}" in off|OFF|Off|false|no|0) _spec_n=0 ;; esac
        case "$$_spec_n" in ""|*[!0-9]*)
          echo "[spec] SPEC_N='$$_spec_n' is not a non-negative integer." >&2
          echo "[spec] Fix: SPEC_N=<n> sets depth; SPEC_N=0 (or SPEC=off) disables." >&2
          exit 1 ;;
        esac
        if [ "$$_spec_n" -gt 0 ]; then
          echo "[spec] drafter ON (SPEC_N=$$_spec_n)" >&2
          # -- Threads -------------------------------------------------------------
          # Resolved HERE, not as a `-t` CLI arg: CLI beats env, so a command-line -t
          # silently overrides anything set below. PORTABLE DEFAULT = nproc/2, matching
          # the launcher's resolve_offload_threads so both paths agree. The old `-t 8`
          # was far below optimum on any capable host; nproc/2 is the safe choice when
          # the operator's core count is unknown. ⚠️ Still a FLOOR, not the optimum --
          # the useful zone is an ABSOLUTE ~24-32 threads. Set THREADS=<n> to tune.
          if [ -n "$${THREADS:-}" ]; then
            export LLAMA_ARG_THREADS="$${THREADS}"
            echo "[threads] -t $${LLAMA_ARG_THREADS} (THREADS set explicitly)" >&2
          else
            _np=$$(nproc 2>/dev/null || echo 8)
            _half=$$(( _np / 2 )); [ "$$_half" -lt 1 ] && _half=1
            export LLAMA_ARG_THREADS="$$_half"
            echo "[threads] -t $${LLAMA_ARG_THREADS} (auto = nproc/2, nproc=$$_np)" >&2
          fi

          exec /app/llama-server "$$@"
        fi
        ARGS=(); _skip=0
        for _a in "$$@"; do
          if [ "$$_skip" = 1 ]; then _skip=0; continue; fi
          case "$$_a" in
            --spec-type|--spec-draft-model|--spec-draft-n-max|--spec-draft-n-min|-md|--model-draft) _skip=1; continue ;;
          esac
          ARGS+=("$$_a")
        done
        echo "[spec] drafter OFF (SPEC_N=0 / SPEC=off) - drafter flags removed" >&2
        exec /app/llama-server "$${ARGS[@]}"
      - --
    command:
      - '-m'
      - '/models/deepseek-v4-flash-0731-gguf/UD-IQ2_XXS/DeepSeek-V4-Flash-0731-UD-IQ2_XXS-00001-of-00003.gguf'
      - '--host'
      - '0.0.0.0'
      - '--port'
      - '8080'
      - '--alias'
      - 'deepseek-v4-flash'
      # Slots. ⚠️ `-np N` SPLITS `-c` into ctx/N per slot, so the pool and the
      # compute buffer change with it — a concurrency A/B must re-measure, not
      # reuse single-stream rows. Default 1 keeps shipped behaviour identical.
      # ⚠️ LLAMA_ARG_N_PARALLEL cannot override this: common/arg.cpp applies env
      #    BEFORE argv (~L783 vs ~L808), so the command line always wins.
      - '-np'
      - '${NPARALLEL:-1}'
      - '-c'
      - '${CTX:-204800}'
      - '-ngl'
      - '99'
      - '-sm'
      - 'layer'
      - '-ts'
      - '1,1'
      - '-fa'
      - 'on'
      - '-ot'
      - '${OT_G0:-blk\.99999\.ffn_(gate|up|down)_exps\.weight=CUDA0},${OT_G1:-blk\.99999\.ffn_(gate|up|down)_exps\.weight=CUDA1},blk\.[0-9]+\.ffn_(gate|up|down)_exps\.weight=CPU'
      - '-ub'
      - '4096'
      - '-b'
      - '4096'
      - '--cache-prompt'
      - '--no-mmap'
      # q8_0 KV on the IQ2 tier ONLY: measured to free ~300 MiB/card, which clears
      # this tier's 1840 MiB bundle. On Q8 (3264 MiB bundle) it buys nothing, so we
      # do not take the quality reduction there. At our stated KV serving floor.
      - '--cache-type-k'
      - 'q8_0'
      - '--cache-type-v'
      - 'q8_0'
      - '-md'
      - '/models/deepseek-v4-flash-0731-gguf/dspark/dspark-DeepSeek-V4-Flash-0731-Q8_0.gguf'
      - '--spec-type'
      - 'draft-dspark'
      - '--spec-draft-n-max'
      - '${SPEC_N:-5}'
      - '--fit'
      - 'off'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${PORT:-8031}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 900s

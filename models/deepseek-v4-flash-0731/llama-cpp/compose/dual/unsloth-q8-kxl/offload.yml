# ===========================================================================
# Profile (at-a-glance):
#   Model:     DeepSeek-V4-Flash-0731 (284B MoE, unsloth UD-Q8_K_XL — MXFP4
#              experts + BF16 attention, 151 GB across 5 shards)
#   Engine:    llama.cpp (mainline server-cuda-b10236, external DSpark drafter)
#   Topology:  Dual 3090 PCIe (layer-split -ts 1,1, no NVLink)
#   Drafter:   DSpark n=5 external (--spec-type draft-dspark) — runtime landed in
#              ggml-org#25784; ABSENT in b9967, so this slug REQUIRES b10236+
#              Toggle: SPEC_N=<n> sets depth; SPEC_N=0 (or SPEC=off) disables
#              (removes the flags — n-max=0 would leave the draft context allocated)
#   KV:        fp16 (llama.cpp default — MLA + a 4,352-cell SWA window keep it tiny)
#   Vision:    no
#   Max ctx:   204800  (⚠️ NOT 262144 — see Caveats)
#   Genesis:   N/A — llama.cpp engine
#   Status:    🐣 Incubating
#   Caveats:   • Canonical bench PUBLISHED 2026-08-09 (BENCHMARKS.md row 2, reference
#                2×3090, 3-boot medians): decode 17.1 narrative / 26.9 code
#                (canonical sampling), prefill 369 @10K / 287 @90K, TTFT 169 ms.
#                The 8-pack is still owed — the slug stays INCUBATING until then.
#              • Quality is UNTESTED on this tier — no 8-pack has been run.
#              • Needs ~140 GB of HOST RAM (experts live in CPU memory). This is a
#                hard gate, not a recommendation: the box will thrash or OOM below it.
#              • Load takes ~8-10 min (--no-mmap). The point is that a 284B model
#                runs at ~27 t/s code decode on 2×24 GB — not raw speed records.
#              • 262K is NOT offered. With the drafter attached it boots READY at
#                97.4% VRAM and survives a trivial decode, then dies on a ~15.7K-token
#                prefill with CUDA OOM in cuMemCreate (measured 2026-08-06).
#              • `-ub/-b 4096` is a decode↔prefill trade, and it is set to 4096 here
#                DELIBERATELY. Halving to 2048 frees ~2.2-2.7 GB/card of CUDA compute
#                buffer. Measured 2026-08-10 on the EXPERIMENTAL expert-cache config
#                (fork engine + cache + CPU drafter — NOT this slug): the cache
#                absorbed all of it, +1,301 resident experts → +10% decode for
#                −12.5% prefill @10K. ⚠️ On THIS stock slug there is no cache to
#                absorb the freed VRAM, so 2048 buys the prefill loss WITHOUT the
#                decode gain. Change it only if you are also running a cache.
#              • multi-GPU beyond 2 cards uses the multi4 compose, not this one.
#   Best for:  The quality tier of the two DeepSeek-Flash slugs Pick IQ2 instead if you are host-RAM bound
#              or prefill-bound. ⭐
# ---------------------------------------------------------------------------
# WHY THIS EXISTS
#   Our fastest historical DeepSeek config (393 t/s prefill) can never ship — it
#   needs an unmerged expert cache plus local engine patches. This is stock
#   upstream, zero patches, and it BEATS that config on decode.
#
# THE THREE LEVERS, and they compose:
#   1. CPU expert offload  — 137 GiB of routed experts live in host RAM.
#   2. Partial residency   — a few expert bundles pinned back onto the GPUs.
#                            moves expert bytes off the CPU buffer, so it improves
#                            both residency and the host-RAM requirement.
#   3. DSpark drafter      — external speculative decode.
#
# ⚠️ -ot IS FIRST-MATCH-WINS. The two device rules MUST precede the catch-all
#    =CPU rule. Reverse them and every expert silently lands on CPU: no error,
#    no warning, just a config that quietly isn't what it claims to be.
#
# ⚠️ THE RESIDENCY RULES ARE INJECTED, NOT HARDCODED. OT_G0/OT_G1 are resolved by
#    launch.sh / switch.sh from DETECTED free VRAM (a 24 GB card fits 1 bundle per
#    card; a 32 GB card fits more). The defaults below deliberately match NO layer
#    (blk.99999), so a bare `docker compose up` degrades to all-experts-CPU — the
#    config that runs anywhere — rather than to one that OOMs.
# ---------------------------------------------------------------------------
#
#   *4-card residency moves more experts onto GPU, so host RAM FALLS with card count.
#
# CPU-Offload-Host-RAM-GB: 146
#   ⚠️ MUST stay the ALL-experts-on-CPU worst case — preflight_cpu_offload_ram()
#   subtracts this rig's detected residency grant itself (offload_residency_grant_mib),
#   so pre-baking expected residency here would DOUBLE-COUNT it and under-gate.
#   On a real 2x24 the gate computes ~140 (worst case minus 2 resident bundles).
#   Measured, not computed (the quant name does not give you the byte size).
# CPU-Offload-Bundle-MiB: 3264
# CPU-Offload-MoE-Layers: 43
# CPU-Offload-First-MoE-Layer: 0
#   0 = no dense prefix on this model (all 43 layers are MoE). Models WITH one
#   (Laguna=1, Inkling=2) must set it: a residency rule naming a dense layer
#   silently matches nothing, so fewer layers land resident than we granted.
# CPU-Offload-GPU-Reserve-MiB: 11432
# CPU-Offload-Draft-Reserve-MiB: 8154
# CPU-Offload-First-Card-Extra-MiB: 444
#   Inputs for resolve_offload_residency(). Sizing is additive from DETECTED
#   FREE VRAM (#931 recalibration):
#     fit = (free − reserve − draft-reserve − first-card-extra − margin) / bundle
#
#   ⚠️ RECALIBRATED 2026-08-12 FROM MEASUREMENT (#953). The previous single
#   constant was 18000, documented as covering "dense split + drafter half +
#   compute buffers + KV". It could not: the drafter loads AFTER the launcher
#   resolves residency, so free VRAM is read before ~8-9 GB of draft model
#   allocates. Measured on 2x3090 (this compose, same session, only residency
#   varied):
#     grant 0+0 (forced): 20030 / 19586 MiB used   <- TRUE per-card cost
#     grant 1+1 (as shipped): 23280 / 22838 used, 845 / 1287 free
#     delta 3250 / 3252 vs a 3264 MiB bundle -> the bundles DID place
#   So the grant was honoured, and the failure was quieter than "experts stay on
#   CPU": card 0 ended at 845 MiB free, BELOW the 1024 MiB margin the model is
#   meant to guarantee and below the 896 MiB that survived a 188K prefill ladder
#   in #931 (556 MiB died at ~90K). The sizer was silently spending its own
#   safety margin, which is a deep-prefill OOM risk on exactly the config whose
#   header already documents a 262K prefill OOM.
#
#   The three terms now mean what they say and reproduce the measurement:
#     reserve      11432  drafter-FREE per-card base (dense split + buffers + KV)
#     draft        8154   the smaller drafter half (card 1)
#     first-card   444    card 0's measured excess (20030 − 19586)
#   -> grants 0 on card 0, 1 on card 1 on 2x24 GB. Asymmetric because card 1
#      carries the smaller drafter half and takes no first-card extra; a fix that
#      simply zeroed residency whenever a drafter is present would leave card 1's
#      bundle on the table.
# ===========================================================================

services:
  llama-cpp-deepseek-flash:
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda-b10236}
    container_name: "${ESTATE_CONTAINER:-llama-cpp-deepseek-flash-q8}"
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8030}}:8080"
    volumes:
      - "${MODEL_DIR:-../../../../../../models-cache}:/models:ro"
    shm_size: "16g"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # ⚠️ THREADS is INJECTED by the launcher as nproc/2 — `-t` must track the rig, not
    # a number that suited the reference box. The `:-8` below is the bare-`docker
    # compose up` fallback and is deliberately LOW: the error is ASYMMETRIC.
    # Measured on 35B-A3B: over-subscribing costs -69% (-t 48 on 32 cores, 94% CPU for
    # 31% of peak) while under-subscribing costs -9.6% (-t 8 vs the -t 16 peak). When
    # the core count is unknown, being too low is ~7x cheaper than being too high.
    # ⚠️ LIST FORM, NOT a folded `command: >-` string — REQUIRED, not style.
    # Docker Compose's command-line parser REJECTS `(gate|up|down)` inside a folded
    # string: `invalid command line string`. The alternation is the trigger (verified
    # by bisection; `blk\.[0-9]+\.ffn_exps\.weight=CPU` parses fine, adding the group
    # breaks it). The list form skips shell parsing altogether, so the regex — and any
    # injected OT_G* value — survives byte-for-byte.
    environment:
      # Drafter toggle - docker forwards only what is declared here.
      - SPEC_N=${SPEC_N:-}
      - SPEC=${SPEC:-}
    # The image ENTRYPOINT is ["/app/llama-server"] on every engine we ship
    # (mainline, ik-llama, beellama, llamacpp-club3090 — all verified). This
    # wrapper is equivalent to it plus the drafter toggle.
    entrypoint:
      - /bin/bash
      - -c
      - |
        # -- Drafter toggle: the same contract on every club-3090 compose --------
        #   SPEC_N=<n>  drafter depth; SPEC_N=0 disables
        #   SPEC=off    back-compat alias for SPEC_N=0
        # Disabling REMOVES the drafter flags rather than passing n=0. At
        # --spec-draft-n-max 0 llama.cpp sets drafting=false but still builds the
        # draft context (server-context.cpp), and still loads an external draft
        # model when one is named -- so the memory stays spent. Removing the
        # flags is the only clean off. A non-numeric SPEC_N is a hard error, so a
        # typo can never masquerade as a silent "drafter off".
        _spec_n="$${SPEC_N:-1}"
        case "$${SPEC:-}" in off|OFF|Off|false|no|0) _spec_n=0 ;; esac
        case "$$_spec_n" in ""|*[!0-9]*)
          echo "[spec] SPEC_N='$$_spec_n' is not a non-negative integer." >&2
          echo "[spec] Fix: SPEC_N=<n> sets depth; SPEC_N=0 (or SPEC=off) disables." >&2
          exit 1 ;;
        esac
        if [ "$$_spec_n" -gt 0 ]; then
          echo "[spec] drafter ON (SPEC_N=$$_spec_n)" >&2
          exec /app/llama-server "$$@"
        fi
        ARGS=(); _skip=0
        for _a in "$$@"; do
          if [ "$$_skip" = 1 ]; then _skip=0; continue; fi
          case "$$_a" in
            --spec-type|--spec-draft-model|--spec-draft-n-max|--spec-draft-n-min|-md|--model-draft) _skip=1; continue ;;
          esac
          ARGS+=("$$_a")
        done
        echo "[spec] drafter OFF (SPEC_N=0 / SPEC=off) - drafter flags removed" >&2
        exec /app/llama-server "$${ARGS[@]}"
      - --
    command:
      - '-m'
      - '/models/deepseek-v4-flash-0731-gguf/UD-Q8_K_XL/DeepSeek-V4-Flash-0731-UD-Q8_K_XL-00001-of-00005.gguf'
      - '--host'
      - '0.0.0.0'
      - '--port'
      - '8080'
      - '--alias'
      - 'deepseek-v4-flash'
      # Slots. ⚠️ `-np N` SPLITS `-c` into ctx/N per slot, so the pool and the
      # compute buffer change with it — a concurrency A/B must re-measure, not
      # reuse single-stream rows. Default 1 keeps shipped behaviour identical.
      # ⚠️ LLAMA_ARG_N_PARALLEL cannot override this: common/arg.cpp applies env
      #    BEFORE argv (~L783 vs ~L808), so the command line always wins.
      - '-np'
      - '${NPARALLEL:-1}'
      - '-c'
      - '${CTX:-204800}'
      - '-ngl'
      - '99'
      - '-sm'
      - 'layer'
      - '-ts'
      - '1,1'
      - '-fa'
      - 'on'
      - '-ot'
      - '${OT_G0:-blk\.99999\.ffn_(gate|up|down)_exps\.weight=CUDA0},${OT_G1:-blk\.99999\.ffn_(gate|up|down)_exps\.weight=CUDA1},blk\.[0-9]+\.ffn_(gate|up|down)_exps\.weight=CPU'
      - '-t'
      - '${THREADS:-8}'
      - '-ub'
      - '4096'
      - '-b'
      - '4096'
      - '--cache-prompt'
      - '--no-mmap'
      - '-md'
      - '/models/deepseek-v4-flash-0731-gguf/dspark/dspark-DeepSeek-V4-Flash-0731-Q8_0.gguf'
      - '--spec-type'
      - 'draft-dspark'
      - '--spec-draft-n-max'
      - '${SPEC_N:-5}'
      - '--fit'
      - 'off'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${PORT:-8030}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 900s

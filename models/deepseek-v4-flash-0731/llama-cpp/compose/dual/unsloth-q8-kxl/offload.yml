# ===========================================================================
# Profile (at-a-glance):
#   Model:     DeepSeek-V4-Flash-0731 (284B MoE, unsloth UD-Q8_K_XL — MXFP4
#              experts + BF16 attention, 151 GB across 5 shards)
#   Engine:    llama.cpp (mainline server-cuda-b10236, external DSpark drafter)
#   Topology:  Dual 3090 PCIe (layer-split -ts 1,1, no NVLink)
#   Drafter:   DSpark n=5 external (--spec-type draft-dspark) — runtime landed in
#              ggml-org#25784; ABSENT in b9967, so this slug REQUIRES b10236+
#   KV:        fp16 (llama.cpp default — MLA + a 4,352-cell SWA window keep it tiny)
#   Vision:    no
#   Max ctx:   204800  (⚠️ NOT 262144 — see Caveats)
#   Genesis:   N/A — llama.cpp engine
#   Status:    🐣 Incubating
#   Caveats:   • NO performance or quality numbers are published for this slug —
#                it is INCUBATING. A canonical bench and the 8-pack are both owed;
#                only operational validation (boot + prefill probe + verify-full) exists.
#              • Quality is UNTESTED on this tier — no 8-pack has been run.
#              • Needs ~140 GB of HOST RAM (experts live in CPU memory). This is a
#                hard gate, not a recommendation: the box will thrash or OOM below it.
#              • Load takes ~8-10 min (--no-mmap) and decode is ~23 t/s single-stream.
#                The point is that a 284B model runs AT ALL on 2×24 GB — not speed.
#              • 262K is NOT offered. With the drafter attached it boots READY at
#                97.4% VRAM and survives a trivial decode, then dies on a ~15.7K-token
#                prefill with CUDA OOM in cuMemCreate (measured 2026-08-06).
#              • multi-GPU beyond 2 cards uses the multi4 compose, not this one.
#   Best for:  The quality tier of the two DeepSeek-Flash slugs Pick IQ2 instead if you are host-RAM bound
#              or prefill-bound. ⭐
# ---------------------------------------------------------------------------
# WHY THIS EXISTS
#   Our fastest historical DeepSeek config (393 t/s prefill) can never ship — it
#   needs an unmerged expert cache plus local engine patches. This is stock
#   upstream, zero patches, and it BEATS that config on decode.
#
# THE THREE LEVERS, and they compose:
#   1. CPU expert offload  — 137 GiB of routed experts live in host RAM.
#   2. Partial residency   — a few expert bundles pinned back onto the GPUs.
#                            moves expert bytes off the CPU buffer, so it improves
#                            both residency and the host-RAM requirement.
#   3. DSpark drafter      — external speculative decode.
#
# ⚠️ -ot IS FIRST-MATCH-WINS. The two device rules MUST precede the catch-all
#    =CPU rule. Reverse them and every expert silently lands on CPU: no error,
#    no warning, just a config that quietly isn't what it claims to be.
#
# ⚠️ THE RESIDENCY RULES ARE INJECTED, NOT HARDCODED. OT_G0/OT_G1 are resolved by
#    launch.sh / switch.sh from DETECTED free VRAM (a 24 GB card fits 1 bundle per
#    card; a 32 GB card fits more). The defaults below deliberately match NO layer
#    (blk.99999), so a bare `docker compose up` degrades to all-experts-CPU — the
#    config that runs anywhere — rather than to one that OOMs.
# ---------------------------------------------------------------------------
#
#   *4-card residency moves more experts onto GPU, so host RAM FALLS with card count.
#
# CPU-Offload-Host-RAM-GB: 146
#   ⚠️ MUST stay the ALL-experts-on-CPU worst case — preflight_cpu_offload_ram()
#   subtracts this rig's detected residency grant itself (offload_residency_grant_mib),
#   so pre-baking expected residency here would DOUBLE-COUNT it and under-gate.
#   On a real 2x24 the gate computes ~140 (worst case minus 2 resident bundles).
#   Measured, not computed (the quant name does not give you the byte size).
# CPU-Offload-Bundle-MiB: 3264
# CPU-Offload-MoE-Layers: 43
# CPU-Offload-First-MoE-Layer: 0
#   0 = no dense prefix on this model (all 43 layers are MoE). Models WITH one
#   (Laguna=1, Inkling=2) must set it: a residency rule naming a dense layer
#   silently matches nothing, so fewer layers land resident than we granted.
# CPU-Offload-GPU-Reserve-MiB: 18000
#   Inputs for resolve_offload_residency(). The RESERVE is what the naive
#   free-VRAM/bundle arithmetic forgets: dense stack + compute reserve + drafter.
#   A ~0.55 calibration is applied on top — naive sizing overestimates ~2x and
#   would hand users a config that dies on its first prefill.
# ===========================================================================

services:
  llama-cpp-deepseek-flash:
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda-b10236}
    container_name: "${ESTATE_CONTAINER:-llama-cpp-deepseek-flash-q8}"
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8030}}:8080"
    volumes:
      - "${MODEL_DIR:-../../../../../../models-cache}:/models:ro"
    shm_size: "16g"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # ⚠️ THREADS is INJECTED by the launcher as nproc/2 — `-t` must track the rig, not
    # a number that suited the reference box. The `:-8` below is the bare-`docker
    # compose up` fallback and is deliberately LOW: the error is ASYMMETRIC.
    # Measured on 35B-A3B: over-subscribing costs -69% (-t 48 on 32 cores, 94% CPU for
    # 31% of peak) while under-subscribing costs -9.6% (-t 8 vs the -t 16 peak). When
    # the core count is unknown, being too low is ~7x cheaper than being too high.
    # ⚠️ LIST FORM, NOT a folded `command: >-` string — REQUIRED, not style.
    # Docker Compose's command-line parser REJECTS `(gate|up|down)` inside a folded
    # string: `invalid command line string`. The alternation is the trigger (verified
    # by bisection; `blk\.[0-9]+\.ffn_exps\.weight=CPU` parses fine, adding the group
    # breaks it). The list form skips shell parsing altogether, so the regex — and any
    # injected OT_G* value — survives byte-for-byte.
    command:
      - '-m'
      - '/models/deepseek-v4-flash-0731-gguf/UD-Q8_K_XL/DeepSeek-V4-Flash-0731-UD-Q8_K_XL-00001-of-00005.gguf'
      - '--host'
      - '0.0.0.0'
      - '--port'
      - '8080'
      - '--alias'
      - 'deepseek-v4-flash'
      - '-np'
      - '1'
      - '-c'
      - '${CTX:-204800}'
      - '-ngl'
      - '99'
      - '-sm'
      - 'layer'
      - '-ts'
      - '1,1'
      - '-fa'
      - 'on'
      - '-ot'
      - '${OT_G0:-blk\.99999\.ffn_(gate|up|down)_exps\.weight=CUDA0}'
      - '-ot'
      - '${OT_G1:-blk\.99999\.ffn_(gate|up|down)_exps\.weight=CUDA1}'
      - '-ot'
      - 'blk\.[0-9]+\.ffn_(gate|up|down)_exps\.weight=CPU'
      - '-t'
      - '${THREADS:-8}'
      - '-ub'
      - '4096'
      - '-b'
      - '4096'
      - '--cache-prompt'
      - '--no-mmap'
      - '-md'
      - '/models/deepseek-v4-flash-0731-gguf/dspark/dspark-DeepSeek-V4-Flash-0731-Q8_0.gguf'
      - '--spec-type'
      - 'draft-dspark'
      - '--spec-draft-n-max'
      - '${SPEC_N:-5}'
      - '--fit'
      - 'off'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${PORT:-8030}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 900s
